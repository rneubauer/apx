# Spectral ruleset encoding APX conventions.
# Runs against the BUNDLED artifact (spec/dist/apx-v1.yaml) so $refs are resolved.
# Extends the standard OAS ruleset so structural defects fail the gate;
# vendored-APDS-inherited findings are downgraded below rather than ignored.
extends: ["spectral:oas"]

rules:
  # Tags on APDS-native operations come from the vendored document and are
  # deliberately not repeated in APX's global tag list.
  operation-tag-defined: "off"
  # Vendored APDS 4.1 defect (Part 1 §1.3 erratum 2): /observations POST's
  # "single-element" example omits the required id and matches no oneOf
  # branch of its own schema — vendored verbatim per the prime directive, so
  # the rule is disabled rather than the file edited. APX's own examples and
  # all scenario payloads are ajv-validated by examples:check /
  # scenarios:check, so no coverage is lost. Re-enable when a corrected
  # APDS release is vendored.
  oas3-valid-media-example: "off"
  apx-topic-format:
    description: Webhook keys must be APX topics (apx.<domain>.<event>.vN) or APDS EventTypeEnum values (PascalCase).
    severity: error
    given: $.webhooks
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(apx\\.[a-z0-9-]+(\\.[a-z0-9-]+)+\\.v\\d+|[A-Z][A-Za-z]+|apx-[a-z0-9-]+)$"

  apx-path-casing:
    description: APX paths are lowercase kebab-case (APDS-native paths inherited verbatim are already compliant).
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^\\/((\\.well-known|[a-z0-9\\-._]+|\\{[a-zA-Z][a-zA-Z0-9]*\\})\\/?)*$"

  apx-operation-description:
    description: Every operation needs a description (normative text lives in the spec too).
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: description
      function: truthy
