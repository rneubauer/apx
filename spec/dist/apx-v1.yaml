openapi: 3.1.0
info:
  title: APX — APDS Parking eXtensions
  version: 0.9.1
  summary: An open companion standard to APDS 4.1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: APX Standard Working Group (stewarded by Umojo)
    email: rneubauer@umojo.com
  x-apds-extension:
    extensionName: apx
    extensionVersion: '1.0'
    apdsVersion: '4.1'
  description: |-
    **APX (APDS Parking eXtensions)** is an additive companion standard to the
    [APDS 4.1 API](https://github.com/parkingdata/spec) (Alliance for Parking
    Data Standards, core model published as ISO/TS 5206-1).

    ## The prime directive

    Wherever APDS 4.1 already defines a route, schema, or convention, APX uses
    it **verbatim**, by `$ref` into the vendored, unmodified `apds-api-4.1.yaml`.
    APX never redefines, subsets, or re-shapes an APDS entity, and a plain
    APDS 4.1 client works against an APX implementation without modification.
    Everything here is what APDS deliberately leaves out.

    ## Five ideas, used everywhere

    | Concept | Plain meaning |
    |---|---|
    | **Place** | Anywhere a vehicle can park, broken into levels, lanes, and spaces |
    | **Right** | Permission to park. A *specification* is the product; an *assigned right* is that product granted to someone |
    | **Session** | An actual stay: a vehicle using a right, with a start and an end |
    | **Rate** | Pricing: hourly tables, flat fees, event rates |
    | **Observation** | Something a sensor saw, with a timestamp, a confidence score, and imagery |

    Supporting players: an **Organisation** or **Contact**, a **Credential**
    (the thing presented at the lane), and a **Device** (gate, pay station,
    camera). All of them are APDS classes; none is redefined here.

    ## Conventions

    - Every APX resource carries an `id` (UUID) and an integer `version`.
      Objects reference each other as `{"id": "…", "className": "Session"}`.
    - Timestamps are RFC 3339 UTC. Money is the APDS shape
      `{"currencyType": "USD", "currencyValue": 9.00}`.
    - Errors are RFC 9457 `application/problem+json` with a registered
      `type` URI you can program against, never a bare string.
    - Mutating operations a device may retry require an `Idempotency-Key`.
      Replaying a key with the same body returns the original result; with a
      different body it is a conflict.
    - Lifecycles are audited: resources with states carry an immutable,
      append-only `statusHistory[]`.

    ## Access

    OAuth 2.0 client credentials. Two independent bounds apply to every call:
    **scopes** (`apx.<domain>:<verb>`, what kinds of thing you may do) and
    **grants** (the token claims `apx_org` and `apx_places`, which facilities
    you may do them at). Grants are fail-closed: absent or empty means no
    places. A vendor hired for one garage cannot act on another.

    ## Not everything is mandatory

    APX is partitioned into named **conformance classes**. `apx-data` and
    `apx-events` are the base; every other class is optional and
    independently claimable, with objective per-requirement criteria in
    Annex A of the written standard. An implementation advertises the classes
    it satisfies at `/.well-known/apx-configuration`.

    ## How to read this document

    Operations are grouped by domain in the navigation, and each group opens
    with what APDS already provides, what APX adds on top, and a link to the
    governing Part of the **written standard** in
    [docs/standard/](https://github.com/rneubauer/apx/tree/main/docs/standard).
    Where prose and this description disagree for an APX-defined path, this
    document prevails and the prose is a defect to be corrected; for
    APDS-native paths the vendored APDS document prevails.

    End-to-end worked examples, every payload machine-validated against this
    bundle, are in
    [docs/scenarios/](https://github.com/rneubauer/apx/tree/main/docs/scenarios).
servers:
  - url: https://api.apx-implementation.example
    description: |-
      One host serves both surfaces: APDS-native routes at their verbatim
      paths (/places, /sessions, /webhooks, …) and APX routes under the
      explicit /v1 prefix.
security:
  - apxOAuth: []
paths:
  /places:
    get:
      summary: List Places
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: |-
        Returns a list of places potentially filtered by a combination of :
        * __latitude__, __longitude__ and __radius__ : retrieve all places within a geographic area,
        * __types__ : retrieve all places of the given type,
        * __right_type__ : retrieve all places associated with the right specification type,
        * __structure_type__ : retrieve all places associated with the specified structure type,
        * __structure_grade__ : retrieve all places associated with the specified structure grade,
        * __name__ : retrieve all places which match the name of the facilities,
        * __layer__ : specify the maximum hierarchy element layer desired,
        * __operator__ : the id of the operator of this location
        * __modified_since__ : retrieve all places that have changed from that given instant onwards,
        * __expand__ : a comma-separated list of optional object attributes associated to a place that should be included in the result set.
      operationId: get-places
      tags:
        - Places
      parameters:
        - $ref: '#/components/parameters/latitude'
        - $ref: '#/components/parameters/longitude'
        - $ref: '#/components/parameters/radius'
        - $ref: '#/components/parameters/place_types'
        - $ref: '#/components/parameters/right_spec_types'
        - $ref: '#/components/parameters/structure_type'
        - $ref: '#/components/parameters/structure_grade'
        - $ref: '#/components/parameters/place_name'
        - $ref: '#/components/parameters/place_layer'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/modified_since'
        - $ref: '#/components/parameters/places_expand'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/ModeParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HierarchyElementList'
                  - $ref: '#/components/schemas/ChangeFeedPage'
    post:
      summary: Create Place
      security:
        - oAuth:
            - po
      description: Create a new place.
      operationId: create-place
      tags:
        - Places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HierarchyElement'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 201
                    message: Place created successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: Place can not be created due to missing required attributes.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                conflict:
                  value:
                    status: error
                    code: 409
                    message: Place can not be created due to conflicting data.
  /places/{id}:
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: Unique identifier for the place.
    get:
      summary: Get Place
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: Returns the latest version of a given place by its identifier (or a specific version provided as a query parameter).
      operationId: get-place
      parameters:
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/places_expand'
      tags:
        - Places
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyElement'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not_found:
                  value:
                    status: error
                    code: 404
                    message: Place not found.
    put:
      summary: Update Place
      security:
        - oAuth:
            - po
      description: Update an existing place using its identifier.
      operationId: update-place
      tags:
        - Places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HierarchyElement'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 200
                    message: Place updated successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: Place can not be updated due to missing required attributes.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not-found:
                  value:
                    status: error
                    code: 404
                    message: Place can not be updated as it has not been found.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                conflict:
                  value:
                    status: error
                    code: 409
                    message: Place can not be updated due to conflicting data.
    delete:
      summary: Delete Place
      security:
        - oAuth:
            - po
      description: Delete an existing place using its identifier.
      operationId: delete-place
      tags:
        - Places
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 200
                    message: Place deleted successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: Place can not be deleted due to missing required attributes.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not-found:
                  value:
                    status: error
                    code: 404
                    message: Place can not be deleted as it has not been found.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                conflict:
                  value:
                    status: error
                    code: 409
                    message: Place can not be deleted due to conflicting data.
  /observations:
    get:
      summary: get list of recorded observations
      tags:
        - Observation
      operationId: get-observations
      description: |-
        Lists `Observations` and allows searching/filtering by:

        * latitude, longitude, radius: to check for `Observations` within a geographic area
        * a list of `Places`, to retrieve all Observations within a set of parking locations
        * start_before: to get observations starting before a given instant
        * end_before: to get observations ending before a given instant
        * start_after: to get observations starting after a given instant
        * end_after: to get observations ending after a given instant
        * a modification instant: to only display changed resources from that point onwards

        Additionally, supports providing a comma-separated list of optional object attributes associated to an `Observation` that should be included in the result set. If unused or left blank, `none` will be assumed.
      parameters:
        - $ref: '#/components/parameters/place_ids'
        - $ref: '#/components/parameters/latitude'
        - $ref: '#/components/parameters/longitude'
        - $ref: '#/components/parameters/radius'
        - $ref: '#/components/parameters/modified_since'
        - $ref: '#/components/parameters/start_before'
        - $ref: '#/components/parameters/end_before'
        - $ref: '#/components/parameters/start_after'
        - $ref: '#/components/parameters/end_after'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ObservationElement'
    post:
      summary: create an Observation or Observation Set
      tags:
        - Observation
      operationId: post-observations
      description: create a singular `Observation` or an `Observation Set`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    type:
                      $ref: '#/components/schemas/ObservationDataType'
                - oneOf:
                    - $ref: '#/components/schemas/ObservationElement'
                    - $ref: '#/components/schemas/ObservationSet'
                  discriminator:
                    propertyName: type
                    mapping:
                      ObservationElement: '#/components/schemas/ObservationElement'
                      ObvservationSet: '#/components/schemas/ObservationSet'
              required:
                - type
            examples:
              single-element:
                value:
                  type: ObservationElement
                  method: visual
                  observer: Officer Peterson
                  observationStartTime: '2026-01-01T10:02:00Z'
                  creationDateTime: '2026-01-01T10:04:00Z'
                  observedCredentialId: BD51 SMR
                  location:
                    observerLocation:
                      type: Point
                      coordinates:
                        - -2.3058626
                        - 53.4723193
                  observerOrganisation:
                    id: SAMPLECITY
                    version: 1
  /contacts:
    get:
      summary: Get List of Organisations (Contacts)
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: Returns the latest list of all organisations and their public ids
      operationId: get-contacts
      parameters:
        - in: query
          name: type
          required: false
          description: filter by this type of organisation/contact
          schema:
            $ref: '#/components/schemas/ContactPointTypeEnum'
      tags:
        - Organisations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactPoint'
              examples:
                found:
                  value:
                    meta:
                      referenceInstant: 1746684020
                      pageSize: 100
                      offset: 0
                      total: 2
                    data:
                      - id: TESTCOUNCIL
                        version: 1
                        organisationName:
                          - language: en
                            string: Test Council
                        type: operator
                        contactType: contactPoint
                      - id: PROVIDER1
                        version: 1
                        organisationName:
                          - language: en
                            string: Service Provider 1
                        type: serviceProvider
                        contactType: contactPoint
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                internal-error:
                  value:
                    status: error
                    code: 500
                    message: internal server error
    post:
      summary: create a new contact
      description: create a new contact point record which can then be referenced by other data elements
      operationId: post-contact
      tags:
        - Organisations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPoint'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-fields:
                  value:
                    status: error
                    code: 400
                    message: missing require fields
        '409':
          description: CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                duplicate-id:
                  value:
                    status: error
                    code: 409
                    message: a contact point with this id already exists
  /contacts/{contactId}:
    parameters:
      - schema:
          type: string
        name: contactId
        in: path
        required: true
        description: Unique identifier for the contact/organisation.
    get:
      summary: get details of particular contact / organisation
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: returns the details of the contact identified by {contactId}
      operationId: get-single-contact
      tags:
        - Organisations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPoint'
              examples:
                found:
                  value:
                    contactType: contactPoint
                    id: TESTCOUNCIL
                    version: 1
                    organisationName:
                      - language: en
                        string: Test Council
                    type: operator
        '404':
          description: contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not-found:
                  value:
                    status: error
                    code: 404
                    message: contact not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                internal-error:
                  value:
                    status: error
                    code: 500
                    message: internal server error
    put:
      summary: update existing contact
      description: update an existing contact point record which can then be referenced by other data elements
      operationId: put-contact
      tags:
        - Organisations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPoint'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                contact-updated:
                  value:
                    status: ok
                    code: 200
                    message: contact 359e20ec-a836-4365-aa62-07de0993cb20 successfully updated
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                duplicate-id:
                  value:
                    status: error
                    code: 404
                    message: a contact point with this id does not exist
    delete:
      summary: delete existing contact
      description: delete an existing contact point record
      operationId: delete-contact
      tags:
        - Organisations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                contact-updated:
                  value:
                    status: ok
                    code: 200
                    message: contact 359e20ec-a836-4365-aa62-07de0993cb20 successfully deleted
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                duplicate-id:
                  value:
                    status: error
                    code: 404
                    message: a contact point with this id does not exist
        '409':
          description: CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                duplicate-id:
                  value:
                    status: error
                    code: 409
                    message: contact point cannot be deleted as it is referenced by existing record(s)
  /rights/specs:
    get:
      summary: List RightSpecifications
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: |-
        Returns a list of right specifications potentially filtered by a combination of :
        * __latitude__, __longitude__ and __radius__ : retrieve all right specifications used in a geographic area (via their associated place),
        * a list of __Places__ : retrieve all right specifications connected to any of the given places,
        * __issuer__ : the id of the entity that issued the right specification
        * __modified_since__ : retrieve all right specifications that have changed from that given instant onwards, 
        * __expand__ : a comma-separated list of optional object attributes associated to a right specification that should be included in the result set.
      operationId: get-right_specs
      tags:
        - Right Specifications
      parameters:
        - $ref: '#/components/parameters/latitude'
        - $ref: '#/components/parameters/longitude'
        - $ref: '#/components/parameters/radius'
        - $ref: '#/components/parameters/place_ids'
        - $ref: '#/components/parameters/place_types'
        - $ref: '#/components/parameters/modified_since'
        - $ref: '#/components/parameters/issuer'
        - $ref: '#/components/parameters/right_specs_expand'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RightSpecificationList'
    post:
      summary: Create RightSpecification
      security:
        - oAuth:
            - po
      description: Create a new right specification.
      operationId: create-right_specs
      tags:
        - Right Specifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightSpecification'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 201
                    message: RightSpecification created successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: RightSpecification can not be created due to missing required attributes.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                conflict:
                  value:
                    status: error
                    code: 409
                    message: RightSpecification can not be created due to conflicting data.
  /rights/specs/{id}:
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: Unique identifier for the right specification.
    get:
      summary: Get RightSpecification
      security:
        - oAuth:
            - po
            - sp
            - ep
            - ad
      description: Returns the latest version of a given right specification by its identifier (or the specific version provided as a query parameter).
      operationId: get-right_spec
      tags:
        - Right Specifications
      parameters:
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/right_specs_expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RightSpecification'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not_found:
                  value:
                    status: error
                    code: 404
                    message: RightSpecification not found.
    put:
      summary: Update RightSpecification
      security:
        - oAuth:
            - po
      description: Update an existing right specification
      operationId: update-right_spec
      tags:
        - Right Specifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightSpecification'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 200
                    message: RightSpecification updated successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: RightSpecification can not be updated due to missing required attributes.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not-found:
                  value:
                    status: error
                    code: 404
                    message: RightSpecification can not be updated as it has not been found.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                conflict:
                  value:
                    status: error
                    code: 409
                    message: RightSpecification can not be updated due to conflicting data.
    delete:
      summary: Delete RightSpecification
      security:
        - oAuth:
            - po
      description: Delete an existing right specification using its identifier.
      operationId: delete-right_spec
      tags:
        - Right Specifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                ok:
                  value:
                    status: ok
                    code: 200
                    message: RightSpecification deleted successfully.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                missing-data:
                  value:
                    status: error
                    code: 400
                    message: RightSpecification can not be deleted due to missing required attributes.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                not-found:
                  value:
