      type: string
      enum:
        - batteryCapacity
        - engineCapacityPetrol
        - emissionStandard
        - engineCapacityDiesel
        - manufactureDate
        - emissionValue
    UnitOfMeasureEnum:
      title: UnitOfMeasureEnum
