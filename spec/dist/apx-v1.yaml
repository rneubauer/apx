  /v1/violations:
    post:
      operationId: post-apx-v1-violations
      security:
        - apxOAuth:
            - apx.violations:manage
      tags:
        - Violations
      summary: Create a violation from a detection (idempotent)
      description: |-
        Records a detected violation — from an automated camera/sensor
        pipeline, a guided-enforcement handheld, or an officer directly
        (`detection.mode`). The `Idempotency-Key` header is REQUIRED:
        cameras and handhelds retry, and a retry must not create a second
        violation. Same key + same body returns the ORIGINAL (200); same
        key + different body is 409 idempotency-conflict. The server
        performs the eligibility check at creation and records it in
        `eligibilityCheck`; a vehicle found entitled is still recorded (as
        `dismissed`, with the basis) so the audit trail is complete.
        Publishes `apx.violations.detected.v1`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Violation'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Violation'
        '201':
          description: Violation recorded (status `detected`, or `dismissed` when the vehicle was entitled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Violation'
        '400':
          description: Missing Idempotency-Key or invalid violation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable — unknown place, or `violationType` outside the served registries.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-violations
      security:
        - apxOAuth:
            - apx.violations:read
      tags:
        - Violations
      summary: List/filter violations
      description: |-
        Filter by plate (credentialIdentification), status, type, place
        (subtree-inclusive), detection mode, and `since` (detectedTime).
        Results are constrained to the caller's place grant. Plate values
        appear only under `apx.violations:*` scopes (Part 9 §9.6).
      parameters:
        - name: plate
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - detected
              - confirmed
              - dismissed
              - issued
              - paid
              - appealed
              - closed
              - voided
        - name: type
          in: query
          schema:
            type: string
        - name: place
          in: query
          schema:
            type: string
            format: uuid
        - name: detectionMode
          in: query
          schema:
            type: string
            enum:
              - automated
              - guided
              - manual
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated violations (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Violation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/violations/{id}:
    get:
      operationId: get-apx-v1-violations-id
      security:
        - apxOAuth:
