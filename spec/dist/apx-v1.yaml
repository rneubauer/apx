  /v1/payments:
    post:
      operationId: post-apx-v1-payments
      security:
        - apxOAuth:
            - apx.payments:write
      tags:
        - Accounts
      summary: Take a payment (idempotent)
      description: |-
        Takes a payment against an account or ticket. Idempotency-Key
        REQUIRED. autoAttendant method = PCI-compliant IVR captures the card
        out of band; APX never carries PANs. Declines are 422.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRecord'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
        '201':
          description: Approved payment with transactionID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
        '400':
          description: Missing Idempotency-Key (`idempotency-key-required`, Part 12) or no account/ticket to settle.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Payment declined.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-payments
      security:
        - apxOAuth:
            - apx.accounts:read
      tags:
        - Accounts
      summary: Payment history by ticket
      description: |-
        Payments made on a ticket. Privacy rule: last-4 lookup without a
        date is constrained to the last 8 hours.
      parameters:
        - name: ticketLast4
          in: query
          schema:
            type: string
        - name: cardLast4
          in: query
          description: |-
            Truncated payment-card digits — the transient-parker lookup of
            last resort (no LPR, no readable ticket). Same recent-window
            privacy rule as ticketLast4.
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Matching payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
