    TollTransaction:
      title: TollTransaction
      description: |-
        A toll charge assembled from plate/transponder reads: Observation refs →
        pricing → Payment ref, with a dispute lifecycle.
      type: object
      required:
        - id
        - version
        - tollPoint
        - transactionStatus
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        tollPoint:
          description: Reference to the toll point (SupplementalEquipment).
          $ref: '#/components/schemas/Reference'
        observations:
          type: array
          description: The underlying APDS Observations (plate/transponder reads).
          items:
            $ref: '#/components/schemas/Reference'
        credential:
          type: object
          description: The credential observed (licensePlate, rfid transponder…).
          properties:
            credentialType:
              type: string
            credentialIdentification:
              type: string
        pricing:
          $ref: '#/components/schemas/AmountInCurrency'
        payment:
          description: Reference to the settling PaymentRecord/APDS Payment.
          $ref: '#/components/schemas/Reference'
        transactionStatus:
          type: string
          enum:
            - created
            - priced
            - paid
            - disputed
            - resolved
            - voided
          readOnly: true
        dispute:
          type: object
          properties:
            reason:
              type: string
            openedTime:
              $ref: '#/components/schemas/DateTime'
            resolvedTime:
              $ref: '#/components/schemas/DateTime'
            resolution:
              type: string
              description: upheld | refunded | adjusted (implementer code list).
        statusHistory:
          type: array
          description: Immutable lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e9000000-0000-4000-8000-000000000802
          version: 5
          tollPoint:
            id: b4000000-0000-4000-8000-000000000001
            className: SupplementalEquipment
          credential:
            credentialType: licensePlate
            credentialIdentification: SYN-9930
          pricing:
            currencyType: USD
            currencyValue: 2.75
          payment:
            id: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1902
            className: PaymentRecord
          transactionStatus: resolved
