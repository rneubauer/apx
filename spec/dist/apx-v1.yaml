  /v1/credentials/{id}/replace:
    post:
      operationId: post-apx-v1-credentials-id-replace
      security:
        - apxOAuth:
            - apx.credentials:manage
      tags:
        - Credentials
      summary: Replace a credential with a successor (idempotent)
      description: |-
        Issues a successor `active` record inheriting holder, account,
        assigned rights, places, and validity; links `replaces`/`replacedBy`;
        moves THIS record to `replaced` and swaps the APDS CredentialAssigned
        atomically. Allowed from `active`, `suspended`, or `lost`; terminal
        states are 409 `credential-not-replaceable`. `Idempotency-Key`
        REQUIRED. Returns the successor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialReplaceRequest'
      responses:
        '200':
          description: Idempotent replay — returns the ORIGINAL successor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '201':
          description: The successor credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Missing Idempotency-Key or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such credential.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not replaceable from the current state, successor identification in use, or key replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
