        schema:
          type: string
          format: uuid
    get:
      operationId: get-apx-v1-validations-programs-id
      security:
        - apxOAuth:
            - apx.validations:read
        - apxOAuth:
            - apx.validations:redeem
      tags:
        - Validations
      summary: Read a validation program
      description: Returns the program including rules, billing, and the immutable statusHistory.
      responses:
        '200':
          description: The program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProgram'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: put-apx-v1-validations-programs-id
      security:
        - apxOAuth:
            - apx.validations:manage
      tags:
        - Validations
      summary: Update a validation program (full update, versioned)
      description: |-
        Full-update semantics (Part 5 §5.1): the body carries the complete
        program with the `version` the client last read; a stale version is
        409 `version-conflict`. Status transitions: `active ⇄ suspended`,
        either → `ended` (terminal; 422 `program-not-active` for any
        transition out of `ended`). Benefit and rule changes apply to
        redemptions from the update onward; existing instruments keep the
        benefit they were issued with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationProgram'
      responses:
        '200':
          description: Updated program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProgram'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Stale version.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Illegal status transition or invalid benefit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/validations/programs/{id}/issuances:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: post-apx-v1-validations-programs-id-issuances
      security:
        - apxOAuth:
            - apx.validations:manage
        - apxOAuth:
            - apx.validations:redeem
      tags:
        - Validations
      summary: Issue a batch of validation instruments (idempotent)
      description: |-
        Issues `quantity` instruments of `method` to the program.
        `Idempotency-Key` REQUIRED — a retried print job must not double
        the stock. For `code`/`qrCode`/`digital`, the generated `codes[]`
        are returned in THIS response only. Program must be `active` (422
        `program-not-active`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationIssuance'
      responses:
        '200':
          description: Idempotent replay — returns the ORIGINAL issuance (without codes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationIssuance'
        '201':
          description: Batch issued; includes `codes[]` exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationIssuance'
        '400':
          description: Missing Idempotency-Key or invalid issuance.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Program not active, or method not in the program's issuanceMethods.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-validations-programs-id-issuances
      security:
        - apxOAuth:
            - apx.validations:read
        - apxOAuth:
            - apx.validations:redeem
      tags:
        - Validations
      summary: List issuances for a program
      description: Batches issued to the program, newest first. Codes are never returned here.
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated issuances (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationIssuance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
