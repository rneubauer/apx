              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationStatement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
