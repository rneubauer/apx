        - brandsAcceptedList
    BrandsAcceptedText:
      title: BrandsAcceptedText
      description: Use this class to describe details of the brands that are accepted.
      type: object
      x-package: rate.payment
      properties:
        brandsAccepted:
          $ref: '#/components/schemas/MultilingualString'
    PaymentMethod:
      title: PaymentMethod
