              time: '2026-09-22T07:52:31Z'
              actor: gantry-hc-01
              detail: plate fallback, confidence 0.71
            - state: priced
              time: '2026-09-22T07:52:31Z'
              actor: toll-pricing
            - state: paid
              time: '2026-09-23T02:11:41Z'
              actor: billing-batch
            - state: disputed
              time: '2026-10-02T15:20:11Z'
              actor: agent-0219
            - state: resolved
              time: '2026-10-03T09:41:02Z'
              actor: backoffice-jlee
              detail: refunded; gantry hc-01 flagged for recalibration
    TollPaymentAttachment:
      title: TollPaymentAttachment
      description: Request body attaching the settling Payment to a toll transaction.
      type: object
      required:
        - payment
      properties:
        payment:
          description: Reference to the settling APDS Payment (or APX PaymentRecord).
          $ref: '#/components/schemas/Reference'
        note:
          type: string
    TollDisputeOpen:
      title: TollDisputeOpen
      description: Request body opening a dispute on a toll transaction.
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Dispute reason (implementer code list).
          examples:
            - wrongVehicle
        detail:
          type: string
        disputedBy:
          $ref: '#/components/schemas/Reference'
    TollDisputeResolution:
      title: TollDisputeResolution
      description: Request body resolving an open dispute.
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string
          description: Resolution value (implementer code list — upheld, refunded, adjusted…).
          examples:
            - refunded
        note:
          type: string
    Violation:
      title: Violation
      description: |-
        An enforcement finding against a vehicle at a place: the detection
        (automated, guided, or manual), the eligibility check that justified
        it, the evidence, the issued notice/citation, settlement, and any
        appeal — with the immutable lifecycle audit (Part 4 §4.2).

        Lifecycle (Part 19 §19.1): `detected → confirmed | dismissed`,
        `confirmed → issued`, `issued → paid | appealed`,
        `appealed → issued (upheld, or reduced with amount replaced by
        adjustedAmount) | closed (dismissed)`, `paid → closed` (server-side
        administrative transition, no API operation). `voided` is terminal
        from any state.
        Automated detection MAY skip review (`detected → issued`) where the
        operator's policy permits; guided detection MUST pass through review.
      type: object
      required:
        - id
        - version
        - violationType
        - violationStatus
        - place
        - detection
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        violationType:
          type: string
          description: definedValue from `apx-violation-types` or an implementer code list.
          examples:
            - noValidRight
        violationStatus:
          type: string
          enum:
            - detected
            - confirmed
            - dismissed
            - issued
            - paid
            - appealed
            - closed
            - voided
          readOnly: true
          description: Current lifecycle state (see schema description for transitions).
        place:
          description: The HierarchyElement (Place, Area, Space…) where the violation was observed.
          $ref: '#/components/schemas/Reference'
        space:
          description: The specific APDS Space, when the detection is space-resolved (sensor, bay camera).
          $ref: '#/components/schemas/Reference'
        detection:
          type: object
          description: How and when the candidate was found.
          required:
            - mode
            - detectedTime
          properties:
            mode:
              type: string
              enum:
                - automated
                - guided
                - manual
              description: |-
                `automated` — a camera/sensor pipeline created the violation with
                no human in the loop. `guided` — the system surfaced a candidate
                (typically to a handheld) and an officer confirms on site.
                `manual` — an officer created the violation directly.
            detectedTime:
              $ref: '#/components/schemas/DateTime'
            detector:
              description: The detecting device (SupplementalEquipment) or, for guided/manual, the officer's Contact.
              $ref: '#/components/schemas/Reference'
            principal:
              type: string
              description: Opaque principal of the human or system that detected (officer badge id, pipeline name).
              examples:
                - officer-0417
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: Detection confidence (plate read × rule certainty), when the detector reports one.
            rule:
              type: string
              description: Implementer identifier of the enforcement rule that fired (automated mode).
              examples:
                - overstay-2h-zone-b
        vehicle:
          type: object
          description: The credential observed on the vehicle (an APDS CredentialTypeEnum credential).
          required:
            - credentialType
            - credentialIdentification
          properties:
            credentialType:
              $ref: '#/components/schemas/CredentialTypeEnum'
            credentialIdentification:
              type: string
              description: The credential value — plate string, permit number, transponder id.
              examples:
                - SYN-4471
            jurisdiction:
              type: string
              description: Issuing jurisdiction of the plate/credential (state, province, country code).
              examples:
                - US-IL
            description:
              type: string
              description: Free-text vehicle description captured by the officer (make, colour).
        observations:
          type: array
          description: The underlying APDS Observations (plate reads, sensor events) the finding is built from.
          items:
            $ref: '#/components/schemas/Reference'
        evidence:
          type: array
          description: |-
            Evidence media, as access-controlled LINKS (Part 9 §9.6 — never
            inline). Each item points at an APDS Image reachable under the same
            authentication and place grant as this resource.
          items:
            type: object
            required:
              - imageLink
            properties:
              imageLink:
                $ref: '#/components/schemas/Url'
              imageType:
                $ref: '#/components/schemas/ImageTypeEnum'
              capturedTime:
                $ref: '#/components/schemas/DateTime'
              device:
                description: The capturing SupplementalEquipment (camera, handheld).
                $ref: '#/components/schemas/Reference'
              description:
                type: string
        eligibilityCheck:
          description: The entitlement check performed at detection time (the same shape `GET /v1/enforcement/eligibility` returns).
          $ref: '#/components/schemas/EligibilityResult'
        relatedSession:
          description: The APDS Session the vehicle was in, when one exists.
          $ref: '#/components/schemas/Reference'
        relatedRight:
          description: The AssignedRight that was closest to covering the stay (expired permit, wrong-zone reservation…).
          $ref: '#/components/schemas/Reference'
        location:
          type: object
          description: |-
            Where the violation was observed and from where — the APDS
            Observation `Location` shape (Part 19 §19.9). GeoJSON positions
            are [longitude, latitude] in that order; enforcement tools that
            store latitude first MUST swap on the wire. Automated detections
            SHOULD copy this from the underlying Observation.
          properties:
            observedLocation:
              description: The vehicle's position (GeoJSON Point).
              $ref: '#/components/schemas/GeoJsonObject'
            observerLocation:
              description: The officer's or camera's position when the finding was made (GeoJSON Point).
              $ref: '#/components/schemas/GeoJsonObject'
            observedLocationTextual:
              description: Human-readable address or description of the observed location.
              $ref: '#/components/schemas/MultilingualString'
            accuracyMetres:
              type: number
              minimum: 0
              description: Horizontal accuracy reported by the capturing device.
        policy:
          description: The EnforcementPolicy resolved for `place` at `issue` (Part 19 §19.10), frozen with its version.
          $ref: '#/components/schemas/VersionedReference'
          readOnly: true
        signage:
          type: array
          readOnly: true
          description: |-
            The Signage records in force at `place` (and ancestors) at
            `detectedTime`, frozen at `issue` with their versions — the
            evidence of what was posted (Part 19 §19.11).
          items:
            $ref: '#/components/schemas/VersionedReference'
        amountHistory:
          type: array
          readOnly: true
          description: |-
            Every change to `amount`, in order: the issued amount, each
            server-applied escalation step, and each appeal reduction
            (Part 19 §19.10). `amount` always equals the last entry.
          items:
            type: object
            required:
              - amount
              - time
              - reason
            properties:
              amount:
                $ref: '#/components/schemas/AmountInCurrency'
              time:
                $ref: '#/components/schemas/DateTime'
              reason:
                type: string
                enum:
                  - issued
                  - escalation
                  - appealReduced
                  - cap
              step:
                type: string
                description: The policy escalation step id that fired, when `reason` is `escalation`.
              detail:
                type: string
        notice:
          type: object
          description: The notice, warning, or citation issued for this violation. Absent until `issued`.
          readOnly: true
          properties:
            noticeKind:
              type: string
              description: What was issued — warning, notice, citation (implementer code list; jurisdictional vocabulary).
              examples:
                - citation
            noticeNumber:
              type: string
              description: The operator's/jurisdiction's printed or mailed notice number.
              examples:
                - LG-2026-018342
            issuedTime:
              $ref: '#/components/schemas/DateTime'
            issuedBy:
              description: The issuing Organisation or officer Contact.
              $ref: '#/components/schemas/Reference'
            deliveryMethod:
              type: string
              description: How the notice reached the driver — windshield, handed, mail, electronic (implementer code list).
              examples:
                - mail
        amount:
          description: The amount payable on the issued notice (after any appeal reduction).
          $ref: '#/components/schemas/AmountInCurrency'
        dueTime:
          description: When payment falls due.
          $ref: '#/components/schemas/DateTime'
        payment:
          description: Reference to the settling APDS Payment or APX PaymentRecord (Part 13).
          $ref: '#/components/schemas/Reference'
        appeal:
          type: object
          description: The appeal on this violation, if one was opened. One appeal per violation.
          readOnly: true
          properties:
            reason:
              type: string
              description: Appeal reason (implementer code list).
              examples:
                - notTheVehicle
            detail:
              type: string
            appellant:
              description: The appealing party (Contact), when identified.
              $ref: '#/components/schemas/Reference'
            openedTime:
              $ref: '#/components/schemas/DateTime'
            resolvedTime:
              $ref: '#/components/schemas/DateTime'
            resolution:
              type: string
              description: upheld | reduced | dismissed (implementer code list).
              examples:
                - dismissed
            resolutionNote:
              type: string
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
                description: Client/agent principal that caused the transition.
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d3000000-0000-4000-8000-000000000001
          version: 2
          violationType: expiredRight
          violationStatus: issued
          place:
            id: b1000000-0000-4000-8000-000000000004
            className: Place
          detection:
            mode: automated
            detectedTime: '2026-09-18T09:31:04Z'
            detector:
              id: b2000000-0000-4000-8000-000000000031
              className: SupplementalEquipment
            principal: lpr-pipeline-lot-c
            confidence: 0.94
            rule: paybyplate-expiry-15m
          vehicle:
            credentialType: licensePlate
            credentialIdentification: SYN-4471
            jurisdiction: US-IL
          observations:
            - id: f2000000-0000-4000-8000-000000000041
              className: Observation
          relatedSession:
            id: f1000000-0000-4000-8000-000000000044
            className: Session
          notice:
            noticeKind: notice
            noticeNumber: LG-2026-018301
            issuedTime: '2026-09-18T09:31:09Z'
            issuedBy:
              id: a1000000-0000-4000-8000-000000000001
              className: Organisation
            deliveryMethod: mail
          amount:
            currencyType: USD
            currencyValue: 35
          dueTime: '2026-10-18T23:59:59Z'
          statusHistory:
            - state: detected
              time: '2026-09-18T09:31:05Z'
              actor: lpr-pipeline-lot-c
              detail: rule paybyplate-expiry-15m; grace to 09:20 elapsed
            - state: issued
              time: '2026-09-18T09:31:09Z'
              actor: lpr-pipeline-lot-c
              detail: policy lot-c-auto-issue (confidence 0.94 ≥ 0.9); notice LG-2026-018301 queued for mail
    EligibilityResult:
      title: EligibilityResult
      description: |-
        "Is this vehicle entitled to be here right now?" — the guided-enforcement
        screen-pop (Part 19 §19.3). A convenience READ composed from the APDS
        entities that natively answer the question: AssignedRights (APDS's own
        enforcement source of truth), Sessions, and reservation/permit profiles.
        Adds no parallel entitlement entity; the AssignedRight remains
        authoritative.
      type: object
      required:
        - place
        - credential
        - checkedTime
        - entitled
      properties:
        place:
          description: The HierarchyElement the question was asked for.
          $ref: '#/components/schemas/Reference'
        credential:
          type: object
          required:
            - credentialType
            - credentialIdentification
          properties:
            credentialType:
              $ref: '#/components/schemas/CredentialTypeEnum'
            credentialIdentification:
              type: string
              examples:
                - SYN-4471
        checkedTime:
          description: The instant the answer applies to (the `at` parameter, or now).
          $ref: '#/components/schemas/DateTime'
        entitled:
          type: boolean
          description: True when at least one basis entry is `valid` for the place at `checkedTime`.
        basis:
          type: array
          description: Every right or session considered, newest first, with why it does or does not cover the stay.
          items:
            type: object
            required:
              - status
            properties:
              right:
                description: The AssignedRight considered.
                $ref: '#/components/schemas/Reference'
              session:
                description: The Session considered (pay-by-plate, transient).
                $ref: '#/components/schemas/Reference'
              rightType:
                type: string
                description: Human-readable product (from the RightSpecification) — monthly permit, reservation, pay-by-plate.
                examples:
                  - monthlyPermit
              validFrom:
                $ref: '#/components/schemas/DateTime'
              validTo:
                $ref: '#/components/schemas/DateTime'
              status:
                type: string
                enum:
                  - valid
                  - expired
                  - notYetValid
                  - wrongPlace
                  - consumed
                  - suspended
                description: Why this basis does or does not entitle the vehicle here, now.
        suggestedViolationType:
          type: string
          description: When not entitled — the `apx-violation-types` value the server's rules suggest (never binding on the officer).
          examples:
            - expiredRight
        graceUntil:
          description: When a grace period on the nearest basis ends, if the operator's policy grants one.
          $ref: '#/components/schemas/DateTime'
        lastRead:
          type: object
          description: The most recent plate read of this credential at the place (APDS Observation-derived).
          properties:
            observation:
              $ref: '#/components/schemas/Reference'
            observationDateTime:
              $ref: '#/components/schemas/DateTime'
            confidence:
              type: number
              minimum: 0
              maximum: 1
            imageLink:
              $ref: '#/components/schemas/Url'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - place:
            id: b1000000-0000-4000-8000-000000000003
            className: Place
          credential:
            credentialType: licensePlate
            credentialIdentification: SYN-8820
          checkedTime: '2026-09-18T10:14:05Z'
          entitled: false
          basis:
            - right:
                id: e1000000-0000-4000-8000-000000000027
                className: AssignedRight
              rightType: monthlyPermit
              validFrom: '2026-09-01T00:00:00Z'
              validTo: '2026-09-30T23:59:59Z'
              status: wrongPlace
          suggestedViolationType: wrongPlace
          lastRead:
            observation:
              id: f2000000-0000-4000-8000-000000000052
              className: Observation
            observationDateTime: '2026-09-18T08:31:47Z'
            confidence: 0.96
            imageLink: https://api.lakeside-garage.example/lpr/f2000000-0052.jpg
    ViolationReview:
      title: ViolationReview
      description: Request body for guided-enforcement review — confirm or dismiss a detected candidate.
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - confirm
            - dismiss
        reason:
          type: string
          description: Required when dismissing (implementer code list — permitDisplayed, plateMisread, gracePeriod…).
          examples:
            - plateMisread
        note:
          type: string
        reviewer:
          description: The reviewing officer's Contact, when the token is a system credential.
          $ref: '#/components/schemas/Reference'
        violationType:
          type: string
          description: Corrects the violation type on confirmation, when the officer's finding differs from the detector's.
          examples:
            - wrongZone
    ViolationIssue:
      title: ViolationIssue
      description: Request body issuing the notice/citation for a confirmed (or, under automated policy, detected) violation.
      type: object
      required:
        - amount
      properties:
        noticeKind:
          type: string
          description: warning | notice | citation (implementer code list). Default is implementation policy.
          examples:
            - citation
        noticeNumber:
          type: string
          description: Client-supplied notice number (pre-printed handheld stock). Server-assigned when absent.
        amount:
          $ref: '#/components/schemas/AmountInCurrency'
        dueTime:
          $ref: '#/components/schemas/DateTime'
        deliveryMethod:
          type: string
          description: windshield | handed | mail | electronic (implementer code list).
          examples:
            - windshield
        issuedBy:
          description: The issuing Organisation or officer Contact, when different from the token's organisation.
          $ref: '#/components/schemas/Reference'
        note:
          type: string
    ViolationPaymentAttachment:
      title: ViolationPaymentAttachment
      description: Request body attaching the settling Payment to an issued violation.
      type: object
      required:
        - payment
      properties:
        payment:
          description: Reference to the settling APDS Payment (or APX PaymentRecord taken via `POST /v1/payments`).
          $ref: '#/components/schemas/Reference'
        note:
          type: string
    ViolationAppealOpen:
      title: ViolationAppealOpen
      description: Request body opening an appeal on an issued violation.
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Appeal reason (implementer code list).
          examples:
            - notTheVehicle
        detail:
          type: string
        appellant:
          description: The appealing party (Contact), when identified.
          $ref: '#/components/schemas/Reference'
        evidenceLinks:
          type: array
          description: Appellant-supplied evidence, as access-controlled links.
          items:
            $ref: '#/components/schemas/Url'
    ViolationAppealResolution:
      title: ViolationAppealResolution
      description: Request body resolving an open appeal.
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string
          description: |-
            upheld | reduced | dismissed (implementer code list). `upheld` returns
            the violation to `issued`; `reduced` returns it to `issued` with
            `adjustedAmount`; `dismissed` closes it.
          examples:
            - reduced
        adjustedAmount:
          description: The new amount payable when `resolution` is `reduced`.
          $ref: '#/components/schemas/AmountInCurrency'
        note:
          type: string
    ViolationVoid:
      title: ViolationVoid
      description: Request body voiding a violation (terminal; never deletes the audit).
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Void reason (implementer code list — issuedInError, duplicate, policyException…).
          examples:
            - duplicate
        note:
          type: string
    EnforcementPolicy:
      title: EnforcementPolicy
      description: |-
        The jurisdictional rules that govern issuing and escalating violations
        at a place (Part 19 §19.10): lawful notice delivery per detection
        mode, the initial penalty cap, the escalation schedule, windows, and
        whether posted signage is required. Bound to a HierarchyElement with
        subtree inheritance — the nearest ancestor's policy applies unless a
        descendant overrides it. A machine-readable summary an operator
        configures from the governing statute; never the statute itself.
        Edits use versioned `PUT` (409 `version-conflict` when stale).
      type: object
      required:
        - id
        - version
        - place
        - policyStatus
        - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        place:
          description: The HierarchyElement this policy binds to (a state- or city-wide root, a lot, a level).
          $ref: '#/components/schemas/Reference'
        name:
          type: string
          examples:
            - Illinois private-lot notice rules 2026
        policyStatus:
          type: string
          enum:
            - active
            - superseded
            - retired
        effectiveFrom:
          $ref: '#/components/schemas/DateTime'
        effectiveTo:
          $ref: '#/components/schemas/DateTime'
        authority:
          type: object
          description: Provenance — where the rules come from.
          properties:
            jurisdiction:
              type: string
              description: ISO 3166-2 or implementer code for the legal jurisdiction.
              examples:
                - US-IL
            citation:
              type: string
              description: Statute, ordinance, or regulation citation.
              examples:
                - 625 ILCS 5/11-1305
            url:
              $ref: '#/components/schemas/Url'
        deliveryRules:
          type: array
          description: Which notice delivery methods are lawful for which detection modes, and by when.
          items:
            type: object
            required:
              - detectionModes
              - deliveryMethods
            properties:
              detectionModes:
                type: array
                items:
                  type: string
                  enum:
                    - automated
                    - guided
                    - manual
              deliveryMethods:
                type: array
                description: Lawful `notice.deliveryMethod` values for these modes (implementer code list — windshield, handed, mail, electronic).
                items:
                  type: string
              noticeDeadline:
                description: Latest lawful `issue` after `detectedTime` for these methods (ISO 8601).
                $ref: '#/components/schemas/Duration'
              minimumEvidence:
                type: object
                description: What the violation MUST carry before a notice by these methods is lawful.
                properties:
                  observations:
                    type: integer
                    minimum: 0
                  images:
                    type: integer
                    minimum: 0
                  locationRequired:
                    type: boolean
        penaltyCap:
          type: object
          description: Ceiling on the amount at `issue`. When more than one bound is present the lowest applies.
          properties:
            maximumAmount:
              $ref: '#/components/schemas/AmountInCurrency'
            maximumMultipleOfUnpaid:
              type: number
              minimum: 0
              description: Cap as a multiple of the unpaid parking fee the violation relates to (e.g. 2 = twice the unpaid fee).
            maximumPercentOverUnpaid:
              type: number
              minimum: 0
              description: Cap as unpaid fee plus this percentage of it.
            onExceed:
              type: string
              enum:
                - refuse
                - clamp
              description: '`refuse` → 422 `penalty-exceeds-cap`; `clamp` → issue at the cap and record `reason: cap` in amountHistory.'
        escalation:
          type: array
          description: |-
            Ordered, server-applied steps (Part 19 §19.10). Each fires once
            when `afterDays` have elapsed since `notice.issuedTime` with the
            violation still `issued`; the result is appended to
            `amountHistory` and never exceeds `overallCeiling`.
          items:
            type: object
            required:
              - step
              - afterDays
            properties:
              step:
                type: string
                description: Stable step id recorded in `amountHistory[].step`.
                examples:
                  - late-30
              afterDays:
                type: integer
                minimum: 1
              addAmount:
                $ref: '#/components/schemas/AmountInCurrency'
              addPercent:
                type: number
                minimum: 0
                description: Percentage of the CURRENT amount to add.
              description:
                type: string
        overallCeiling:
          type: object
          description: Hard ceiling on `amount` after any escalation.
          properties:
            maximumAmount:
              $ref: '#/components/schemas/AmountInCurrency'
            maximumMultipleOfIssued:
              type: number
              minimum: 1
              description: e.g. 3 = never more than three times the issued amount.
        appealWindowDays:
          type: integer
          minimum: 0
          description: Days after `notice.issuedTime` during which an appeal MUST be accepted.
        paymentGraceDays:
          type: integer
          minimum: 0
          description: Days after `notice.issuedTime` before the first escalation step MAY fire, regardless of `afterDays`.
        signageRequired:
          type: boolean
          description: When true, `issue` is refused (422 `signage-required`) unless Signage was in force at the place at `detectedTime`.
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d4000000-0000-4000-8000-000000000001
          version: 1
          place:
            id: b1000000-0000-4000-8000-000000000004
            className: Place
          name: State private-lot notice rules — Lot C
          policyStatus: active
          effectiveFrom: '2026-07-01T00:00:00Z'
          authority:
            jurisdiction: US-IL
            citation: Synthetic Stat. §12-405 (private lot notices)
          deliveryRules:
            - detectionModes:
                - automated
              deliveryMethods:
                - mail
                - electronic
              noticeDeadline: P14D
              minimumEvidence:
                observations: 1
                images: 1
                locationRequired: true
            - detectionModes:
                - guided
                - manual
              deliveryMethods:
                - windshield
                - handed
              noticeDeadline: PT1H
          penaltyCap:
            maximumMultipleOfUnpaid: 2
            onExceed: refuse
          escalation:
            - step: late-30
              afterDays: 30
              addPercent: 25
              description: 25% late penalty
            - step: late-60
              afterDays: 60
              addAmount:
                currencyType: USD
                currencyValue: 15
              description: Collection referral fee
          overallCeiling:
            maximumMultipleOfIssued: 3
          appealWindowDays: 21
          paymentGraceDays: 14
          signageRequired: true
          statusHistory:
            - state: active
              time: '2026-06-20T14:00:00Z'
              actor: backoffice-jlee
              detail: loaded from counsel's summary of §12-405
    Signage:
      title: Signage
      description: |-
        A record of what is posted at a place — the text, a photo, the
        sign's position, and when it was in force (Part 19 §19.11). Bound to
        a HierarchyElement with subtree inheritance. Versioned so an appeal
        can show the sign as it stood on the day: superseding a sign is a
        new version or a new record with `effectiveTo` set, never an edit in
        place of historical text. Edits use versioned `PUT`.
      type: object
      required:
        - id
        - version
        - place
        - text
        - signageStatus
        - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        place:
          description: The HierarchyElement the sign governs (the lot, a level, a zone).
          $ref: '#/components/schemas/Reference'
        text:
          description: The posted text, verbatim, per language.
          $ref: '#/components/schemas/MultilingualString'
        signageStatus:
          type: string
          enum:
            - active
            - superseded
            - removed
        effectiveFrom:
          $ref: '#/components/schemas/DateTime'
        effectiveTo:
          $ref: '#/components/schemas/DateTime'
        location:
          description: Where the sign stands (GeoJSON Point).
          $ref: '#/components/schemas/GeoJsonObject'
        imageLink:
          description: Access-controlled photo of the physical sign (Part 9 §9.6).
          $ref: '#/components/schemas/Url'
        signType:
          type: string
          description: Implementer code list — entrance, payStation, perSpace, towAway, ratesBoard.
          examples:
            - entrance
        policy:
          description: The EnforcementPolicy whose disclosure requirements this sign satisfies, when applicable.
          $ref: '#/components/schemas/Reference'
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d5000000-0000-4000-8000-000000000001
          version: 1
          place:
            id: b1000000-0000-4000-8000-000000000004
            className: Place
          text:
            - language: en
              string: 'PAY BY PLATE. Unpaid or expired parking is subject to a $35 notice; unpaid notices increase 25% after 30 days. Appeals: lakeside-garage.example/appeals within 21 days.'
            - language: es
              string: 'PAGUE POR PLACA. El estacionamiento sin pagar o vencido está sujeto a un aviso de $35; los avisos impagos aumentan 25% después de 30 días. Apelaciones: lakeside-garage.example/appeals dentro de 21 días.'
          signageStatus: active
          effectiveFrom: '2026-07-01T00:00:00Z'
          location:
            type: Point
            coordinates:
              - -87.6214
              - 41.8827
          imageLink: https://api.lakeside-garage.example/signage/lot-c-entrance-2026-07.jpg
          signType: entrance
          policy:
            id: d4000000-0000-4000-8000-000000000001
            className: EnforcementPolicy
          statusHistory:
            - state: active
              time: '2026-06-28T10:12:00Z'
              actor: backoffice-jlee
              detail: installed 2026-06-28, photographed
    ValidationBenefit:
      title: ValidationBenefit
      description: |-
        What a validation is worth. Exactly one of `amount` (money off),
        `duration` (comped time, valued at the applicable rate), or
        `percentage` (proportionate discount — the APDS RateDiscount
        `discountRate` semantics) applies; `description` is always present so
        agents can answer disputes in plain language.
      type: object
      required:
        - description
      properties:
        description:
          type: string
          examples:
            - First two hours comped
        amount:
          description: Fixed money off.
          $ref: '#/components/schemas/AmountInCurrency'
        duration:
          description: Comped parking time (ISO 8601), valued at the applicable rate.
          $ref: '#/components/schemas/Duration'
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Proportionate discount on the amount due (APDS RateDiscount.discountRate semantics).
    ValidationProgram:
      title: ValidationProgram
      description: |-
        A merchant's enrolment to validate parking at a place: who the
        provider is, what the validation is worth, the rules that bound it,
        how the merchant is billed, and how instruments are issued. Active
        programs ARE the source of the Part 6 `GET /v1/validations/providers`
        list when `apx-validations` is claimed.

        Lifecycle (Part 20 §20.1): `active ⇄ suspended`, either → `ended`
        (terminal). Status changes go through `PUT` with the current
        `version` (409 `version-conflict` when stale).
      type: object
      required:
        - id
        - version
        - place
        - provider
        - programStatus
        - benefit
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        place:
          description: The HierarchyElement (Place or subtree root) the program validates parking at.
          $ref: '#/components/schemas/Reference'
        provider:
          description: The merchant — an APDS Contact or Organisation.
          $ref: '#/components/schemas/Reference'
        name:
          type: string
          description: Display name shown to agents and on receipts.
          examples:
            - Harbor Bistro
        validationType:
          type: string
          description: Implementer code list naming the validation product (matches `ValidationProvider.validationType`).
          examples:
            - twoHourComp
        programStatus:
          type: string
          enum:
            - active
            - suspended
            - ended
        benefit:
          $ref: '#/components/schemas/ValidationBenefit'
        rules:
          type: object
          description: |-
            The closed rule set every implementation evaluates at redemption
            (Part 20 §20.3). Anything beyond it rides in `extensions`.
          properties:
            maxPerTicket:
              type: integer
              minimum: 1
              description: Redemptions of THIS program allowed on one ticket/session.
            maxPerDay:
              type: integer
              minimum: 1
              description: Redemptions of this program allowed per calendar day at the place.
            validityWindow:
              description: How long after issuance an instrument stays redeemable (ISO 8601).
              $ref: '#/components/schemas/Duration'
            stackable:
              type: boolean
              description: Whether this program may combine with other programs on the same ticket.
            applicableRateTables:
              type: array
              description: Restrict to these APDS RateTables; absent = all tables at the place that accept validations.
              items:
                $ref: '#/components/schemas/Reference'
        billing:
          type: object
          description: How the operator charges the merchant for redemptions.
          required:
            - model
          properties:
            model:
              type: string
              enum:
                - merchantPays
                - operatorAbsorbs
                - split
            unitPrice:
              description: What the merchant pays per redemption (merchantPays), or the base for `merchantShare` (split). Absent = billed at the actual amount reduced.
              $ref: '#/components/schemas/AmountInCurrency'
            merchantShare:
              type: number
              minimum: 0
              maximum: 100
              description: Percentage of the amount reduced the merchant pays under `split`.
            billingCycle:
              type: string
              enum:
                - monthly
                - weekly
                - perRedemption
        issuanceMethods:
          type: array
          description: Instrument forms this program may issue.
          items:
            type: string
            enum:
              - code
              - qrCode
              - stamp
              - digital
              - api
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e5000000-0000-4000-8000-000000000001
          version: 1
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          provider:
            id: a2000000-0000-4000-8000-000000000077
            className: Organisation
          name: Harbor Bistro
          validationType: twoHourComp
          programStatus: active
          benefit:
            description: First two hours comped
            duration: PT2H
          rules:
            maxPerTicket: 1
            maxPerDay: 200
            validityWindow: P1D
            stackable: false
          billing:
            model: merchantPays
            unitPrice:
              currencyType: USD
              currencyValue: 4
            billingCycle: monthly
          issuanceMethods:
            - qrCode
          statusHistory:
            - state: active
              time: '2026-09-01T15:02:11Z'
              actor: backoffice-jlee
              detail: enrolled
    ValidationIssuance:
      title: ValidationIssuance
      description: |-
        A batch of validation instruments issued to a program — printed codes,
        QR codes, stamp stock, digital tokens. `codes[]` is returned EXACTLY
        ONCE, in the creation response (the webhook-secret convention, Part 8
        §8.1); later reads omit it. `stamp` and `api` batches carry no codes.
      type: object
      required:
        - id
        - version
        - program
        - quantity
        - method
        - issuanceStatus
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        program:
          $ref: '#/components/schemas/Reference'
        quantity:
          type: integer
          minimum: 1
        method:
          type: string
          enum:
            - code
            - qrCode
            - stamp
            - digital
            - api
        validFrom:
          $ref: '#/components/schemas/DateTime'
        validTo:
          description: Expiry of every instrument in the batch; defaults from the program's `rules.validityWindow`.
          $ref: '#/components/schemas/DateTime'
        issuedTo:
          type: string
          description: Opaque principal or merchant contact the stock was handed to.
        codes:
          type: array
          readOnly: true
          description: The instrument codes — present ONLY in the creation response.
          items:
            type: string
        issuanceStatus:
          type: string
          enum:
            - issued
            - void
          readOnly: true
        note:
          type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e6000000-0000-4000-8000-000000000003
          version: 1
          program:
            id: e5000000-0000-4000-8000-000000000001
            className: ValidationProgram
          quantity: 50
          method: qrCode
          validFrom: '2026-09-12T17:00:00Z'
          validTo: '2026-09-13T17:00:00Z'
          issuedTo: front-of-house
          codes:
            - HB-7Q2M-K9X4-3TPD
            - HB-A1C8-ZR5N-W6LJ
            - HB-P0V3-E7HS-M2QY
          issuanceStatus: issued
    ValidationInstrument:
      title: ValidationInstrument
      description: The current state of one validation code — the pay-station / merchant-app "is this code good?" read.
      type: object
      required:
        - code
        - program
        - instrumentStatus
      properties:
        code:
          type: string
        program:
          $ref: '#/components/schemas/Reference'
        issuance:
          $ref: '#/components/schemas/Reference'
        instrumentStatus:
          type: string
          enum:
            - valid
            - redeemed
            - void
            - expired
        validFrom:
          $ref: '#/components/schemas/DateTime'
        validTo:
          $ref: '#/components/schemas/DateTime'
        benefit:
          description: What redeeming this code is worth (from the program), so a pay station can show it before applying.
          $ref: '#/components/schemas/ValidationBenefit'
        redemption:
          description: The ValidationRedemption that consumed the code, when `redeemed`.
          $ref: '#/components/schemas/Reference'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - code: HB-7Q2M-K9X4-3TPD
          program:
            id: e5000000-0000-4000-8000-000000000001
            className: ValidationProgram
          issuance:
            id: e6000000-0000-4000-8000-000000000003
            className: ValidationIssuance
          instrumentStatus: valid
          validFrom: '2026-09-12T17:00:00Z'
          validTo: '2026-09-13T17:00:00Z'
          benefit:
            description: First two hours comped
            duration: PT2H
    ValidationRedemption:
      title: ValidationRedemption
      description: |-
        One validation applied to one ticket/session — the ledger entry every
        channel writes: a pay station scanning a code, a merchant app, an
        agent's `applyValidation` command (Part 6), or a lane device. `validationId`
        is the APDS `Segment.validationId`, so APDS consumers see the same
        redemption without speaking APX. `amountReduced` is the ACTUAL value
        removed from the amount due (dispute evidence), never the nominal benefit.
      type: object
      required:
        - id
        - version
        - program
        - place
        - appliedTime
        - channel
        - redemptionStatus
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        program:
          $ref: '#/components/schemas/Reference'
        place:
          $ref: '#/components/schemas/Reference'
        instrumentCode:
          type: string
          description: The code redeemed, when the channel used one.
        ticketNumber:
          type: string
        session:
          $ref: '#/components/schemas/Reference'
        appliedTime:
          $ref: '#/components/schemas/DateTime'
        channel:
          type: string
          enum:
            - lane
            - payStation
            - merchantApp
            - callCenter
            - api
        appliedBy:
          type: string
          description: Opaque principal (device id, merchant user, agent id).
        command:
          description: The Part 6 Command that applied it, when the channel was `callCenter`/`api` via `applyValidation`.
          $ref: '#/components/schemas/Reference'
        validationId:
          type: string
          readOnly: true
          description: The APDS Segment.validationId materialized on the session.
        amountReduced:
          description: Actual reduction of the amount due.
          $ref: '#/components/schemas/AmountInCurrency'
        durationComped:
          $ref: '#/components/schemas/Duration'
        redemptionStatus:
          type: string
          enum:
            - applied
            - reversed
          readOnly: true
        reversal:
          type: object
          readOnly: true
          properties:
            reason:
              type: string
            note:
              type: string
            time:
              $ref: '#/components/schemas/DateTime'
            actor:
              type: string
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e7000000-0000-4000-8000-000000000041
          version: 1
          program:
            id: e5000000-0000-4000-8000-000000000001
            className: ValidationProgram
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          instrumentCode: HB-7Q2M-K9X4-3TPD
          ticketNumber: T-2210
          session:
            id: f1000000-0000-4000-8000-000000000210
            className: Session
          appliedTime: '2026-09-12T21:33:05Z'
          channel: payStation
          appliedBy: paystation-b2000000-0007
          validationId: VAL-20260912-000318
          amountReduced:
            currencyType: USD
            currencyValue: 6
          durationComped: PT2H
          redemptionStatus: applied
          statusHistory:
            - state: applied
              time: '2026-09-12T21:33:05Z'
              actor: paystation-b2000000-0007
              detail: T-2210 amount due 9.00 → 3.00
    ValidationRedemptionReversal:
      title: ValidationRedemptionReversal
      description: Request body reversing a redemption (wrong ticket, merchant dispute, fraud).
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Implementer code list.
          examples:
            - wrongTicket
        note:
          type: string
    ValidationStatementClose:
      title: ValidationStatementClose
      description: Request body closing a billing period for a program.
      type: object
      required:
        - periodStart
        - periodEnd
      properties:
        periodStart:
          $ref: '#/components/schemas/DateTime'
        periodEnd:
          $ref: '#/components/schemas/DateTime'
        note:
          type: string
    ValidationStatement:
      title: ValidationStatement
      description: |-
        A program's redemptions and billable total for a period. Returned
        as a computed preview by `GET …/statement`, and as an IMMUTABLE
        record once a period is closed by `POST …/statements` (`statementStatus:
        closed`; the operator's accounting system invoices from it). Closed
        periods MUST NOT overlap (409 `statement-overlap`).
      type: object
      required:
        - program
        - periodStart
        - periodEnd
        - redemptionCount
        - billableAmount
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Present only on closed statements.
        version:
          type: integer
          minimum: 1
          readOnly: true
        program:
          $ref: '#/components/schemas/Reference'
        place:
          $ref: '#/components/schemas/Reference'
        periodStart:
          $ref: '#/components/schemas/DateTime'
        periodEnd:
          $ref: '#/components/schemas/DateTime'
        statementStatus:
          type: string
          enum:
            - preview
            - closed
          readOnly: true
        billingModel:
          type: string
          enum:
            - merchantPays
            - operatorAbsorbs
            - split
        redemptionCount:
          type: integer
          minimum: 0
          description: Applied redemptions in the period (reversed ones excluded).
        reversedCount:
          type: integer
          minimum: 0
        totalReduced:
          description: Sum of `amountReduced` over applied redemptions.
          $ref: '#/components/schemas/AmountInCurrency'
        billableAmount:
          description: What the merchant owes for the period under the program's billing model.
          $ref: '#/components/schemas/AmountInCurrency'
        lines:
          type: array
          description: Per-redemption detail; MAY be omitted from list responses.
          items:
            type: object
            required:
              - redemption
              - appliedTime
            properties:
              redemption:
                $ref: '#/components/schemas/Reference'
              appliedTime:
                $ref: '#/components/schemas/DateTime'
              ticketNumber:
                type: string
              amountReduced:
                $ref: '#/components/schemas/AmountInCurrency'
              billable:
                $ref: '#/components/schemas/AmountInCurrency'
        closedTime:
          $ref: '#/components/schemas/DateTime'
        closedBy:
          type: string
        note:
          type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e8000000-0000-4000-8000-000000000009
          version: 1
          program:
            id: e5000000-0000-4000-8000-000000000001
            className: ValidationProgram
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          periodStart: '2026-09-01T00:00:00Z'
          periodEnd: '2026-10-01T00:00:00Z'
          statementStatus: closed
          billingModel: merchantPays
          redemptionCount: 412
          reversedCount: 3
          totalReduced:
            currencyType: USD
            currencyValue: 2418
          billableAmount:
            currencyType: USD
            currencyValue: 1648
          lines:
            - redemption:
                id: e7000000-0000-4000-8000-000000000041
                className: ValidationRedemption
              appliedTime: '2026-09-12T21:33:05Z'
              ticketNumber: T-2210
              amountReduced:
                currencyType: USD
                currencyValue: 6
              billable:
                currencyType: USD
                currencyValue: 4
          closedTime: '2026-10-01T09:00:12Z'
          closedBy: backoffice-jlee
    CredentialRecord:
      title: CredentialRecord
      description: |-
        One access credential — keycard, fob, RFID tag or transponder, mobile
        credential, hangtag, or a plate used as the credential — with its
        holder, validity, physical media, and lifecycle. `credentialType` is
        the APDS read technology; `media.form` is the physical form.

        Lifecycle (Part 21 §21.1): `issued → active`, `active ⇄ suspended`,
        `active | suspended → lost | revoked | expired`, and `replace`
        creates a successor while this record becomes `replaced`.
        `revoked`, `expired`, and `replaced` are terminal; `lost` may still be
        `replace`d or `revoke`d.
      type: object
      required:
        - id
        - version
        - credentialType
        - credentialIdentification
        - credentialStatus
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        credentialType:
          description: The APDS read technology (rfid, bluetooth, electronicID, hangtag, licensePlate…).
          $ref: '#/components/schemas/CredentialTypeEnum'
        credentialIdentification:
          type: string
          description: The value the lane reads — card number, tag id, plate. Unique per (credentialType) within the implementation.
          examples:
            - C-0048812
        credentialAssignedType:
          type: string
          enum:
            - vehicle
            - customer
            - other
          description: APDS CredentialAssignedTypeEnum — what the credential identifies.
        holder:
          description: The APDS RightHolder (or Contact) the credential is issued to.
          $ref: '#/components/schemas/Reference'
        account:
          description: The APX Account (Part 13) this credential belongs to, when the holder is a billable account.
          $ref: '#/components/schemas/Reference'
        assignedRights:
          type: array
          description: The APDS AssignedRights this credential is materialized on (Part 21 §21.2).
          items:
            $ref: '#/components/schemas/Reference'
        places:
          type: array
          description: HierarchyElement subtree roots this credential is valid at.
          items:
            $ref: '#/components/schemas/Reference'
        validity:
          type: object
          properties:
            start:
              $ref: '#/components/schemas/DateTime'
            end:
              $ref: '#/components/schemas/DateTime'
        media:
          type: object
          description: The physical (or virtual) form the credential was issued on.
          properties:
            form:
              type: string
              enum:
                - physicalCard
                - fob
                - transponder
                - hangtag
                - mobile
                - plate
                - ticket
                - virtual
            serialNumber:
              type: string
              description: Manufacturer or stock serial of the physical item (distinct from `credentialIdentification`).
            batch:
              type: string
              description: Stock batch or print run.
            issuedTime:
              $ref: '#/components/schemas/DateTime'
            deposit:
              description: Deposit taken for the physical item.
              $ref: '#/components/schemas/AmountInCurrency'
            depositStatus:
              type: string
              enum:
                - held
                - refunded
                - forfeited
        credentialStatus:
          type: string
          enum:
            - issued
            - active
            - suspended
            - lost
            - revoked
            - expired
            - replaced
          readOnly: true
        suspension:
          type: object
          readOnly: true
          description: Present while `suspended`.
          properties:
            reason:
              type: string
            until:
              $ref: '#/components/schemas/DateTime'
        replaces:
          description: The CredentialRecord this one succeeded.
          $ref: '#/components/schemas/Reference'
        replacedBy:
          description: The successor, when `replaced`.
          readOnly: true
          $ref: '#/components/schemas/Reference'
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d6000000-0000-4000-8000-000000000102
          version: 1
          credentialType: rfid
          credentialIdentification: C-0051207
          credentialAssignedType: customer
          holder:
            id: c1000000-0000-4000-8000-000000000102
            className: RightHolder
          account:
            id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
            className: Account
          assignedRights:
            - id: e1000000-0000-4000-8000-000000000102
              className: AssignedRight
          places:
            - id: b1000000-0000-4000-8000-000000000001
              className: Place
          validity:
            start: '2026-01-01T00:00:00Z'
            end: '2026-12-31T23:59:59Z'
          media:
            form: physicalCard
            serialNumber: HID-77A3-006903
            batch: 2026-Q3-A
            issuedTime: '2026-09-19T12:04:20Z'
            deposit:
              currencyType: USD
              currencyValue: 25
            depositStatus: held
          credentialStatus: active
          replaces:
            id: d6000000-0000-4000-8000-000000000101
            className: CredentialRecord
          statusHistory:
            - state: issued
              time: '2026-09-19T12:04:20Z'
              actor: agent-0212
              detail: replacement for d6000000-…-0101 (lost)
            - state: active
              time: '2026-09-19T12:04:20Z'
              actor: agent-0212
    CredentialTransition:
      title: CredentialTransition
      description: Request body for activate / suspend / resume / report-lost / revoke.
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Implementer code list (nonPayment, holderRequest, securityIncident, stolen…).
          examples:
            - holderRequest
        note:
          type: string
        until:
          description: For `suspend` — automatic resume time; absent = until resumed.
          $ref: '#/components/schemas/DateTime'
    CredentialReplaceRequest:
      title: CredentialReplaceRequest
      description: |-
        Request body issuing a successor credential. The new record inherits
        holder, account, assigned rights, places, and validity unless
        overridden; the old record becomes `replaced` and is removed from the
        APDS AssignedRights at the same instant the successor is materialized.
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Implementer code list (lost, stolen, damaged, upgrade, reissue).
          examples:
            - lost
        credentialType:
          description: Successor read technology; defaults to the old record's.
          $ref: '#/components/schemas/CredentialTypeEnum'
        credentialIdentification:
          type: string
          description: Successor identification; server-assigned when absent (pre-encoded stock).
        media:
          type: object
          description: Successor media; same shape as `CredentialRecord.media`.
          properties:
            form:
              type: string
              enum:
                - physicalCard
                - fob
                - transponder
                - hangtag
                - mobile
                - plate
                - ticket
                - virtual
            serialNumber:
              type: string
            batch:
              type: string
            deposit:
              $ref: '#/components/schemas/AmountInCurrency'
        oldDepositStatus:
          type: string
          enum:
            - held
            - refunded
            - forfeited
          description: What happens to the old record's deposit.
        note:
          type: string
    CredentialAccessEvent:
      title: CredentialAccessEvent
      description: |-
        One access attempt with a credential at a lane — granted or denied,
        and why. Fills the gap that APDS EventTypeEnum has no access events
        (published as `apx.credentials.access.v1`).
      type: object
      required:
        - credential
        - occurredAt
        - direction
        - outcome
      properties:
        id:
          type: string
          format: uuid
        credential:
          $ref: '#/components/schemas/Reference'
        occurredAt:
          $ref: '#/components/schemas/DateTime'
        place:
          $ref: '#/components/schemas/Reference'
        lane:
          description: The VehicularAccess where the attempt occurred.
          $ref: '#/components/schemas/Reference'
        device:
          description: The reader (SupplementalEquipment).
          $ref: '#/components/schemas/Reference'
        direction:
          type: string
          enum:
            - entry
            - exit
        outcome:
          type: string
          enum:
            - granted
            - denied
        denialReason:
          type: string
          description: When denied — credentialSuspended, credentialLost, credentialRevoked, credentialReplaced, credentialExpired, unknownCredential, passback, accountBalance, outsidePlace, outsideValidity (implementer code list seeded here; the credential* values mirror the non-active lifecycle states).
          examples:
            - credentialReplaced
        session:
          description: The APDS Session opened or closed by a granted access.
          $ref: '#/components/schemas/Reference'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d7000000-0000-4000-8000-000000000410
          credential:
            id: d6000000-0000-4000-8000-000000000101
            className: CredentialRecord
          occurredAt: '2026-09-19T18:02:17Z'
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          lane:
            id: b2000000-0000-4000-8000-000000000001
            className: VehicularAccess
          device:
            id: b2000000-0000-4000-8000-000000000011
            className: SupplementalEquipment
          direction: entry
          outcome: denied
          denialReason: credentialReplaced
    ConditionReport:
      title: ConditionReport
      description: |-
        The vehicle's condition as recorded by an attendant (or a scanning
        device) at drop-off or handback: free-text notes, per-area damage
        entries, and access-controlled image links (Part 9 §9.6). The
        drop-off report is the evidence a damage claim is answered with.
      type: object
      properties:
        notes:
          type: string
          description: Free-text observations.
          examples:
            - Scuff on rear bumper, driver side; interior clean.
        damage:
          type: array
          description: Structured damage entries, one per finding.
          items:
            type: object
            required:
              - area
            properties:
              area:
                type: string
                description: Implementer code list — frontBumper, rearBumper, driverDoor, passengerDoor, hood, roof, trunk, wheelFL/FR/RL/RR, windshield, interior…
                examples:
                  - rearBumper
              description:
                type: string
              severity:
                type: string
                enum:
                  - minor
                  - moderate
                  - major
              imageLink:
                $ref: '#/components/schemas/Url'
        imageLinks:
          type: array
          description: Walk-around photos or scan captures, as access-controlled links.
          items:
            $ref: '#/components/schemas/Url'
        recordedTime:
          $ref: '#/components/schemas/DateTime'
        recordedBy:
          type: string
          description: Opaque principal (attendant id, scanning device id).
        customerAcknowledged:
          type: boolean
          description: Whether the customer acknowledged the report (signature, tap, spoken confirmation).
      examples:
        - notes: Scuff on rear bumper, driver side, approx 6 cm. Interior clean.
          damage:
            - area: rearBumper
              description: 6 cm scuff, driver side
              severity: minor
              imageLink: https://api.lakeside-garage.example/valet/v-20419/in-rear-bumper.jpg
          imageLinks:
            - https://api.lakeside-garage.example/valet/v-20419/in-front.jpg
            - https://api.lakeside-garage.example/valet/v-20419/in-driver.jpg
            - https://api.lakeside-garage.example/valet/v-20419/in-rear.jpg
            - https://api.lakeside-garage.example/valet/v-20419/in-passenger.jpg
          recordedTime: '2026-09-20T18:30:02Z'
          recordedBy: scanner-0031
          customerAcknowledged: true
    ValetTicket:
      title: ValetTicket
      description: |-
        The custody record for one valeted vehicle: drop-off (with condition
        evidence), where it is parked and where the keys are, the retrieval
        request and its ETA, staging, and handback — with the immutable
        lifecycle audit. The APDS Session remains the stay and the money;
        this record is what the attendant board, the customer's phone, and a
        damage claim look at.

        Lifecycle (Part 22 §22.1): `dropped → parked → requested → retrieving
        → staged → handedBack → closed`; `cancel-retrieval` returns
        `requested | retrieving` to `parked`; `dropped → handedBack` is
        allowed before the car moves; `closed` is server-side when the stay
        settles. `cancelled` is terminal for a drop-off abandoned before
        custody.
      type: object
      required:
        - id
        - version
        - place
        - valetStatus
        - dropOff
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        place:
          description: The HierarchyElement (the facility or valet stand).
          $ref: '#/components/schemas/Reference'
        session:
          description: The APDS Session for the stay (opened at drop-off).
          $ref: '#/components/schemas/Reference'
        assignedRight:
          description: The APDS AssignedRight (the valet ticket as a right), when the operator issues one.
          $ref: '#/components/schemas/Reference'
        ticketNumber:
          type: string
          description: The number printed on the claim ticket / shown in the app.
          examples:
            - V-20419
        vehicle:
          type: object
          properties:
            credentialType:
              $ref: '#/components/schemas/CredentialTypeEnum'
            credentialIdentification:
              type: string
              description: The plate (or other credential) read at drop-off.
              examples:
                - SYN-7734
            jurisdiction:
              type: string
            make:
              type: string
            model:
              type: string
            colour:
              type: string
            description:
              type: string
        customer:
          type: object
          description: Who the car belongs to — minimized (Part 9 §9.6); enough to verify at handback and reach them for ETA.
          properties:
            contact:
              $ref: '#/components/schemas/Reference'
            account:
              description: The APX Account (Part 13), for members and hotel guests on file.
              $ref: '#/components/schemas/Reference'
            displayName:
              type: string
            contactChannel:
              type: object
              description: How to reach the customer about retrieval; the handle is opaque/masked — no telephony in the contract.
              properties:
                type:
                  type: string
                  enum:
                    - sms
                    - app
                    - web
                    - voice
                    - email
                    - none
                handle:
                  type: string
                  description: Opaque or masked handle (push token id, masked number).
        dropOff:
          type: object
          required:
            - time
          properties:
            time:
              $ref: '#/components/schemas/DateTime'
            lane:
              description: The VehicularAccess or valet stand where custody was taken.
              $ref: '#/components/schemas/Reference'
            attendant:
              type: string
              description: Opaque principal.
            mileage:
              type: integer
              minimum: 0
            fuelLevelPercent:
              type: number
              minimum: 0
              maximum: 100
            keyTag:
              type: string
              description: The key hook / tag identifier.
            itemsLeft:
              type: string
              description: Declared items left in the vehicle.
            conditionReport:
              $ref: '#/components/schemas/ConditionReport'
        storage:
          type: object
          description: Where the vehicle and its keys are.
          properties:
            space:
              description: The APDS Space, when the facility is space-mapped.
              $ref: '#/components/schemas/Reference'
            zone:
              type: string
              description: Zone/row/level text for facilities that are not space-mapped.
              examples:
                - P3 row D
            keyLocation:
              type: string
              examples:
                - board-2 hook 17
            parkedTime:
              $ref: '#/components/schemas/DateTime'
            parkedBy:
              type: string
        retrieval:
          type: object
          description: The current (or last) retrieval request.
          properties:
            requestedTime:
              $ref: '#/components/schemas/DateTime'
            requestedFor:
              description: A scheduled pickup time; absent = as soon as possible.
              $ref: '#/components/schemas/DateTime'
            channel:
              type: string
              enum:
                - sms
                - app
                - web
                - voiceBot
                - kiosk
                - attendant
                - callCenter
            requestedBy:
              type: string
              description: Opaque principal (customer handle, attendant, bot id).
            interaction:
              type: string
              description: Opaque interaction id (Part 17 §17.6 convention) linking to the support interaction that raised it, if any.
            etaMinutes:
              type: integer
              minimum: 0
              description: The operator's current estimate; recomputed as the queue moves.
            promisedTime:
              description: When the car is promised at the staging lane (requestedTime + eta, or requestedFor).
              $ref: '#/components/schemas/DateTime'
            retrievingBy:
              type: string
            stagingLane:
              $ref: '#/components/schemas/Reference'
            stagedTime:
              $ref: '#/components/schemas/DateTime'
            cancelledTime:
              $ref: '#/components/schemas/DateTime'
            cancelReason:
              type: string
        handback:
          type: object
          readOnly: true
          properties:
            time:
              $ref: '#/components/schemas/DateTime'
            handedTo:
              type: string
              description: Opaque description of the recipient as verified.
            verificationMethod:
              type: string
              enum:
                - ticket
                - phone
                - code
                - id
                - attendant
            attendant:
              type: string
            mileage:
              type: integer
              minimum: 0
            conditionReport:
              $ref: '#/components/schemas/ConditionReport'
            notes:
              type: string
        valetStatus:
          type: string
          enum:
            - dropped
            - parked
            - requested
            - retrieving
            - staged
            - handedBack
            - closed
            - cancelled
          readOnly: true
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: d8000000-0000-4000-8000-000000000419
          version: 3
          place:
            id: b1000000-0000-4000-8000-000000000005
            className: Place
          ticketNumber: V-20419
          vehicle:
            credentialType: licensePlate
            credentialIdentification: SYN-7734
            make: Audi
            colour: grey
          dropOff:
            time: '2026-09-20T18:30:14Z'
          retrieval:
            requestedTime: '2026-09-20T20:41:03Z'
            channel: sms
            requestedBy: customer
            etaMinutes: 8
            promisedTime: '2026-09-20T20:49:03Z'
          valetStatus: requested
          statusHistory:
            - state: dropped
              time: '2026-09-20T18:30:14Z'
              actor: attendant-0031
            - state: parked
              time: '2026-09-20T18:36:40Z'
              actor: runner-0107
            - state: requested
              time: '2026-09-20T20:41:03Z'
              actor: customer
              detail: channel sms; eta 8 min
    ValetParkRequest:
      title: ValetParkRequest
      description: Request body recording where the vehicle was parked and where its keys are.
      type: object
      properties:
        space:
          $ref: '#/components/schemas/Reference'
        zone:
          type: string
        keyLocation:
          type: string
        note:
          type: string
    ValetRetrievalRequest:
      title: ValetRetrievalRequest
      description: Request body asking for the car — from the customer (text, app, web, voice bot) or an attendant.
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          enum:
            - sms
            - app
            - web
            - voiceBot
            - kiosk
            - attendant
            - callCenter
        requestedFor:
          description: Scheduled pickup; absent = as soon as possible.
          $ref: '#/components/schemas/DateTime'
        interaction:
          type: string
          description: Opaque interaction id (Part 17 §17.6) when raised through a support channel or bot.
        note:
          type: string
    ValetCancelRetrievalRequest:
      title: ValetCancelRetrievalRequest
      description: Request body cancelling an open retrieval request; the vehicle returns to `parked`.
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          examples:
            - customerDelayed
        note:
          type: string
    ValetStageRequest:
      title: ValetStageRequest
      description: Request body recording the vehicle at the staging lane, ready for handback.
      type: object
      required:
        - stagingLane
      properties:
        stagingLane:
          $ref: '#/components/schemas/Reference'
        note:
          type: string
    ValetHandbackRequest:
      title: ValetHandbackRequest
      description: Request body handing the vehicle to a verified customer, with the handback condition report.
      type: object
      required:
        - verificationMethod
      properties:
        verificationMethod:
          type: string
          enum:
            - ticket
            - phone
            - code
            - id
            - attendant
        verificationValue:
          type: string
          description: What was presented (ticket number, one-time code…); never stored beyond the check.
        handedTo:
          type: string
        mileage:
          type: integer
          minimum: 0
        conditionReport:
          $ref: '#/components/schemas/ConditionReport'
        notes:
          type: string
    DiscoveryDocument:
      title: DiscoveryDocument
      description: |-
        What THIS credential can do: exactly the endpoints, commands, topics,
        and places reachable with the presented token's scopes and grants.
        Two clients with different grants receive different documents; a client
        can call everything its document lists and nothing more.
      type: object
      required:
        - client
        - conformanceClasses
        - scopes
        - endpoints
      properties:
        client:
          type: string
          description: The OAuth client id this document was computed for.
        organisation:
          description: The client's Organisation (token claim apx_org).
          $ref: '#/components/schemas/Reference'
        conformanceClasses:
          type: array
          description: Server classes usable by this client (intersection with its scopes).
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        places:
          type: array
          description: |-
            Granted HierarchyElement subtree roots (token claim apx_places),
            reflected exactly. Fail-closed semantics (Part 9 §9.3): an empty
            array means NO places; the explicit wildcard entry "*" means all
            places.
          items:
            type: string
        endpoints:
          type: array
          description: Concrete callable endpoints (APDS-native + APX).
          items:
            type: object
            required:
              - path
              - methods
            properties:
              path:
                type: string
              methods:
                type: array
                items:
                  type: string
        commandTypes:
          type: array
          description: Command types this client may execute (empty without apx.control:execute).
          items:
            type: string
        topics:
          type: array
          description: Topics this client may subscribe to.
          items:
            type: string
        rateLimits:
          type: object
          description: Advisory per-client limits.
          additionalProperties:
            type: integer
    ResolutionContext:
      title: ResolutionContext
      description: |-
        The aggregated customer-service context (Part 17): everything the
        server could resolve about one interaction, plus the policy-decided
        allowed actions. Every section beyond the required core is OPTIONAL —
        implementations include what they know and omit what they don't
        (graceful degradation), and MUST NOT include sections the caller's
        scopes/grants could not read directly.
      type: object
      required:
        - id
        - version
        - computedAt
        - status
        - place
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: Increments each time the context is recomputed.
        computedAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          enum:
            - full
            - partial
          description: partial = at least one source has not answered yet; re-read to refresh.
        pendingSources:
          type: array
          description: Names of sources still resolving when status=partial (implementer-defined identifiers).
          items:
            type: string
        interactionId:
          type: string
          description: Echo of the caller's opaque interaction identifier.
          examples:
            - interaction-938383
        correlationId:
          type: string
          format: uuid
        issue:
          $ref: '#/components/schemas/ResolutionIssue'
        place:
          description: The facility this interaction is anchored to.
          $ref: '#/components/schemas/Reference'
        placeDisplay:
          type: string
          examples:
            - Lakeside Garage
        lane:
          description: The VehicularAccess (lane) if resolved.
          $ref: '#/components/schemas/Reference'
        laneStatus:
          description: The live lane inquiry result (Part 6 §6.2).
          $ref: '#/components/schemas/LaneStatus'
        vehicle:
          type: object
          description: The vehicle as best resolved (usually via LPR). Plate vocabulary follows APDS VehicleAncillaryIdentification (country/stateProvince).
          properties:
            plate:
              type: string
            country:
              type: string
              examples:
                - US
            stateProvince:
              type: string
              examples:
                - FL
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: Projection of APDS Confidence.overallConfidence (0–1).
            plateImage:
              $ref: '#/components/schemas/Url'
        session:
          $ref: '#/components/schemas/Reference'
        holder:
          description: The RightHolder (parker) if identified.
          $ref: '#/components/schemas/Reference'
        holderDisplay:
          type: string
          description: Display name only — contact details require the account read (PII minimization).
        account:
          $ref: '#/components/schemas/Account'
        assignedRight:
          description: The permit/reservation AssignedRight if resolved.
          $ref: '#/components/schemas/Reference'
        reservation:
          $ref: '#/components/schemas/ReservationSummary'
        credential:
          $ref: '#/components/schemas/Reference'
        passback:
          $ref: '#/components/schemas/PassbackStatus'
        accessDecision:
          type: object
          description: The most recent access decision at the lane.
          properties:
            status:
              type: string
              enum:
                - granted
                - denied
                - pending
                - unknown
            reasonCode:
              type: string
              description: Operator code-list value.
              examples:
                - outstandingBalance
            reasonDisplay:
              type: string
            occurredAt:
              $ref: '#/components/schemas/DateTime'
        payments:
          type: array
          description: Recent relevant payments (most recent first).
          items:
            $ref: '#/components/schemas/PaymentRecord'
        devices:
          type: array
          description: Live status of the lane's devices — surfaces equipment faults before the agent asks the customer to retry.
          items:
            $ref: '#/components/schemas/DeviceStatus'
        recentOverrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideRecord'
        supportHistory:
          type: array
          description: Recent SupportInteractions for the same subjects.
          items:
            $ref: '#/components/schemas/SupportInteraction'
        allowedActions:
          type: array
          description: The policy layer's decisions — see AllowedAction. May be empty.
          items:
            $ref: '#/components/schemas/AllowedAction'
        recommendedAction:
          type: object
          description: The server's suggested next step (advisory, never binding). MUST be one of allowedActions.
          required:
            - action
          properties:
            action:
              type: string
              description: The AllowedAction.action value being recommended.
              examples:
                - post-apx-v1-payment-links
            reason:
              type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e5000000-0000-4000-8000-000000000013
          version: 1
          computedAt: '2026-09-05T20:12:44Z'
          status: full
          issue:
            code: validationMissing
            display: Customer reports a merchant validation that is not applied to the ticket
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          laneStatus:
            lane:
              id: b2000000-0000-4000-8000-000000000002
              className: VehicularAccess
            currentTicket:
              ticketNumber: T-70443
              session:
                id: c4000000-0000-4000-8000-000000000023
                className: Session
              amountDue:
                currencyType: USD
                currencyValue: 14
              paidInFull: false
              validations: []
          allowedActions:
            - action: applyValidation
              display: Apply merchant validation
              target:
                id: b2000000-0000-4000-8000-000000000002
                className: VehicularAccess
              allowed: true
              requiresApproval: false
              execution:
                type: control
                command: applyValidation
            - action: vendGate
              display: Vend gate
              target:
                id: b2000000-0000-4000-8000-000000000002
                className: VehicularAccess
              allowed: false
              execution:
                type: control
                command: vendGate
              reason:
                code: sessionUnpaid
                display: A validation adjusts the amount due; it does not waive the remainder.
                policy: no-vend-while-unpaid
          recommendedAction:
            action: applyValidation
            reason: The ticket carries no validation; if the claimed provider is on the place's list, apply it and requote.
    ResolutionResolveRequest:
      title: ResolutionResolveRequest
      description: |-
        Whatever PARKING-DOMAIN identifiers are currently known — the server
        resolves every relationship it can (Part 17 §17.2). At least one
        identifying property is required; all are optional individually.

        Deliberately NO telephony identifiers (SIP URIs, phone numbers): the
        call platform that owns the intercom maps call → lane/device on its
        side before calling APX (Part 17 §17.1). PARCS implementations never
        need to understand telephony.
      type: object
      minProperties: 1
      properties:
        interactionId:
          type: string
          description: |-
            OPAQUE identifier of the calling application's customer interaction
            (a call, chat, SMS session…). APX never interprets it — it only
            echoes it for correlation (Part 17 §17.7). Not an identifier for
            resolution.
          examples:
            - interaction-938383
        correlationId:
          type: string
          format: uuid
          description: Caller-minted correlation id; echoed on the context and reusable on Commands.
        channel:
          type: string
          description: How the interaction arrived, for context/history display (voice | intercom | chat | web | other).
          examples:
            - intercom
        device:
          description: A SupplementalEquipment the interaction is anchored to (only meaningful if inventoried in the Place hierarchy).
          $ref: '#/components/schemas/Reference'
        place:
          $ref: '#/components/schemas/Reference'
        lane:
          $ref: '#/components/schemas/Reference'
        session:
          $ref: '#/components/schemas/Reference'
        holder:
          $ref: '#/components/schemas/Reference'
        credential:
          $ref: '#/components/schemas/Reference'
        plate:
          type: string
        ticketNumber:
          type: string
        reservationCode:
          type: string
    ResolutionIssue:
      title: ResolutionIssue
      description: |-
        The machine-classified issue this context describes. `code` is a
        definedValue from the apx-issue-types registry (open, per Part 11);
        `display` is the human-readable summary shown to agents.
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: definedValue from apx-issue-types.
          examples:
            - accountBalanceDenied
        display:
          type: string
          examples:
            - Monthly parker denied because of outstanding balance
    AllowedAction:
      title: AllowedAction
      description: |-
        One policy decision about one action, evaluated for THIS context, THIS
        credential, and THIS moment (Part 17 §17.3). The server — never the
        consuming agent, human or AI — decides permissibility. Approval
        requirements are policy-dependent, which is why they live here at
        runtime and not in a registry.

        The `execution` descriptor abstracts HOW the action runs — a Part 6
        control command or a domain API operation — so the agent sees one
        unified action list and never needs to know which APX module executes
        it. Servers MUST NOT list an action the implementation does not
        support (Part 17 §17.3).
      type: object
      required:
        - action
        - allowed
      properties:
        action:
          type: string
          description: |-
            Logical action identifier: the apx-command-types value for control
            actions, or the effective-spec operationId for domain actions.
          examples:
            - courtesyExit
        display:
          type: string
          description: Agent-facing label.
          examples:
            - Courtesy exit
        target:
          description: The Reference the action should be executed against.
          $ref: '#/components/schemas/Reference'
        allowed:
          type: boolean
        requiresApproval:
          type: boolean
          default: false
          description: When true, the executing request MUST carry approval evidence (Part 17 §17.3).
        approvalRole:
          type: string
          description: Role that can approve (implementer/operator code list).
          examples:
            - supervisor
        execution:
          type: object
          description: How to execute (RECOMMENDED). Exactly one of command/operationId per type.
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - control
                - domain
            command:
              type: string
              description: For type=control — the apx-command-types value for POST /v1/commands.
              examples:
                - courtesyExit
            operationId:
              type: string
              description: For type=domain — the operationId of the executing operation in the effective OpenAPI description.
              examples:
                - post-apx-v1-payment-links
        reason:
          type: object
          description: Why the action is denied or gated. REQUIRED when allowed=false or requiresApproval=true.
          required:
            - code
          properties:
            code:
              type: string
              description: Machine-readable policy reason code (operator code list).
              examples:
                - courtesyLimitReached
            display:
              type: string
              examples:
                - Two courtesy exits have already been provided within the previous 48 hours.
            policy:
              type: string
              description: Identifier of the matched operator policy (opaque to APX).
    PassbackStatus:
      title: PassbackStatus
      description: Anti-passback state overlay for one APDS Credential.
      type: object
      required:
        - credential
        - state
      properties:
        credential:
          $ref: '#/components/schemas/Reference'
        state:
          type: string
          enum:
            - normal
            - violation
            - unknown
        expectedPresence:
          type: string
          enum:
            - inside
            - outside
            - unknown
        recordedPresence:
          type: string
          enum:
            - inside
            - outside
            - unknown
        lastAccess:
          type: object
          description: The most recent access event for this credential.
          required:
            - direction
            - occurredAt
          properties:
            direction:
              type: string
              enum:
                - entry
                - exit
            occurredAt:
              $ref: '#/components/schemas/DateTime'
            place:
              $ref: '#/components/schemas/Reference'
            lane:
              description: The VehicularAccess where the access occurred.
              $ref: '#/components/schemas/Reference'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - credential:
            id: c3000000-0000-4000-8000-000000000013
            className: Credential
          state: violation
          expectedPresence: outside
          recordedPresence: inside
          lastAccess:
            direction: entry
            occurredAt: '2026-09-01T08:03:47Z'
            place:
              id: b1000000-0000-4000-8000-000000000001
              className: Place
            lane:
              id: b2000000-0000-4000-8000-000000000001
              className: VehicularAccess
    PlateCandidate:
      title: PlateCandidate
      description: |-
        One candidate plate read for correction workflows (Part 17 §17.5) —
        a projection over APDS Observations, imagery as access-controlled
        links (Part 9 §9.6).
      type: object
      required:
        - plate
        - confidence
        - observationDateTime
      properties:
        plate:
          type: string
        country:
          type: string
          description: Plate issuing country (APDS VehicleAncillaryIdentification.country vocabulary).
          examples:
            - US
        stateProvince:
          type: string
          description: Plate issuing state/province (APDS VehicleAncillaryIdentification.stateProvince vocabulary).
          examples:
            - FL
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Projection of APDS Confidence.overallConfidence (0–1) for the read.
        observationDateTime:
          description: When the read was captured (aligned with LprRead.observationDateTime; APDS ObservationElement.observationStartTime).
          $ref: '#/components/schemas/DateTime'
        detail:
          description: Per-attribute confidences, alternate reads, and passage geometry (Part 13 §13.3a), when the read carried them.
          $ref: '#/components/schemas/LprReadDetail'
        lane:
          $ref: '#/components/schemas/Reference'
        observation:
          description: The underlying APDS Observation.
          $ref: '#/components/schemas/Reference'
        plateImage:
          $ref: '#/components/schemas/Url'
        vehicleImage:
          $ref: '#/components/schemas/Url'
      examples:
        - plate: SVN-4821
          country: US
          stateProvince: FL
          confidence: 0.97
          observationDateTime: '2026-09-02T22:39:04Z'
          lane:
            id: b2000000-0000-4000-8000-000000000002
            className: VehicularAccess
          observation:
            id: f2000000-0000-4000-8000-000000000014
            className: Observation
          plateImage: https://api.lakeside-garage.example/v1/media/f2000000-0014/plate.jpg
    OverrideRecord:
      title: OverrideRecord
      description: A recent manual override relevant to this context (courtesy exits, gate opens, passback resets…). Summarizes a Part 6 Command.
      type: object
      required:
        - commandType
        - occurredAt
      properties:
        commandType:
          type: string
          description: definedValue from apx-command-types.
          examples:
            - courtesyExit
        command:
          description: Reference to the full Command (audit trail).
          $ref: '#/components/schemas/Reference'
        occurredAt:
          $ref: '#/components/schemas/DateTime'
        requestedBy:
          $ref: '#/components/schemas/Reference'
        place:
          $ref: '#/components/schemas/Reference'
    SupportInteraction:
      title: SupportInteraction
      description: |-
        One customer-service interaction (human or AI agent), recorded so
        future resolution contexts can surface "they called twice yesterday".
      type: object
      required:
        - id
        - version
        - channel
        - agentType
        - startedAt
        - place
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        channel:
          type: string
          description: voice | chat | email | sms | other (implementer code list).
          examples:
            - voice
        agentType:
          type: string
          enum:
            - human
            - ai
        agent:
          type: string
          description: Agent identifier (human or system principal).
        startedAt:
          $ref: '#/components/schemas/DateTime'
        endedAt:
          $ref: '#/components/schemas/DateTime'
        place:
          $ref: '#/components/schemas/Reference'
        issue:
          $ref: '#/components/schemas/ResolutionIssue'
        summary:
          type: string
          description: Short outcome summary. NOT a transcript — PII minimization (Part 9 §9.6).
        subjects:
          type: object
          description: What/who the interaction was about (all optional).
          properties:
            session:
              $ref: '#/components/schemas/Reference'
            holder:
              $ref: '#/components/schemas/Reference'
            account:
              $ref: '#/components/schemas/Reference'
            credential:
              $ref: '#/components/schemas/Reference'
            reservation:
              $ref: '#/components/schemas/Reference'
            plate:
              type: string
        actions:
          type: array
          description: References to actions executed during the interaction (Commands, PaymentLinks, domain mutations).
          items:
            $ref: '#/components/schemas/Reference'
        interactionId:
          type: string
          description: The calling application's opaque interaction identifier.
          examples:
            - interaction-938383
        resolution:
          type: object
          description: How the interaction ended.
          properties:
            code:
              type: string
              examples:
                - resolved
            display:
              type: string
        correlationId:
          type: string
          format: uuid
          description: Correlation chain id (Part 17 §17.7).
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e7000000-0000-4000-8000-000000000003
          version: 1
          channel: voice
          agentType: ai
          agent: callcenter-ai-agent-07
          startedAt: '2026-09-02T21:14:02Z'
          endedAt: '2026-09-02T21:18:30Z'
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          issue:
            code: accountBalanceDenied
            display: Monthly parker denied because of outstanding balance
          summary: Balance hold at Exit 3; customer paid $185.00 via payment link; exited normally.
          subjects:
            holder:
              id: c1000000-0000-4000-8000-000000000003
              className: RightHolder
            account:
              id: c2000000-0000-4000-8000-000000000004
              className: Account
            plate: SYN-1234
          actions:
            - id: e6000000-0000-4000-8000-000000000002
              className: PaymentLink
          interactionId: interaction-938383
          resolution:
            code: resolved
            display: Paid and exited
          correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    ApxConfiguration:
      type: object
      description: Unauthenticated bootstrap configuration document.
      required:
        - apxVersion
        - apdsVersion
        - tokenEndpoint
        - conformanceClasses
      properties:
        apxVersion:
          type: string
          description: APX standard version implemented (semver).
          examples:
            - 0.1.0
        apdsVersion:
          type: string
          description: APDS version this implementation extends.
          examples:
            - '4.1'
        tokenEndpoint:
          type: string
          format: uri
          description: OAuth2 token endpoint (client-credentials grant).
        conformanceClasses:
          type: array
          description: APX conformance classes this implementation supports.
          items:
            type: string
          examples:
            - - apx-data
              - apx-events
              - apx-control
              - apx-alerts
              - apx-discovery
        registries:
          type: object
          description: Locations of the published UserDefinedCodeList registries.
          additionalProperties:
            type: string
            format: uri
    HierarchyElementTypeEnum:
      title: HierarchyElementTypeEnum
      description: |-
        Defines the supported lists of types of parking hierarchy elements permissible
        * campus : a data structure holding information about a large, often ill-defined area, which may contain many parking structures.
        * identifiedArea : a data structure holding information about a coherent feature, such as a set of parking spaces that all share the same characteristics.
        * place : a data structure holding information about a single identifiable parking place.
        * space : a data structure holding information about a single space for parking, usually designed for one vehicle, which may be denoted by painted or other road surface markers.
        * subplaceElement : a sub-division of a place for the convenience of the operator that may be used for parking related or other purposes.
        * specificArea : a specialisation of an identified area that denotes a specific geographic area in a place that has a common physical infrastructure purpose and common characteristics.
        * vehicularAccess : a specialisation of an identified area defining vehicular access areas.
        * electricChargingEquipment : a specialisation of a supplemental facility for electric charging areas.
        * supplementalEquipment : a specialisation of a supplemental facility which is available on some site, for example on a rest area.
        * supplementalServiceFacility : a specialisation of a supplemental facility to specify the type and number of available sub-facilities, for example 20 restaurants.
      type: string
      x-package: place.enums
      enum:
        - campus
        - identifiedArea
        - place
        - space
        - subplaceElement
        - specificArea
        - vehicularAccess
        - electricChargingEquipment
        - supplementalEquipment
        - supplementalServiceFacility
    RightSpecificationTypeEnum:
      title: RightTypeEnum
      description: |-
        Defines the type of RightSpecification
        * accessPermission : intended grant access permission
        * loadingUnloading : intended granting permissions to load and unload vehicles.
        * oneTimeUseParking : intended for one time or limited parking usage
        * permitParking : intended for multi-use parking usage
        * setDownPickup : intended for passenger set down and pick up
        * waiting : intended to grant permission for an accompanied vehicle to wait
      type: string
      x-package: right_specification.enums
      enum:
        - accessPermission
        - loadingUnloading
        - oneTimeUseParking
        - permitParking
        - setdownPickup
        - waiting
    StructureTypeEnum:
      title: StructureTypeEnum
      description: |-
        A list of types of parking structure.
        * offStreetStructure : Off-street multi-tier parking structure.
        * offStreetSurface : Off-street ground-level at grade parking.
        * onStreet : On-street parking.
      type: string
      x-package: place.enums
      enum:
        - offStreetStructure
        - offStreetSurface
        - onStreet
    StructureGradeEnum:
      title: StructureGradeEnum
      description: |-
        Types of layout of the parking site.
        * aboveGround : Parking is above ground level (this may include ground level parking)
        * groundLevel : Parking is at ground level
        * underground : Parking is on one or more floors below ground level
      type: string
      x-package: place.enums
      enum:
        - aboveGround
        - groundLevel
        - underground
    PaginatedListMeta:
      title: PaginatedListMeta
      description: Metadata for paginated list of results for listing API endpoints.
      type: object
      x-package: api
      properties:
        referenceInstant:
          type: integer
          description: Unix epoch time to be used as reference which should be the same for all pages. Allows a consistent view of data across multiple paged requests.
          minimum: 0
          examples:
            - 1709840615
        offset:
          type: integer
          minimum: 0
          description: Index of the first item returned in the page.
          examples:
            - 0
        pageSize:
          type: integer
          description: Maximum number of items that can be returned per page.
          minimum: 0
          examples:
            - 100
        total:
          type: integer
          description: Total number of items contained in all pages.
          minimum: 0
          examples:
            - 1
      required:
        - referenceInstant
        - offset
        - pageSize
        - total
    DateTime:
      title: DateTime
      description: ISO-8601 format definition of a date and time - format YYYY-MM-DDTHH:MM:SSZ.
      type: string
      x-package: common
      format: date-time
      examples:
        - '2024-03-09T15:35:08Z'
    DeletedReference:
      title: DeletedReference
      description: A reference to a deleted identifiable managed object where the identifier is unique. It is described by a string identifying the class of the referenced object (key name) with a unique string identifier as its value, and the deletion instant.
      type: object
      x-package: api
      properties:
        id:
          type: string
          description: The unique id of the deleted object.
        className:
          type: string
          description: The class name of the deleted object.
          pattern: ^([A-Z][a-z0-9]+)+
        deleteTimestamp:
          description: The instant when the reference was deleted.
          $ref: '#/components/schemas/DateTime'
      required:
        - id
        - className
        - deleteTimestamp
    PaginatedList:
      title: PaginatedList
      description: Paginated list of results for listing API endpoints.
      type: object
      x-package: api
      properties:
        meta:
          $ref: '#/components/schemas/PaginatedListMeta'
        deletedReferences:
          type: array
          description: This attribute will returned when the `modified_since` query parameter is used. It will contain references to deleted resources since the provided instant, that would have otherwise been included in the dataset (either at the top-level or as associated objects).
          items:
            $ref: '#/components/schemas/DeletedReference'
      required:
        - meta
    HierarchyElement:
      title: HierarchyElement
      description: A generalised component of a place hierarchy, that forms one element in the tree-like hierarchy. This forms a reusable block of the hierarchy, with relations to its parent element (if one exists) and any child elements. Each Place element in the hierarchy shall have a name, and may support a free-text description and an operator/property owner defined reference (e.g. location number/identifier)'
      type: object
      x-package: place
      discriminator:
        propertyName: type
        mapping:
          campus: '#/components/schemas/Campus'
          place: '#/components/schemas/Place'
          space: '#/components/schemas/Space'
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/HierarchyElementTypeEnum'
            name:
              $ref: '#/components/schemas/MultilingualString'
            description:
              $ref: '#/components/schemas/MultilingualString'
            aliases:
              type: array
              description: Alternative names for the hierarchy element.
              items:
                $ref: '#/components/schemas/MultilingualString'
            operatorDefinedReference:
              $ref: '#/components/schemas/VersionedReference'
            parentId:
              $ref: '#/components/schemas/VersionedReference'
            childIds:
              type: array
              readOnly: true
              description: The identity of one or several child nodes directly related to this hierarchy element.
              items:
                $ref: '#/components/schemas/VersionedReference'
            layer:
              type: integer
              minimum: 0
              description: Indicator of the position of this hierarchy element in the specific hierarchy, with the top of the hierarchy numbered layer 0.
            rightSpecifications:
              type: array
              readOnly: true
              description: RightSpecifications associated to the element
              items:
                $ref: '#/components/schemas/VersionedReference'
            hierarchyElementRecord:
              readOnly: true
              $ref: '#/components/schemas/HierarchyElementRecord'
            hierarchyElementReference:
              $ref: '#/components/schemas/HierarchyElementReference'
            occupancyLevel:
              $ref: '#/components/schemas/OccupancyLevel'
            responsibilityRoleAssignments:
              description: roles and responsibilities
              type: array
              items:
                $ref: '#/components/schemas/ResponsibilityRoleAssignment'
      required:
        - type
        - name
        - layer
        - hierarchyElementRecord
    Campus:
      title: Campus
      description: The highest level in the hierarchy, it typically defines a large facility (such as a university campus, or an airport), or a large geographic zone (such as a city or a town), which may contain numerous Places. A Campus combines and encompasses a number of Places that can be logically reported together.
      type: object
      x-package: place
      allOf:
        - $ref: '#/components/schemas/HierarchyElement'
    CoveredTypeEnum:
      title: CoveredTypeEnum
      description: |-
        Defines the supported lists of different types describing roof coverage of the facility or entity
        * covered: Indicates that the facility or specific entity has a roof to provide protection from direct overhead sun or adverse weather
        * notCovered: Indicates that the facility or specific entity has no roof to provide protection from direct overhead sun or adverse weather
        * partiallyCovered: Indicates that the facility or specific entity has a roof offering partial coverage to provide protection from direct overhead sun or adverse weather
        * topLevelNotCovered: Indicates that in a multi-level facility or specific entity the top level(s) have no roof to provide protection from direct overhead sun or adverse weather
      type: string
      x-package: place.characteristics.enums
      enum:
        - covered
        - notCovered
        - partiallyCovered
        - topLevelNotCovered
    AccessibilityTypeEnum:
      title: AccessibilityTypeEnum
      description: |-
        Special forms of accessibility, easements and marking for disabled people.
        * barrierFreeAccessible: Accessible without any steps or other barriers. Does not ensure the same access as disabledAccessible.
        * disabledAccessible: Accessible for disabled people. wheelChairAccessible is a special form of it.
        * disabledEasements: There are special easements for disabled people, like handrails or disabled-friendly furniture.
        * disabledMarkedThere: is a visible mark to support access by disabled people (e.g. a wheelchair symbol).
        * none: No form of special accessibility, i.e. usually not convenient for disabled people, e.g. because of steps or barriers.
        * orientationSystemForBlindPeople: There is some orientation system, which helps blind or visually impaired people. Examples might be some acoustic system or tactile paving.
        * other: Other.
        * unknown: It is unknown, whether there is a special form of accessibility.
        * wheelChairAccessible: Accessible by people in a wheelchair.
      type: string
      x-package: place.characteristics.enums
      enum:
        - barrierFreeAccessible
        - disabledAccessible
        - disabledEasements
        - disabledMarkedThere
        - none
        - orientationSystemForBlindPeople
        - other
        - unknown
        - wheelChairAccessible
    OperatingModeTypeEnum:
      title: OperatingModeTypeEnum
      description: |-
        A list of supported parking operation modes
        * app : App â€“ payment is collected via an app that may also control access to the facility.
        * payAndDisplay : PND â€“ pay and display. Vehicle displays a credential to show it is paid. Typically prepaid and short term.
        * payByPlate : PBP - pay by plate - vehicle registration or license plate is used for recording and enforcement either on street or off street. Payment is collected on a prepaid basis or at the exit.
        * payBySpace : PBS â€“ pay by space. Vehicle makes a payment based on occupying a specific space. Typically prepaid.
        * permit : Similar to PND but for long term parking (e.g. monthly pass, quarterly, semester).
        * ticket : Payment is done with a ticket (e.g. with magnetic strip, barcode). Payment is collected at the exit.
      type: string
      x-package: place.characteristics.enums
      enum:
        - app
        - payAndDisplay
        - payByPlate
        - payBySpace
        - permit
        - ticket
    StaffEnum:
      title: StaffEnum
      description: |-
        A list of supported values for staffing characteristics
        * staffed : Normally staffed during operating hours
        * temporary : Staffed on a temporary or part time basis.
        * unstaffed : Not normally staffed during operating hours
      type: string
      x-package: place.characteristics.enums
      enum:
        - staffed
        - temporary
        - unstaffed
    PlaceCharacteristics:
      title: PlaceCharacteristics
      description: Defines information concerning characteristics related to a parking facility.
      type: object
      x-package: place.characteristics
      properties:
        openToPublic:
          description: Identifies if this facility is accessible to public use (TRUE) or private use only (FALSE).
          type: boolean
        accessControlled:
          type: boolean
          description: Indicates facility has physical access control (e.g. barriers, gates) (TRUE) or no access control (FALSE).
        robotic:
          type: boolean
          description: Indicates existence of a robotic parking system (a parking structure where customer leaves vehicle at drop off area and robots move the vehicle to parking location within the structure). Default is (FALSE).
        coveredType:
          $ref: '#/components/schemas/CoveredTypeEnum'
        disabledAccess:
          type: boolean
          description: Specifies if there is provision of facilities for disable access (TRUE) or not (FALSE).
        disabledAccessTypes:
          type: array
          description: Defines the type of provision of facilities for disable access available.
          items:
            $ref: '#/components/schemas/AccessibilityTypeEnum'
        operatingModes:
          type: array
          description: Defines the mode of parking operation in use.
          items:
            $ref: '#/components/schemas/OperatingModeTypeEnum'
        spacesNonDedicated:
          type: integer
          description: Number of parking spaces that are not assigned for a particular purpose.
          minimum: 0
        spacesTotal:
          type: integer
          description: Total number of parking spaces
          minimum: 0
        staffed:
          $ref: '#/components/schemas/StaffEnum'
        structureGrade:
          $ref: '#/components/schemas/StructureGradeEnum'
        structureType:
          $ref: '#/components/schemas/StructureTypeEnum'
        evChargingPoints:
          type: integer
          description: Total number of electric vehicle charging points.
          minimum: 0
    Contact:
      title: Contact
      description: Address and contact information about some person, service or the parking site, provided in detail or via reference.
      type: object
      x-package: contact
      discriminator:
        propertyName: contactType
        mapping:
          contactPoint: '#/components/schemas/ContactPoint'
          contactByReference: '#/components/schemas/ContactByReference'
      properties:
        contactType:
          $ref: '#/components/schemas/ContactTypeEnum'
        contactNotDefined:
          type: boolean
          description: When true, there is currently no contact defined for the selected role and/or timeframe. Don't use the specialisations in this case.
        contactUnknown:
          type: boolean
          description: When true, the contact for the selected role and/or timeframe is unknown. Don't use the specialisations in this case.
        shareWithPublic:
          type: boolean
          description: When true, the details of this contact may be shared with the public. If false these contacts details are for internal purposes only.
        validityOfContact:
          $ref: '#/components/schemas/OverallPeriod'
      required:
        - contactType
    VersionedIdentity:
      title: VersionedIdentity
      description: Represents an object unique identifier associated with a version that can evolve over time.
      type: object
      x-package: common
      properties:
        id:
          type: string
          description: Unique identifier for the object.
          minLength: 1
          examples:
            - 98bccb9c-2ffe-4ca4-8e7f-eb1ae4439c29
        version:
          type: integer
          description: Positive integer representing the object version.
          minimum: 1
          examples:
            - 1
      required:
        - id
        - version
    LanguageCode:
      title: LanguageCode
      description: ISO 639-1:2002 language code.
      type: string
      x-package: common
      pattern: ^[a-z]{2}$
      examples:
        - en
    SpecificLanguageString:
      title: SpecificLanguageString
      description: Object containing a language code (using ISO 639-1:2002) and the translated string.
      type: object
      x-package: common
      properties:
        language:
          $ref: '#/components/schemas/LanguageCode'
        string:
          type: string
          description: Translated string
          examples:
            - This is a translated string
      required:
        - language
        - string
    MultilingualString:
      title: MultilingualString
      description: Array of SpecificLanguageString objects representing multi language text.
      type: array
      minItems: 1
      x-package: common
      items:
        $ref: '#/components/schemas/SpecificLanguageString'
    ContactPointTypeEnum:
      title: ContactPointTypeEnum
      description: |-
        Defines the supported lists of types of contact.
        * customerService : Contact details for parking customer support for a facility or specific entity
        * emergencyContact : Contact details for emergency assistance or support for a facility or specific entity specifically related to parking operations
        * enforcementSystemProvider : Contact details for the provider of the enforcement system
        * operator : Contact details for the parking operator for a facility or specific entity
        * owner : Contact details for the owner of a facility or specific entity.
        * propertyManager : Contact details for the property manager of a facility or related facility.
        * securityService : Contact details for security services for a facility or specific entity
        * serviceProvider : Contact details for a parking service provider (e.g. pay-by-mobile provider)
      type: string
      x-package: contact.enums
      enum:
        - customerService
        - emergencyContact
        - enforcementSystemProvider
        - operator
        - owner
        - propertyManager
        - securityService
        - serviceProvider
    CountryCode:
      title: CountryCode
      description: EN ISO 3166-1 two-character country code.
      type: string
      x-package: common
      pattern: ^[A-Z]{2}$
      examples:
        - GB
    AddressLineTypeEnum:
      title: AddressLineTypeEnum
      description: |-
        A table of types of address lines
         * apartment: Element indicating a discrete element of a building forming the address
         * building: Element identifying the number or name and type of the edifice or construction relevant for the address [derived from ISO19160-4]
         * districtTerritory: Element specifying the geographic or administrative area of the country for the address [Source: 19160-4]
         * floor: Element indicating the floor or level on which a delivery point is located in a multi-storey building [Source:ISO19160-4]
         * poBox: A postal delivery location identifier, not necessarily a physical location.
         * region: Element indicating the name of the area within or adjacent to the town in which delivery address is.
         * street: Element indicating road or street identifier or name 
         * town: Element indicating the name of the populated place in which a delivery point is located, or near to or via which the delivery point is accessed. [Source: ISO19160-4]
         * unit: An element representing a section of a building or organisation.Free-text description of the condition that leads to a surcharge being applied.
      type: string
      x-package: place.enums
      enum:
        - apartment
        - building
        - districtTerritory
        - floor
        - poBox
        - region
        - street
        - town
        - unit
    AddressLine:
      title: AddressLine
      description: A class defining information concerning one line of a postal address.
      type: object
      x-package: place.characteristics
      properties:
        order:
          type: integer
          minimum: 0
          description: The sequence order that the address line element should be displayed in
        text:
          $ref: '#/components/schemas/MultilingualString'
        type:
          $ref: '#/components/schemas/AddressLineTypeEnum'
      required:
        - order
        - text
        - type
    Address:
      title: Address
      description: A street oriented addressing structure supporting delivery
      type: object
      x-package: place.characteristics
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        city:
          $ref: '#/components/schemas/MultilingualString'
        postCode:
          type: string
          description: Postcode or postal code for the address.
        addressLines:
          type: array
          description: Address lines
          items:
            $ref: '#/components/schemas/AddressLine'
    Url:
      title: Url
      description: Represents a Url for an internet accessible resource.
      type: string
      x-package: common
      examples:
        - https://api.parking-data-standards.org
    ContactDetails:
      title: ContactDetails
      description: Details for some person, service or the parking site itself, especially address information.
      type: object
      x-package: contact
      properties:
        available24hours:
          type: boolean
          description: Specifies if the availability is 24 hours a day. If true available 24 hours. If omitted, this information is unknown or heterogeneous.
        contactDetailsFax:
          type: string
          description: Fax of the contact.
        contactDetailsLanguage:
          type: array
          description: Language(s) this contact is able to speak resp. understand.
          items:
            $ref: '#/components/schemas/LanguageCode'
        contactDetailsLogoUrl:
          $ref: '#/components/schemas/Url'
        contactDetailsMoreInfo:
          $ref: '#/components/schemas/MultilingualString'
        contactDetailsResponsibility:
          $ref: '#/components/schemas/MultilingualString'
        contactPersonFirstName:
          type: string
          description: First name of the contact person.
        contactPersonName:
          type: string
          description: Name of the contact person.
        contactPersonPosition:
          $ref: '#/components/schemas/MultilingualString'
        publishingAgreement:
          type: boolean
          description: Indication, whether the contact accepted publishing its contact information [TRUE] = accepted.
        urlLinkAddress:
          $ref: '#/components/schemas/Url'
    EmailTypeEnum:
      title: EmailTypeEnum
      description: |-
        Defines the supported lists of different email contact types
        * customerService: The email contact is for customer service.
        * general: The email contact is general in nature.
        * helpdesk: The email contact is a helpdesk.
        * individual: The email contact is for a specified individual.
      type: string
      x-package: contact.enums
      enum:
        - customerService
        - general
        - helpdesk
        - individual
    EMail:
      title: EMail
      description: Represents an eMail address.
      type: string
      x-package: common
      format: email
      examples:
        - john.doe@npp.com
    EMailCommonData:
      title: EMailCommonData
      description: Defines information concerning an email point of contact.
      type: object
      x-package: contact
      properties:
        primaryFlag:
          description: If true, this indicates that this is the primary point of contact
          type: boolean
        typeCode:
          description: The type of contact that can be reached with this email
          $ref: '#/components/schemas/EmailTypeEnum'
        emailAddress:
          description: The email address
          $ref: '#/components/schemas/EMail'
    TelephoneContact:
      title: TelephoneContact
      description: A class defining information relating to a specific telephone point of contact.
      type: object
      x-package: contact
      properties:
        areaCode:
          type: string
          description: The area code element of a telephone number.
        extensionNumbers:
          type: array
          description: Any extension number typically within a larger organisation's telephone exchange system.
          items:
            type: string
        ituCountryCode:
          type: string
          description: Country calling codes or country dial in codes are telephone dialing prefixes for the member countries or regions of the International Telecommunication Union (ITU). They are defined by the ITU-T in standards E.123 and E.164.
        localNumbers:
          type: array
          description: The local code element of a telephone number.
          items:
            type: string
    GeoJsonObject:
      title: GeoJsonObject
      description: |-
        GeoJSon object

        The coordinate reference system for all GeoJSON coordinates is a
        geographic coordinate reference system, using the World Geodetic System
        1984 (WGS 84) datum, with longitude and latitude units of decimal
        degrees.
        This is equivalent to the coordinate reference system identified by the
        Open Geospatial Consortium (OGC) URN
        An OPTIONAL third-position element SHALL be the height in meters above
        or below the WGS 84 reference ellipsoid.
        In the absence of elevation values, applications sensitive to height or
        depth SHOULD interpret positions as being at local ground or sea level.
      type: object
      properties:
        type:
          type: string
          enum:
            - Feature
            - FeatureCollection
            - Point
            - MultiPoint
            - LineString
            - MultiLineString
            - Polygon
            - MultiPolygon
            - GeometryCollection
        bbox:
          description: |-
            A GeoJSON object MAY have a member named "bbox" to include
            information on the coordinate range for its Geometries, Features, or
            FeatureCollections. The value of the bbox member MUST be an array of
            length 2*n where n is the number of dimensions represented in the
            contained geometries, with all axes of the most southwesterly point
            followed by all axes of the more northeasterly point. The axes order
            of a bbox follows the axes order of geometries.
          type: array
          items:
            type: number
      required:
        - type
      discriminator:
        propertyName: type
    ContactPoint:
      title: ContactPoint
      description: Defines contact details for specified role. Organisation name attribute should not be used in combination with role parkingSiteAddress.
      type: object
      x-package: contact
      allOf:
        - $ref: '#/components/schemas/Contact'
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            organisationName:
              $ref: '#/components/schemas/MultilingualString'
            type:
              $ref: '#/components/schemas/ContactPointTypeEnum'
            address:
              type: array
              description: Addresses.
              items:
                $ref: '#/components/schemas/Address'
            contactDetails:
              type: array
              description: Contact details.
              items:
                $ref: '#/components/schemas/ContactDetails'
            eMailCommonData:
              type: array
              description: Email common data.
              items:
                $ref: '#/components/schemas/EMailCommonData'
            telephoneContacts:
              type: array
              description: Telephone contact.
              items:
                $ref: '#/components/schemas/TelephoneContact'
            pointLocations:
              type: array
              description: Contact point location.
              items:
                $ref: '#/components/schemas/GeoJsonObject'
          required:
            - type
    VersionedReference:
      title: VersionedReference
      description: Represents a reference to an identifiable object where the combination of the identifier and version is unique. It is composed of an unique identifier, a version and potentially a string identifying the class of the referenced object.
      type: object
      x-package: common
      properties:
        id:
          type: string
          description: Unique identifier for the object.
          minLength: 1
          examples:
            - 98bccb9c-2ffe-4ca4-8e7f-eb1ae4439c29
        version:
          type: integer
          description: Positive integer representing the object version.
          minimum: 1
          examples:
            - 1
        className:
          type: string
          description: Class name of the referenced object.
          pattern: ^[A-Z]+[A-Za-z0-9]+
          examples:
            - UKNumberPlate
      required:
        - id
        - version
    ContactByReference:
      title: ContactByReference
      description: Contact information that is addressed via a reference.
      type: object
      x-package: contact
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          properties:
            contactReference:
              $ref: '#/components/schemas/VersionedReference'
          required:
            - contactReference
    ContactTypeEnum:
      title: ContactTypeEnum
      description: |-
        Defined the type of contact object.
        * ContactPoint: Contact detailed information.
        * ContactByReference: Reference to an exiting contact.
      type: string
      x-package: contact.enums
      enum:
        - contactPoint
        - contactByReference
    DayEnum:
      title: DayEnum
      description: Defines permissible enumerations of identification of days within a week.
      type: string
      x-package: time.enums
      enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
    MonthEnum:
      title: MonthEnum
      description: Defines permissible enumerations of identification of calendar months within a year.
      type: string
      x-package: time.enums
      enum:
        - january
        - february
        - march
        - april
        - may
        - june
        - july
        - august
        - september
        - october
        - november
        - december
    WeekOfMonthEnum:
      title: WeekOfMonthEnum
      description: |-
        Weeks of the month

        * `firstWeekOfMonth`: First week of the month
        * `secondWeekOfMonth`: Second week of the month
        * `thirdWeekOfMonth`: Third week of the month
        * `fourthWeekOfMonth`: Fourth week of the month
        * `fifthWeekOfMonth`: Fifth week of the month (at most only 3 days and non in February when not a leap year)
      type: string
      x-package: time.enums
      enum:
        - firstWeekOfMonth
        - secondWeekOfMonth
        - thirdWeekOfMonth
        - fourthWeekOfMonth
        - fifthWeekOfMonth
    DayWeekMonth:
      title: DayWeekMonth
      description: Specification of periods defined by the intersection of days, weeks and months.
      type: object
      x-package: time
      properties:
        applicableDay:
          type: array
          uniqueItems: true
          maxItems: 7
          description: Applicable day of the week (1 to 7). All days of the week is expressed by non-inclusion of this attribute.
          items:
            $ref: '#/components/schemas/DayEnum'
        applicableMonth:
          type: array
          description: Applicable month of the year (1 to 12). All months of the year is expressed by non-inclusion of this attribute.
          uniqueItems: true
          maxItems: 12
          items:
            $ref: '#/components/schemas/MonthEnum'
        applicableWeek:
          type: array
          description: Applicable week of the month (1 to 5). All weeks of the month is expressed by non-inclusion of this attribute.
          uniqueItems: true
          maxItems: 5
          items:
            $ref: '#/components/schemas/WeekOfMonthEnum'
    SpecialDay:
      title: SpecialDay
      description: Specification of a special type of day, possibly also a public holiday. Can be country or region specific.
      type: object
      x-package: time
      discriminator:
        propertyName: specialDayType
        mapping:
          dayBeforePublicHoliday: '#/components/schemas/OtherSpecialDay'
          dayFollowingPublicHoliday: '#/components/schemas/OtherSpecialDay'
          inLieuOfPublicHoliday: '#/components/schemas/OtherSpecialDay'
          longWeekendDay: '#/components/schemas/OtherSpecialDay'
          other: '#/components/schemas/OtherSpecialDay'
          publicEventDay: '#/components/schemas/OtherSpecialDay'
          publicHoliday: '#/components/schemas/PublicHoliday'
          schoolDay: '#/components/schemas/OtherSpecialDay'
          schoolHolidays: '#/components/schemas/OtherSpecialDay'
      properties:
        specialDayType:
          $ref: '#/components/schemas/SpecialDayTypeEnum'
        intersectWithApplicableDays:
          type: boolean
          description: Indicates if the period is the intersection of applicable days and this special day (TRUE) or if it is the union of applicable days and this special day.
      required:
        - specialDayType
        - intersectWithApplicableDays
    OtherSpecialDay:
      title: OtherSpecialDay
      description: Specification of a other type of special day.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/SpecialDay'
    PublicHoliday:
      title: PublicHoliday
      description: Specification of a specific public holiday in case `specialDayType` is set to `publicHoliday`.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/SpecialDay'
        - type: object
          properties:
            publicHolidayName:
              $ref: '#/components/schemas/MultilingualString'
          required:
            - publicHolidayName
    SpecialDayTypeEnum:
      title: SpecialDayTypeEnum
      description: |-
        Collection of special types of days
        * dayBeforePublicHoliday: The day preceding a public holiday
        * dayFollowingPublicHoliday: A day following a public holiday
        * inLieuOfPublicHoliday: A holiday in lieu of a public holiday that falls on a weekend
        * longWeekendDay: A day between a public holiday and the weekend
        * other: Some other special day
        * publicEventDay: A day of a public event. You may use the publicEvent attribute to specify the corresponding event
        * publicHoliday: Public holiday A public holiday in general. You may use the PublicHoliday class to refer on a specific public holiday
        * schoolDay: A school day
        * schoolHolidays: A day within the school holidays
      type: string
      x-package: time.enums
      enum:
        - dayBeforePublicHoliday
        - dayFollowingPublicHoliday
        - inLieuOfPublicHoliday
        - longWeekendDay
        - other
        - publicEventDay
        - publicHoliday
        - schoolDay
        - schoolHolidays
    Time:
      title: Time
      description: ISO-8601 format definition of a time - format HH:MM.
      type: string
      x-package: common
      pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
      examples:
        - '12:15'
    TimePeriodOfDay:
      title: TimePeriodOfDay
      description: Specification of a continuous period of time within the same day.
      type: object
      x-package: time
      properties:
        startTimeOfPeriod:
          description: Start of time period.
          $ref: '#/components/schemas/Time'
        endTimeOfPeriod:
          description: End time of period.
          $ref: '#/components/schemas/Time'
      required:
        - startTimeOfPeriod
        - endTimeOfPeriod
    Period:
      title: Period
      description: Defines a continuous time period or a set of discontinuous time periods defined by the intersection of a set of criteria all within an overall delimiting interval.
      type: object
      x-package: time
      properties:
        periodName:
          $ref: '#/components/schemas/MultilingualString'
        startOfPeriod:
          description: Start of the period.
          $ref: '#/components/schemas/DateTime'
        endOfPeriod:
          description: End of the period.
          $ref: '#/components/schemas/DateTime'
        recurringDayWeekMonthPeriod:
          type: array
          description: The list of days each month for the period. If empty, all year (7d/7).
          items:
            $ref: '#/components/schemas/DayWeekMonth'
        recurringSpecialDay:
          type: array
          description: The list of special days for the period.
          items:
            $ref: '#/components/schemas/SpecialDay'
        recurringTimePeriodOfDay:
          type: array
          description: The list of start and end time for each day. If empty, all day (24h/24).
          items:
            $ref: '#/components/schemas/TimePeriodOfDay'
    OverallPeriod:
      title: OverallPeriod
      description: A continuous or discontinuous period of validity defined by overall bounding start and end times and the possible intersection of valid periods (potentially recurring) with the complement of exception periods (also potentially recurring).
      type: object
      x-package: time
      properties:
        overallStartTime:
          description: Start of bounding period of validity defined by date and time.
          $ref: '#/components/schemas/DateTime'
        overallEndTime:
          description: End of bounding period of validity defined by date and time.
          $ref: '#/components/schemas/DateTime'
        validPeriods:
          type: array
          description: A single time period, a recurring time `Period` period or a set of different recurring time periods during which validity is true.
          items:
            $ref: '#/components/schemas/Period'
        exceptionPeriods:
          type: array
          description: A single time period, a recurring time Period period or a set of different recurring time periods during which validity is false.
          items:
            $ref: '#/components/schemas/Period'
      required:
        - overallStartTime
    ImageAlbum:
      title: ImageAlbum
      description: A class defining information relating to images for a parking facility.
      type: object
      x-package: contact
      properties:
        photo:
          $ref: '#/components/schemas/Url'
        caption:
          $ref: '#/components/schemas/MultilingualString'
        logoImage:
          type: array
          description: URL to location of logo(s) the parking operator wishes to associate with this parking facility (e.g. their logo, schemes [ParkMark])
          items:
            $ref: '#/components/schemas/Url'
    Marketing:
      title: Marketing
      description: Universal resource locator (URI) that points towards a web site carrying marketing material supplied.
      type: object
      x-package: contact
      properties:
        imageAlbums:
          type: array
          description: Image albums associated
          items:
            $ref: '#/components/schemas/ImageAlbum'
        webURLs:
          type: array
          items:
            $ref: '#/components/schemas/Url'
    OperatingRestrictionTypeEnum:
      title: OperatingRestrictionTypeEnum
      description: |-
        Defines operating restrictions to use the of a facility.
        * busOnly : Only buses are permitted.
        * busStop : This is a stopping place of bus pick-up or drop-off; not to be used for parking.
        * carpoolOnly : Only carpool vehicles are permitted.
        * commercialVehicleOnly : Only commercial vehicles are permitted.
        * disabledPersonPermitOnly : Only vehicles of registered disabled person permit holders permitted.
        * electricVehicleOnly : Only electric vehicles permitted.
        * freeParking : No fee for parking
        * governmentVehicleOnly : Only government vehicles permitted.
        * loadingZone : This is a loading zone; not to be used for parking.
        * loadingZoneCommercial : Only government vehicles permitted.
        * media : Only for use by the media
        * noParking : No parking permitted
        * noWaiting : No waiting or parking of vehicles is permitted
        * parkingTimeLimit : Time limited parking.
        * residentialPermitOnly : Only for use by residential permit holders only
        * snow : Snow clearing zone; no parking
        * streetCleaning : Street cleansing zone; no parking
        * taxiOnly : Only taxis are permitted.
        * valetOnly : Only valet service vehicles are permitted.
      type: string
      x-package: place.characteristics.enums
      enum:
        - busOnly
        - busStop
        - carpoolOnly
        - commercialVehicleOnly
        - disabledPersonPermitOnly
        - electricVehicleOnly
        - freeParking
        - governmentVehicleOnly
        - loadingZone
        - loadingZoneCommercial
        - media
        - noParking
        - noWaiting
        - parkingTimeLimit
        - residentialPermitOnly
        - snow
        - streetCleaning
        - taxiOnly
        - valetOnly
    OperatingRestrictions:
      title: OperatingRestrictions
      description: A class defining operating restrictions.
      type: object
      x-package: place.characteristics
      properties:
        operatingRestriction:
          $ref: '#/components/schemas/OperatingRestrictionTypeEnum'
        operatingRestrictionContext:
          $ref: '#/components/schemas/MultilingualString'
        times:
          $ref: '#/components/schemas/OverallPeriod'
      required:
        - operatingRestriction
    RGBColour:
      title: RGBColour
      description: A RGB colour described by values for red, green and blue (0..255) as well as an optional name.
      type: object
      x-package: common
      properties:
        colourName:
          $ref: '#/components/schemas/MultilingualString'
        rgbBlueValue:
          type: integer
          description: The blue value of the RGB colour (0..255).
          minimum: 0
          maximum: 255
        rgbGreenValue:
          type: integer
          description: The green value of the RGB colour (0..255).
          minimum: 0
          maximum: 255
        rgbRedValue:
          type: integer
          description: The red value of the RGB colour (0..255).
          minimum: 0
          maximum: 255
      required:
        - rgbBlueValue
        - rgbGreenValue
        - rgbRedValue
    AccessAndEgress:
      title: AccessAndEgress
      description: Time periods specified for access to or from a parking facility.
      type: object
      x-package: time
      discriminator:
        propertyName: accessAndEgressType
        mapping:
          accessAndEgressValidity: '#/components/schemas/AccessAndEgressValidity'
          accessAndEgressPeriods: '#/components/schemas/AccessAndEgressPeriods'
      properties:
        accessAndEgressType:
          $ref: '#/components/schemas/AccessAndEgressTypeEnum'
        exitPossibleAtAnyTime:
          type: boolean
          description: If true, specifies that the specified access is available for exit at all times.
        entranceOpenTimeArea:
          type: array
          description: Entrance open time area
          items:
            $ref: '#/components/schemas/EntranceOpenTime'
        exitOpenTimeArea:
          type: array
          description: Exit open time area
          items:
            $ref: '#/components/schemas/ExitOpenTime'
      required:
        - accessAndEgressType
    ValidityStatusEnum:
      title: ValidityStatusEnum
      description: |-
        Values of validity status that can be assigned to a described event, action or item.
        * active : The described event, action or item is currently active regardless of the definition of the validity time specification.
        * definedByValidityTimeSpec : The validity status of the described event, action or item is in accordance with the definition of the validity time specification.
        * planned : The described event, action or item is currently planned regardless of the definition of the validity time specification.
        * suspended : The described event, action or item is currently suspended, that is inactive, regardless of the definition of the validity time specification.
      type: string
      x-package: time.enums
      enum:
        - active
        - definedByValidityTimeSpec
        - planned
        - suspended
    Validity:
      title: Validity
      description: Specification of validity, either explicitly or by a validity time period specification which may be discontinuous.
      type: object
      x-package: time
      properties:
        validityStatus:
          $ref: '#/components/schemas/ValidityStatusEnum'
        validityTimeSpecification:
          $ref: '#/components/schemas/OverallPeriod'
      required:
        - validityTimeSpecification
    AccessAndEgressValidity:
      title: AccessAndEgressValidity
      description: Defines an AccessAndEgress variant with validity.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/AccessAndEgress'
        - type: object
          properties:
            validity:
              description: Specific validity information.
              $ref: '#/components/schemas/Validity'
    AccessAndEgressPeriods:
      title: AccessAndEgressPeriods
      description: Defines an AccessAndEgress variant with periods.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/AccessAndEgress'
        - type: object
          properties:
            periods:
              type: array
              minItems: 1
              description: list of periods
              items:
                $ref: '#/components/schemas/Period'
    AccessAndEgressTypeEnum:
      title: AccessAndEgressTypeEnum
      description: Defines the type of access and egress for places.
      type: string
      x-package: time.enums
      enum:
        - accessAndEgressValidity
        - accessAndEgressPeriods
    PeriodsOrValidity:
      title: PeriodsOrValidity
      description: Describes the mutually exclusive use of one Validity or one or more Periods.
      type: object
      x-package: time
      discriminator:
        propertyName: type
        mapping:
          validity: '#/components/schemas/ValidityAlias'
          periods: '#/components/schemas/PeriodsAlias'
      properties:
        type:
          $ref: '#/components/schemas/PeriodsOrValidityTypeEnum'
      required:
        - type
    ValidityAlias:
      title: ValidityAlias
      description: Represents a validity.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/PeriodsOrValidity'
        - type: object
          properties:
            validity:
              $ref: '#/components/schemas/Validity'
    PeriodsAlias:
      title: PeriodsAlias
      description: Represents an array of periods.
      type: object
      x-package: time
      allOf:
        - $ref: '#/components/schemas/PeriodsOrValidity'
        - type: object
          properties:
            periods:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Period'
    PeriodsOrValidityTypeEnum:
      title: PeriodsOrValidityTypeEnum
      description: |-
        Collection of types for PeriodsOrValidity.
        * validity: using validity
        * periods: using periods
      type: string
      x-package: time.enums
      enum:
        - validity
        - periods
    EntranceOpenTime:
      title: EntranceOpenTime
      description: Specification of periods of times when parking entrance(s) are open for vehicle movements.
      type: object
      allOf:
        - $ref: '#/components/schemas/PeriodsOrValidity'
      x-package: time
    ExitOpenTime:
      title: ExitOpenTime
      description: Specification of periods of times when parking exit(s) are open for vehicle movements.
      type: object
      allOf:
        - $ref: '#/components/schemas/PeriodsOrValidity'
      x-package: time
    OperatingTime:
      title: OperatingTime
      description: Specification of periods or time when the parking operates, do not represents times of accessibility.
      type: object
      allOf:
        - $ref: '#/components/schemas/PeriodsOrValidity'
      x-package: time
    Times:
      title: Times
      description: |-
        Defines forms of time period for specific purposes. 
        There are four distinct time domain concepts: 
        * Hours of operation (times at which the facility may be used)
        * Access and egress (times it is possible to enter and leave the facility)
        * Entrance open time
        * Exit open time
      type: object
      x-package: time
      properties:
        available24hours:
          type: boolean
          description: If [TRUE], the identified parking hierarchy entities is available 24 hours per day.
        openAllYear:
          type: boolean
          description: If [TRUE], the identified parking hierarchy entities is available every day each year.
        openingTimesNotSpecified:
          type: boolean
          description: If [TRUE], the time periods are not specified.
        openingTimesUnknown:
          type: boolean
          description: If [TRUE], the time periods are not known.
        accessAndEgress:
          type: array
          items:
            $ref: '#/components/schemas/AccessAndEgress'
        operatingTime:
          $ref: '#/components/schemas/OperatingTime'
      required:
        - available24hours
        - openAllYear
        - openingTimesNotSpecified
        - openingTimesUnknown
    MeansOfPaymentEnum:
      title: MeansOfPaymentEnum
      description: |-
        Means of payment
        * cashBillsOnly : Cash payment using bills only.
        * cashCoinsAndBills : Cash payment using bills and/or coins only.
        * cashCoinsOnly : Cash payment with coins only.
        * mobileAccount : Payment method using an app or other functions typically via a smartphone, to a linked bank or card account.
        * paymentCreditCard : Payment by electronic payment credit card which is a small plastic card issued by a bank, building society, or  other financial institution (ISO/IEC 7813 and other related standards), allowing the holder to purchase goods or services on credit.
        * paymentDebitCard : Payment by electronic payment debit card which is a small plastic card (ISO/IEC 7813 and other related standards), allowing the holder to transfer money electronically from their bank account when making a purchase.
        * paymentValueCard : Payment by electronic payment debit card which is a small plastic card (ISO/IEC 7813 and other related standards)  with a monetary value stored on the card itself, not that may not be linked to an external account maintained by a financial institution.
        * prepay : Advanced payment for parking right.
        * tollTag : Toll tag (RFID) or similar, with associated account.
        * unknown : Unknown.
      type: string
      x-package: rate.payment.enums
      enum:
        - cashBillsOnly
        - cashCoinsAndBills
        - cashCoinsOnly
        - mobileAccount
        - paymentCreditCard
        - paymentDebitCard
        - paymentValueCard
        - prepay
        - tollTag
        - unknown
    PaymentTimingEnum:
      title: PaymentTimingEnum
