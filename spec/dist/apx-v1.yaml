  /v1/violations/{id}/issue:
    post:
      operationId: post-apx-v1-violations-id-issue
      security:
        - apxOAuth:
            - apx.violations:manage
      tags:
        - Violations
      summary: Issue the notice or citation
      description: |-
        Transition `confirmed → issued` — or `detected → issued` for
        `automated` detections where operator policy allows unreviewed
        issuance; a `guided` detection still in `detected` is 409
        `violation-not-issuable`. Sets `notice`, `amount`, and `dueTime`.

        The server resolves the EnforcementPolicy in force at `place`
        (Part 19 §19.10) and refuses with 422 when the request breaks it:
        `delivery-method-not-permitted`, `notice-deadline-passed`,
        `penalty-exceeds-cap` (or clamps, per the policy), or
        `signage-required`. On success `policy`, `signage[]`, and the
        first `amountHistory` entry are frozen onto the violation.
        Publishes `apx.violations.issued.v1`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViolationIssue'
      responses:
        '200':
          description: Issued violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Violation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such violation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not issuable from the current state or detection mode.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Refused by the enforcement policy in force (delivery method, notice deadline, penalty cap, or signage).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
