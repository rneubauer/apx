              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Program not active, instrument invalid/expired/used, or a program rule exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-validations-redemptions
      security:
        - apxOAuth:
            - apx.validations:read
        - apxOAuth:
            - apx.validations:redeem
      tags:
        - Validations
      summary: List/filter redemptions
      description: Filter by program, place, ticket, session, channel, status, and `since` (appliedTime).
      parameters:
        - name: program
          in: query
          schema:
            type: string
            format: uuid
        - name: place
          in: query
          schema:
            type: string
            format: uuid
        - name: ticket
          in: query
          schema:
            type: string
        - name: session
          in: query
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          schema:
            type: string
