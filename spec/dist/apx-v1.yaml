      security:
        - apxOAuth:
            - apx.data:read
      tags:
        - Data
      summary: Current occupancy snapshot for a place element
      description: |-
        "How full is it right now" for one HierarchyElement, without pulling
        the Place hierarchy. A pure convenience READ over the APDS occupancy
        model (Supply + DemandTable) — the Place payload remains the source
        of truth. Fields the implementation does not know are simply absent.
        Threshold crossings publish apx.data.occupancy.v1 and SHOULD raise
        an occupancyThresholdExceeded alert (Part 7). Scope apx.data:read;
        the place grant must cover the element.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: HierarchyElement UUID (Place, Level, Area, …).
      responses:
        '200':
          description: The occupancy snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancySnapshot'
        '404':
          description: No such place element.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /webhooks:
    post:
      operationId: post-webhooks
      security:
        - apxOAuth:
            - apx.subscriptions:manage
        - oAuth:
            - po
            - sp
            - ad
      tags:
        - Subscription
      summary: Subscribe to event topics (APDS-compatible superset)
      description: |-
        Creates a subscription. A stock APDS 4.1 `EventSubscription`
        (`{endpoint, topics[]}` with EventTypeEnum values) is a valid body;
        APX fields (transport, filters, secret) are additive.

        **Response negotiation (normative, Part 8 §8.1):** the stock APDS
        4.1 response contract is preserved — a request WITHOUT
        `Prefer: return=representation` receives the native APDS `200`/`202`
        with `ResponseStatus`, exactly as APDS documents. An APX client
        sends `Prefer: return=representation` and receives `201` with the
        full subscription INCLUDING the signing secret (returned exactly
        once, in that response only).
      parameters:
        - name: Prefer
          in: header
          required: false
          description: |-
            RFC 7240. `return=representation` selects the APX-rich 201
            response (subscription + one-time secret). Absent, the server
            answers with the stock APDS 200/202 ResponseStatus contract.
          schema:
            type: string
            enum:
              - return=representation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApxEventSubscription'
      responses:
        '200':
          description: |-
            Stock APDS contract — subscription approved and activated
            (request did not ask for the APX representation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '201':
          description: |-
            APX contract (Prefer: return=representation) — subscription
            created; includes the signing secret, exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApxEventSubscription'
        '202':
          description: |-
            Stock APDS contract — subscription request received; will be
            processed and then approved/declined.
          content:
