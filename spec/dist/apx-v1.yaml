                  description: APDS VehicleAncillaryIdentification.country vocabulary.
                stateProvince:
                  type: string
                  examples:
                    - FL
                observation:
                  description: The Observation candidate this correction is based on.
                  $ref: '#/components/schemas/Reference'
                reason:
                  type: string
      responses:
        '200':
          description: The corrected association.
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - plate
                properties:
                  session:
                    $ref: '#/components/schemas/Reference'
                  plate:
                    type: string
                  country:
                    type: string
                  stateProvince:
                    type: string
                  observation:
                    $ref: '#/components/schemas/Reference'
