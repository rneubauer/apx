      type: string
      enum:
        - rateEndCutOff
        - fullTimePurchased
        - creditCarryOver
    RateTransition:
      title: RateTransition
      description: describes rate transition rules
      type: object
      x-package: right_specification
      properties:
        overpaymentPolicy:
          $ref: '#/components/schemas/OverpaymentPolicyTypeEnum'
        followThroughAllowed:
          type: boolean
        prepaymentAllowed:
          type: boolean
        reservationAvailable:
          type: boolean
    RightSpecification:
      title: RightSpecification
      description: Defines what the owner/manager of a place is granting the ability to do (e.g. park, delivery, pick up) to specific users or vehicles.
      type: object
      x-package: right_specification
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            description:
              $ref: '#/components/schemas/MultilingualString'
            type:
              $ref: '#/components/schemas/RightSpecificationTypeEnum'
            financialReference:
              type: string
              description: Creator defined free-text reference to financial transactions associated to the specific Right Specification.
            transferable:
              type: boolean
            transferableConditions:
              type: boolean
            credentials:
              type: array
              description: The allowed credential types for this RightSpecification
              items:
                $ref: '#/components/schemas/CredentialTypeEnum'
            validity:
              $ref: '#/components/schemas/Validity'
            expiry:
              type: string
              description: Date/time showing the timestamp for when a RightSpecification ceases to be valid.
              format: date-time
            rightPools:
              type: array
              description: Shares the number of AssignedRights that are available for use, are currently in use, or intended for use within a specific RightSpecification in specific date/time periods by a specific AssignedRightIssuer'
              items:
                $ref: '#/components/schemas/RightPool'
            issuer:
              readOnly: true
              $ref: '#/components/schemas/VersionedReference'
            hierarchyElements:
              type: array
              description: Reference to Places where this RightSpecification is available.
              minItems: 1
              items:
                $ref: '#/components/schemas/VersionedReference'
            rateEligibility:
              type: array
              description: |-
                Defines the combination of Eligibility requirements with RateTables and associates this combination to a RightSpecification. 
                RateEligibility enables a RightSpecification to have association to multiple RateTable(s) for a
                specific Eligibility ( or set of Qualifications). 
                RateEligibility also defines if RateTables are Combinable. 
                This is a Yes / No (Boolean) definition. 
                Either all RateTables associated to a RightSpecification with a common Eligibility can be combined or they cannot.
              items:
                $ref: '#/components/schemas/RateEligibility'
            rateTransition:
              $ref: '#/components/schemas/RateTransition'
          required:
            - issuer
            - transferable
            - hierarchyElements
            - validity
    RightSpecificationList:
      title: RightSpecificationList
      description: Paginated list of RightSpecifications
      type: object
      x-package: right_specification
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          properties:
            data:
              type: array
              description: List of RightSpecifications
              items:
                $ref: '#/components/schemas/RightSpecification'
    RateAvailabilityTypeEnum:
      title: RateAvailabilityTypeEnum
      description: |-
        * private : Parking access is limited to known and authorized individuals.
        * public : Open to the public. 
        * restricted : Open to the public but requires a direct purpose or permission to use from owner (e.g. Doctor's surgery, storefront...)"
      type: string
      x-package: rate.enums
      enum:
        - private
        - public
        - restricted
    RateTypeEnum:
      title: RateTypeEnum
      description: |-
        Describes the type of rates for a RateTable.
        * contract : Rate provided to contract holders only.
        * daily : Rate provided on a daily rate, per calendar day.
        * event : Rate provided in combination with a specific event.
        * hourly : Rate provided on an hourly basis.
      type: string
      x-package: rate.enums
      enum:
        - contract
        - daily
        - event
        - hourly
    RateLineTypeEnum:
      title: RateLineTypeEnum
      description: |-
        Describes the type of rates of a RateLine.
        * flatRate : A rate applied to the rate line which is not time/duration dependent. i.e. a single fixed payment.
        * flatRateTier : A flat rate charge rate associated with a specific time-based tier. This is a special case of an incrementing rate.
        * incrementingRate : A charge rate that increases by a defined amount in a defined time.
      type: string
      x-package: rate.enums
      enum:
        - flatRate
        - flatRateTier
        - incrementingRate
    RateUsageConditionsTypeEnum:
      title: RateUsageConditionsTypeEnum
      description: |
        A list of supported rate usage condition types.
        * fixedDuration : Fixed duration - check Rate Usage Duration Limitation field
        * fixedNumber : check Rate Usage Count Limitation field
        * once : Permit can be used once
        * unlimited : Unlimited usage.
      type: string
      x-package: rate.enums
      enum:
        - fixedDuration
        - fixedNumber
        - once
        - unlimited
    TriggerTypeEnum:
      title: TriggerTypeEnum
      description: |-
        * firstUse : Trigger is applied on first use of the facility.
        * withTransaction : Trigger condition is met when the transaction is completed.
      type: string
      x-package: rate.enums
      enum:
        - firstUse
        - withTransaction
    RateLineTax:
      title: RateLineTax
      description: Contains details of the tax to be applied to a RateLine.
      type: object
      x-package: rate
      properties:
        triggerDescription:
          $ref: '#/components/schemas/MultilingualString'
        triggerType:
          $ref: '#/components/schemas/TriggerTypeEnum'
        taxIncluded:
          type: boolean
          description: Indicates if the tax to be applied is included within the total rate associated with this rate line (TRUE) or if the tax is to be added additionally to the total (FALSE).
        labelForDisplay:
          $ref: '#/components/schemas/MultilingualString'
        taxRate:
          type: number
          description: The percentage rate of tax to be applied.
          format: float
          maximum: 100
          minimum: 0
        taxValue:
          $ref: '#/components/schemas/AmountInCurrency'
      required:
        - taxIncluded
    RateLine:
      title: RateLine
      description: |-
        Describes a specific line in a __RateTable__. __incrementPeriod__ represents the time period for incrementing the __RateLine__ charge. 
        If set to the same as the duration of the period between the __durationStart__ and __durationEnd__, the increment will occur once per period, i.e. a flat rate time-based tier charge rate.
      type: object
      x-package: rate
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            sequence:
              type: integer
              description: The position of this rate line within a __RateLineCollection__
              minimum: 1
            rateLineType:
              $ref: '#/components/schemas/RateLineTypeEnum'
            description:
              $ref: '#/components/schemas/MultilingualString'
            durationStart:
              type: string
              description: If used, indicates the start time for the applicability of the specific RateLine, generally with respect to the start of the parking Session, e.g. the start of a time-based tier charge rate. The format can be either of _hh:mm_ (hours and minutes) or _dd:hh:mm_ (days, hours and minutes).
            durationEnd:
              type: string
              description: If used, indicates the end time for the applicability of the specific RateLine, generally with respect to the end of the parking or other mobility Session, e.g. the end of a time-based tier charge rate.The format can be either of _hh:mm_ (hours and minutes) or _dd:hh:mm_ (days, hours and minutes).
            incrementPeriod:
              $ref: '#/components/schemas/Duration'
            value:
              type: number
              format: float
            minValue:
              type: number
              format: float
            maxValue:
              type: number
              format: float
            usageCondition:
              $ref: '#/components/schemas/RateUsageConditionsTypeEnum'
            rateLineTax:
              $ref: '#/components/schemas/RateLineTax'
          required:
            - sequence
            - rateLineType
            - value
    RateLineCollection:
      title: RateLineCollection
      description: Describes a group of __RateLine__ elements that logically group together within one __RateTable__.
      type: object
      x-package: rate
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            collectionSequence:
              type: integer
              description: An indicator giving the place in sequence of this RateLineCollection.
              minimum: 1
            applicableCurrency:
              $ref: '#/components/schemas/CurrencyCode'
            minTime:
              $ref: '#/components/schemas/Duration'
            maxTime:
              $ref: '#/components/schemas/Duration'
            resetTime:
              $ref: '#/components/schemas/Time'
            minValueCollection:
              $ref: '#/components/schemas/AmountInCurrency'
            maxValueCollection:
              $ref: '#/components/schemas/AmountInCurrency'
            validStart:
              type: string
              description: The start time for the validity of this RateLineCollection.
              format: date-time
            validEnd:
              type: string
              description: The end time for the validity of this RateLineCollection.
              format: date-time
            relativeTimes:
              type: boolean
              description: Indicates whether or not times that are relative to the start of an event are used as the basis for rate calculation (TRUE), or if parking rate calculation definitions are done with respect to the parking sessions and defined as local or UTC times (FALSE).
            referenceTimeStart:
              type: string
              format: date-time
              description: Event-related reference start time
            referenceTimeEnd:
              type: string
              format: date-time
              description: Event-related reference end time
            taxIncluded:
              type: boolean
              description: Indication that tax to be applied is included within the total rate associated with this rate line collection (true) or indicates that the tax is added additionally to the total.
            taxRate:
              type: number
              description: The percentage rate of tax to be applied.
              format: float
              minimum: 0
              maximum: 100
            taxValue:
              type: number
              description: The monetary amount of tax to be applied.
              format: float
            rateLines:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RateLine'
          required:
            - collectionSequence
            - applicableCurrency
            - resetTime
            - validStart
            - relativeTimes
            - taxIncluded
            - rateLines
    RateTable:
      title: RateTable
      description: Contains a specific set of rate line collection relating to one or more locations and optionally one set of eligibility criteria. rate table id refers to the internal identifier provided by the data supplier, and not the rate table unique identifier.
      type: object
      x-package: rate
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            rateTableName:
              $ref: '#/components/schemas/MultilingualString'
            rateTableID:
              $ref: '#/components/schemas/MultilingualString'
            availability:
              $ref: '#/components/schemas/RateAvailabilityTypeEnum'
            rateResponsibleParty:
              readOnly: true
              $ref: '#/components/schemas/VersionedReference'
            rateSupersedeLink:
              $ref: '#/components/schemas/VersionedReference'
            validation:
              type: boolean
              description: Indicates if validations are accepted when using this RateTable.
            rateType:
              $ref: '#/components/schemas/RateTypeEnum'
            additionalInformation:
              $ref: '#/components/schemas/Url'
            validity:
              $ref: '#/components/schemas/Validity'
            rateLineCollections:
              type: array
              description: List of RateLineCollection that defines this RateTable.
              minItems: 1
              items:
                $ref: '#/components/schemas/RateLineCollection'
          required:
            - rateTableName
            - availability
            - validityStart
            - activeTimes
            - rateLineCollections
    RateTableList:
      title: RateList
      description: Paginated list of Rates
      type: object
      x-package: rate
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          properties:
            data:
              type: array
              description: List of Rates
              items:
                $ref: '#/components/schemas/RateTable'
    Segment:
      title: Segment
      description: |-
        Segments enables a single __session__ to capture and report changes in __rates__ and __assigned rights__ during a its validity. A segment can only have one __assigned right__ and __rate__ associated to it and must always :
        * be associated to a __session__.
        * be associated to an __assigned right__ and to a specific __rate__ and __credential__ via the __assigned right__.
        * keep track of the version of the __assigned right__ (i.e. when a segment starts with one __assigned right__ and then is updated to a new __assigned right__ replacing the original at the end of the __segment__).
        * be associated with a __place__.
        * be associated to a __financial transaction__ data.
        * have a start and end time.
      type: object
      x-package: session
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            actualStart:
              type: string
              format: date-time
            actualEnd:
              type: string
              format: date-time
            assignedRight:
              $ref: '#/components/schemas/VersionedReference'
            spaceId:
              $ref: '#/components/schemas/VersionedReference'
            validationType:
              type: array
              description: The form of validation (the nature of credential) that is used in conjunction with the specific segment.
              minItems: 1
              items:
                $ref: '#/components/schemas/CredentialTypeEnum'
            validationId:
              type: string
              description: Specific validation identification associated to the segment.
            credentialId:
              $ref: '#/components/schemas/Reference'
            notes:
              $ref: '#/components/schemas/MultilingualString'
          required:
            - actualStart
            - assignedRight
            - validationType
    Session:
      title: Session
      description: A session captures the actual use of an assigned right and includes start time, end time, credential, and other relevant data related to an operational transaction. A __session__ is not used for future activities, and is broken into one or multiple __segments__.
      type: object
      x-package: session
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            actualStart:
              type: string
              format: date-time
              description: The date/time of the start of the session.
            actualEnd:
              type: string
              format: date-time
              description: The date/time of the end of the session.
            initiator:
              readOnly: true
              $ref: '#/components/schemas/VersionedReference'
            hierarchyElement:
              $ref: '#/components/schemas/VersionedReference'
            identifiedCredentials:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CredentialAssigned'
            segments:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Segment'
            identifiedVehicle:
              $ref: '#/components/schemas/VehicleAncillaryIdentification'
          required:
            - actualStart
            - initiator
            - identifiedCredentials
            - segments
    SessionList:
      title: SessionList
      description: Paginated list of Sessions
      type: object
      x-package: session
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          properties:
            data:
              type: array
              description: List of Sessions
              items:
                $ref: '#/components/schemas/Session'
    IssueMethodTypeEnum:
      title: IssueMethodTypeEnum
      description: |-
        A list of the supported methods for issuing credentials.
        * electronic : electronically issued, traceable
        * permit : physical identifier, typically visibly mounted within vehicle
        * ticket : typically single use, paper based
      type: string
      x-package: assigned_right.enums
      enum:
        - electronic
        - ticket
        - permit
    PlannedUse:
      title: PlannedUse
      description: Represents a specific future instance of an AssignedRight.
      type: object
      x-package: assigned_right
      properties:
        startTime:
          type: string
          description: Datetime instance when a PlannedUse is considered to start, and be available for use.
          format: date-time
        endTime:
          type: string
          description: Datetime instance when a PlannedUse is considered to end, and no longer be available for use.
          format: date-time
        cancelTime:
          type: string
          description: Datetime instance when a specific PlannedUse has been cancelled by the RightHolder.
          format: date-time
        expiryTime:
          type: string
          description: Datetime instance when a PlannedUse expires, and is no longer available for use.
          format: date-time
        issuer:
          readOnly: true
          $ref: '#/components/schemas/VersionedReference'
        issuanceTime:
          type: string
          description: Date/time at which a specific PlannedUse instance was issued.
          format: date-time
        issueMethod:
          $ref: '#/components/schemas/IssueMethodTypeEnum'
        credentialsAssigned:
          type: array
          description: Credentials that might be used for the future AssignedRight.
          minItems: 1
          items:
            $ref: '#/components/schemas/CredentialAssigned'
      required:
        - startTime
    PaymentTypeEnum:
      title: PaymentTypeEnum
      description: |-
        Indicates the nature of the payment made against an AssignedRight.
        * payment : Indicates financial payment made
        * validation : Indicates financial value offset through use of validation coupon or similar
      type: string
      x-package: rate.payment.enums
      enum:
        - payment
        - validation
    PaymentLine:
      title: PaymentLine
      description: Enables transaction details to be accumulated based on the type of payment (ie, base fee, taxes, surcharges, etc)
      type: object
      x-package: rate.payment
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            identifierId:
              type: string
              description: Identifier for the transaction (e.g. reservation number, credit card transaction reference).
            idCode:
              type: string
              description: Unique cost code identifier, potentially agreed bi-laterally between data supplier and data receiver.
            paymentType:
              $ref: '#/components/schemas/PaymentTypeEnum'
            value:
              $ref: '#/components/schemas/AmountInCurrency'
          required:
            - paymentType
            - value
    Payment:
      title: Payment
      description: Represents the record of payments for associated AssignedRight.
      type: object
      x-package: rate.payment
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            dateCollected:
              description: Datetime that the payment related to this financial transaction is recorded as being paid and collected.
              $ref: '#/components/schemas/DateTime'
            dateAuthorised:
              description: Datetime that the payment related to this financial transaction is authorised.
              $ref: '#/components/schemas/DateTime'
            serviceProvider:
              readOnly: true
              $ref: '#/components/schemas/VersionedReference'
            transactionID:
              type: string
              description: Identifier for the transaction (e.g. reservation number, credit card transaction reference) as agreed upon by the two entities sharing data.
            idCode:
              type: string
              description: User defined field to identity additional details such as customer account number or G/L account number.
            startPeriodCovered:
              type: string
              description: Note field to describe the start of the period a payment covers.
              format: date-time
            endPeriodCovered:
              type: string
              description: Note field to describe the end of the period a payment covers.
              format: date-time
            paymentLines:
              type: array
              description: A data class that enables transaction details to be accumulated.
              items:
                $ref: '#/components/schemas/PaymentLine'
          required:
            - serviceProvider
            - paymentLines
    MonetaryValue:
      title: MonetaryValue
      type: object
      description: Lightweight record of the monetary financial value of the associated AssignedRight (temporary). Service provider is entity responsible for selling/collecting fees associated to the AR.
      x-package: rate.payment
      properties:
        taxIncluded:
          type: boolean
          description: Whether tax included in monetary value, if yes (TRUE), if not (FALSE).
        serviceProvider:
          $ref: '#/components/schemas/VersionedReference'
          readOnly: true
        value:
          $ref: '#/components/schemas/AmountInCurrency'
      required:
        - taxIncluded
        - serviceProvider
        - value
    AssignedRight:
      title: AssignedRight
      description: AssignedRight indicates the granting of a specific right specification to a specific right holder, and indicates one instance of a planned use of the right.
      type: object
      x-package: assigned_right
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            rightSpecification:
              $ref: '#/components/schemas/VersionedReference'
            rightHolder:
              $ref: '#/components/schemas/AssignedRightHolder'
            assignedRightIssuer:
              readOnly: true
              $ref: '#/components/schemas/VersionedReference'
            issueMethod:
              $ref: '#/components/schemas/IssueMethodTypeEnum'
            issuanceTime:
              type: string
              description: The datetime this AssignedRight was issued.
              format: date-time
            minutesAvailable:
              type: number
              description: Number of decimal minutes that are remaining for use under a specified AssignedRight.
              format: float
            minutesUsed:
              type: number
              description: Number of decimal minutes that have been used under a specified AssignedRight.
              format: float
            totalMinutes:
              type: number
              description: Number of decimal minutes that have been issued under a specified AssignedRight.
              format: float
            remainingValue:
              $ref: '#/components/schemas/AmountInCurrency'
            totalRightValue:
              $ref: '#/components/schemas/AmountInCurrency'
            instancesUsed:
              type: integer
              description: The total number of instances that have been used under a specified RightSpecification.
            instancesAvailable:
              type: integer
              description: The total number of instances that are available for use under a specified RightSpecification.
            totalInstances:
              type: integer
              description: The total number of instances that have been issued under a specified AssignedRight.
            expiry:
              type: string
              description: The datetime when the specific AssignedRight expires, and is not longer available for use.
              format: date-time
            plannedUses:
              type: array
              description: Planned future uses of this AssignedRight.
              items:
                $ref: '#/components/schemas/PlannedUse'
            payments:
              type: array
              description: Payments made for this AssignedRight.
              items:
                $ref: '#/components/schemas/Payment'
            monetaryValue:
              $ref: '#/components/schemas/MonetaryValue'
          required:
            - rightSpecification
            - rightHolder
    AssignedRightList:
      title: AssignedRightList
      description: Paginated list of AssignedRights
      type: object
      x-package: assigned_right
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          properties:
            data:
              type: array
              description: List of AssignedRights
              items:
                $ref: '#/components/schemas/AssignedRight'
    ReferenceQuoteExtension:
      title: ReferenceQuoteExtension
      type: object
      description: Class providing a versioned reference to a quote for a session extension
      properties:
        quoteResponseId:
          $ref: '#/components/schemas/VersionedReference'
        optionId:
          $ref: '#/components/schemas/VersionedReference'
      x-package: Quotes
      x-tags: Quotes
    ReferenceQuoteNew:
      title: ReferenceQuoteNew
      type: object
      description: Class providing a versioned reference to a new quote
      properties:
        quoteResponseId:
          $ref: '#/components/schemas/VersionedReference'
        optionId:
          $ref: '#/components/schemas/VersionedReference'
      x-package: Quotes
      x-tags: Quotes
    ReferenceToQuote:
      title: ReferenceToQuote
      description: Class defining a reference to a specific Quote
      oneOf:
        - $ref: '#/components/schemas/ReferenceQuoteExtension'
        - $ref: '#/components/schemas/ReferenceQuoteNew'
      x-package: Quotes
      x-tags: Quotes
    ReferencedRightSpecification:
      title: ReferencedRightSpecification
      type: object
      description: class to support referencing a RightSpecification
      properties:
        elementId:
          $ref: '#/components/schemas/VersionedReference'
        rightSpecificationId:
          $ref: '#/components/schemas/VersionedReference'
      required:
        - rightSpecificationId
      x-package: Quotes
      x-tags: Quotes
    QuoteRightRequest:
      title: QuoteRightRequest
      description: class containing data elements required to request a quote for a new transaction
      allOf:
        - $ref: '#/components/schemas/VersionedIdentity'
        - type: object
          properties:
            eligibility:
              $ref: '#/components/schemas/Eligibility'
            referencedRightSpecifications:
              type: array
              items:
                $ref: '#/components/schemas/ReferencedRightSpecification'
            periodStart:
              type: string
              format: date-time
              description: request date/time for the start of a proposed new transactions
            periodEnd:
              type: string
              format: date-time
              description: request date/time for the end of a proposed new transactions
            requestTime:
              type: string
              format: date-time
              description: date/time at which the request was made
            timePeriods:
              type: array
              items:
                $ref: '#/components/schemas/Duration'
              description: requested duration for the proposed new transaction
          required:
            - periodStart
            - requestTime
      x-package: Quotes
      x-tags: Quotes
    ResponseReasonEnum:
      title: ResponseReasonEnum
      description: |
        A list of supported reasons if a requested quote response is not provided

        * `eligibilityRequirementNotMet`: a stated eligibility requirement is not considered to be met
        * `noAvailability`: No availability for request
        * `noMatchingSpecification`: No matching rights specification found
        * `other`: other reason (reason not given)
        * `rightSpecificationNotAvailableAtRequestedTimes`: the requested specification is not available at the requested time
      type: string
      enum:
        - eligibilityRequirementNotMet
        - noAvailability
        - noMatchingSpecification
        - other
        - rightSpecificationNotAvailableAtRequestedTimes
      x-package: Quotes
      x-tags: Quotes
    QuoteExpiration:
      title: QuoteExpiration
      description: class defining conditions indicating the end of the validity of a quote
      properties:
        expiresDateTime:
          type: string
          format: date-time
        firstComeFirstServe:
          type: boolean
          description: a Boolean value shows that the availability of an Option and thus FinancialQuote are available to the requester on a first come first served basis, with no assurance that the advertised RightSpecification will be available based on actual demand
      required:
        - firstComeFirstServe
      x-package: Quotes
      x-tags: Quotes
    Identifiers:
      title: Identifiers
      description: compound reference for rate table and right specification
      properties:
        rateTableID:
          $ref: '#/components/schemas/VersionedReference'
        rightSpecificationId:
          $ref: '#/components/schemas/VersionedReference'
      required:
        - rateTableId
        - rightSpecificationId
      x-package: Quotes
      x-tags: Quotes
    FinancialQuote:
      title: FinancialQuote
      type: object
      description: class containing information on financila value of a quote
      properties:
        serviceProvider:
          $ref: '#/components/schemas/VersionedReference'
        taxIncluded:
          type: boolean
          description: whether tax is included in the specified monetary value or not
