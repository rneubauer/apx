      type: object
      x-package: rate.eligibility
      properties:
        comparisonOperator:
          $ref: '#/components/schemas/ComparisonOperatorEnum'
        vehicleLength:
          type: number
          description: The overall distance (in metres) between the front and back of an individual vehicle, including the length of any trailers, couplings or embedded features.
          format: float
          exclusiveMinimum: 0
      required:
        - comparisonOperator
        - vehicleLength
    WidthCharacteristic:
      title: WidthCharacteristic
