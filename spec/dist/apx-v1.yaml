  /v1/sessions/{id}/plate:
    put:
      operationId: put-apx-v1-sessions-id-plate
      security:
        - apxOAuth:
            - apx.data:write
      tags:
        - LPR
        - Resolution
      summary: Associate or correct the plate on a session
      description: |-
        The write side of plate correction (Part 17 §17.5): sets the
        session's plate, optionally citing the chosen Observation candidate
        (GET /v1/lpr/candidates). A transactional domain action — not a
        control command. Naturally idempotent (PUT). Scope apx.data:write.

        NORMATIVE (Part 17 §17.5): the correction MUST materialize in the
        underlying APDS Session (identifiedCredentials /
        identifiedVehicle), MUST publish SessionUpdated, and MUST be
        visible to plain APDS clients reading /sessions/{id} — this route
        is a business-action façade over APDS-modeled state, never a
        parallel store.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
