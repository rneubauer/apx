        officer's decision is recorded with reason and reviewer; a
        `violationType` in the body corrects the detector's classification.
        Any other starting state is 409 `violation-transition-illegal`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
