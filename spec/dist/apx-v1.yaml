        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationStatementClose'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationStatement'
        '201':
          description: Period closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationStatement'
        '400':
          description: Missing Idempotency-Key or invalid period.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
