      x-package: common
      type: object
      properties:
        class:
          $ref: '#/components/schemas/ValueRangeClassEnum'
        unit:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
        boundaries:
          type: array
          items:
            $ref: '#/components/schemas/ValueRangeBoundary'
          minItems: 1
          maxItems: 2
    Emissions:
      title: Emissions
      description: Emission characteristics of vehicles.
      type: object
      x-package: rate.eligibility
      properties:
        emissionClassification:
          $ref: '#/components/schemas/ReferencedCodeListEntry'
        emissionClassificationOther:
          type: array
