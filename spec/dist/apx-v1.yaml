          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Matching reads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LprRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/alerts:
    post:
      operationId: post-apx-v1-alerts
      security:
        - apxOAuth:
            - apx.alerts:write
      tags:
        - Alerts
      summary: Raise an alert (idempotent)
      description: |-
        Raises an alert. The `Idempotency-Key` header is REQUIRED: replaying
        the same key with the same body returns the original alert (200);
        the same key with a different body is 409 idempotency-conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '201':
          description: Alert raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: Missing Idempotency-Key or invalid alert.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-alerts
      security:
        - apxOAuth:
            - apx.alerts:read
      tags:
        - Alerts
      summary: List/filter alerts
      description: Filter by status, severityFloor, type, place (subtree-inclusive), since.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - raised
              - acknowledged
              - resolved
              - expired
        - name: severityFloor
          in: query
          schema:
            type: string
            enum:
              - info
              - warning
              - minor
              - major
              - critical
        - name: type
          in: query
          schema:
            type: string
        - name: place
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated alerts (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/alerts/{id}:
    get:
      operationId: get-apx-v1-alerts-id
      security:
        - apxOAuth:
            - apx.alerts:read
      tags:
        - Alerts
      summary: Read an alert
      description: Returns the alert including its immutable statusHistory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          description: No such alert.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/alerts/{id}/acknowledge:
    post:
      operationId: post-apx-v1-alerts-id-acknowledge
      security:
        - apxOAuth:
            - apx.alerts:write
      tags:
        - Alerts
      summary: Acknowledge an alert
      description: Transition raised → acknowledged. Illegal transitions are 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Acknowledged alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '409':
          description: Illegal transition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/alerts/{id}/resolve:
    post:
      operationId: post-apx-v1-alerts-id-resolve
      security:
        - apxOAuth:
            - apx.alerts:write
      tags:
        - Alerts
      summary: Resolve an alert
      description: Transition raised|acknowledged → resolved. Illegal transitions are 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resolved alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '409':
          description: Illegal transition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/resolution/contexts:
    post:
      operationId: post-apx-v1-resolution-contexts
      security:
        - apxOAuth:
            - apx.resolution:read
      tags:
        - Resolution
      summary: Resolve a customer-service context from any known identifiers
      description: |-
        THE aggregation call (Part 17 §17.2): accepts whatever
        parking-domain identifiers are known (lane, device, plate, ticket,
        credential, reservation code…) — telephony mapping stays on the
        call platform's side (§17.1) — and returns everything the server
        can resolve —
        issue classification, lane status, vehicle, session, account,
        passback, device status, recent overrides, support history — plus
        the policy-decided allowedActions. Sections the caller's scopes and
        `apx_places` grant could not read directly are omitted. May return
        `status: partial` with `pendingSources` rather than waiting on a
        slow source; re-read to refresh. Scope apx.resolution:read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionResolveRequest'
      responses:
        '201':
          description: The resolved context (possibly partial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionContext'
        '400':
          description: No usable identifier supplied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No identifier resolved to anything this implementation knows.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/resolution/contexts/{id}:
    get:
      operationId: get-apx-v1-resolution-contexts-id
      security:
        - apxOAuth:
            - apx.resolution:read
      tags:
        - Resolution
      summary: Re-read (recompute) a resolution context
      description: |-
        Returns the context recomputed against current state — `version`
        increments when anything material changed. Use after events arrive
        or when the initial response was partial. Scope apx.resolution:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such context (contexts MAY expire; re-resolve).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/resolution/contexts/{id}/allowed-actions:
    get:
      operationId: get-apx-v1-resolution-contexts-id-allowed-actions
      security:
        - apxOAuth:
            - apx.resolution:read
      tags:
        - Resolution
      summary: Re-evaluate the allowed actions for a context
      description: |-
        The policy layer's current decisions (Part 17 §17.3) — cheaper than
        a full context recompute; call before executing when time has
        passed. The consuming agent (human or AI) MUST NOT decide
        permissibility itself. Scope apx.resolution:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current decisions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllowedAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such context.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/lpr/candidates:
    get:
      operationId: get-apx-v1-lpr-candidates
      security:
        - apxOAuth:
            - apx.lpr:read
      tags:
        - LPR
        - Resolution
      summary: Plate candidates for correction workflows
      description: |-
        Candidate plate reads (with confidence and imagery links) for a
        session or lane — the read side of plate correction (Part 17
        §17.5); the write is PUT /v1/sessions/{id}/plate. Scope apx.lpr:read.
      parameters:
        - name: session
          in: query
          schema:
            type: string
            format: uuid
          description: Session UUID.
        - name: lane
          in: query
          schema:
            type: string
            format: uuid
          description: VehicularAccess UUID.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Candidates, best confidence first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlateCandidate'
        '400':
          description: Neither session nor lane given.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/credentials/{id}/passback:
    get:
      operationId: get-apx-v1-credentials-id-passback
      security:
        - apxOAuth:
            - apx.control:read
      tags:
        - Resolution
      summary: Anti-passback status for a credential
      description: |-
        The credential's passback overlay: state, expected vs recorded
        presence, last access. The write side is the `resetPassback` /
        `forceIn` / `forceOut` commands (Part 17 §17.4). Scope
        apx.control:read; the place grant must cover the credential's
        last-access place.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: APDS Credential UUID.
      responses:
        '200':
          description: Passback status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassbackStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such credential or no passback tracking.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/support/interactions:
    post:
      operationId: post-apx-v1-support-interactions
      security:
        - apxOAuth:
            - apx.support:manage
      tags:
        - Support
      summary: Record a support interaction
      description: |-
        Records one customer-service interaction (human or AI) so future
        resolution contexts can surface it. Summaries, not transcripts
        (Part 9 §9.6). Scope apx.support:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportInteraction'
      responses:
        '201':
          description: Recorded interaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportInteraction'
        '400':
          description: Invalid interaction.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: get-apx-v1-support-interactions
      security:
        - apxOAuth:
            - apx.support:manage
      tags:
        - Support
      summary: Support history for a subject
      description: |-
        Recent interactions filtered by any subject key. At least one
        filter is required. Scope apx.support:manage (or apx.resolution:read
        for read-only consumers).
      parameters:
        - name: plate
          in: query
          schema:
            type: string
        - name: holder
          in: query
          schema:
            type: string
            format: uuid
        - name: account
          in: query
          schema:
            type: string
            format: uuid
        - name: session
          in: query
          schema:
            type: string
            format: uuid
        - name: place
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated interactions (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/PaginatedListMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportInteraction'
        '400':
          description: No filter given.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/discovery:
    get:
      operationId: get-apx-v1-discovery
      security:
        - apxOAuth: []
      tags:
        - Discovery
      summary: Credential-scoped capability document
      description: |-
        Reflects the presented token's scopes and grants exactly: the
        endpoints, command types, topics, and place subtrees THIS client can
        use. Soundness rule: everything listed is callable; APX endpoints
        not listed fail with 403.
      responses:
        '200':
          description: The capability document for this credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        '401':
          description: Missing/invalid token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /.well-known/apx-configuration:
    get:
      operationId: get-well-known-apx-configuration
      tags:
        - Discovery
      summary: Bootstrap configuration document
      security: []
      description: |-
        Unauthenticated bootstrap document. Advertises the token endpoint,
        the APDS version this implementation extends, supported APX
        conformance classes, and code-list registry locations.

        Served at the server root (NOT under `/v1`), per RFC 8615.
      responses:
        '200':
          description: Bootstrap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApxConfiguration'
webhooks:
  apx-event:
    post:
      operationId: receive-apx-event
      summary: Signed APX event delivery
      description: |-
        Every webhook delivery POSTs one EventEnvelope with headers
        `APX-Signature` (v1=HMAC-SHA256(secret, timestamp + "." + body)),
        `APX-Timestamp` (RFC 3339, ±5 min replay window),
        `APX-Delivery-Id` (unique per attempt; envelope `id` is stable
        across retries), and `APX-Key-Id` (REQUIRED during secret-rotation
        overlap windows — Part 9 §9.4). Respond 2xx to acknowledge;
        anything else triggers the normative retry schedule (Part 8).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Acknowledged.
components:
  parameters:
    ModeParam:
      name: mode
      in: query
      required: false
      description: |-
        APX data profile: `full` (default — behaves exactly like stock APDS 4.1)
        or `change` (return a ChangeFeedPage of deltas since `cursor`/`since`).
      schema:
        type: string
        enum:
          - full
          - change
        default: full
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque change-feed cursor from a previous ChangeFeedPage. Only meaningful with `mode=change`.
      schema:
        type: string
    latitude:
      schema:
        type: number
        format: float
      in: query
      name: latitude
      description: Location latitude to use as filter (mandatory if __longitude__ and __radius__ are defined)
    longitude:
      schema:
        type: number
        format: float
      in: query
      name: longitude
      description: Location longitude to use as filter (mandatory if __latitude__ and __radius__ are defined)
    radius:
      schema:
        type: integer
        minimum: 0
      in: query
      name: radius
      description: Number of metres to use as search filter from given position (mandatory if __latitude__ and __longitude__ are defined)
    place_types:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/HierarchyElementTypeEnum'
      name: type
      in: query
      description: Comma-separated list of place types to consider. All will be assumed if parameter is not used or left blank.
      style: form
      explode: false
    right_spec_types:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RightSpecificationTypeEnum'
      name: right_type
      in: query
      description: Comma-separated list of right specification types to consider. All will be assumed if parameter is not used or left blank.
      style: form
      explode: false
    structure_type:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/StructureTypeEnum'
      name: structure_type
      in: query
      description: Comma-separated list of types of structure in the hierarchy to consider (all will be assumed if parameter is not used or left blank)
      style: form
      explode: false
    structure_grade:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/StructureGradeEnum'
      name: structure_grade
      in: query
      description: Comma-separated list of Structure grades in the hierarchy to consider (all will be assumed if parameter is not used or left blank)
      style: form
      explode: false
    place_name:
      schema:
        type: string
      name: name
      in: query
      description: Name of place hierarchy element (in any of its supported languages)
    place_layer:
      schema:
        type: integer
      name: layer
      in: query
      description: Most detailed (lower-level) layer of data desired. 0 (zero) being the first level (and higher numbers correspond to lower-levels of information). If left empty, the entire place hierarchy that matches the remaining parameters will be returned.
    operator:
      schema:
        type: string
      in: query
      name: operator
      description: id of the parking operator in charge of the location(s)
    modified_since:
      schema:
        type: integer
        minimum: 0
      in: query
      name: modified_since
      description: Unix epoch __instant__ to filter results that have changed or have been deleted after the given instant. If __expand__ attributes are requested, then this parameter will also apply to those objects. When this attribute is used, the result set will also include a list of deleted references to avoid storing stale data.
    places_expand:
      schema:
        type: array
        items:
          type: string
          enum:
            - all
            - none
            - rightSpecifications
            - occupancy
            - areaLocation
            - pointLocation
            - contacts
            - operatingRestrictions
            - characteristics
            - paymentMethods
            - openingTimes
            - streetAddress
      description: Comma-separated list of optional object attributes associated to a place hierarchy element that should be included in the result set.
      name: expand
      in: query
      style: form
      explode: false
    page:
      schema:
        type: integer
        minimum: 1
      in: query
      name: page
      description: The page number for paginated responses.
    version:
      schema:
        type: integer
        minimum: 1
      in: query
      name: version
      description: Previous version number. Useful when a reference to a resource version is found in another dataset, and that version is no longer the latest one. Latest version is assumed when this parameter is not used.
    place_ids:
      schema:
        type: array
        items:
          type: string
      description: Comma-separated list of unique place ids according to the requested types.
      name: place
      in: query
      explode: false
      style: form
    start_before:
      schema:
        type: integer
        minimum: 0
      in: query
      name: start_before
      description: Unix epoch __instant__ to filter results starting before the given instant.
    end_before:
      schema:
        type: integer
        minimum: 0
      in: query
      name: end_before
      description: Unix epoch __instant__ to filter results ending before the given instant.
    start_after:
      schema:
        type: integer
        minimum: 0
      in: query
      name: start_after
      description: Unix epoch __instant__ to filter results starting after the given instant.
    end_after:
      schema:
        type: integer
        minimum: 0
      in: query
      name: end_after
      description: Unix epoch __instant__ to filter results ending after the given instant.
    issuer:
      schema:
        type: string
      in: query
      name: issuer
      description: id of the entity that issued the returned records
    right_specs_expand:
      schema:
        type: array
        items:
          type: string
          enum:
            - all
            - none
            - rateEligibility
            - validity
            - credentials
            - rightPools
      description: Comma-separated list of optional object attributes associated to a right specification that should be included in the result set.
      name: expand
      in: query
      style: form
      explode: false
    right_spec_ids:
      schema:
        type: array
        items:
          type: string
      description: Comma-separated list of unique right specification ids according to the requested types.
      name: right_spec
      in: query
      explode: false
      style: form
    rates_expand:
      schema:
        type: array
        items:
          type: string
          enum:
            - all
            - none
            - rateLineCollections
            - rateLineCollections.rateLines
      description: Comma-separated list of optional attributes associated to a rate that should be included in the result set.
      name: expand
      in: query
      style: form
      explode: false
    credential_ids:
      schema:
        type: array
        items:
          type: string
      in: query
      name: credential_id
      description: Comma-separated list of unique credential ids according to the requested types.
      style: form
      explode: false
    credential_types:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CredentialTypeEnum'
      name: credential_type
      in: query
      description: Comma-separated list of credential types to consider. All will be assumed if parameter is not used or left blank.
      style: form
      explode: false
    sessions_expand:
      schema:
        type: array
        items:
          type: string
          enum:
            - all
            - none
            - credentials
            - vehicleAncillaryIdentification
            - segments
            - segments.space
            - segments.assignedRight
      description: Comma-separated list of optional attributes associated to a session or its segment.s that should be included in the result set.
      name: expand
      in: query
      style: form
      explode: false
    assigned_expand:
      schema:
        type: array
        items:
          type: string
          enum:
            - all
            - none
            - plannedUses
            - assignedRightIssuer
      description: Comma-separated list of optional object attributes associated to an assigned right that should be included in the result set.
      name: expand
      in: query
      style: form
      explode: false
    quote_type:
      name: quote_type
      in: query
      schema:
        type: string
        description: type of quote element requested
        enum:
          - QuoteRightRequest
          - QuoteRightResponse
          - QuoteSessionExtensionRequest
          - QuoteSessionExtensionResponse
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |-
        Insufficient scope (problem type `insufficient-scope`) or place
        grant (`insufficient-grant`) for this operation (Part 9).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited (problem type `rate-limited`, Part 12).
      headers:
        Retry-After:
          description: Seconds to wait before retrying (RFC 9110).
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.parking-data-standards.org
          scopes:
            po: Parking Operator
            sp: Service Provider
            ep: Enforcement Provider
            ad: Administrator
    apxOAuth:
      type: oauth2
      description: |-
        OAuth 2.0 client-credentials (aligned with APDS 4.1's `oAuth` scheme).
        APX scopes follow `apx.<domain>:<verb>`. Grants are carried in the
        normative token claims `apx_org` (Organisation reference) and
        `apx_places` (HierarchyElement subtree grants — FAIL-CLOSED: absent
        or empty = no places; the explicit wildcard "*" = all places,
        Part 9 §9.3).
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          scopes:
            apx.data:read: Read parking data via APDS-native routes
            apx.data:write: Create/update parking data via APDS-native routes
            apx.control:read: Read commands, lanes, and device status
            apx.control:execute: Execute commands (vend gate, lost ticket, push rate, apply validation…)
            apx.alerts:read: Read alerts
            apx.alerts:write: Raise, acknowledge, and resolve alerts
            apx.subscriptions:manage: Create and manage event subscriptions
            apx.accounts:read: Look up accounts and balances
            apx.payments:write: Take payments and post accounting write-backs
            apx.lpr:read: LPR plate/ticket cross-lookup
            apx.reservations:manage: Quote, book, amend, cancel reservations
            apx.permits:manage: Issue and manage permits
            apx.tolling:manage: Create and manage toll transactions
            apx.resolution:read: Resolve and read customer-service resolution contexts and allowed actions
            apx.support:manage: Record and read support-interaction history
            apx.violations:read: Read violations and run the enforcement eligibility check
            apx.violations:manage: Create, review, issue, settle, appeal, and void violations
            apx.validations:read: Read validation programs, issuances, redemptions, and statements
            apx.validations:manage: Enrol and update programs, issue stock, reverse redemptions, close statements
            apx.validations:redeem: Merchant scope — check codes, issue own stock, record redemptions, read own programs and statements (limited to the token's apx_org)
            apx.credentials:read: Read credentials and their access-event history
            apx.credentials:manage: Issue, activate, suspend, resume, report lost, revoke, and replace credentials
            apx.valet:read: Read valet tickets and the retrieval queue
            apx.valet:manage: Take custody, park, stage, hand back, and manage retrievals
            apx.valet:request: Customer scope — request or cancel retrieval and read status/ETA for the caller's own ticket (text, app, web, voice bot)
  schemas:
    RecordInfo:
      title: RecordInfo
      description: |-
        Provenance metadata for an APX resource, aligned to the APDS Information
        Model's RecordType (creationTime/creator/lastUpdate). All timestamps are
        RFC 3339 (APDS DateTime).
      type: object
      properties:
        creationTime:
          $ref: '#/components/schemas/DateTime'
        creator:
          description: Reference to the creating Organisation or Contact.
          $ref: '#/components/schemas/Reference'
        creationUser:
          type: string
          description: Human or system principal that created the record.
        lastUpdate:
          $ref: '#/components/schemas/DateTime'
        lastUpdateUser:
          type: string
          description: Human or system principal that last updated the record.
    Extensions:
      title: Extensions
      description: |-
        The official APDS extension container (Use Case Document §C.2.5).
        Keys MUST follow `apds-ext:<namespace>:<class>@<major>.<minor>`.
        Implementations MUST preserve unknown extension keys on round-trip
        (tolerant reader, faithful writer).
      type: object
      propertyNames:
        pattern: ^apds-ext:[a-z0-9-]+:[a-z0-9-]+@[0-9]+\.[0-9]+$
      additionalProperties:
        type: object
    ApxResourceCore:
      title: ApxResourceCore
      description: |-
        Identity core shared by every APX-defined resource. Shaped so any APX
        resource can itself be the target of an APDS Reference or
        VersionedReference (RFC 4122 UUID identifier + integer version).
      type: object
      required:
        - id
        - version
      properties:
        id:
          type: string
          format: uuid
          description: RFC 4122 UUID, unique within the resource class.
        version:
          type: integer
          minimum: 1
          description: Monotonically increasing object version.
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
    Problem:
      title: Problem
      description: |-
        RFC 9457 problem details. APX problem `type` URIs are registered in the
        APX problem-type registry. Used for all APX error responses; APDS-native
        routes may alternatively use the APDS ResponseStatus shape.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI from the APX problem registry.
          examples:
            - https://apx-standard.org/problems/insufficient-grant
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
      additionalProperties: true
      examples:
        - type: https://apx-standard.org/problems/target-not-found
          title: Target not found
          status: 404
          detail: No lane b2000000-0000-4000-8000-00000000dead at this place.
          instance: /v1/lanes/b2000000-0000-4000-8000-00000000dead/current
    EventEnvelope:
      title: EventEnvelope
      description: |-
        The single envelope for all APX asynchronous delivery (webhooks and SSE).
        Attribute names are aligned with CloudEvents 1.0 (informative mapping in
        the standard's annex); `subject` carries an APDS Reference so events bind
        to APDS/APX entities natively.
      type: object
      required:
        - id
        - type
        - source
        - time
        - data
      properties:
        id:
          type: string
          format: uuid
          description: Unique event id (delivery-stable; retries reuse it).
        type:
          type: string
          description: |-
            Event topic. Either an APX topic (`apx.<domain>.<event>.vN`) or an
            APDS EventTypeEnum value (e.g. `SessionCreated`).
          examples:
            - apx.alert.raised.v1
            - SessionCreated
        source:
          type: string
          format: uri-reference
          description: Identifies the publishing implementation/site.
        time:
          $ref: '#/components/schemas/DateTime'
        subject:
          description: The entity this event is about.
          $ref: '#/components/schemas/Reference'
        dataschema:
          type: string
          format: uri
          description: Optional URI of the schema that `data` validates against.
        data:
          description: Event payload. For APDS EventTypeEnum topics this is the APDS EventData shape.
          type: object
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: 3b4c5d6e-7f8a-4b9c-8d0e-1f2a3b4c5d6e
          type: apx.reservation.noshow.v1
          source: https://api.lakeside-garage.example/v1
          subject:
            id: e2000000-0000-4000-8000-000000000003
            className: AssignedRight
          time: '2026-08-14T19:30:00Z'
          data:
            reservation:
              id: e2000000-0000-4000-8000-000000000003
              className: AssignedRight
            reservationState: noShow
            plannedStart: '2026-08-14T18:00:00Z'
    CodeListValue:
      title: CodeListValue
      description: |-
        A value drawn from an APX or implementer UserDefinedCodeList — carries the
        defined value plus an optional ReferencedCodeListEntry-style pointer to
        the list that defines it.
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: The definedValue from the code list entry.
          examples:
            - vendGate
        codeListId:
          description: VersionedReference to the defining UserDefinedCodeList.
          $ref: '#/components/schemas/VersionedReference'
    ChangeFeedPage:
      title: ChangeFeedPage
      description: |-
        Response of a native APDS list route when called with `mode=change`.
        Items are VERBATIM APDS entities carrying only changed fields plus
        identity (change semantics per Part 5: explicit null = clear the field,
        absent = unchanged — generalizing APDS Use Case C.1.1.6). Deletions are
        APDS DeletedReferences (tombstones).
      type: object
      required:
        - publicationTime
        - updateMode
        - items
        - cursor
      properties:
        publicationTime:
          $ref: '#/components/schemas/DateTime'
        publisher:
          description: The publishing Organisation.
          $ref: '#/components/schemas/Reference'
        updateMode:
          type: string
          const: change
        items:
          type: array
          description: Changed APDS entities of the route's class (verbatim APDS schemas).
          items:
            type: object
        deleted:
          type: array
          description: Tombstones for deleted entities.
          items:
            $ref: '#/components/schemas/DeletedReference'
        cursor:
          type: string
          description: Opaque cursor to resume AFTER the last change in this page.
        grantAdditions:
          type: array
          description: |-
            Present on the first page served after the credential's apx_places
            grant gained subtrees (Part 5 §5.2 rule 7): the new subtree roots.
            The client MUST full-sync these subtrees before relying on the
            feed for them — the cursor does not retroactively cover their
            history.
          items:
            type: string
            format: uuid
        next:
          type:
            - string
            - 'null'
          format: uri-reference
          description: Link to the next page when more changes are immediately available; null otherwise.
      examples:
        - publicationTime: '2026-08-06T18:20:00Z'
          publisher:
            id: a1000000-0000-4000-8000-000000000001
            className: Organisation
          updateMode: change
          items:
            - id: f1000000-0000-4000-8000-000000000001
              version: 4
              className: Session
              segments:
                - actualEnd: '2026-08-06T18:14:34Z'
          deleted:
            - id: f1000000-0000-4000-8000-000000000099
              className: Session
              deleteTimestamp: '2026-08-06T17:58:12Z'
          cursor: c:00042
    OccupancySnapshot:
      title: OccupancySnapshot
      description: |-
        Current occupancy for one HierarchyElement, computed from the APDS
        occupancy model (Supply + DemandTable) that natively lives in the Place
        hierarchy. A convenience READ (Part 5 §5.5): the Place payload remains
        the source of truth; this answers "how full is it right now" without
        pulling the hierarchy. Composed entirely of verbatim APDS occupancy
        classes — APX adds no parallel occupancy datatypes.
      type: object
      required:
        - place
        - computedAt
      properties:
        place:
          description: The HierarchyElement (Place, Level, Area, …) this snapshot describes.
          $ref: '#/components/schemas/Reference'
        computedAt:
          description: When this snapshot was computed.
          $ref: '#/components/schemas/DateTime'
        supply:
          description: The element's supply (verbatim APDS Supply).
          $ref: '#/components/schemas/Supply'
        demand:
          description: |-
            The latest area demand record (verbatim APDS DemandType — count,
            percentage, occupancyCalculation, recordDateTime).
          $ref: '#/components/schemas/DemandType'
        available:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |-
            Convenience derivation: supply.supplyQuantity − demand.count when
            both are known; null when either side is unknown. Never negative —
            overfull facilities clamp to 0 (the demand record still shows the
            true count).
          examples:
            - 59
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          computedAt: '2026-08-25T17:45:00Z'
          supply:
            supplyViewType: spaceView
            supplyQuantity: 420
          demand:
            count: 361
            percentage: 85.9
            occupancyCalculation: counted
            recordDateTime: '2026-08-25T17:44:30Z'
          available: 59
    ApxEventSubscription:
      title: ApxEventSubscription
      description: |-
        Superset of the APDS 4.1 EventSubscription. A stock APDS client sending
        only `{endpoint, topics}` (EventTypeEnum values) gets stock behavior;
        the APX fields are additive and optional.
      type: object
      required:
        - topics
      properties:
        id:
          type: string
          format: uuid
          description: Assigned at creation; used with DELETE/PATCH /webhooks/{id}.
        version:
          type: integer
          minimum: 1
        endpoint:
          description: Client endpoint URL for webhook deliveries (required for transport=webhook).
          $ref: '#/components/schemas/Url'
        topics:
          type: array
          minItems: 1
          description: |-
            APDS EventTypeEnum values (e.g. SessionCreated) and/or APX topics
            (apx.<domain>.<event>.vN) — freely mixed.
          items:
            type: string
        transport:
          type: string
          enum:
            - webhook
            - sse
          default: webhook
        filters:
          type: object
          description: Server-side delivery filtering.
          properties:
            places:
              type: array
              description: Only events bound to these HierarchyElement subtrees are delivered.
              items:
                type: string
                format: uuid
            severityFloor:
              type: string
              description: For alert topics — minimum severity delivered.
              enum:
                - info
                - warning
                - minor
                - major
                - critical
        secret:
          type: string
          description: |-
            HMAC signing secret (≥32 bytes of entropy, used as raw UTF-8 key
            material). Server-generated when absent and returned EXACTLY ONCE —
            in the Prefer=representation creation response. Never present in
            GET/PATCH responses.
        secretRef:
          type: string
          writeOnly: true
          description: |-
            Identifier of an out-of-band-exchanged secret (Part 9 §9.4) —
            supply INSTEAD of `secret` when key material must never transit
            the API. Never a secret value itself.
        activeKeyIds:
          type: array
          readOnly: true
          description: |-
            Identifiers of the currently valid signing keys — two entries
            during a rotation overlap window, matching deliveries' APX-Key-Id
            header (Part 9 §9.4).
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - paused
            - failed
          description: failed = retry schedule exhausted; PATCH status=active to resume.
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
    DeliveryRecord:
      title: DeliveryRecord
      description: One entry in a subscription's delivery ledger.
      type: object
      required:
        - deliveryId
        - eventId
        - attempts
        - status
        - time
      properties:
        deliveryId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: EventEnvelope.id delivered (stable across retries).
        attempts:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - delivered
            - retrying
            - failed
        lastCode:
          type: integer
          description: Last HTTP status code received from the endpoint (0 = network error).
        time:
          $ref: '#/components/schemas/DateTime'
      examples:
        - deliveryId: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
          eventId: 2a3b4c5d-6e7f-4890-9a0b-1c2d3e4f5a6b
          attempts: 1
          status: delivered
          lastCode: 200
          time: '2026-08-06T18:17:42Z'
    Alert:
      title: Alert
      description: |-
        An operational condition requiring attention. Alert types are OPEN
        (UserDefinedCodeList `apx-alert-types`, seeded from APDS Use Case C.2.2
        transaction exceptions and space statuses); severity is CLOSED.
      type: object
      required:
        - id
        - version
        - alertType
        - severity
        - status
        - detectionTime
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        alertType:
          type: string
          description: definedValue from apx-alert-types or an implementer code list.
          examples:
            - deviceFault
        severity:
          type: string
          enum:
            - info
            - warning
            - minor
            - major
            - critical
        status:
          type: string
          enum:
            - raised
            - acknowledged
            - resolved
            - expired
          readOnly: true
          description: 'Lifecycle: raised → acknowledged → resolved | expired.'
        source:
          type: object
          description: Where the condition was detected.
          properties:
            device:
              description: Reference to a SupplementalEquipment.
              $ref: '#/components/schemas/Reference'
            place:
              type: string
              format: uuid
              description: HierarchyElement UUID (subtree semantics for filtering).
        relatedEntity:
          description: The APDS/APX entity this alert concerns (Session, AssignedRight, Command…).
          $ref: '#/components/schemas/Reference'
        occurrenceTime:
          description: When the condition actually occurred (may precede detection).
          $ref: '#/components/schemas/DateTime'
        detectionTime:
          $ref: '#/components/schemas/DateTime'
        description:
          description: Human-readable detail.
          $ref: '#/components/schemas/MultilingualString'
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
                description: Client/agent principal that caused the transition.
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: 7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e
          version: 2
          alertType: deviceFault
          severity: major
          status: acknowledged
          source:
            device:
              id: c1000000-0000-4000-8000-000000000003
              className: SupplementalEquipment
            place: b1000000-0000-4000-8000-000000000001
          occurrenceTime: '2026-08-06T18:17:40Z'
          detectionTime: '2026-08-06T18:17:41Z'
          description:
            - language: en
              string: Pay station 3 not responding
          statusHistory:
            - state: raised
              time: '2026-08-06T18:17:41Z'
              actor: lakeside-parcs
            - state: acknowledged
              time: '2026-08-06T18:19:05Z'
              actor: apx-operator
              detail: field tech dispatched
    Command:
      title: Command
      description: |-
        A request for an operational action against a lane/device/place.
        Perishable (expiryTime), idempotent (Idempotency-Key), fully audited
        (immutable statusHistory).
      type: object
      required:
        - id
        - version
        - commandType
        - target
        - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        commandType:
          type: string
          description: definedValue from apx-command-types (vendGate, lostTicket, pushRate, applyValidation, …).
          examples:
            - vendGate
        target:
          description: |-
            Reference to the target — SupplementalEquipment (device) or a
            VehicularAccess/Place HierarchyElement (lane/place scope).
          $ref: '#/components/schemas/Reference'
        parameters:
          type: object
          description: |-
            Command-type-specific parameters. Normative parameter schemas per
            commandType are given in Part 6 (e.g. lostTicket.method,
            pushRate.rateTable VersionedReference, applyValidation.ticket +
            provider, displayMessage.message, setDeviceState.state).
        requestedBy:
          description: The agent/organisation requesting the action (defaults to the token's apx_org).
          $ref: '#/components/schemas/Reference'
        reason:
          type: string
          description: Free-text or code-list reason for the action (audit).
        resolutionContext:
          description: The ResolutionContext this command resolves (Part 17) — links the action into the interaction's audit chain.
          $ref: '#/components/schemas/Reference'
        correlationId:
          type: string
          format: uuid
          description: Correlation chain id (Part 17 §17.7) — one id connects call → context → command → events → support interaction.
        approval:
          $ref: '#/components/schemas/Approval'
        expiryTime:
          description: Commands are perishable — MUST NOT be dispatched after this instant.
          $ref: '#/components/schemas/DateTime'
        priority:
          type: string
          enum:
            - normal
            - high
          default: normal
        status:
          type: string
          enum:
            - received
            - accepted
            - rejected
            - dispatched
            - executing
            - succeeded
            - failed
            - expired
            - cancelled
          readOnly: true
        confirmationLevel:
          type: string
          enum:
            - accepted
            - deviceAcknowledged
            - physicallyConfirmed
          readOnly: true
          description: |-
            How far success is actually confirmed (Part 6 §6.1): the command was
            accepted; the device acknowledged it; or the physical outcome was
            verified (e.g. gate-state sensor). Consumers — AI agents especially —
            MUST NOT claim a physical outcome ("the gate is open") beyond this
            level ("the open command was accepted").
        statusHistory:
          type: array
          description: Immutable, append-only lifecycle audit — THE audit trail (Part 4 §4.2).
          items:
            type: object
            required:
              - state
              - time
              - actor
            properties:
              state:
                type: string
              time:
                $ref: '#/components/schemas/DateTime'
              actor:
                type: string
              detail:
                type: string
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: 5e8d7c6b-4a39-4281-b0f1-2e3d4c5b6a70
          version: 5
          commandType: vendGate
          target:
            id: b2000000-0000-4000-8000-000000000002
            className: VehicularAccess
          requestedBy:
            id: a1000000-0000-4000-8000-000000000001
            className: Organisation
          reason: customer assistance — cinema validation applied, remainder waived per policy
          expiryTime: '2026-08-06T18:16:00Z'
          status: succeeded
          statusHistory:
            - state: received
              time: '2026-08-06T18:14:31Z'
              actor: apx-operator
            - state: accepted
              time: '2026-08-06T18:14:31Z'
              actor: lakeside-parcs
            - state: dispatched
              time: '2026-08-06T18:14:32Z'
              actor: lakeside-parcs
            - state: executing
              time: '2026-08-06T18:14:32Z'
              actor: gate-c1000000-0002
            - state: succeeded
              time: '2026-08-06T18:14:34Z'
              actor: gate-c1000000-0002
              detail: barrier raised
    Approval:
      title: Approval
      description: |-
        Approval evidence, REQUIRED on a write whose AllowedAction said
        requiresApproval (Part 17 §17.3). Servers MUST reject a
        requires-approval action without it (403 approval-required). One shared
        shape for control commands and domain actions (e.g. refunds).
      type: object
      required:
        - approvedBy
      properties:
        approvedBy:
          type: string
          description: The approving principal (role per AllowedAction.approvalRole).
        approvedAt:
          $ref: '#/components/schemas/DateTime'
        note:
          type: string
    DeviceStatus:
      title: DeviceStatus
      description: |-
        Live state overlay keyed by Reference to an APDS SupplementalEquipment —
        never duplicates its descriptive fields. deviceState values mirror the
        RefillPointStatusEnum style (registry apx-device-states). Attachable to
        APDS payloads as apds-ext:apx:devicestatus@1.0.
      type: object
      required:
        - device
        - deviceState
      properties:
        device:
          $ref: '#/components/schemas/Reference'
        deviceState:
          type: string
          description: definedValue from apx-device-states.
          examples:
            - available
        lastCommunication:
          $ref: '#/components/schemas/DateTime'
        stateChangedTime:
          $ref: '#/components/schemas/DateTime'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - device:
            id: c1000000-0000-4000-8000-000000000003
            className: SupplementalEquipment
          deviceState: fault
          lastCommunication: '2026-08-06T18:16:55Z'
          stateChangedTime: '2026-08-06T18:17:40Z'
    LaneStatus:
      title: LaneStatus
      description: |-
        The transaction context at a lane right now (the call-center
        screen-pop). Composes APDS references and data; adds no
        parallel entities.
      type: object
      required:
        - lane
      properties:
        lane:
          $ref: '#/components/schemas/Reference'
        currentTicket:
          type: object
          description: The ticket/credential currently in the machine, if any.
          properties:
            ticketNumber:
              type: string
            session:
              $ref: '#/components/schemas/Reference'
            issuedTime:
              $ref: '#/components/schemas/DateTime'
            amountDue:
              $ref: '#/components/schemas/AmountInCurrency'
            paidInFull:
              type: boolean
            validations:
              type: array
              items:
                type: object
                properties:
                  provider:
                    $ref: '#/components/schemas/Reference'
                  providerName:
                    type: string
                    description: Human-readable vendor name (from the place's ValidationProvider list).
                  validationType:
                    type: string
                    description: The provider's validation type at time of application.
                  validationId:
                    type: string
                    description: Unique id of this applied validation — maps to APDS Segment.validationId.
                  amountReduced:
                    description: The ACTUAL value this validation removed from the amount due (dispute evidence).
                    $ref: '#/components/schemas/AmountInCurrency'
                  appliedTime:
                    $ref: '#/components/schemas/DateTime'
            lpr:
              type: object
              description: Latest plate read at this lane (APDS Observation-derived).
              properties:
                plate:
                  type: string
                confidence:
                  type: number
                observation:
                  $ref: '#/components/schemas/Reference'
                imageLink:
                  $ref: '#/components/schemas/Url'
        monthlyCredential:
          type: object
          description: Monthly-parker credential context at the lane, if presented.
          properties:
            credential:
              $ref: '#/components/schemas/Reference'
            cardNumber:
              type: string
            accessGranted:
              type: boolean
            denialReason:
              type: string
            lastActivity:
              $ref: '#/components/schemas/DateTime'
            recentEvents:
              type: array
              maxItems: 10
              description: The last 10 activity events on this credential (trend view).
              items:
                type: object
                properties:
                  time:
                    $ref: '#/components/schemas/DateTime'
                  event:
                    type: string
                  lane:
                    $ref: '#/components/schemas/Reference'
      examples:
        - lane:
            id: b2000000-0000-4000-8000-000000000002
            className: VehicularAccess
          currentTicket:
            ticketNumber: T-1001
            session:
              id: f1000000-0000-4000-8000-000000000001
              className: Session
            issuedTime: '2026-08-06T08:02:11Z'
            amountDue:
              currencyType: USD
              currencyValue: 9
            paidInFull: false
            validations: []
            lpr:
              plate: SYN-1234
              confidence: 0.97
              observation:
                id: f2000000-0000-4000-8000-000000000001
                className: Observation
              imageLink: https://api.lakeside-garage.example/lpr/f2000000.jpg
          monthlyCredential:
            credential:
              id: e3000000-0000-4000-8000-000000000001
              className: Credential
            cardNumber: MC-0777
            accessGranted: false
            denialReason: account past due
            lastActivity: '2026-08-05T18:22:00Z'
            recentEvents:
              - time: '2026-08-05T18:22:00Z'
                event: exit
                lane:
                  id: b2000000-0000-4000-8000-000000000002
                  className: VehicularAccess
              - time: '2026-08-05T08:04:31Z'
                event: entry
                lane:
                  id: b2000000-0000-4000-8000-000000000001
                  className: VehicularAccess
    ValidationProvider:
      title: ValidationProvider
      description: A venue/organisation allowed to validate tickets at a place.
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: '#/components/schemas/Reference'
        name:
          type: string
        program:
          description: |-
            The ValidationProgram this row is derived from, when the server
            claims `apx-validations` (Part 20) — additive; absent otherwise.
          $ref: '#/components/schemas/Reference'
        validationType:
          type: string
          description: e.g. flat discount, hours comped — implementer code list.
        benefit:
          type: object
          description: |-
            What the validation is WORTH — disclosed in the lookup so agents can
            answer disputes. Exactly one of amount (money off) or duration
            (comped time, priced at the applicable rate) applies.
          required:
            - description
          properties:
            description:
              type: string
              description: Human-readable statement of the benefit.
              examples:
                - $3.00 off
                - First two hours comped
            amount:
              description: Fixed money off.
              $ref: '#/components/schemas/AmountInCurrency'
            duration:
              description: Comped parking time (ISO 8601), valued at the applicable rate.
              $ref: '#/components/schemas/Duration'
      examples:
        - provider:
            id: a2000000-0000-4000-8000-000000000011
            className: Organisation
          name: Lakeside Cinema
          validationType: twoHoursComped
          benefit:
            description: First two hours comped
            duration: PT2H
    Account:
      title: Account
      description: A billable parking account (monthly parker, fleet…), anchored on an APDS RightHolder.
      type: object
      required:
        - id
        - version
        - accountStatus
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        holder:
          description: Reference to the APDS RightHolder.
          $ref: '#/components/schemas/Reference'
        name:
          type: string
        phone:
          type: string
        cardNumber:
          type: string
          description: Access credential number (NOT a payment card PAN).
        plates:
          type: array
          items:
            type: string
        credentials:
          type: array
          description: |-
            The account's CredentialRecords (Part 21), when the server claims
            `apx-credentials` — additive; `cardNumber` and `plates` remain
            the APDS-only summary.
          items:
            $ref: '#/components/schemas/Reference'
        balance:
          description: Current balance due.
          $ref: '#/components/schemas/AmountInCurrency'
        accountStatus:
          type: string
          enum:
            - enabled
            - disabled
        places:
          type: array
          description: |-
            HierarchyElement subtree roots this account is valid at. On
            aggregating implementations (one endpoint fronting many locations)
            this is how consumers attribute the account to its site(s); results
            of place-less account lookups MUST stay within the caller's
            `apx_places` grant (Part 13 §13.5).
          items:
            $ref: '#/components/schemas/Reference'
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
    PaymentRecord:
      title: PaymentRecord
      description: A payment taken through APX (maps to the APDS Payment concept; card capture stays in the implementer's PCI scope).
      type: object
      required:
        - id
        - transactionID
        - dateCollected
        - amount
        - paymentStatus
        - place
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        transactionID:
          type: string
          readOnly: true
        place:
          description: |-
            The HierarchyElement (site) this payment is bound to. REQUIRED so
            every payment — in API responses and in
            `apx.accounts.payment.recorded.v1` events — is attributable to its
            location on implementations fronting many places (Part 13 §13.5).
          $ref: '#/components/schemas/Reference'
        dateCollected:
          $ref: '#/components/schemas/DateTime'
          readOnly: true
        amount:
          $ref: '#/components/schemas/AmountInCurrency'
        method:
          type: string
          description: card | autoAttendant | cash | other (implementer code list). autoAttendant = PCI-compliant IVR captures the card out of band.
        paymentStatus:
          type: string
          enum:
            - approved
            - declined
            - reversed
          readOnly: true
        account:
          $ref: '#/components/schemas/Reference'
        ticketNumber:
          type: string
        cardLast4:
          type: string
          pattern: ^[0-9]{2,4}$
          description: |-
            Truncated payment-card digits (PCI-permitted). For transient parkers
            with no LPR and no readable ticket, this is often the ONLY key a
            caller can provide — the lookup of last resort.
        postings:
          type: array
          description: Accounting write-backs (PARIS-style) applied for this payment.
          items:
            $ref: '#/components/schemas/Posting'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
          transactionID: PARIS-20260806-00347
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          dateCollected: '2026-08-06T18:26:40Z'
          amount:
            currencyType: USD
            currencyValue: 4.5
          method: card
          paymentStatus: approved
          ticketNumber: T-1001
          cardLast4: '0777'
          postings:
            - confirmationNumber: CONF-88214
              accountUpdated: false
              postedTo: PARIS
              time: '2026-08-06T18:26:41Z'
    Posting:
      title: Posting
      description: An accounting write-back of a payment to a monthly-parking/AR system.
      type: object
      required:
        - confirmationNumber
        - accountUpdated
      properties:
        confirmationNumber:
          type: string
        accountUpdated:
          type: boolean
        newBalance:
          $ref: '#/components/schemas/AmountInCurrency'
        postedTo:
          type: string
          description: Target accounting system identifier (e.g. "paris").
        time:
          $ref: '#/components/schemas/DateTime'
      examples:
        - confirmationNumber: CONF-88214
          accountUpdated: false
          postedTo: PARIS
          time: '2026-08-06T18:26:41Z'
    PaymentLink:
      title: PaymentLink
      description: |-
        A hosted payment link sent to a customer (Part 13 §13.1a) — the
        customer-service payment action of first resort. APX carries the link's
        lifecycle, never card data; the hosted page is the implementer's PCI
        scope.
      type: object
      required:
        - id
        - version
        - place
        - channel
        - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        place:
          description: Site binding (Part 13 §13.5).
          $ref: '#/components/schemas/Reference'
        account:
          description: The account the payment settles (or omit and use ticketNumber).
          $ref: '#/components/schemas/Reference'
        ticketNumber:
          type: string
        session:
          $ref: '#/components/schemas/Reference'
        amount:
          description: Requested amount; omit to charge the current amount due.
          $ref: '#/components/schemas/AmountInCurrency'
        channel:
          type: string
          description: Delivery channel (sms | email | other implementer code list).
          examples:
            - sms
        sentTo:
          type: string
          description: Masked destination (e.g. "+1•••••••4567"). PII-minimized.
        status:
          type: string
          enum:
            - sent
            - opened
            - paid
            - expired
            - cancelled
          readOnly: true
        payment:
          description: The resulting PaymentRecord once paid.
          $ref: '#/components/schemas/Reference'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        correlationId:
          type: string
          format: uuid
        resolutionContext:
          $ref: '#/components/schemas/Reference'
        recordInfo:
          $ref: '#/components/schemas/RecordInfo'
        extensions:
          $ref: '#/components/schemas/Extensions'
      examples:
        - id: e6000000-0000-4000-8000-000000000002
          version: 1
          place:
            id: b1000000-0000-4000-8000-000000000001
            className: Place
          account:
            id: c2000000-0000-4000-8000-000000000004
            className: Account
          amount:
            currencyType: USD
            currencyValue: 185
          channel: sms
          sentTo: +1•••••••4567
          status: sent
          expiresAt: '2026-09-02T22:15:41Z'
          resolutionContext:
            id: e5000000-0000-4000-8000-000000000001
            className: ResolutionContext
          correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    PostingRequest:
      title: PostingRequest
      description: Request body for the accounting write-back of a payment.
      type: object
      properties:
        postedTo:
          type: string
          description: Target accounting system identifier; server default applies when omitted.
          examples:
            - paris
        account:
          description: Account to post against when the payment isn't already account-bound.
          $ref: '#/components/schemas/Reference'
        note:
          type: string
    LprRead:
      title: LprRead
      description: One plate read joined with its ticket/session context.
      type: object
      required:
        - plate
        - place
      properties:
        plate:
          type: string
        place:
          description: |-
            The HierarchyElement (site) where the read occurred. REQUIRED so
            cross-lookups and `apx.data.observation.created.v1` consumers can
            always attribute the read to its location (Part 13 §13.5).
          $ref: '#/components/schemas/Reference'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Overall read accuracy (APDS 4.1 Confidence.overallConfidence). Per-attribute confidences are in `detail`.
        detail:
          $ref: '#/components/schemas/LprReadDetail'
        laneTravel:
          type: string
          enum:
            - withLane
            - againstLane
            - unknown
          readOnly: true
          description: |-
            SERVER-DERIVED (Part 13 §13.3a): whether the vehicle was travelling
            in the lane's configured direction. Derived from `detail.movement`,
            `detail.plateFace`, the camera's configured orientation, and the
            lane's APDS `VehicularAccess.accessType` (entry | exit | reversible).
            `againstLane` is the gateless "entered on the exit lane" signal.
        observation:
          description: The underlying APDS Observation.
          $ref: '#/components/schemas/Reference'
        observationDateTime:
          $ref: '#/components/schemas/DateTime'
        ticketNumber:
          type: string
        session:
          $ref: '#/components/schemas/Reference'
        imageLink:
          description: Screenshot/still of the read (APDS Image).
          $ref: '#/components/schemas/Url'
        recentReservations:
          type: array
          maxItems: 10
          description: |-
            The same customer's last 10 reservations (newest first) — customer
            resolved from the plate via the account registry or the
            reservation's own vehicle credentials.
          items:
            $ref: '#/components/schemas/ReservationSummary'
      examples:
        - plate: RVR-8821
          place:
            id: b1000000-0000-4000-8000-000000000006
            className: Place
          confidence: 0.91
          detail:
            plate:
              value: RVR-8821
              confidence: 0.91
            stateProvince:
              value: IL
              confidence: 0.88
            make:
              value: Ford
              confidence: 0.94
            model:
              value: F-150
              confidence: 0.71
            color:
              value: grey
              confidence: 0.83
            bodyType:
              value: pickup
              confidence: 0.96
            platesRead: 1
            plateFace: rear
            movement: receding
            captureGroup: cam-exit-1/20260921T074108/0417
            engine: vendor-x/7.2
          laneTravel: againstLane
          observation:
            id: f2000000-0000-4000-8000-000000000741
            className: Observation
          observationDateTime: '2026-09-21T07:41:08Z'
          session:
            id: f1000000-0000-4000-8000-000000000741
            className: Session
          imageLink: https://api.riverside-lot.example/lpr/f2000000-741-plate.jpg
          recentReservations: []
    AttributeRead:
      title: AttributeRead
      description: One recognized attribute with its own confidence (0–1, APDS Confidence scale).
      type: object
      required:
        - value
      properties:
        value:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    LprReadDetail:
      title: LprReadDetail
      description: |-
        What a modern LPR camera knows beyond the plate string and one overall
        score (Part 13 §13.3a). Carried on the ingested APDS Observation as the
        Level B decoration `apds-ext:apx:lpr-read@1.0` in its `extensions`
        container (Part 4 §4.3 — plain APDS consumers ignore it), and projected
        on `LprRead.detail` and `PlateCandidate.detail`. Every field optional;
        each recognized attribute carries its own confidence. APDS's
        `vehicleAncillaryIdentification` (country, stateProvince, make, model,
        color) remains the APDS-visible copy of the winning values; this block
        adds the per-attribute confidence, the candidates that lost, and the
        passage geometry APDS has no fields for.
      type: object
      properties:
        plate:
          $ref: '#/components/schemas/AttributeRead'
        country:
          description: Plate issuing country (APDS VehicleAncillaryIdentification.country vocabulary).
          $ref: '#/components/schemas/AttributeRead'
        stateProvince:
          description: Plate issuing state/province (APDS VehicleAncillaryIdentification.stateProvince vocabulary).
          $ref: '#/components/schemas/AttributeRead'
        make:
          $ref: '#/components/schemas/AttributeRead'
        model:
          $ref: '#/components/schemas/AttributeRead'
        color:
          $ref: '#/components/schemas/AttributeRead'
        bodyType:
          description: Implementer vocabulary (sedan, suv, pickup, van, motorcycle…).
          $ref: '#/components/schemas/AttributeRead'
        alternateReads:
          type: array
          description: The other candidate plate strings the engine considered for this capture, best first — kept so a correction (Part 17 §17.5) can pick a loser.
          items:
            type: object
            required:
              - plate
            properties:
              plate:
                type: string
              stateProvince:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
        platesRead:
          type: integer
          minimum: 0
          description: |-
            How many plates of the vehicle the camera read during this passage
            (1 = one plate; 2 = front and rear across frames). Two reads are
            what let the engine call `movement` with confidence.
        plateFace:
          type: string
          enum:
            - front
            - rear
            - unknown
          description: Which plate of the vehicle was read — the vehicle's orientation relative to the camera.
        movement:
          type: string
          enum:
            - approaching
            - receding
            - stopped
            - unknown
          description: The vehicle's motion relative to the camera — coming toward it, going away from it, or stopped.
        captureGroup:
          type: string
          description: Opaque id linking the reads of one passage (front and rear, several frames) so consumers can treat them as one event.
        engine:
          type: string
          description: Recognition engine/vendor identifier, opaque (for confidence calibration downstream).
      examples:
        - plate:
            value: RVR-8821
            confidence: 0.91
          stateProvince:
            value: IL
            confidence: 0.88
          make:
            value: Ford
            confidence: 0.94
          model:
            value: F-150
            confidence: 0.71
          color:
            value: grey
            confidence: 0.83
          bodyType:
            value: pickup
            confidence: 0.96
          platesRead: 1
          plateFace: rear
          movement: receding
          captureGroup: cam-exit-1/20260921T074108/0417
          engine: vendor-x/7.2
    ReservationExtension:
      title: ReservationExtension
