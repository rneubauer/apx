        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRecord'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '201':
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Missing Idempotency-Key or invalid record.
          content:
