  /v1/validations/redemptions:
    post:
      operationId: post-apx-v1-validations-redemptions
      security:
        - apxOAuth:
            - apx.validations:manage
        - apxOAuth:
            - apx.validations:redeem
      tags:
        - Validations
      summary: Record a redemption (idempotent)
      description: |-
        Applies a validation to a ticket/session from a pay station,
        merchant app, or lane device — the data-plane counterpart of the
        Part 6 `applyValidation` command (which agents use to act on a
        lane; it materializes the same resource). `Idempotency-Key`
        REQUIRED. The server evaluates the program rules (Part 20 §20.3):
        422 `program-not-active`, `instrument-invalid`,
        `redemption-limit-exceeded`. On success the session gains the APDS
        `Segment.validationId` and `amountReduced` reflects the ACTUAL
        reduction. Publishes `apx.validations.redeemed.v1`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRedemption'
      responses:
        '200':
          description: Idempotent replay — same key + same body returns the ORIGINAL redemption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRedemption'
        '201':
          description: Redemption applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRedemption'
        '400':
          description: Missing Idempotency-Key or invalid redemption.
