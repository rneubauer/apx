# APX tolling — the one NET-NEW surface (APDS has no toll entities).
# Built to APDS conventions: toll point = SupplementalEquipment ref, toll
# read = native Observation, money = AmountInCurrency, payment = Payment ref.

TollTransaction:
  title: TollTransaction
  description: |-
    A toll charge assembled from plate/transponder reads: Observation refs →
    pricing → Payment ref, with a dispute lifecycle.
  type: object
  required: [id, version, tollPoint, transactionStatus]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    version: { type: integer, minimum: 1, readOnly: true }
    tollPoint:
      description: Reference to the toll point (SupplementalEquipment).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    observations:
      type: array
      description: The underlying APDS Observations (plate/transponder reads).
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    credential:
      type: object
      description: The credential observed (licensePlate, rfid transponder…).
      properties:
        credentialType:
          type: string
          description: |-
            Read technology. Senders SHOULD use an APDS `CredentialTypeEnum`
            value (`licensePlate`, `rfid`, …); Part 15 §15.1.
          examples: [licensePlate, rfid]
        credentialIdentification:
          type: string
          description: What was read — the plate string or the transponder/tag id, as read.
    pricing:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    payment:
      description: Reference to the settling PaymentRecord/APDS Payment.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    transactionStatus:
      type: string
      enum: [created, priced, paid, disputed, resolved, voided]
      readOnly: true
    dispute:
      type: object
      properties:
        reason: { type: string }
        openedTime:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        resolvedTime:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        resolution:
          type: string
          description: |-
            Base values upheld | refunded | adjusted | withdrawn (Part 15
            §15.1); implementers MAY add their own.
        disputedBy:
          description: |-
            The party on whose behalf the dispute was raised (RightHolder,
            Organisation, or Contact); absent for an operator-initiated
            dispute (Part 15 §15.1).
          readOnly: true
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        originalPricing:
          description: |-
            Set by the server when an `adjusted` resolution rewrites
            `pricing`: the amount before the adjustment (Part 15 §15.1).
          readOnly: true
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    statusHistory:
      type: array
      description: Immutable lifecycle audit (Part 4 §4.2).
      items:
        type: object
        required: [state, time, actor]
        properties:
          state: { type: string }
          time:
            $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
          actor: { type: string }
          detail: { type: string }
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

TollPaymentAttachment:
  title: TollPaymentAttachment
  description: Request body attaching the settling Payment to a toll transaction.
  type: object
  required: [payment]
  properties:
    payment:
      description: Reference to the settling APDS Payment (or APX PaymentRecord).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    note: { type: string }

TollDisputeOpen:
  title: TollDisputeOpen
  description: Request body opening a dispute on a toll transaction.
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      description: |-
        Dispute reason. Base values wrongVehicle | duplicateCharge |
        wrongClass | notLiable | other (Part 15 §15.1); implementers MAY
        add their own.
      examples: [wrongVehicle, duplicateCharge]
    detail: { type: string }
    disputedBy:
      description: |-
        The party on whose behalf the operator raises the dispute
        (RightHolder, Organisation, or Contact). MAY be absent for an
        operator-initiated dispute (Part 15 §15.1).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"

TollDisputeResolution:
  title: TollDisputeResolution
  description: Request body resolving an open dispute.
  type: object
  required: [resolution]
  properties:
    resolution:
      type: string
      description: |-
        Resolution. Base values upheld | refunded | adjusted | withdrawn
        (Part 15 §15.1); implementers MAY add their own.
      examples: [refunded]
    adjustedPricing:
      description: |-
        The new amount owed. REQUIRED when `resolution` is `adjusted`
        (otherwise 400 `invalid-request`) and ignored for any other value;
        the server moves the old `pricing` to `dispute.originalPricing`
        (Part 15 §15.1).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    note: { type: string }

TollPricing:
  title: TollPricing
  description: |-
    Request body pricing a `created` toll transaction (Part 15 §15.1), for
    operators whose pricing engine runs outside the APX server.
  type: object
  required: [pricing]
  properties:
    pricing:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    detail:
      type: string
      description: Pricing basis recorded in `statusHistory` (e.g. vehicle class, rate id).

TollVoid:
  title: TollVoid
  description: Request body voiding a toll transaction that should never have been charged (Part 15 §15.1).
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      description: Why the transaction is void (implementer code list, e.g. duplicate, exemptVehicle, misread).
      examples: [duplicate]
    note: { type: string }
