# APX control domain — command plane, lane inquiry, validations, device status.
# Net-new surface: APDS models devices (SupplementalEquipment) but no actuation.

Command:
  title: Command
  description: |-
    A request for an operational action against a lane/device/place.
    Perishable (expiryTime), idempotent (Idempotency-Key), fully audited
    (immutable statusHistory).
  type: object
  required:
    - id
    - version
    - commandType
    - target
    - status
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    version:
      type: integer
      minimum: 1
      readOnly: true
    commandType:
      type: string
      description: definedValue from apx-command-types (vendGate, lostTicket, pushRate, applyValidation, pushNegotiatedRate, matchTicket, …).
      examples: [vendGate]
    target:
      description: |-
        Reference to the target — SupplementalEquipment (device) or a
        VehicularAccess/Place HierarchyElement (lane/place scope).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    parameters:
      type: object
      description: |-
        Command-type-specific parameters. Normative parameter schemas per
        commandType are given in Part 6 (e.g. lostTicket.method,
        pushRate.rateTable VersionedReference, applyValidation.ticket +
        provider, displayMessage.message, setDeviceState.state,
        pushNegotiatedRate.rateTable VersionedReference to a RateTable
        flagged negotiable, matchTicket.session + evidence,
        resetPassback/forceIn/forceOut.credential, courtesyExit.holder).
    requestedBy:
      description: The organisation requesting the action (defaults to the token's apx_org).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    agent:
      type: string
      description: |-
        Opaque principal of the human or AI agent who initiated the command
        (mirrors SupportInteraction.agent, Part 17 §17.6). Distinct from
        requestedBy (the organisation) and from approval.approvedBy (the
        approver). REQUIRED for pushNegotiatedRate and matchTicket (Part 6
        §6.6–6.7): who selected the rate, who made the match.
      examples: ["agent:j.okafor"]
    agentType:
      type: string
      enum: [human, ai]
      description: Whether `agent` is a person or an AI agent (mirrors SupportInteraction.agentType).
    reason:
      type: string
      description: Free-text or code-list reason for the action (audit).
    resolutionContext:
      description: The ResolutionContext this command resolves (Part 17) — links the action into the interaction's audit chain.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    correlationId:
      type: string
      format: uuid
      description: Correlation chain id (Part 17 §17.7) — one id connects call → context → command → events → support interaction.
    approval:
      $ref: "#/Approval"
    expiryTime:
      description: Commands are perishable — MUST NOT be dispatched after this instant.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    priority:
      type: string
      enum: [normal, high]
      default: normal
    status:
      type: string
      enum: [received, accepted, rejected, dispatched, executing, succeeded, failed, expired, cancelled]
      readOnly: true
    confirmationLevel:
      type: string
      enum: [accepted, deviceAcknowledged, physicallyConfirmed]
      readOnly: true
      description: |-
        How far success is actually confirmed (Part 6 §6.1): the command was
        accepted; the device acknowledged it; or the physical outcome was
        verified (e.g. gate-state sensor). Consumers — AI agents especially —
        MUST NOT claim a physical outcome ("the gate is open") beyond this
        level ("the open command was accepted").
    statusHistory:
      type: array
      description: Immutable, append-only lifecycle audit — THE audit trail (Part 4 §4.2).
      items:
        type: object
        required: [state, time, actor]
        properties:
          state: { type: string }
          time:
            $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
          actor: { type: string }
          detail: { type: string }
    result:
      $ref: "#/CommandResult"
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

CommandResult:
  title: CommandResult
  description: |-
    The structured outcome of a command, populated by the server when the
    command reaches `succeeded` (Part 6 §6.1a) and absent before then. Members
    are normative per command type: `lostTicket` → `ticketNumber`, `session`,
    `amountDue`; `matchTicket` → `session`, `amountDue`;
    `pushNegotiatedRate` → `rateTable`, `amountDue`. Other command types
    leave it absent unless a registry entry says otherwise. It restates what
    the lane inquiry shows, so a console can continue (print, take payment)
    without parsing `statusHistory[].detail` or making a second call.
  type: object
  readOnly: true
  properties:
    ticketNumber:
      type: string
      description: The ticket the command issued or bound (lostTicket).
    session:
      description: The APDS Session the ticket belongs to (lostTicket, matchTicket).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    amountDue:
      description: The amount due on the ticket immediately after the command.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    rateTable:
      description: The RateTable at the exact version applied (pushNegotiatedRate).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

Approval:
  title: Approval
  description: |-
    Approval evidence, REQUIRED on a write whose AllowedAction said
    requiresApproval (Part 17 §17.3). Servers MUST reject a
    requires-approval action without it (403 approval-required). One shared
    shape for control commands and domain actions (e.g. refunds).
  type: object
  required: [approvedBy]
  properties:
    approvedBy:
      type: string
      description: The approving principal (role per AllowedAction.approvalRole).
    approvedAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    note:
      type: string

DeviceStatus:
  title: DeviceStatus
  description: |-
    Live state overlay keyed by Reference to an APDS SupplementalEquipment —
    never duplicates its descriptive fields. deviceState values mirror the
    RefillPointStatusEnum style (registry apx-device-states). Attachable to
    APDS payloads as apds-ext:apx:devicestatus@1.0.
  type: object
  required:
    - device
    - deviceState
  properties:
    device:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    deviceState:
      type: string
      description: definedValue from apx-device-states.
      examples: [available]
    lastCommunication:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    stateChangedTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

LaneStatus:
  title: LaneStatus
  description: |-
    The transaction context at a lane right now (the call-center
    screen-pop). Composes APDS references and data; adds no
    parallel entities.
  type: object
  required:
    - lane
  properties:
    lane:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    currentTicket:
      type: object
      description: The ticket/credential currently in the machine, if any.
      properties:
        ticketNumber: { type: string }
        session:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        issuedTime:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        amountDue:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
        paidInFull: { type: boolean }
        validations:
          type: array
          items:
            type: object
            properties:
              provider:
                $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
              providerName:
                type: string
                description: Human-readable vendor name (from the place's ValidationProvider list).
              validationType:
                type: string
                description: The provider's validation type at time of application.
              validationId:
                type: string
                description: Unique id of this applied validation — maps to APDS Segment.validationId.
              amountReduced:
                description: The ACTUAL value this validation removed from the amount due (dispute evidence).
                $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
              appliedTime:
                $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        lpr:
          type: object
          description: Latest plate read at this lane (APDS Observation-derived).
          properties:
            plate: { type: string }
            confidence: { type: number }
            observation:
              $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
            imageLink:
              $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
        negotiatedRate:
          type: object
          description: |-
            The negotiated rate in effect on this ticket, if a
            pushNegotiatedRate command succeeded for it (Part 6 §6.6). Absent
            when the ticket prices from the lane's normal rate deck.
          required: [rateTable, command]
          properties:
            rateTable:
              description: The RateTable selected (VersionedReference — the exact version applied).
              $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
            command:
              description: The pushNegotiatedRate Command that applied it — carries `agent`, `reason`, and the audit trail.
              $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
            agent:
              type: string
              description: The principal who selected the rate (copied from the command for the screen-pop).
            policy:
              description: The table's `apds-ext:apx:ratepolicy@1.0` decoration as it stood when applied (its displayName is what the agent saw).
              $ref: "#/RatePolicy"
        matchedCommand:
          description: |-
            When this ticket was bound to an open session by a matchTicket
            command (Part 6 §6.7), the Command that made the match — carries
            `agent`, `parameters.evidence`, and the audit trail. Absent for a
            ticket physically inserted at the lane.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    matchCandidates:
      type: array
      description: |-
        Open sessions at this lane's place that plausibly belong to the
        vehicle in the lane, best first (Part 6 §6.7). Computed when the lane
        has no ticket in the machine, or whenever the caller passes a
        `plate`, `phone`, or `credential` lookup parameter. ADVISORY: the
        agent confirms with the driver; the server never binds a candidate
        without a matchTicket command.
      items:
        $ref: "#/MatchCandidate"
    monthlyCredential:
      type: object
      description: Monthly-parker credential context at the lane, if presented.
      properties:
        credential:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        cardNumber: { type: string }
        accessGranted: { type: boolean }
        denialReason: { type: string }
        lastActivity:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        recentEvents:
          type: array
          maxItems: 10
          description: The last 10 activity events on this credential (trend view).
          items:
            type: object
            properties:
              time:
                $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
              event: { type: string }
              lane:
                $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"

ValidationProvider:
  title: ValidationProvider
  description: A venue/organisation allowed to validate tickets at a place.
  type: object
  required:
    - provider
  properties:
    provider:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    name: { type: string }
    program:
      description: |-
        The ValidationProgram this row is derived from, when the server
        claims `apx-validations` (Part 20) — additive; absent otherwise.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    validationType:
      type: string
      description: e.g. flat discount, hours comped — implementer code list.
    benefit:
      type: object
      description: |-
        What the validation is WORTH — disclosed in the lookup so agents can
        answer disputes. Exactly one of amount (money off) or duration
        (comped time, priced at the applicable rate) applies.
      required: [description]
      properties:
        description:
          type: string
          description: Human-readable statement of the benefit.
          examples: ["$3.00 off", "First two hours comped"]
        amount:
          description: Fixed money off.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
        duration:
          description: Comped parking time (ISO 8601), valued at the applicable rate.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Duration"

RatePolicy:
  title: RatePolicy
  description: |-
    Level B decoration on an APDS RateTable, carried in its `extensions`
    container as `apds-ext:apx:ratepolicy@1.0` (Part 6 §6.6). APDS models
    the rate deck completely; it has no way to say which tables an agent
    may offer as a negotiated rate. This is that flag — and because it
    rides inside the RateTable, every consumer mirroring the deck through
    the native `/rates` route (Part 5 §5.2) receives it with the table, no
    second query. APX deliberately defines NO selection rules here (length
    of stay, time of day, caller type): the system presenting the deck to
    an agent or a third party applies its own guardrails. The server's only
    rule is enforcement — a pushNegotiatedRate naming a table that is not
    flagged negotiable is refused (422 rate-not-negotiable).
  type: object
  required: [negotiable]
  properties:
    negotiable:
      type: boolean
      description: Whether this RateTable MAY be selected by a pushNegotiatedRate command.
    displayName:
      type: string
      description: Short agent-facing label for the table when offered as a negotiated rate (e.g. "Customer-service flat $20").
    note:
      type: string
      description: Free-text guidance for the presenting system or agent. Informative — never evaluated by the server.

MatchCandidate:
  title: MatchCandidate
  description: |-
    An open session at the place that plausibly belongs to the vehicle in
    the lane (Part 6 §6.7). Produced by the lane inquiry from the lane's
    own LPR read, a presented credential, the account registry (by plate
    or phone), or a checked-in reservation. Composes APDS references; adds
    no parallel session store. Advisory until a matchTicket command binds
    one.
  type: object
  required: [session, matchedBy, confidence]
  properties:
    session:
      description: The open APDS Session this candidate proposes.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    ticketNumber:
      type: string
      description: The entry ticket number, if a ticket was issued at entry.
    entryTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    entryLane:
      description: The VehicularAccess the session entered through.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    plate:
      type: string
      description: The plate recorded on the session at entry, if any.
    matchedBy:
      type: string
      enum: [plateRead, credential, account, reservation]
      description: |-
        How this candidate was found: the lane's LPR read against the entry
        read (plateRead); a credential presented at the lane (credential);
        the account registry by plate or phone (account); a checked-in
        reservation carrying the plate (reservation).
    evidence:
      description: |-
        The record that produced the match — the entry Observation, the
        Credential, the RightHolder account, or the AssignedRight — so the
        agent can show it and the matchTicket command can cite it.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: Server's confidence that this is the vehicle in the lane (a plate-read match projects APDS Confidence.overallConfidence).
    amountDueIfMatched:
      description: What the exit would price at from this session's true entry time — so the agent can tell the driver before matching.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    imageLink:
      description: The entry image, for visual confirmation (access-controlled per Part 9 §9.6).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
