# APX reservations & permits — THIN PROFILES over APDS native machinery.
# Reservations: quote via /quotes, book = POST /rights/assigned, amend/cancel
# via native PUT/DELETE. Permits: RightSpecification + RightPool + Credential.

ReservationExtension:
  title: ReservationExtension
  description: |-
    The apds-ext:apx:reservation@1.0 extension object attached to a native
    AssignedRight. Presence of this extension marks the AssignedRight as a
    reservation; state transitions follow Part 14 §14.1 (transition
    table). `plannedStart`/`plannedEnd` MUST mirror the AssignedRight's
    `plannedUses[0].startTime`/`endTime`, which is authoritative.
  type: object
  required: [reservationState]
  properties:
    reservationState:
      type: string
      enum: [confirmed, amended, cancelled, checkedIn, noShow]
    plannedStart:
      description: Mirror of `plannedUses[0].startTime` (Part 14 §14.1).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    plannedEnd:
      description: Mirror of `plannedUses[0].endTime` (Part 14 §14.1).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    checkInSession:
      description: Set when a Session referencing this AssignedRight is created.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    noShowAfter:
      description: |-
        SERVER-SET: the instant after which a reservation still without a
        check-in transitions to `noShow` (`plannedStart` plus the
        operator's grace period, Part 14 §14.1 step 6), so a platform can
        tell a customer when the booking lapses. Clients do not send it.
      readOnly: true
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"

ReservationSummary:
  title: ReservationSummary
  description: |-
    Compact view of one past/current reservation, for customer-history
    lookups. Also the `data` of `apx.reservation.noshow.v1` (Part 14
    §14.1 step 6).
  type: object
  required: [reservation]
  properties:
    reservation:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    reservationState:
      type: string
      enum: [confirmed, amended, cancelled, checkedIn, noShow]
    plannedStart:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    plannedEnd:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    noShowAfter:
      description: When a reservation not yet checked in lapses to `noShow` (see ReservationExtension.noShowAfter).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"

PoolAvailability:
  title: PoolAvailability
  description: |-
    Availability of one RightPool of a pooled RightSpecification (APDS
    RightPool profile, Part 14 §14.2). `issued` =
    `RightPool.distributedAssignedRights`, `available` =
    `RightPool.availableAssignedRights`, `capacity` = their sum.
  type: object
  required: [rightSpecification, capacity, issued, available]
  properties:
    rightSpecification:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
    pool:
      description: The RightPool these counts are for (selected per Part 14 §14.2).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
    validity:
      description: The selected pool's validity window (APDS `RightPool.validity`), when it has one.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Validity"
    capacity:
      type: integer
      minimum: 0
      description: Permits the pool can issue in total (`issued` + `available`); may exceed `spaces` when the operator oversells.
    issued: { type: integer, minimum: 0 }
    available: { type: integer, minimum: 0 }
    spaces:
      type: integer
      minimum: 0
      description: Physical spaces behind the pool, when the operator sells above that count. Informative.

PermitIssueRequest:
  title: PermitIssueRequest
  description: |-
    Issue a permit from a pooled RightSpecification — creates a native
    AssignedRight with (possibly multiple) vehicle credentials, per the APDS
    annual-permit use case (one right, multiple vehicles).
  type: object
  required: [rightSpecification, holder]
  properties:
    rightSpecification:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
    holder:
      description: |-
        The RightHolder the permit is issued to; materialized as a
        `CustomerCredential` on the AssignedRight (Part 14 §14.2).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    credentials:
      type: array
      description: |-
        Vehicle credentials (e.g. plates) usable under this one permit; each
        is materialized as a `VehicleCredential` (Part 14 §14.2).
      items:
        type: object
        properties:
          credentialType:
            type: string
            description: |-
              An APDS `CredentialTypeEnum` value, which MUST also be in the
              RightSpecification's `credentials` allow-list (Part 14 §14.2).
            examples: [licensePlate]
          credentialIdentification:
            type: string
            description: What the lane reads — the plate string, tag id, or card number.
    validity:
      type: object
      description: |-
        The permit's validity window; materialized as one `PlannedUse`
        (`startTime`/`endTime`) and `expiry` = `end` (Part 14 §14.2).
      properties:
        start:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        end:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    extensions:
      description: |-
        Extension container (Part 4 §4.3). `apds-ext:apx:permit@1.0` links
        a renewal to the permit it renews (Part 14 §14.2).
      allOf:
        - $ref: "../common/schemas.yaml#/Extensions"
        - type: object
          properties:
            "apds-ext:apx:permit@1.0":
              $ref: "#/PermitExtension"

PermitExtension:
  title: PermitExtension
  description: |-
    The `apds-ext:apx:permit@1.0` extension object (Part 14 §14.2): links a
    renewal permit to the one it renews, so a portal can follow the chain.
  type: object
  properties:
    renews:
      description: The AssignedRight this permit renews.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    renewedBy:
      description: Set by the server on the renewed permit when a renewal is issued.
      readOnly: true
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
