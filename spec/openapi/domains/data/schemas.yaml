# APX data profile — schemas and parameters layered ONTO the native APDS routes.
# The routes themselves are the vendored APDS 4.1 paths, mounted verbatim in apx.yaml.

ChangeFeedPage:
  title: ChangeFeedPage
  description: |-
    Response of a native APDS list route when called with `mode=change`.
    Items are VERBATIM APDS entities carrying only changed fields plus
    identity (change semantics per Part 5: explicit null = clear the field,
    absent = unchanged — generalizing APDS Use Case C.1.1.6). Deletions are
    APDS DeletedReferences (tombstones).
  type: object
  required:
    - publicationTime
    - updateMode
    - items
    - cursor
  properties:
    publicationTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    publisher:
      description: The publishing Organisation.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    updateMode:
      type: string
      const: change
    items:
      type: array
      description: |-
        Changed APDS entities of the route's class, each a change payload
        (identity plus only the changed members; Part 5 §5.1).
      items:
        $ref: "#/ChangePayload"
    deleted:
      type: array
      description: Tombstones for deleted entities.
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DeletedReference"
    cursor:
      type: string
      description: Opaque cursor to resume AFTER the last change in this page.
    grantAdditions:
      type: array
      description: |-
        Present on the first page served after the credential's apx_places
        grant gained subtrees (Part 5 §5.2 rule 7): the new subtree roots.
        The client MUST full-sync these subtrees before relying on the
        feed for them — the cursor does not retroactively cover their
        history.
      items:
        type: string
        format: uuid
    next:
      type: [string, "null"]
      format: uri-reference
      description: Link to the next page when more changes are immediately available; null otherwise.

ChangePayload:
  title: ChangePayload
  description: |-
    A change-mode payload for any native APDS entity class (Part 5 §5.1):
    the entity's identity plus only the members that changed. An absent
    member is unchanged; an explicit `null` clears it. Nested objects that
    carry their own `id` (a Session segment, say) follow the same rule.

    This schema checks the envelope only (identity present, any member may
    be null). Each member present is still validated by the server against
    the class's native property schema, and a member the class does not
    define is refused with 400 (Part 5 §5.1a). It is the request schema of
    a native `PUT` sent with `APX-Update-Mode: change`, and the shape of
    every `ChangeFeedPage` item.
  type: object
  required:
    - id
  properties:
    id:
      type: string
      minLength: 1
      description: The entity's identifier (APDS VersionedIdentity.id).
    version:
      type: integer
      minimum: 1
      description: |-
        On a write, the version the client last read (the precondition,
        Part 4 §4.2a); on a feed item, the version after the change.
  additionalProperties: true

OccupancySnapshot:
  title: OccupancySnapshot
  description: |-
    Current occupancy for one HierarchyElement, computed from the APDS
    occupancy model (Supply + DemandTable) that natively lives in the Place
    hierarchy. A convenience READ (Part 5 §5.5): the Place payload remains
    the source of truth; this answers "how full is it right now" without
    pulling the hierarchy. Composed entirely of verbatim APDS occupancy
    classes — APX adds no parallel occupancy datatypes.
  type: object
  required:
    - place
    - computedAt
  properties:
    place:
      description: The HierarchyElement (Place, Level, Area, …) this snapshot describes.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    computedAt:
      description: When this snapshot was computed.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    supply:
      description: The element's supply (verbatim APDS Supply).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Supply"
    demand:
      description: |-
        The latest area demand record (verbatim APDS DemandType — count,
        percentage, occupancyCalculation, recordDateTime).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DemandType"
    available:
      type: [integer, "null"]
      minimum: 0
      description: |-
        Convenience derivation: supply.supplyQuantity − demand.count when
        both are known; null when either side is unknown. Never negative —
        overfull facilities clamp to 0 (the demand record still shows the
        true count).
      examples: [59]
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

SessionDetail:
  title: SessionDetail
  description: |-
    What the pairing of reads into a stay decided, carried on the APDS
    Session as the Level B decoration `apds-ext:apx:session-detail@1.0`
    (Part 5 §5.8). APDS Session has no member for the reads behind it, why
    or how it ended, how its links were made, or the visit it is part of;
    this block adds them, written with the native Session `POST`/`PUT`
    (Part 5 §5.3) by whoever pairs the reads — the server itself or a
    separate client. Every member is optional; a plain APDS consumer
    ignores the block.
  type: object
  properties:
    reads:
      type: array
      description: |-
        The reads (Observations) behind this Session, each with its role
        (Part 5 §5.8 rule 1). A read appears at most once. Where the server
        claims `apx-lpr`, `LprRead.session` and `GET /v1/lpr/reads?session=`
        are derived from this list (Part 13 §13.3a(6)).
      items:
        $ref: "#/SessionReadBinding"
    lifecycle:
      type: string
      enum: [open, ended, final, disputed]
      description: |-
        Where the Session is in its life (Part 5 §5.8 rule 2): `open` — no
        `actualEnd` yet; `ended` — `actualEnd` set, the pairing may still
        revise it; `final` — no further revision is expected; `disputed` —
        the stay or its charge is contested and may change. Every state
        but `open` requires `actualEnd`.
    closure:
      $ref: "#/SessionClosure"
    matches:
      type: array
      description: |-
        How each link from this Session to another record was established
        and how sure it is (Part 5 §5.9): the AssignedRight that covers
        it, a ValetTicket, a Violation, the exit read paired to it.
      items:
        $ref: "#/MatchEvidence"
    parent:
      description: |-
        For a stay in a nested area (Part 5 §5.8 rule 4): the Session of
        the visit it is part of. The parent's `hierarchyElement` MUST be
        an ancestor of this Session's. A Session with `parent` is not a
        visit and is never counted as one.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    passThrough:
      type: boolean
      description: |-
        True for an area stay shorter than the area's minimum dwell — the
        vehicle passed through the area rather than parked in it. Only
        meaningful with `parent`. Consumers MUST NOT score such a stay for
        compliance or occupancy.

SessionReadBinding:
  title: SessionReadBinding
  description: One read bound to a Session, with the part it plays in the stay (Part 5 §5.8 rule 1).
  type: object
  required: [observation, role]
  properties:
    observation:
      description: The read — an APDS ObservationElement.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    role:
      type: string
      enum: [entry, exit, duplicate, activity]
      description: |-
        `entry` — the read that opened the stay; `exit` — the read that
        closed it; `duplicate` — the same passage seen again (another
        camera, another frame, another plate of the vehicle); `activity` —
        the vehicle seen inside during the stay (a patrol or inventory
        sweep).
    representative:
      type: boolean
      description: |-
        True on the one read a consumer should show for the Session (the
        clearest plate image). At most one read per Session carries it.

SessionClosure:
  title: SessionClosure
  description: |-
    Why and how a Session ended, and which of its times were observed
    (Part 5 §5.8 rule 3).
  type: object
  properties:
    endReason:
      type: string
      description: |-
        Why the Session ended — definedValue from `apx-session-end-reasons`
        (exitRead | reentry | stale | parentExit | areaLeft |
        inventorySweep | valetHandback | exitOnly | operator | review).
      examples: [exitOnly]
    startObserved:
      type: boolean
      description: |-
        False when no entry was seen and `actualStart` is a placeholder the
        APDS schema requires (an exit-only Session SHOULD set it equal to
        `actualEnd`). Absent means true.
    endObserved:
      type: boolean
      description: |-
        False when `actualEnd` was set by rule or inference (a stale
        closure, a sweep that found the space empty) rather than taken
        from a read. Absent means true.
    rule:
      type: string
      description: |-
        The implementation's own name for the rule that closed the
        Session, when `endReason` is `stale` (for example a
        48-hour transient limit). Opaque to APX.
      examples: [transient-48h]

MatchEvidence:
  title: MatchEvidence
  description: |-
    How one link between a Session and another record was established, and
    how sure it is (Part 5 §5.9). An item of `SessionDetail.matches[]`, and
    the Level B decoration `apds-ext:apx:match-evidence@1.0` on a Violation
    (for `relatedSession`) and on a ValetTicket (for `session`). Carries no
    plate characters and no make, model, or colour values (Part 9 §9.6):
    the evidence is about the comparison, not the vehicle.
  type: object
  required: [target, matchType, applied]
  properties:
    target:
      description: |-
        The record at the other end of the link: in `SessionDetail.matches[]`
        the AssignedRight, ValetTicket, Violation, or Observation; in the
        decoration on a Violation or ValetTicket, the Session.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    matchType:
      type: string
      enum: [right, valet, violation, exitRead, sweep, other]
      description: |-
        The kind of link: `right` — an AssignedRight covers the stay;
        `valet` — a ValetTicket's stay; `violation` — a Violation's stay;
        `exitRead` — an exit read paired to the Session's entry; `sweep` —
        a vehicle seen during an inventory sweep tied to the Session;
        `other` — anything else.
    plate:
      type: object
      description: How the plates agreed, when the link rests on a plate.
      required: [method]
      properties:
        method:
          type: string
          enum: [exact, alias, fold, fuzzy, lenient, reviewer]
          description: |-
            `exact` — the same characters; `alias` — a plate the right or
            account lists as an alternate for the same vehicle; `fold` —
            the same after folding look-alike characters (O/0, I/1, B/8);
            `fuzzy` — within the implementation's edit-cost threshold;
            `lenient` — accepted under a relaxed rule that may excuse a
            stay but never accuse one (Part 5 §5.9 rule 2); `reviewer` — a
            person judged the plates to match where no automatic method
            did.
        editCost:
          type: [number, "null"]
          minimum: 0
          description: The weighted edit cost between the two plates, for `fuzzy` and `lenient`; null or absent otherwise.
        jurisdiction:
          type: string
          enum: [agrees, differs, unknown]
          description: Whether the plates' issuing state or province agreed.
    vehicle:
      type: object
      description: |-
        What the vehicle's other attributes (make, model, colour, body)
        said about the match, when compared.
      required: [level]
      properties:
        level:
          type: string
          enum: [unknown, mismatch, inconclusive, weak, good, strong]
          description: |-
            `unknown` — not compared; `mismatch` — the attributes
            contradict the match; `inconclusive` — compared, no signal;
            `weak`, `good`, `strong` — increasing support.
        llr:
          type: number
          description: The log-likelihood ratio behind `level`, when the implementation computes one.
        model:
          type: string
          description: The implementation's identifier for the scoring model and version. Opaque to APX.
    applied:
      type: boolean
      description: |-
        False for a shadow match — recorded for evaluation, not acted on.
        A link the record actually carries has `applied: true`.
    decidedBy:
      type: string
      enum: [system, person]
      description: Whether software or a person made the link.
    decidedTime:
      description: When the link was made.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"

# --- Reusable additive parameters (applied by implementations to native list routes) ---

ModeParam:
  name: mode
  in: query
  required: false
  description: |-
    APX data profile: `full` (default — behaves exactly like stock APDS 4.1)
    or `change` (return a ChangeFeedPage of deltas since `cursor`/`since`).
  schema:
    type: string
    enum: [full, change]
    default: full

CursorParam:
  name: cursor
  in: query
  required: false
  description: Opaque change-feed cursor from a previous ChangeFeedPage. Only meaningful with `mode=change`.
  schema:
    type: string

# NOTE: there is deliberately no APX "since" parameter — APDS 4.1 natively
# provides `modified_since` on list routes (returning `deletedReferences`
# tombstones in PaginatedList). APX reuses it as the coarse fallback.
