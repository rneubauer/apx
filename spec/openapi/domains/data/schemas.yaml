# APX data profile — schemas and parameters layered ONTO the native APDS routes.
# The routes themselves are the vendored APDS 4.1 paths, mounted verbatim in apx.yaml.

ChangeFeedPage:
  title: ChangeFeedPage
  description: |-
    Response of a native APDS list route when called with `mode=change`.
    Items are VERBATIM APDS entities carrying only changed fields plus
    identity (change semantics per Part 5: explicit null = clear the field,
    absent = unchanged — generalizing APDS Use Case C.1.1.6). Deletions are
    APDS DeletedReferences (tombstones).
  type: object
  required:
    - publicationTime
    - updateMode
    - items
    - cursor
  properties:
    publicationTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    publisher:
      description: The publishing Organisation.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    updateMode:
      type: string
      const: change
    items:
      type: array
      description: |-
        Changed APDS entities of the route's class, each a change payload
        (identity plus only the changed members; Part 5 §5.1).
      items:
        $ref: "#/ChangePayload"
    deleted:
      type: array
      description: Tombstones for deleted entities.
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DeletedReference"
    cursor:
      type: string
      description: Opaque cursor to resume AFTER the last change in this page.
    grantAdditions:
      type: array
      description: |-
        Present on the first page served after the credential's apx_places
        grant gained subtrees (Part 5 §5.2 rule 7): the new subtree roots.
        The client MUST full-sync these subtrees before relying on the
        feed for them — the cursor does not retroactively cover their
        history.
      items:
        type: string
        format: uuid
    next:
      type: [string, "null"]
      format: uri-reference
      description: Link to the next page when more changes are immediately available; null otherwise.

ChangePayload:
  title: ChangePayload
  description: |-
    A change-mode payload for any native APDS entity class (Part 5 §5.1):
    the entity's identity plus only the members that changed. An absent
    member is unchanged; an explicit `null` clears it. Nested objects that
    carry their own `id` (a Session segment, say) follow the same rule.

    This schema checks the envelope only (identity present, any member may
    be null). Each member present is still validated by the server against
    the class's native property schema, and a member the class does not
    define is refused with 400 (Part 5 §5.1a). It is the request schema of
    a native `PUT` sent with `APX-Update-Mode: change`, and the shape of
    every `ChangeFeedPage` item.
  type: object
  required:
    - id
  properties:
    id:
      type: string
      minLength: 1
      description: The entity's identifier (APDS VersionedIdentity.id).
    version:
      type: integer
      minimum: 1
      description: |-
        On a write, the version the client last read (the precondition,
        Part 4 §4.2a); on a feed item, the version after the change.
  additionalProperties: true

OccupancySnapshot:
  title: OccupancySnapshot
  description: |-
    Current occupancy for one HierarchyElement, computed from the APDS
    occupancy model (Supply + DemandTable) that natively lives in the Place
    hierarchy. A convenience READ (Part 5 §5.5): the Place payload remains
    the source of truth; this answers "how full is it right now" without
    pulling the hierarchy. Composed entirely of verbatim APDS occupancy
    classes — APX adds no parallel occupancy datatypes.
  type: object
  required:
    - place
    - computedAt
  properties:
    place:
      description: The HierarchyElement (Place, Level, Area, …) this snapshot describes.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    computedAt:
      description: When this snapshot was computed.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    supply:
      description: The element's supply (verbatim APDS Supply).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Supply"
    demand:
      description: |-
        The latest area demand record (verbatim APDS DemandType — count,
        percentage, occupancyCalculation, recordDateTime).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DemandType"
    available:
      type: [integer, "null"]
      minimum: 0
      description: |-
        Convenience derivation: supply.supplyQuantity − demand.count when
        both are known; null when either side is unknown. Never negative —
        overfull facilities clamp to 0 (the demand record still shows the
        true count).
      examples: [59]
    evCharging:
      type: object
      description: |-
        Part 23 §23.7 — charging availability under this
        element, derived from ChargingPointStatus. Optional; present only
        when the implementation claims `apx-charging`.
        Counts are of charging points (APDS ElectricChargingEquipment),
        not connectors. Absent counts are unknown, never guessed.
      properties:
        pointsTotal:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
          description: "Points with `availability: available`."
        charging:
          type: integer
          minimum: 0
        occupiedNotCharging:
          type: integer
          minimum: 0
          description: Points `occupied` (cable connected, no energy) — includes complete and idle sessions.
        blocked:
          type: integer
          minimum: 0
          description: Points whose bay holds a vehicle that is not plugged in, or is obstructed.
        inoperative:
          type: integer
          minimum: 0
          description: Points `inoperative` or `outOfOrder`.
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

OccupancyHistoryPage:
  title: OccupancyHistoryPage
  description: |-
    Occupancy per clock interval for one HierarchyElement (Part 5 §5.5a):
    the history behind the §5.5 snapshot, derived from the APDS
    DemandTable records the implementation holds. Buckets are aligned to
    the interval boundary in the place's time zone; a bucket with no
    demand record carries no counts, never a guess.
  type: object
  required: [place, interval, from, to, buckets]
  properties:
    place:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    interval:
      description: The bucket length as requested (ISO 8601 duration, e.g. `PT1H`).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Duration"
    from:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    to:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    buckets:
      type: array
      items:
        type: object
        required: [start]
        properties:
          start:
            $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
          maxCount:
            type: integer
            minimum: 0
            description: The highest demand count recorded in the bucket.
          avgCount:
            type: number
            minimum: 0
            description: The time-weighted mean demand count over the bucket.
          supplyQuantity:
            type: integer
            minimum: 0
            description: The supply in force during the bucket (APDS Supply.supplyQuantity).
          samples:
            type: integer
            minimum: 0
            description: How many demand records the bucket is computed from.
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

SessionReadBinding:
  title: SessionReadBinding
  description: |-
    One LPR read attached to a Session by the pairing engine (Part 5
    §5.8, member `reads[]` of `apds-ext:apx:session-detail@1.0`).
  type: object
  required: [observation, role]
  properties:
    observation:
      description: The APDS ObservationElement (className `ObservationElement`).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    role:
      type: string
      enum: [entry, exit, duplicate, activity]
      description: |-
        `entry` and `exit` are the passages that opened and closed the
        visit; `duplicate` is the same passage seen by another camera or
        frame; `activity` is the vehicle seen inside (a sweep, a bay camera).
    representative:
      type: boolean
      description: The read that stands for the visit in lists and screen-pops (at most one per Session).

SessionClosure:
  title: SessionClosure
  description: Why and how a Session ended (Part 5 §5.8).
  type: object
  properties:
    endReason:
      type: string
      description: definedValue from `apx-session-end-reasons` (Part 11) or an implementer code list.
      examples: [exitRead]
    endInferred:
      type: boolean
      description: True when `actualEnd` was set by a rule rather than observed.
    startObserved:
      type: boolean
      description: |-
        False declares `actualStart` synthetic — an exit-only Session whose
        entry was never observed. Consumers MUST exclude such Sessions from
        dwell statistics (Part 5 §5.8).
    rule:
      type: [string, "null"]
      description: The implementer rule that closed a `stale` Session (e.g. `transient-48h`); null when none applied.

MatchEvidence:
  title: MatchEvidence
  description: |-
    How a link to a Session was established and how sure it is (Part 5
    §5.8; shared by the `matches[]` member of
    `apds-ext:apx:session-detail@1.0` and the decoration
    `apds-ext:apx:match-evidence@1.0` on a Violation or ValetTicket).
    Carries no plate characters and no vehicle attribute values
    (Part 9 §9.6).
  type: object
  required: [target, matchType]
  properties:
    target:
      description: What the Session was matched to — an AssignedRight, a ValetTicket, a Violation, a PlateListEntry, an Observation.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    matchType:
      type: string
      description: Open — `right`, `valet`, `violation`, `list`, `exitPairing`, `sweep`, or an implementer value.
      examples: [right]
    plate:
      type: object
      description: How the plate strings agreed.
      properties:
        method:
          type: string
          enum: [exact, alias, fold, fuzzy, lenient, reviewer]
        editCost:
          type: [number, "null"]
          minimum: 0
          description: The weighted edit cost of a `fuzzy` or `lenient` match; null otherwise.
        jurisdiction:
          type: string
          enum: [agrees, differs, unknown]
    vehicle:
      type: object
      description: The vehicle-attribute evidence (make, model, colour) behind the match, as a level and a score — never the values.
      properties:
        level:
          type: string
          enum: [unknown, mismatch, inconclusive, weak, good, strong]
        llr:
          type: number
          description: Log-likelihood ratio of the vehicle evidence.
        model:
          type: string
          description: The evidence model and version that scored it, opaque.
    applied:
      type: boolean
      description: False is a shadow match — recorded, not acted on.
    decidedBy:
      type: string
      description: "`system`, `reviewer`, or an opaque principal."
    decidedTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"

SessionDetail:
  title: SessionDetail
  description: |-
    The `apds-ext:apx:session-detail@1.0` decoration on an APDS Session
    (Part 5 §5.8): what an external pairing engine decided and APDS has no
    members for — the reads behind the visit, why and how it ended, the
    matches it rests on, and the parent visit of an area Session. Written
    with the native Session POST/PUT; a plain APDS client ignores it.
  type: object
  properties:
    reads:
      type: array
      description: |-
        The reads attached to this Session. A read already bound as
        `entry` or `exit` to another Session of the same place is refused
        with 409 `read-already-bound` unless `supersedes` names that Session.
      items:
        $ref: "#/SessionReadBinding"
    supersedes:
      description: The Session whose reads this write takes over (a re-pairing).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    lifecycle:
      type: string
      enum: [open, ended, final, disputed]
      description: |-
        `open` — a vehicle is in the facility; `ended` — closed, may still
        be revised; `final` — no further revision expected; `disputed` —
        under review.
    closure:
      $ref: "#/SessionClosure"
    flags:
      type: array
      description: Open flags — `entryUnknown`, `orphanExit`, `reentry`, `passThrough`, or implementer values.
      items: { type: string }
    matches:
      type: array
      items:
        $ref: "#/MatchEvidence"
    parent:
      description: |-
        The visit this area Session is part of (className `Session`). A
        Session with `parent` MUST have a `hierarchyElement` inside the
        parent's; consumers count visits by Sessions without `parent`.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    passThrough:
      type: boolean
      description: An area stay shorter than the area's minimum dwell — never scored or billed.

# --- Reusable additive parameters (applied by implementations to native list routes) ---

ModeParam:
  name: mode
  in: query
  required: false
  description: |-
    APX data profile: `full` (default — behaves exactly like stock APDS 4.1)
    or `change` (return a ChangeFeedPage of deltas since `cursor`/`since`).
  schema:
    type: string
    enum: [full, change]
    default: full

CursorParam:
  name: cursor
  in: query
  required: false
  description: Opaque change-feed cursor from a previous ChangeFeedPage. Only meaningful with `mode=change`.
  schema:
    type: string

# NOTE: there is deliberately no APX "since" parameter — APDS 4.1 natively
# provides `modified_since` on list routes (returning `deletedReferences`
# tombstones in PaginatedList). APX reuses it as the coarse fallback.
