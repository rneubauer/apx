# APX LPR domain — optional conformance class apx-lpr.
# A pure PROFILE over APDS Observation/Confidence/Image: reads are stored and
# ingested as native Observations (POST /observations); this adds the
# bidirectional plate↔ticket cross-lookup.

LprRead:
  title: LprRead
  description: One plate read joined with its ticket/session context.
  type: object
  required: [plate, place]
  properties:
    plate: { type: string }
    place:
      description: |-
        The HierarchyElement (site) where the read occurred. REQUIRED so
        cross-lookups and `apx.data.observation.created.v1` consumers can
        always attribute the read to its location (Part 13 §13.5).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: Overall read accuracy (APDS 4.1 Confidence.overallConfidence). Per-attribute confidences are in `detail`.
    detail:
      $ref: "#/LprReadDetail"
    laneTravel:
      type: string
      enum: [withLane, againstLane, unknown]
      readOnly: true
      deprecated: true
      description: |-
        DEPRECATED since 0.12.0, removed at 1.0. APX no longer derives
        direction; use `detail.accessEvent` (entry | exit), which the LPR
        system reports (Part 13 §13.3a(4)). Servers SHOULD return `unknown`.
    observation:
      description: The underlying APDS Observation.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    observationDateTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    ticketNumber: { type: string }
    session:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    imageLink:
      description: |-
        Screenshot/still of the read (APDS Image). Absent when no image was
        taken or the imagery has been purged (see `purgedImagery`). The
        preferred still; every unpurged image is in `images[]`.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
    images:
      type: array
      description: |-
        Every unpurged image of the read (Part 13 §13.3c), by kind:
        the APDS `ImageTypeEnum` values plus `plateExtended` (a wider crop
        around the plate) and `context` (the scene around the vehicle,
        wider than the overview), carried as `imageType` strings until
        APDS adds them. Same access and purge rules as `imageLink`.
      items:
        type: object
        required: [id]
        properties:
          id:
            type: string
            description: The APDS Image id.
          imageType:
            type: string
            description: "`overview`, `plate` (APDS ImageTypeEnum), `plateExtended`, `context`, or an implementer kind."
            examples: [plateExtended]
          imageLink:
            $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
          cameraId:
            type: string
    lane:
      description: |-
        The VehicularAccess (lane) the read was taken at, when the
        Observation's `elementIds` reference one. Whether the read was an
        entry or an exit is `detail.accessEvent` (Part 13 §13.3a(4)); the
        lane used does not decide it.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    cameraId:
      type: string
      description: The capturing camera (APDS Image.cameraID), opaque.
    purgedImagery:
      type: boolean
      readOnly: true
      description: |-
        True when imagery for this read existed and was purged under the
        published retention schedule (Part 13 §13.3b), so a consumer can
        tell "picture purged" from "no picture taken". Absent or false
        otherwise.
    recentReservations:
      type: array
      maxItems: 10
      description: |-
        The same customer's last 10 reservations (newest first) — customer
        resolved from the plate via the account registry or the
        reservation's own vehicle credentials.
      items:
        $ref: "../reservations/schemas.yaml#/ReservationSummary"
    extensions:
      description: |-
        The underlying Observation's `extensions`, projected minus the
        `apds-ext:apx:lpr-read@1.0` block (which is `detail`), so vendor
        keys preserved on ingest are visible here (Part 13 §13.3a,
        Part 4 §4.3).
      $ref: "../common/schemas.yaml#/Extensions"

AttributeRead:
  title: AttributeRead
  description: One recognized attribute with its own confidence (0–1, APDS Confidence scale).
  type: object
  required: [value]
  properties:
    value:
      type: string
    confidence:
      type: number
      minimum: 0
      maximum: 1

LprReadDetail:
  title: LprReadDetail
  description: |-
    What a modern LPR camera knows beyond the plate string and one overall
    score (Part 13 §13.3a). Carried on the ingested APDS Observation as the
    Level B decoration `apds-ext:apx:lpr-read@1.0` in its `extensions`
    container (Part 4 §4.3 — plain APDS consumers ignore it), and projected
    on `LprRead.detail` and `PlateCandidate.detail`. Every field optional;
    each recognized attribute carries its own confidence. APDS's
    `vehicleAncillaryIdentification` (country, stateProvince, make, model,
    color) remains the APDS-visible copy of the winning values; this block
    adds the per-attribute confidence, the candidates that lost, and the
    passage geometry APDS has no fields for.
  type: object
  properties:
    plate:
      $ref: "#/AttributeRead"
    country:
      description: Plate issuing country (APDS VehicleAncillaryIdentification.country vocabulary).
      $ref: "#/AttributeRead"
    stateProvince:
      description: Plate issuing state/province (APDS VehicleAncillaryIdentification.stateProvince vocabulary).
      $ref: "#/AttributeRead"
    plateCategory:
      description: The plate's category where the issuing country uses one (e.g. the prefix on some Gulf-state plates). Absent where the country has none.
      $ref: "#/AttributeRead"
    make:
      $ref: "#/AttributeRead"
    model:
      $ref: "#/AttributeRead"
    color:
      $ref: "#/AttributeRead"
    bodyType:
      description: The engine's own vehicle class label (SUV, sedan, pickup, bus, truck…), carried as the engine reports it and not mapped to a standard list.
      $ref: "#/AttributeRead"
    alternateReads:
      type: array
      description: The other candidate plate strings the engine considered for this capture, best first — kept so a correction (Part 17 §17.5) can pick a loser.
      items:
        type: object
        required: [plate]
        properties:
          plate:
            type: string
          stateProvince:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
    frameReads:
      type: integer
      minimum: 0
      description: |-
        How many frames read this plate as the vehicle passed. Engines need
        at least two to call `movement`, so a camera that sees only one of
        the vehicle's plates still reports it (Part 13 §13.3a(3)).
    platesRead:
      type: integer
      minimum: 0
      description: |-
        How many distinct plates of the vehicle were read in the passage
        (1 = one plate; 2 = front and rear).
    plateFace:
      type: string
      enum: [front, rear, unknown]
      description: Which plate of the vehicle was read, for engines that can tell.
    plateBox:
      type: object
      description: |-
        The plate's position in the camera frame, as fractions 0–1 of the
        frame's height (`top`, `bottom`) and width (`left`, `right`), so it
        survives image resizing.
      required: [top, left, bottom, right]
      properties:
        top: { type: number, minimum: 0, maximum: 1 }
        left: { type: number, minimum: 0, maximum: 1 }
        bottom: { type: number, minimum: 0, maximum: 1 }
        right: { type: number, minimum: 0, maximum: 1 }
    movement:
      type: string
      enum: [toward, away, stopped, unknown, approaching, receding]
      description: |-
        The vehicle's motion relative to the camera: toward it, away from
        it, or stopped. A camera fact, not a statement about the facility.
        `approaching` and `receding` are deprecated synonyms of `toward`
        and `away` — accepted until 1.0; writers SHOULD send the new values
        (Part 13 §13.3a(3)).
    speed:
      type: number
      minimum: 0
      description: Vehicle speed in km/h when the engine measures it; absent otherwise, never a sentinel such as -1.
    accessEvent:
      type: string
      enum: [entry, exit, unknown]
      description: |-
        Whether this read was a vehicle entering or leaving the facility, as
        reported by the LPR system — not the lane's configured purpose (the
        lane's APDS `accessType`), and never inferred by the APX server.
        Absent means `unknown`. The LPR system MAY revise it through
        `PUT /v1/lpr/reads/{observation}/access-event` (Part 13 §13.3a(4)).
    captureGroup:
      type: string
      description: |-
        Opaque id linking the reads of one vehicle's passage — several
        frames, and one camera or several (e.g. front plate and rear
        plate) — so consumers can treat them as one event. Reads of one
        group SHOULD carry the same `accessEvent` (Part 13 §13.3a(6)).
    engine:
      type: string
      description: Recognition engine/vendor identifier, opaque (for confidence calibration downstream).
    review:
      type: object
      description: |-
        The human-review state of the read (Part 13 §13.3a(4a)): a
        low-confidence read, or any read in a jurisdiction that requires
        review, is `pending` until a reviewer confirms, corrects, or
        rejects it through `PUT /v1/lpr/reads/{observation}/plate`.
        `notRequired` is a read no rule sent to review. Absent means the
        implementation does not review reads.
      properties:
        state:
          type: string
          enum: [pending, confirmed, corrected, rejected, notRequired]
        reasons:
          type: array
          description: Why the read was sent to review — definedValues from `apx-read-review-reasons` (Part 11) or implementer values.
          items: { type: string }
        decidedTime:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        decidedBy:
          type: string
          description: Opaque reviewer principal.
        original:
          type: object
          description: |-
            The engine's values before the first correction, with their
            confidences, kept so the correction is auditable. Set by the
            server on the first `corrected` decision and never changed
            afterwards (Part 13 §13.3a(4a)).
          properties:
            plate:
              $ref: "#/AttributeRead"
            country:
              $ref: "#/AttributeRead"
            stateProvince:
              $ref: "#/AttributeRead"

PlateCorrection:
  title: PlateCorrection
  description: |-
    Request body of `PUT /v1/lpr/reads/{observation}/plate` (Part 13
    §13.3a(4a)): a reviewer's decision on one read. `confirmed` keeps the
    engine's values; `corrected` replaces them with the ones given;
    `rejected` marks the read unusable for pairing and enforcement.
    `plate`, `country`, and `stateProvince` belong to `corrected` only:
    sent with another decision they are 422 `request-unprocessable`.
  type: object
  required: [decision]
  properties:
    decision:
      type: string
      enum: [confirmed, corrected, rejected]
    plate:
      type: string
      description: The corrected plate. Required when `decision` is `corrected`; not allowed otherwise.
    country:
      type: string
      description: APDS VehicleAncillaryIdentification.country vocabulary. Only with `corrected`.
    stateProvince:
      type: string
      description: APDS VehicleAncillaryIdentification.stateProvince vocabulary. Only with `corrected`.
    reason:
      type: string
    reviewer:
      type: string
      description: Opaque reviewer principal (recorded as `review.decidedBy`).
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

LprReadSearch:
  title: LprReadSearch
  description: |-
    Request body of `POST /v1/lpr/reads:search` (Part 13 §13.3): the same
    keys as the `GET` lookup, carried in a body so a plate never enters a
    URL that proxies and access logs keep (Part 9 §9.6). At least one of
    `plate`, `ticket`, `observation`, or `session` is REQUIRED.
  type: object
  properties:
    plate: { type: string }
    ticket: { type: string }
    observation:
      type: string
      format: uuid
    session:
      type: string
      format: uuid
    place:
      type: string
      format: uuid
      description: Narrow results below the grant to one HierarchyElement and its subtree.
    page:
      type: integer
      minimum: 1

LaneCameras:
  title: LaneCameras
  description: |-
    The LPR cameras on a lane and which way each one faces (Part 13
    §13.3a(5)). Carried on an APDS VehicularAccess as the Level B
    decoration `apds-ext:apx:lane-cameras@1.0` in its `extensions`
    container (Part 4 §4.3). Facing is relative to the facility, not to
    the lane's mode, so it holds on `reversible` lanes. Describes the
    setup only; APX derives nothing from it.
  type: object
  required: [cameras]
  properties:
    cameras:
      type: array
      minItems: 1
      items:
        type: object
        required: [cameraId, faces]
        properties:
          cameraId:
            type: string
            description: |-
              The camera, as `Image.cameraID` names it on its reads. MUST
              be unique within the Place.
          faces:
            type: string
            enum: [inward, outward]
            description: |-
              `inward` — looking into the facility, the way entering
              traffic travels (reads the rear plates of entering
              vehicles); `outward` — looking out of it, the way exiting
              traffic travels (reads the rear plates of exiting vehicles).
