# APX alerts domain — fully net-new surface (no APDS alert/event classes exist).

Alert:
  title: Alert
  description: |-
    An operational condition requiring attention. Alert types are OPEN
    (UserDefinedCodeList `apx-alert-types`, seeded from APDS Use Case C.2.2
    transaction exceptions and space statuses); severity is CLOSED.
  type: object
  required:
    - id
    - version
    - alertType
    - severity
    - status
    - detectionTime
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
      description: |-
        Server-assigned when the raise carries none. A client MAY supply its
        own UUID on raise (Part 4 §4.1, Part 7 §7.1); an id that already
        exists is 409 `id-collision`.
    version:
      type: integer
      minimum: 1
      readOnly: true
    alertType:
      type: string
      description: definedValue from apx-alert-types or an implementer code list.
      examples: [deviceFault]
    severity:
      type: string
      enum: [info, warning, minor, major, critical]
    status:
      type: string
      enum: [raised, acknowledged, resolved, expired]
      readOnly: true
      description: "Lifecycle: raised → acknowledged → resolved | expired."
    source:
      type: object
      description: Where the condition was detected.
      properties:
        device:
          description: Reference to a SupplementalEquipment.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        place:
          type: string
          format: uuid
          description: HierarchyElement UUID (subtree semantics for filtering).
    relatedEntity:
      description: The APDS/APX entity this alert concerns (Session, AssignedRight, Command…).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    occurrenceTime:
      description: When the condition actually occurred (may precede detection).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    detectionTime:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    expiryTime:
      description: |-
        The end of the alert's validity window (Part 7 §7.3). Settable on
        raise; when absent the server MAY default it by policy per
        `alertType`, and returns the value it applies. If the alert is still
        `raised` or `acknowledged` at this instant the server transitions it
        to `expired` and publishes `apx.alert.status.v1`. Absent means the
        alert never expires on its own.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    description:
      description: Human-readable detail.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/MultilingualString"
    statusHistory:
      type: array
      description: Immutable, append-only lifecycle audit (Part 4 §4.2).
      items:
        type: object
        required: [state, time, actor]
        properties:
          state:
            type: string
          time:
            $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
          actor:
            type: string
            description: Client/agent principal that caused the transition.
          detail:
            type: string
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

AlertTransition:
  title: AlertTransition
  description: |-
    Optional body of `POST /v1/alerts/{id}/acknowledge` and `/resolve`
    (Part 7 §7.2). Annotates the `statusHistory[]` entry the transition
    appends. Sending no body is equivalent to sending `{}`.
  type: object
  properties:
    detail:
      type: string
      description: Copied verbatim into the appended history entry's `detail`.
      examples: ["field tech dispatched, ETA 40 min"]
    agent:
      type: string
      description: |-
        The human or AI principal acting through the calling client (as
        `Command.agent`, Part 6 §6.1). When given it is recorded as the
        appended entry's `actor`; otherwise `actor` is the principal
        derived from the token. Attribution only: authorization is always
        the token's.
      examples: ["agent:j.okafor"]
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"
