# APX accounts & payments — optional conformance classes apx-accounts and
# apx-payment-history. Anchored on APDS RightHolder, Credential, and Payment
# concepts.

Account:
  title: Account
  description: A billable parking account (monthly parker, fleet…), anchored on an APDS RightHolder.
  type: object
  required: [id, version, accountStatus]
  properties:
    id: { type: string, format: uuid }
    version: { type: integer, minimum: 1 }
    holder:
      description: Reference to the APDS RightHolder.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    name: { type: string }
    phone: { type: string }
    cardNumber:
      type: string
      description: Access credential number (NOT a payment card PAN).
    plates:
      type: array
      items: { type: string }
    balance:
      description: Current balance due.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    accountStatus:
      type: string
      enum: [enabled, disabled]
    places:
      type: array
      description: |-
        HierarchyElement subtree roots this account is valid at. On
        aggregating implementations (one endpoint fronting many locations)
        this is how consumers attribute the account to its site(s); results
        of place-less account lookups MUST stay within the caller's
        `apx_places` grant (Part 13 §13.5).
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

PaymentRecord:
  title: PaymentRecord
  description: A payment taken through APX (maps to the APDS Payment concept; card capture stays in the implementer's PCI scope).
  type: object
  required: [id, transactionID, dateCollected, amount, paymentStatus, place]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    transactionID: { type: string, readOnly: true }
    place:
      description: |-
        The HierarchyElement (site) this payment is bound to. REQUIRED so
        every payment — in API responses and in
        `apx.accounts.payment.recorded.v1` events — is attributable to its
        location on implementations fronting many places (Part 13 §13.5).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    dateCollected:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
      readOnly: true
    amount:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    method:
      type: string
      description: card | autoAttendant | cash | other (implementer code list). autoAttendant = PCI-compliant IVR captures the card out of band.
    paymentStatus:
      type: string
      enum: [approved, declined, reversed]
      readOnly: true
    account:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    ticketNumber: { type: string }
    cardLast4:
      type: string
      pattern: "^[0-9]{2,4}$"
      description: |-
        Truncated payment-card digits (PCI-permitted). For transient parkers
        with no LPR and no readable ticket, this is often the ONLY key a
        caller can provide — the lookup of last resort.
    postings:
      type: array
      description: Accounting write-backs (PARIS-style) applied for this payment.
      items:
        $ref: "#/Posting"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

PaymentLink:
  title: PaymentLink
  description: |-
    A hosted payment link sent to a customer (Part 13 §13.1a) — the
    customer-service payment action of first resort. APX carries the link's
    lifecycle, never card data; the hosted page is the implementer's PCI
    scope.
  type: object
  required: [id, version, place, channel, status]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    version: { type: integer, minimum: 1, readOnly: true }
    place:
      description: Site binding (Part 13 §13.5).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    account:
      description: The account the payment settles (or omit and use ticketNumber).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    ticketNumber: { type: string }
    session:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    amount:
      description: Requested amount; omit to charge the current amount due.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    channel:
      type: string
      description: Delivery channel (sms | email | other implementer code list).
      examples: [sms]
    sentTo:
      type: string
      description: Masked destination (e.g. "+1•••••••4567"). PII-minimized.
    status:
      type: string
      enum: [sent, opened, paid, expired, cancelled]
      readOnly: true
    payment:
      description: The resulting PaymentRecord once paid.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    expiresAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    correlationId:
      type: string
      format: uuid
    resolutionContext:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

Posting:
  title: Posting
  description: An accounting write-back of a payment to a monthly-parking/AR system.
  type: object
  required: [confirmationNumber, accountUpdated]
  properties:
    confirmationNumber: { type: string }
    accountUpdated: { type: boolean }
    newBalance:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    postedTo:
      type: string
      description: Target accounting system identifier (e.g. "paris").
    time:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
