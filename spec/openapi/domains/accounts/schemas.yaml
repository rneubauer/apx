# APX accounts & payments — optional conformance classes apx-accounts and
# apx-payment-history. Anchored on APDS RightHolder, Credential, and Payment
# concepts.

Account:
  title: Account
  description: A billable parking account (monthly parker, fleet…), anchored on an APDS RightHolder.
  type: object
  required: [id, version, accountStatus]
  properties:
    id: { type: string, format: uuid }
    version: { type: integer, minimum: 1 }
    holder:
      description: Reference to the APDS RightHolder.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    name: { type: string }
    phone: { type: string }
    email:
      type: string
      description: |-
        Contact e-mail on file. Personal data under the same Part 9 §9.6
        minimization rule as `phone`: returned only under
        `apx.accounts:read` (Part 13 §13.1).
    cardNumber:
      type: string
      description: Access credential number (NOT a payment card PAN).
    plates:
      type: array
      items: { type: string }
    credentials:
      type: array
      description: |-
        The account's CredentialRecords (Part 21), when the server claims
        `apx-credentials` — additive; `cardNumber` and `plates` remain
        the APDS-only summary.
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    balance:
      description: Current balance due.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    accountStatus:
      type: string
      enum: [enabled, disabled]
    places:
      type: array
      description: |-
        HierarchyElement subtree roots this account is valid at. On
        aggregating implementations (one endpoint fronting many locations)
        this is how consumers attribute the account to its site(s); results
        of place-less account lookups MUST stay within the caller's
        `apx_places` grant (Part 13 §13.5).
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

PaymentRecord:
  title: PaymentRecord
  description: A payment taken through APX (maps to the APDS Payment concept; card capture stays in the implementer's PCI scope).
  type: object
  required: [id, transactionID, dateCollected, amount, paymentStatus, place]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    transactionID: { type: string, readOnly: true }
    place:
      description: |-
        The HierarchyElement (site) this payment is bound to. REQUIRED so
        every payment — in API responses and in
        `apx.accounts.payment.recorded.v1` events — is attributable to its
        location on implementations fronting many places (Part 13 §13.5).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    dateCollected:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
      readOnly: true
    amount:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    meansOfPayment:
      description: |-
        How the customer paid, in APDS's own vocabulary (`MeansOfPaymentEnum`,
        which APDS uses for the means a place accepts). A card whose credit or
        debit type the payment layer does not report is `unknown`.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/MeansOfPaymentEnum"
    channel:
      type: string
      description: |-
        Where the payment was captured. `lane` = a lane device; `payStation` =
        a pay-on-foot or pay station; `agent` = a person on the implementer's
        own PCI-scoped terminal; `autoAttendant` = a PCI-compliant IVR that
        captures the card out of band; `online` = web or mobile app. APX
        never carries PANs, whichever channel is used.
      enum: [lane, payStation, agent, autoAttendant, online, other]
    paymentStatus:
      type: string
      description: |-
        The payment layer's answer. `approved` = approved (for a hold, see
        `captureStatus`); `declined` = refused by the payment layer;
        `reversed` = a hold voided, or a payment refunded in full.
        Transitions per Part 13 §13.1a.
      enum: [approved, declined, reversed]
      readOnly: true
    captureStatus:
      type: string
      readOnly: true
      description: |-
        Whether an approved payment's funds have been collected (Part 13
        §13.1a). `authorized` = a hold: the payment layer approved an
        authorization-only request (`captureLater: true`), funds are held,
        nothing is collected yet; settled by
        `POST /v1/payments/{id}/capture` or released by `…/void`.
        `captured` = collected. Absent = `captured` (a sale). A hold is
        returned to the caller that created it, but is not listed by
        `GET /v1/payments` unless asked for, is not published on
        `apx.accounts.payment.recorded.v1`, and is not materialized as an
        APDS Payment until captured.
      enum: [authorized, captured]
    captureLater:
      type: boolean
      default: false
      description: |-
        Create-time intent: `true` asks for authorization only (the record
        is created `paymentStatus: approved`, `captureStatus: authorized`
        and is settled later by `POST /v1/payments/{id}/capture` or
        released by `…/void`). Absent or `false` = sale (authorize and
        capture at once). A server that does not model an authorization
        lifecycle refuses `true` with 422 `request-unprocessable` (Part 13
        §13.1a).
    refundedAmount:
      description: |-
        Cumulative amount refunded so far (Part 13 §13.1a). Absent or zero
        = nothing refunded. When it reaches `amount` the record is
        `reversed`; a partial refund leaves it `approved` with this member
        showing what was given back.
      readOnly: true
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    account:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    ticketNumber: { type: string }
    cardLast4:
      type: string
      pattern: "^[0-9]{2,4}$"
      description: |-
        Truncated payment-card digits (PCI-permitted). For transient parkers
        with no LPR and no readable ticket, this is often the ONLY key a
        caller can provide — the lookup of last resort.
    postings:
      type: array
      description: Accounting write-backs (PARIS-style) applied for this payment.
      items:
        $ref: "#/Posting"
    extensions:
      description: |-
        Extension container (Part 4 §4.3). `apds-ext:apx:payment-detail@1.0`
        itemizes the payment and names the rate sold (Part 13 §13.6a).
      $ref: "../common/schemas.yaml#/Extensions"

PaymentDetail:
  title: PaymentDetail
  description: |-
    The `apds-ext:apx:payment-detail@1.0` decoration (Part 13 §13.6a): what
    a payment was made of and what it bought. On an APX `PaymentRecord` it
    carries `rateSold` and the itemized `lines`; on a native APDS `Payment`
    it carries `rateSold` only, because the Payment's own `paymentLines`
    are the itemization there (one store, never two).
  type: object
  minProperties: 1
  properties:
    rateSold:
      $ref: "#/RateSold"
    lines:
      type: array
      minItems: 1
      description: |-
        The payment's itemization as APDS `PaymentLine` entries (by `$ref`,
        never re-shaped). The `currencyValue`s of the `paymentType: payment`
        lines MUST sum to the record's `amount`, in its `currencyType`;
        `paymentType: validation` lines record value offset by a validation
        and are not part of `amount`. A `payment` line's `idCode` is a
        definedValue of the `apx-payment-line-codes` registry (Part 11) or
        of an implementer's own list. Lines that do not sum to `amount` are
        422 `request-unprocessable`. Only on a `PaymentRecord`; on materialization these
        become the native Payment's `paymentLines` (Part 13 §13.6).
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaymentLine"

RateSold:
  title: RateSold
  description: |-
    The rate or product the payment bought, as the seller sold it (Part 13
    §13.6a), so a revenue report can group by rate and a price check can
    compare the amount with the published deck.
  type: object
  minProperties: 1
  properties:
    code:
      type: string
      description: |-
        The seller's identifier for the rate or product (a plain string,
        meaningful to the seller; Part 11 §11.1a form 4).
      examples: [early-bird]
    name:
      type: string
      description: The rate's customer-facing name, as displayed when it was sold.
      examples: [Early Bird]
    rateTable:
      description: |-
        The published APDS `RateTable` the price came from, when the place
        publishes its deck on `/rates` and the rate sold is in it.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/VersionedReference"
    rightType:
      description: |-
        What kind of right the payment bought, in APDS's own vocabulary
        (`RightSpecificationTypeEnum`): `oneTimeUseParking` for a transient
        stay, `permitParking` for a pass or permit. Omit on a Payment
        inside an AssignedRight, whose RightSpecification already says it.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/RightSpecificationTypeEnum"
    priceClass:
      type: string
      description: |-
        How the price relates to the rate's list price. `standard` = the
        list price; `discounted` = reduced by a promotion, coupon, or
        negotiated rate; `validated` = offset in full or part by a
        validation (the `validation` lines carry the value); `complimentary`
        = no charge, recorded for audit; `other`.
      enum: [standard, discounted, validated, complimentary, other]

PaymentLink:
  title: PaymentLink
  description: |-
    A hosted payment link sent to a customer (Part 13 §13.1a) — the
    customer-service payment action of first resort. APX carries the link's
    lifecycle, never card data; the hosted page is the implementer's PCI
    scope.
  type: object
  required: [id, version, place, channel, status]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    version: { type: integer, minimum: 1, readOnly: true }
    place:
      description: Site binding (Part 13 §13.5).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    account:
      description: The account the payment settles (or omit and use ticketNumber).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    ticketNumber: { type: string }
    session:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    amount:
      description: Requested amount; omit to charge the current amount due.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    channel:
      type: string
      description: Delivery channel (sms | email | other implementer code list).
      examples: [sms]
    sentTo:
      type: string
      description: Masked destination (e.g. "+1•••••••4567"). PII-minimized.
    status:
      type: string
      enum: [sent, opened, paid, expired, cancelled]
      readOnly: true
    payment:
      description: The resulting PaymentRecord once paid.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    expiresAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    correlationId:
      type: string
      format: uuid
    resolutionContext:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    resolutionContextVersion:
      type: integer
      minimum: 1
      readOnly: true
      description: |-
        The `version` of the ResolutionContext whose allowed actions this
        write was checked against, recorded by the server so the decision stays
        reconstructible after the context is recomputed or expires (Part 17 §17.2).
    approval:
      description: Approval evidence, when the context's AllowedAction for the link said requiresApproval (Part 17 §17.3).
      $ref: "../control/schemas.yaml#/Approval"
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

Posting:
  title: Posting
  description: An accounting write-back of a payment to a monthly-parking/AR system.
  type: object
  required: [confirmationNumber, accountUpdated]
  properties:
    confirmationNumber: { type: string }
    accountUpdated: { type: boolean }
    newBalance:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
    postedTo:
      type: string
      description: Target accounting system identifier (e.g. "paris").
    time:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"

PostingRequest:
  title: PostingRequest
  description: Request body for the accounting write-back of a payment.
  type: object
  properties:
    postedTo:
      type: string
      description: Target accounting system identifier; server default applies when omitted.
      examples: [paris]
    account:
      description: Account to post against when the payment isn't already account-bound.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    note: { type: string }

PaymentLinkCancel:
  title: PaymentLinkCancel
  description: |-
    Request body cancelling a payment link before the customer pays
    (Part 13 §13.1a). The body is optional; `reason` is recorded on the
    link's audit trail.
  type: object
  properties:
    reason:
      type: string
      description: Why the link was cancelled (implementer code list, e.g. wrongRecipient, paidOtherwise).
      examples: [wrongRecipient]
    note: { type: string }
