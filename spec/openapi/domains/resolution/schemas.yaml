# APX resolution domain — optional conformance class apx-resolution (Part 17).
# Customer Service & Resolution: one aggregated context call, policy-decided
# allowed actions, passback status, plate candidates, support history.
#
# DISCOVERY -> CONTEXT -> POLICY -> ACTIONS -> EVENTS, in APDS vocabulary:
# every entity is referenced (never redefined), and every WRITE goes through
# the existing Part 6 command plane — this domain adds reads and decisions,
# not a second actuation surface.

ResolutionIssue:
  title: ResolutionIssue
  description: |-
    The machine-classified issue this context describes. `code` is a
    definedValue from the apx-issue-types registry (open, per Part 11);
    `display` is the human-readable summary shown to agents.
  type: object
  required: [code]
  properties:
    code:
      type: string
      description: definedValue from apx-issue-types.
      examples: [accountBalanceDenied]
    display:
      type: string
      examples: ["Monthly parker denied because of outstanding balance"]

AllowedAction:
  title: AllowedAction
  description: |-
    One policy decision about one action, evaluated for THIS context, THIS
    credential, and THIS moment (Part 17 §17.3). The server — never the
    consuming agent, human or AI — decides permissibility. Approval
    requirements are policy-dependent, which is why they live here at
    runtime and not in a registry.

    The `execution` descriptor abstracts HOW the action runs — a Part 6
    control command or a domain API operation — so the agent sees one
    unified action list and never needs to know which APX module executes
    it. Servers MUST NOT list an action the implementation does not
    support (Part 17 §17.3).
  type: object
  required: [action, allowed]
  allOf:
    - if: { required: [allowed], properties: { allowed: { const: false } } }
      then: { required: [reason] }
    - if: { required: [requiresApproval], properties: { requiresApproval: { const: true } } }
      then: { required: [reason] }
  properties:
    action:
      type: string
      description: |-
        Logical action identifier: the apx-command-types value for control
        actions, or the effective-spec operationId for domain actions.
      examples: [courtesyExit]
    display:
      type: string
      description: Agent-facing label.
      examples: ["Courtesy exit"]
    target:
      description: The Reference the action should be executed against.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    allowed:
      type: boolean
    requiresApproval:
      type: boolean
      default: false
      description: When true, the executing request MUST carry approval evidence (Part 17 §17.3).
    approvalRole:
      type: string
      description: Role that can approve (implementer/operator code list).
      examples: [supervisor]
    execution:
      type: object
      description: |-
        How to execute (RECOMMENDED). Exactly one of command/operationId/
        surface per type. `ui` says the action is done in the vendor's own
        screen (Part 25): the agent launches `surface` on `subject` and
        the implementation reports what was done as the module's native
        resource or a UiActionRecord carrying the launch's correlation id.
      required: [type]
      allOf:
        - if: { required: [type], properties: { type: { const: control } } }
          then: { required: [command] }
        - if: { required: [type], properties: { type: { const: domain } } }
          then: { required: [operationId] }
        - if: { required: [type], properties: { type: { const: ui } } }
          then: { required: [surface] }
      properties:
        type:
          type: string
          enum: [control, domain, ui]
        command:
          type: string
          description: For type=control — the apx-command-types value for POST /v1/commands.
          examples: [courtesyExit]
        operationId:
          type: string
          description: For type=domain — the operationId of the executing operation in the effective OpenAPI description.
          examples: [post-apx-v1-payment-links]
        surface:
          type: string
          description: For type=ui — the apx-ui-surfaces value to launch (Part 25 §25.5).
          examples: [lane.console]
        subject:
          description: For type=ui — the entity to open the surface on; defaults to the action's `target`.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    reason:
      type: object
      description: Why the action is denied or gated. REQUIRED when allowed=false or requiresApproval=true.
      required: [code]
      properties:
        code:
          type: string
          description: Machine-readable policy reason code (operator code list).
          examples: [courtesyLimitReached]
        display:
          type: string
          examples: ["Two courtesy exits have already been provided within the previous 48 hours."]
        policy:
          type: string
          description: Identifier of the matched operator policy (opaque to APX).

PassbackStatus:
  title: PassbackStatus
  description: Anti-passback state overlay for one APDS Credential.
  type: object
  required: [credential, state]
  properties:
    credential:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    state:
      type: string
      enum: [normal, violation, unknown]
    expectedPresence:
      type: string
      enum: [inside, outside, unknown]
    recordedPresence:
      type: string
      enum: [inside, outside, unknown]
    lastAccess:
      type: object
      description: The most recent access event for this credential.
      required: [direction, occurredAt]
      properties:
        direction:
          type: string
          enum: [entry, exit]
        occurredAt:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        place:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        lane:
          description: The VehicularAccess where the access occurred.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

PlateCandidate:
  title: PlateCandidate
  description: |-
    One candidate plate read for correction workflows (Part 17 §17.5) —
    a projection over APDS Observations, imagery as access-controlled
    links (Part 9 §9.6).
  type: object
  required: [plate, confidence, observationDateTime]
  properties:
    plate: { type: string }
    country:
      type: string
      description: Plate issuing country (APDS VehicleAncillaryIdentification.country vocabulary).
      examples: [US]
    stateProvince:
      type: string
      description: Plate issuing state/province (APDS VehicleAncillaryIdentification.stateProvince vocabulary).
      examples: [FL]
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: Projection of APDS Confidence.overallConfidence (0–1) for the read.
    observationDateTime:
      description: When the read was captured (aligned with LprRead.observationDateTime; APDS ObservationElement.observationStartTime).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    detail:
      description: Per-attribute confidences, alternate reads, and passage geometry (Part 13 §13.3a), when the read carried them.
      $ref: "../lpr/schemas.yaml#/LprReadDetail"
    lane:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    observation:
      description: The underlying APDS Observation.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    plateImage:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
    vehicleImage:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
    purgedImagery:
      type: boolean
      readOnly: true
      description: True when imagery for this read existed and was purged under the retention schedule (Part 13 §13.3b); `plateImage`/`vehicleImage` are then absent.
    extensions:
      description: The underlying Observation's `extensions`, minus the `apds-ext:apx:lpr-read@1.0` block (which is `detail`) — Part 13 §13.3a.
      $ref: "../common/schemas.yaml#/Extensions"

OverrideRecord:
  title: OverrideRecord
  description: A recent manual override relevant to this context (courtesy exits, gate opens, passback resets…). Summarizes a Part 6 Command.
  type: object
  required: [commandType, occurredAt]
  properties:
    commandType:
      type: string
      description: definedValue from apx-command-types.
      examples: [courtesyExit]
    command:
      description: Reference to the full Command (audit trail).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    occurredAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    requestedBy:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    place:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    agent:
      type: string
      description: The human or AI principal who initiated the override, copied from the summarized Command's `agent`.
      examples: ["agent:j.okafor"]
    agentType:
      type: string
      enum: [human, ai]
      description: Copied from the summarized Command's `agentType`.
    reason:
      type: string
      description: The override's recorded reason, copied from the summarized Command's `reason`.

SupportInteraction:
  title: SupportInteraction
  description: |-
    One customer-service interaction (human or AI agent), recorded so
    future resolution contexts can surface "they called twice yesterday".
  type: object
  required: [id, version, channel, agentType, startedAt, place]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    version: { type: integer, minimum: 1, readOnly: true }
    channel:
      type: string
      description: voice | chat | email | sms | other (implementer code list).
      examples: [voice]
    agentType:
      type: string
      enum: [human, ai]
    agent:
      type: string
      description: Agent identifier (human or system principal).
    startedAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    endedAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    place:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    issue:
      $ref: "#/ResolutionIssue"
    summary:
      type: string
      description: Short outcome summary. NOT a transcript — PII minimization (Part 9 §9.6).
    subjects:
      type: object
      description: What/who the interaction was about (all optional).
      properties:
        session:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        holder:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        account:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        credential:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        reservation:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        plate: { type: string }
    actions:
      type: array
      description: References to actions executed during the interaction (Commands, PaymentLinks, domain mutations).
      items:
        $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    interactionId:
      type: string
      description: The calling application's opaque interaction identifier.
      examples: [interaction-938383]
    resolution:
      type: object
      description: How the interaction ended.
      properties:
        code:
          type: string
          description: A definedValue of apx-interaction-outcomes (Part 11) or an implementer code (Part 17 §17.5).
          examples: [resolved]
        display:
          type: string
    correlationId:
      type: string
      format: uuid
      description: Correlation chain id (Part 17 §17.7).
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"

ResolutionResolveRequest:
  title: ResolutionResolveRequest
  description: |-
    Whatever PARKING-DOMAIN identifiers are currently known — the server
    resolves every relationship it can (Part 17 §17.2). At least one
    IDENTIFYING member is required — `device`, `place`, `lane`,
    `session`, `holder`, `credential`, `plate`, `ticketNumber`,
    `reservationCode`, `guestReference`, `commsPoint`, `callerId`,
    `dialedNumber`, or `commsDeviceId`; all are optional individually.
    `interactionId`, `correlationId`, `channel`, and `reservationIssuer`
    are metadata and do not count: a body without an identifying member
    is 400 `invalid-request` (Part 17 §17.1). Unknown members are ignored
    (tolerant reader) and never used for resolution. (`minProperties: 1`
    is the only part of this rule the schema states; the full rule is
    enforced by the server.)

    Telephony values appear in exactly two places in APX: on a Part 26
    CommsPoint, and in the `callerId`, `dialedNumber` and `commsDeviceId`
    members here, which the call platform supplies to find the comms
    point. A PARCS implementation never has to hold, return or understand
    them; one that holds no comms points answers these members with 422
    `comms-point-unknown` (Part 17 §17.1). No SIP identifiers, anywhere.
  type: object
  minProperties: 1
  properties:
    interactionId:
      type: string
      description: |-
        OPAQUE identifier of the calling application's customer interaction
        (a call, chat, SMS session…). APX never interprets it — it only
        echoes it for correlation (Part 17 §17.7). Not an identifier for
        resolution.
      examples: [interaction-938383]
    correlationId:
      type: string
      format: uuid
      description: Caller-minted correlation id; echoed on the context and reusable on Commands.
    channel:
      type: string
      description: How the interaction arrived, for context/history display (voice | intercom | chat | web | other).
      examples: [intercom]
    device:
      description: A SupplementalEquipment the interaction is anchored to (only meaningful if inventoried in the Place hierarchy).
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    place:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    lane:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    session:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    holder:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    credential:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    plate: { type: string }
    ticketNumber: { type: string }
    reservationCode: { type: string }
    reservationIssuer:
      type: string
      description: Who sold the reservation, when the code alone is ambiguous across sellers (Part 17 §17.2, ReservationSummary.issuer). Metadata, not an identifier.
      examples: [spothero.example]
    guestReference:
      type: object
      description: A guest without a plate or ticket — a hotel room, a company, a tenant's employee, an event (Part 17 §17.2). The server resolves it through the place's guest arrangements.
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [hotelRoom, company, tenant, event, other]
        value:
          type: string
          examples: ["1412"]
    commsPoint:
      description: The Part 26 CommsPoint the contact came from, when the call platform already knows it.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    callerId:
      type: string
      pattern: "^\\+[1-9][0-9]{1,14}$"
      description: E.164. The number the contact came from; matched against `CommsPoint.callerId` (Part 26 §26.4). A parker's own mobile number resolves to nothing and is not stored.
      examples: ["+15555550199"]
    dialedNumber:
      type: string
      pattern: "^\\+[1-9][0-9]{1,14}$"
      description: E.164. The number the contact called; matched against `CommsPoint.phoneNumber`. A posted number shared by many lanes resolves to the place only.
      examples: ["+15555550142"]
    commsDeviceId:
      type: string
      description: The call platform's device id; matched against `CommsPoint.commsDeviceId`.
      examples: [dev-51cc-ae16]

ApprovalRequest:
  title: ApprovalRequest
  description: |-
    Asking someone with authority to approve an action before it runs
    (Part 17 §17.3a). An agent whose AllowedAction said `requiresApproval`
    creates one, addressed to a `role` (an escalation role of the place,
    Part 26 §26.5, or the AllowedAction's `approvalRole`); the approver
    decides through `POST /v1/approvals/{id}/decide`; the resulting
    `Approval` evidence on the write cites the request. Every change is
    published as `apx.approvals.changed.v1`.
  allOf:
    - $ref: "../common/schemas.yaml#/ApxResourceCore"
    - type: object
      required: [place, action, requestedBy, role, correlationId, status]
      properties:
        place:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        action:
          type: string
          description: The apx-command-types value or effective-spec operationId to be approved (the AllowedAction.action).
          examples: [post-apx-v1-payments-id-refund]
        target:
          description: What the action is to be executed against.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
        requestedBy:
          type: string
          description: The agent asking.
          examples: [agent-4471]
        agentType:
          type: string
          enum: [human, ai]
        role:
          type: string
          description: The role asked to decide (apx-escalation-roles value or the AllowedAction's approvalRole).
          examples: [siteManager]
        interactionId:
          type: string
          examples: [interaction-938383]
        correlationId:
          type: string
          format: uuid
          description: The interaction's correlation id (Part 17 §17.7).
        reason:
          type: string
          description: Why the agent is asking, in one line.
          examples: ["Customer double charged at the exit; refund of 12.00 USD"]
        status:
          type: string
          enum: [pending, approved, denied, expired]
          readOnly: true
        expiresAt:
          description: When a pending request lapses to `expired`. Settable on create; the server MAY default it by policy.
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
        decision:
          readOnly: true
          $ref: "#/ApprovalDecision"
  examples:
    - {
        "id": "d7000000-0000-4000-8000-000000000001",
        "version": 2,
        "place": { "id": "b1000000-0000-4000-8000-000000000001", "className": "Place" },
        "action": "post-apx-v1-payments-id-refund",
        "target": { "id": "e6000000-0000-4000-8000-000000000002", "className": "PaymentRecord" },
        "requestedBy": "agent-4471",
        "agentType": "human",
        "role": "siteManager",
        "interactionId": "interaction-938383",
        "correlationId": "6a1f3c2e-7b4d-4e8f-9a0b-1c2d3e4f5a6b",
        "reason": "Customer double charged at the exit; refund of 12.00 USD",
        "status": "approved",
        "expiresAt": "2026-10-18T14:30:00Z",
        "decision": { "outcome": "approved", "decidedBy": "mgr-lakeside-02", "decidedAt": "2026-10-18T14:09:12Z", "note": "Confirmed on the payment history" }
      }

ApprovalDecision:
  title: ApprovalDecision
  description: The decision on an ApprovalRequest (Part 17 §17.3a), also the body of `POST /v1/approvals/{id}/decide`.
  type: object
  required: [outcome, decidedBy]
  properties:
    outcome:
      type: string
      enum: [approved, denied]
    decidedBy:
      type: string
      description: The approving principal, in the role the request named.
      examples: [mgr-lakeside-02]
    decidedAt:
      readOnly: true
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    note:
      type: string

ResolutionContext:
  title: ResolutionContext
  description: |-
    The aggregated customer-service context (Part 17): everything the
    server could resolve about one interaction, plus the policy-decided
    allowed actions. Every section beyond the required core is OPTIONAL —
    implementations include what they know and omit what they don't
    (graceful degradation), and MUST NOT include sections the caller's
    scopes/grants could not read directly.
  type: object
  required: [id, version, computedAt, status, place, allowedActions]
  properties:
    id: { type: string, format: uuid, readOnly: true }
    version:
      type: integer
      minimum: 1
      readOnly: true
      description: Increments each time the context is recomputed.
    computedAt:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    status:
      type: string
      enum: [full, partial]
      description: partial = at least one source has not answered yet; re-read to refresh.
    pendingSources:
      type: array
      description: Names of sources still resolving when status=partial (implementer-defined identifiers).
      items: { type: string }
    interactionId:
      type: string
      description: Echo of the caller's opaque interaction identifier.
      examples: [interaction-938383]
    correlationId:
      type: string
      format: uuid
    issue:
      $ref: "#/ResolutionIssue"
    place:
      description: The facility this interaction is anchored to.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    placeDisplay:
      type: string
      examples: ["Lakeside Garage"]
    lane:
      description: The VehicularAccess (lane) if resolved.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    laneStatus:
      description: The live lane inquiry result (Part 6 §6.2).
      $ref: "../control/schemas.yaml#/LaneStatus"
    vehicle:
      type: object
      description: The vehicle as best resolved (usually via LPR). Plate vocabulary follows APDS VehicleAncillaryIdentification (country/stateProvince).
      properties:
        plate: { type: string }
        country: { type: string, examples: [US] }
        stateProvince: { type: string, examples: [FL] }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Projection of APDS Confidence.overallConfidence (0–1).
        plateImage:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Url"
    session:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    holder:
      description: The RightHolder (parker) if identified.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    holderDisplay:
      type: string
      description: Display name only — contact details require the account read (PII minimization).
    account:
      $ref: "../accounts/schemas.yaml#/Account"
    assignedRight:
      description: The permit/reservation AssignedRight if resolved.
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    reservation:
      $ref: "../reservations/schemas.yaml#/ReservationSummary"
    credential:
      $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
    passback:
      $ref: "#/PassbackStatus"
    accessDecision:
      type: object
      description: The most recent access decision at the lane.
      properties:
        status:
          type: string
          enum: [granted, denied, pending, unknown]
        reasonCode:
          type: string
          description: Operator code-list value.
          examples: [outstandingBalance]
        reasonDisplay:
          type: string
        occurredAt:
          $ref: "../../../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/DateTime"
    payments:
      type: array
      description: Recent relevant payments (most recent first).
      items:
        $ref: "../accounts/schemas.yaml#/PaymentRecord"
    devices:
      type: array
      description: Live status of the lane's devices — surfaces equipment faults before the agent asks the customer to retry.
      items:
        $ref: "../control/schemas.yaml#/DeviceStatus"
    recentOverrides:
      type: array
      items:
        $ref: "#/OverrideRecord"
    supportHistory:
      type: array
      description: Recent SupportInteractions for the same subjects.
      items:
        $ref: "#/SupportInteraction"
    allowedActions:
      type: array
      description: The policy layer's decisions — see AllowedAction. May be empty.
      items:
        $ref: "#/AllowedAction"
    recommendedAction:
      type: object
      description: The server's suggested next step (advisory, never binding). MUST be one of allowedActions.
      required: [action]
      properties:
        action:
          type: string
          description: The AllowedAction.action value being recommended.
          examples: [post-apx-v1-payment-links]
        reason:
          type: string
    recordInfo:
      $ref: "../common/schemas.yaml#/RecordInfo"
    extensions:
      $ref: "../common/schemas.yaml#/Extensions"
