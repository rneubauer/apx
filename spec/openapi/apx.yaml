        - name: status
          in: query
          schema: { type: string, enum: [active, superseded, removed] }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated signage (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
