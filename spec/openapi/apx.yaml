openapi: 3.1.0

info:
  title: APX — APDS Parking eXtensions
  version: 0.10.0
  summary: An open companion standard to APDS 4.1
  description: |-
    **APX (APDS Parking eXtensions)** is an additive companion standard to the
    [APDS 4.1 API](https://github.com/parkingdata/spec) (Alliance for Parking
    Data Standards, published as ISO/TS 5206-1).

    APX follows an **APDS-first prime directive**: wherever APDS 4.1 already
    defines a route, schema, or convention, APX uses it verbatim (by `$ref`
    into the vendored, unmodified `apds-api-4.1.yaml`). APX only adds what
    APDS deliberately leaves out:

    - **Data profile** — Full/Change update semantics, tombstones, and a
      cursor-based change feed as additive parameters on APDS's native routes
    - **Delivery fabric** — a superset-compatible profile of APDS `/webhooks`
      (HMAC signing, normative retries, delivery ledger, SSE)
    - **Control** — command plane for gates/PARCS/devices with idempotency,
      lifecycle, and immutable audit
    - **Alerts** — operational alerting with open taxonomies via APDS
      UserDefinedCodeLists
    - **Discovery** — credential-scoped capability documents
    - **Accounts & payments, LPR, reservations, permits, tolling** — profiles
      and additive resources over APDS entities

    Extension identity follows the official APDS extension convention:
    `apds-ext:apx:<class>@<version>` (Use Case Document §C.2.5), with
    extensionName `apx`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: APX Standard Working Group (stewarded by Umojo)
    email: rneubauer@umojo.com
  x-apds-extension:
    extensionName: apx
    extensionVersion: "1.0"
    apdsVersion: "4.1"

servers:
  - url: https://api.apx-implementation.example
    description: |-
      One host serves both surfaces: APDS-native routes at their verbatim
      paths (/places, /sessions, /webhooks, …) and APX routes under the
      explicit /v1 prefix.

tags:
  - name: Discovery
    description: Bootstrap and credential-scoped capability discovery.
  - name: Data
    description: |-
      APX data profile — additive reads over the APDS Place hierarchy
      (occupancy snapshot). The pull/push routes themselves are the native
      APDS paths, mounted verbatim. See written standard Part 5.
  - name: Subscription
    description: |-
      APX delivery fabric — a superset-compatible profile of the APDS 4.1
      /webhooks subscription endpoint (stock EventSubscription bodies work
      unmodified). See written standard Part 8.
  - name: Alerts
    description: Operational alerting (net-new APX domain). See written standard Part 7.
  - name: Control
    description: Command plane, lane inquiry, validations, device status. See written standard Part 6.
  - name: Accounts
    description: Accounts, payments, accounting write-back, payment history. See written standard Part 13.
  - name: LPR
    description: Plate/ticket cross-lookup over APDS Observations. See written standard Part 13.
  - name: Permits
    description: Pooled permit issuance over RightSpecification/RightPool. See written standard Part 14.
  - name: Reservations
    description: Reservation conventions over native Quote/AssignedRight routes. See written standard Part 14.
  - name: Tolling
    description: Toll transactions binding Observations to pricing and Payments. See written standard Part 15.
  - name: Resolution
    description: |-
      Customer Service & Resolution (optional class apx-resolution) — one
      aggregated context call plus policy-decided allowed actions. Writes go
      through the Part 6 command plane. See written standard Part 17.
  - name: Support
    description: Support-interaction history for resolution contexts. See written standard Part 17.
  - name: Violations
    description: |-
      Enforcement (optional class apx-violations, net-new domain) — one
      Violation resource for tickets, notices, and citations: automated and
      guided detection, review, issuance, settlement by Payment reference,
      appeals, and the eligibility check that drives guided enforcement.
      See written standard Part 19.
  - name: Validations
    description: |-
      Validation program management (optional class apx-validations) —
      merchant enrolment, instrument issuance (codes, QR, stamps),
      the redemption ledger every channel writes, and merchant billing
      statements. Builds on the Part 6 §6.3 provider lookup and
      `applyValidation` command. See written standard Part 20.
  - name: Credentials
    description: |-
      Credential lifecycle (optional class apx-credentials) — keycards,
      fobs, RFID tags, mobile credentials, hangtags, plates-as-credential:
      issue, activate, suspend, resume, report lost, revoke, replace, and
      access-event history. Active records are materialized as APDS
      CredentialAssigned on the holder's AssignedRights. See written
      standard Part 21.
  - name: Valet
    description: |-
      Valet custody (optional class apx-valet, net-new domain) — drop-off
      with condition evidence, parked position and keys, the retrieval
      queue with ETA (from text, app, web, voice bot, kiosk, or
      attendant), staging, and verified handback. The APDS Session
      remains the stay and the money. See written standard Part 22.

paths:
  # ===== APDS 4.1 native routes, mounted VERBATIM from the vendored spec ===== #
  # The APX data profile (Part 5) adds additive query parameters (mode, cursor)
  # to the list operations; plain APDS clients are unaffected.
  /places:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1places"
  /places/{id}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1places~1{id}"
  /observations:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1observations"
  /contacts:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1contacts"
  /contacts/{contactId}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1contacts~1{contactId}"
  /rights/specs:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rights~1specs"
  /rights/specs/{id}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rights~1specs~1{id}"
  /rates:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rates"
  /rates/{id}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rates~1{id}"
  /sessions:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1sessions"
  /sessions/{id}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1sessions~1{id}"
  /rights/assigned:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rights~1assigned"
  /rights/assigned/{id}:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1rights~1assigned~1{id}"
  /quotes:
    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/paths/~1quotes"

  # ===== Data profile: additive convenience reads (Part 5) ===== #
  /v1/places/{id}/occupancy:
    get:
      operationId: get-apx-v1-places-id-occupancy
      security:
        - apxOAuth: ["apx.data:read"]
      tags: [Data]
      summary: Current occupancy snapshot for a place element
      description: |-
        "How full is it right now" for one HierarchyElement, without pulling
        the Place hierarchy. A pure convenience READ over the APDS occupancy
        model (Supply + DemandTable) — the Place payload remains the source
        of truth. Fields the implementation does not know are simply absent.
        Threshold crossings publish apx.data.occupancy.v1 and SHOULD raise
        an occupancyThresholdExceeded alert (Part 7). Scope apx.data:read;
        the place grant must cover the element.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: HierarchyElement UUID (Place, Level, Area, …).
      responses:
        "200":
          description: The occupancy snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancySnapshot" }
        "404":
          description: No such place element.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Delivery fabric: superset profile of APDS /webhooks ===== #
  /webhooks:
    post:
      operationId: post-webhooks
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: Subscribe to event topics (APDS-compatible superset)
      description: |-
        Creates a subscription. A stock APDS 4.1 `EventSubscription`
        (`{endpoint, topics[]}` with EventTypeEnum values) is a valid body;
        APX fields (transport, filters, secret) are additive.

        **Response negotiation (normative, Part 8 §8.1):** the stock APDS
        4.1 response contract is preserved — a request WITHOUT
        `Prefer: return=representation` receives the native APDS `200`/`202`
        with `ResponseStatus`, exactly as APDS documents. An APX client
        sends `Prefer: return=representation` and receives `201` with the
        full subscription INCLUDING the signing secret (returned exactly
        once, in that response only; webhook transport only).

        Refusals at creation (Part 8 §8.1): a topic the credential could
        not read synchronously is 403 `insufficient-scope` (Part 9 §9.6(4));
        a `filters.places` entry outside the token's `apx_places` grant is
        403 `insufficient-grant`. Send `Idempotency-Key` to make a retried
        create safe.
      parameters:
        - name: Prefer
          in: header
          required: false
          description: |-
            RFC 7240. `return=representation` selects the APX-rich 201
            response (subscription + one-time secret). Absent, the server
            answers with the stock APDS 200/202 ResponseStatus contract.
          schema:
            type: string
            enum: [return=representation]
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApxEventSubscription"
      responses:
        "200":
          description: |-
            Stock APDS contract — subscription approved and activated
            (request did not ask for the APX representation). `ids[]`
            carries the new subscription's id as its single entry, so a
            stock client can later revoke it (Part 8 §8.1).
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/ResponseStatus"
        "201":
          description: |-
            APX contract (Prefer: return=representation) — subscription
            created; includes the signing secret, exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApxEventSubscription"
        "202":
          description: |-
            Stock APDS contract — subscription request received; will be
            processed and then approved/declined. `ids[]` carries the new
            subscription's id as its single entry (Part 8 §8.1).
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/ResponseStatus"
        "400":
          description: |-
            An unregistered topic (`unknown-topic`), or a body that fails the
            schema or a field rule (`invalid-request`, with `errors[]`): a
            webhook-transport subscription without `endpoint`, an empty
            `topics[]`, a secret under 32 bytes of entropy, or an
            `extensions` key outside the Part 4 §4.3 pattern.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |-
            The `Idempotency-Key` was already used with a different body
            (`idempotency-conflict`). A replay with the same body returns
            the subscription as it now stands (Part 4 §4.2a) — never the
            secret a second time.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-webhooks
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: List subscriptions (APX additive operation)
      description: Lists subscriptions visible to the caller. Secrets are never returned.
      parameters:
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated subscription list (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApxEventSubscription"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier for the existing subscription
    get:
      operationId: get-webhooks-id
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: Read one subscription (APX additive operation)
      description: |-
        Returns one subscription the caller may see — its status,
        `activeKeyIds`, and filters — without paging through `GET
        /webhooks`. Secrets are never returned. Readable in every state,
        including `failed` (Part 8 §8.1).
      responses:
        "200":
          description: The subscription (secret never returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApxEventSubscription"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: patch-webhooks-id
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: Update a subscription (APX additive operation)
      description: |-
        Update topics, endpoint, filters, or status (pause, resume a paused
        or failed subscription), or rotate the secret. The body is a JSON
        Merge Patch over the subscription: send only what changes
        (Part 8 §8.1). The precondition is `If-Match` or the body
        `version`; a stale one is 409 `version-conflict` (Part 4 §4.2a).
        While the subscription is `failed`, the only PATCH accepted is one
        that sets `status: active`; any other is 410
        `subscription-failed`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./domains/events/schemas.yaml#/ApxEventSubscriptionPatch"
      responses:
        "200":
          description: Updated subscription (secret never returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApxEventSubscription"
        "404":
          description: No such subscription.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale `If-Match` or body `version` (`version-conflict`, Part 4 §4.2a).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: |-
            The subscription is `failed` and the body does not set
            `status: active` (`subscription-failed`, Part 8 §8.1).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: delete-webhooks-id
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: Revoke (delete) existing subscription
      description: Native APDS 4.1 operation, unchanged (APDS ResponseStatus shape).
      responses:
        "200":
          description: Subscription deleted.
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/ResponseStatus"
        "404":
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/ResponseStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /webhooks/{id}/deliveries:
    get:
      operationId: get-webhooks-id-deliveries
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
        - oAuth: [po, sp, ad]
      tags: [Subscription]
      summary: Delivery ledger for a subscription
      description: |-
        Returns the delivery records for auditing: one per (event,
        subscription), with the attempt count, status, last HTTP code, and
        the per-attempt history (`attemptHistory`: each attempt's
        `APX-Delivery-Id`, time, and code — Part 8 §8.3). Newest first.
        Readable in every subscription state. An event held while the
        subscription is `paused` has no record until its first attempt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
        - name: status
          in: query
          required: false
          description: Only records in this delivery status.
          schema:
            type: string
            enum: [delivered, retrying, failed]
        - name: eventId
          in: query
          required: false
          description: Only the record of this EventEnvelope.id.
          schema: { type: string, format: uuid }
        - name: since
          in: query
          required: false
          description: Only records whose latest attempt is at or after this instant (RFC 3339).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Delivery records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryRecord"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such subscription.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/events/stream:
    get:
      operationId: get-apx-v1-events-stream
      security:
        - apxOAuth: ["apx.subscriptions:manage"]
      tags: [Subscription]
      summary: Server-Sent Events stream (conformance class apx-events-sse)
      description: |-
        Streams EventEnvelopes for a subscription with `transport: sse`.
        Frame grammar (normative, Part 8 §8.4): one event per frame, an
        `id:` line carrying the per-subscription sequence (a decimal
        integer), a single `data:` line carrying the envelope JSON, and a
        blank line; `retry:` and comment lines MAY appear. Reconnect with
        `Last-Event-ID` to resume strictly after that sequence.

        Checks run in this order: the subscription exists and is visible
        (else 404), its transport is `sse` (else 404 `target-not-found` —
        there is no stream for it), it is not `failed` (else 410
        `subscription-failed`), and `Last-Event-ID` is still buffered (else
        410 `stream-position-expired`; re-sync through the Part 5 change
        feed, then reconnect without `Last-Event-ID`).
      parameters:
        - name: subscription
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |-
            text/event-stream of EventEnvelope objects, one per frame
            (`id: <sequence>`, `data: <EventEnvelope JSON>`, blank line).
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames per Part 8 §8.4; each `data:` line validates as an EventEnvelope.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: |-
            No such subscription, or its transport is not sse — both
            `target-not-found` (transport is checked before status).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: |-
            The subscription exhausted its retry schedule and is failed
            (`subscription-failed`), or `Last-Event-ID` is older than the
            server's buffer (`stream-position-expired`) — Part 8 §8.4.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ===== Control (conformance class apx-control) ===== #
  /v1/commands:
    post:
      operationId: post-apx-v1-commands
      security:
        - apxOAuth: ["apx.control:execute"]
      tags: [Control]
      summary: Execute a command (idempotent, perishable, audited)
      description: |-
        Requests an operational action (vendGate, lostTicket, pushRate,
        applyValidation, …). Idempotency-Key REQUIRED. Returns 202 with the
        Command; poll GET /v1/commands/{id} or subscribe to
        apx.control.command.status.v1. Requires scope apx.control:execute
        AND a place grant covering the target.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the command as
            it currently stands, not a snapshot of the first response (Part 4
            §4.2a, Part 6 §6.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "202":
          description: Command accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`); an unknown
            `commandType`, a missing `target`, or a parameter that fails its
            §6.1 definition (`invalid-request`, with `errors[]`); or a command
            that requires `agent` without one (`agent-required`) — Part 12.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |-
            Insufficient scope or place grant (Part 9), the current
            resolution context evaluated the action as not allowed
            (`action-not-allowed`), or approval evidence is missing
            (`approval-required`) — Part 17 §17.3.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            Idempotency-Key replayed with a different body
            (`idempotency-conflict`), or `pushNegotiatedRate` / `matchTicket`
            at a lane with no transaction in progress
            (`lane-no-current-transaction`) — Part 12.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            Refused synchronously, nothing dispatched: command expired before
            dispatch (`command-expired`); unknown validation provider
            (`validation-provider-unknown`); `lostTicket` at a place whose
            applicable rate deck has no `lostTicketFee` line
            (`lost-ticket-fee-undefined`, Part 6 §6.1); a RateTable not
            flagged negotiable (`rate-not-negotiable`); a session that is not
            open (`session-not-open`); or a parameter Reference that names
            nothing (`reference-unknown`) — Part 12.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    get:
      operationId: get-apx-v1-commands
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: List and filter commands (the audit query)
      description: |-
        The commands the caller may see, newest first by the time the
        command was received, each with its full `statusHistory` (Part 6
        §6.1b). Only commands whose target lies inside the token's
        `apx_places` grant are returned; naming a `place` outside the grant
        is 403 `insufficient-grant`. All filters combine with AND.
      parameters:
        - name: target
          in: query
          schema: { type: string, format: uuid }
          description: Commands whose `target.id` is this device, lane, or place.
        - name: place
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
          description: Comma-separated HierarchyElement ids; subtree-inclusive (a command at a lane matches its parent Place).
        - name: commandType
          in: query
          schema: { type: string }
          description: An apx-command-types value (or an implementer's own).
        - name: status
          in: query
          schema: { type: string, enum: [received, accepted, rejected, dispatched, executing, succeeded, failed, expired, cancelled] }
        - name: agent
          in: query
          schema: { type: string }
          description: Commands whose `agent` equals this principal.
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Received at or after this instant (the first `statusHistory` entry).
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Received before this instant.
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated commands (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/commands/{id}:
    get:
      operationId: get-apx-v1-commands-id
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: Read a command (lifecycle + audit trail)
      description: Returns the Command including its immutable statusHistory.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "404":
          description: No such command.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/commands/{id}/cancel:
    post:
      operationId: post-apx-v1-commands-id-cancel
      security:
        - apxOAuth: ["apx.control:execute"]
      tags: [Control]
      summary: Cancel a command before dispatch
      description: Allowed in received/accepted states; afterwards 409 command-not-cancellable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "409":
          description: Not cancellable from the current state (`command-not-cancellable`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/devices:
    get:
      operationId: get-apx-v1-devices
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: List device status overlays
      description: |-
        Live DeviceStatus for every SupplementalEquipment the caller may
        see, optionally narrowed by place and state (Part 6 §6.4). Naming a
        `place` outside the token's `apx_places` grant is 403
        `insufficient-grant`.
      parameters:
        - name: place
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
          description: Comma-separated HierarchyElement ids; subtree-inclusive (a device on a lane matches its parent Place).
        - name: deviceState
          in: query
          schema: { type: string }
          description: An apx-device-states value, e.g. `fault` for everything in fault.
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Device status list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/devices/{id}:
    get:
      operationId: get-apx-v1-devices-id
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: Read one device's status overlay
      description: DeviceStatus keyed by the SupplementalEquipment id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceStatus" }
        "404":
          description: No such device.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/lanes/{id}/current:
    get:
      operationId: get-apx-v1-lanes-id-current
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: Lane inquiry — current transaction context (screen-pop)
      description: |-
        The ticket/credential currently in the machine at this lane, amount
        due, applied validations, latest LPR read, and monthly-credential
        context including the last 10 activity events. When no ticket is in
        the machine — or when a lookup parameter is given — also
        `matchCandidates[]`: the open sessions at the place that plausibly
        belong to the vehicle in the lane (Part 6 §6.7), for a driver who
        has lost the ticket.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: VehicularAccess (lane) UUID.
        - name: plate
          in: query
          schema: { type: string }
          description: Ticket-matching override — the plate as the driver reads it, when the camera missed or misread (Part 6 §6.7).
        - name: phone
          in: query
          schema: { type: string }
          description: Ticket-matching override — a permit holder's phone number, resolved through the account registry (Part 13 §13.1); never a call-routing identifier (Part 17 §17.1).
        - name: credential
          in: query
          schema: { type: string }
          description: Ticket-matching override — a credential identification (card number, tag) the driver names.
      responses:
        "200":
          description: Current lane status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneStatus" }
        "404":
          description: No such lane or no live state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/providers:
    get:
      operationId: get-apx-v1-validations-providers
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Control]
      summary: List validation providers for a place
      description: The venues allowed to validate tickets at the place.
      parameters:
        - name: place
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Validation providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Tolling (optional class; Part 15) ===== #
  /v1/tolling/transactions:
    post:
      operationId: post-apx-v1-tolling-transactions
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Create a toll transaction (idempotent)
      description: |-
        Binds Observation refs + credential + pricing. Idempotency-Key
        REQUIRED. Created `priced` when `pricing` is given, otherwise
        `created` (priced later via `POST …/{id}/price`; Part 15 §15.1).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TollTransaction" }
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the transaction
            the key created, in its current representation (`version` and
            `transactionStatus` may have advanced; Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "201":
          description: Created toll transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`) or a body
            that fails the schema, e.g. no `tollPoint` (`invalid-request`,
            Part 12).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      operationId: get-apx-v1-tolling-transactions
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: List/filter toll transactions
      description: |-
        Filter by plate or credential, status, toll point, place, and time
        window; all filters combine with AND (Part 15 §15.2). Results are
        constrained to the caller's grant.
      parameters:
        - name: plate
          in: query
          description: Convenience alias for `credentialType=licensePlate&credentialIdentification=<plate>`.
          schema: { type: string }
        - name: status
          in: query
          description: |-
            A `transactionStatus` value. A value outside that enum is 400
            `invalid-request`, never an empty list.
          schema: { type: string }
        - name: tollPoint
          in: query
          description: The toll point (SupplementalEquipment id) that produced the transaction.
          schema: { type: string, format: uuid }
        - name: place
          in: query
          description: |-
            Comma-separated HierarchyElement ids, subtree-inclusive. A place
            outside the caller's grant is 403 `insufficient-grant`.
          style: form
          explode: false
          schema: { type: array, items: { type: string, format: uuid } }
        - name: credentialType
          in: query
          description: Matches `credential.credentialType` (an APDS CredentialTypeEnum value, e.g. `rfid`).
          schema: { type: string }
        - name: credentialIdentification
          in: query
          description: Matches `credential.credentialIdentification` exactly (a plate string or tag id).
          schema: { type: string }
        - name: since
          in: query
          description: Only transactions created at or after this instant (`statusHistory[0].time`), RFC 3339.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only transactions created before this instant (`statusHistory[0].time`), RFC 3339.
          schema: { type: string, format: date-time }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Matching transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TollTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tolling/transactions/{id}:
    get:
      operationId: get-apx-v1-tolling-transactions-id
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Read a toll transaction
      description: Includes dispute state and the immutable statusHistory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "404":
          description: No such transaction.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tolling/transactions/{id}/payment:
    post:
      operationId: post-apx-v1-tolling-transactions-id-payment
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Attach the settling Payment reference
      description: |-
        Transitions the transaction to paid. Allowed from `priced`, and from
        `resolved` with resolution `upheld` or `adjusted` on an unpaid
        transaction; anything else is 409 `toll-transition-illegal` (Part 15
        §15.1). Re-attaching the payment already attached returns 200
        unchanged, so a replayed billing batch is harmless.
        Idempotency-Key optional (Part 4 §4.2a).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TollPaymentAttachment" }
      responses:
        "200":
          description: Paid transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such transaction.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |-
            The transaction's state does not accept a payment (`created`,
            `disputed`, `voided`, `resolved` as `refunded` or already paid,
            or `paid` with a different payment — `toll-transition-illegal`),
            or Idempotency-Key replayed with a different body
            (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/tolling/transactions/{id}/price:
    post:
      operationId: post-apx-v1-tolling-transactions-id-price
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Price a created toll transaction
      description: |-
        For pricing engines outside the APX server: sets `pricing` on a
        `created` transaction and moves it to `priced` (Part 15 §15.1).
        From any other state 409 `toll-transition-illegal`; a later price
        change goes through a dispute. Idempotency-Key optional.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/tolling/schemas.yaml#/TollPricing" }
      responses:
        "200":
          description: The transaction, now `priced`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |-
            Not `created` (`toll-transition-illegal`), or Idempotency-Key
            replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tolling/transactions/{id}/void:
    post:
      operationId: post-apx-v1-tolling-transactions-id-void
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Void a toll transaction
      description: |-
        Terminal: the charge should never have been raised (a duplicate, an
        exempt service vehicle, a misread). Allowed from `created` and
        `priced` only; a paid charge is corrected by a dispute resolved
        `refunded`, so `paid`, `disputed`, `resolved`, and `voided` are 409
        `toll-transition-illegal` (Part 15 §15.1). Idempotency-Key optional.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/tolling/schemas.yaml#/TollVoid" }
      responses:
        "200":
          description: The transaction, now `voided`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |-
            Not `created` or `priced` (`toll-transition-illegal`), or
            Idempotency-Key replayed with a different body
            (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tolling/transactions/{id}/disputes:
    post:
      operationId: post-apx-v1-tolling-transactions-id-disputes
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Open a dispute
      description: |-
        Opened by the operator, on the holder's behalf or on its own
        initiative (Part 15 §15.1). Allowed from `priced` and `paid`.
        Re-disputing a `resolved` transaction is 409 `dispute-closed`; a
        `created`, `voided`, or already `disputed` transaction is 409
        `toll-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TollDisputeOpen" }
      responses:
        "200":
          description: Disputed transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "409":
          description: |-
            The dispute is already resolved (`dispute-closed`), or the
            transaction's state does not allow a dispute
            (`toll-transition-illegal`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tolling/transactions/{id}/disputes/resolve:
    post:
      operationId: post-apx-v1-tolling-transactions-id-disputes-resolve
      security:
        - apxOAuth: ["apx.tolling:manage"]
      tags: [Tolling]
      summary: Resolve a dispute
      description: |-
        Allowed from `disputed` only. Base resolution values upheld |
        refunded | adjusted | withdrawn (Part 15 §15.1); `adjusted` carries
        `adjustedPricing`, which replaces `pricing` (the old amount moves to
        `dispute.originalPricing`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TollDisputeResolution" }
      responses:
        "200":
          description: Resolved transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TollTransaction" }
        "409":
          description: |-
            No open dispute: the dispute is already resolved
            (`dispute-closed`), or the transaction was never disputed
            (`toll-transition-illegal`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Violations / enforcement (optional class apx-violations; Part 19) ===== #
  # Net-new like tolling: APDS has no violation entity. Eligibility comes
  # from AssignedRight (APDS's own enforcement source), evidence from native
  # Observations; settlement attaches a Payment reference (Part 13).
  /v1/violations:
    post:
      operationId: post-apx-v1-violations
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Create a violation from a detection (idempotent)
      description: |-
        Records a detected violation — from an automated camera/sensor
        pipeline, a guided-enforcement handheld, or an officer directly
        (`detection.mode`). The `Idempotency-Key` header is REQUIRED:
        cameras and handhelds retry, and a retry must not create a second
        violation. Same key + same body returns the violation's current
        representation (200, Part 4 §4.2a); same key + different body is
        409 idempotency-conflict. The server
        performs the eligibility check at creation and records it in
        `eligibilityCheck`; a vehicle found entitled is still recorded (as
        `dismissed`, with the basis) so the audit trail is complete.
        Publishes `apx.violations.detected.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Violation" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the violation's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "201":
          description: Violation recorded (status `detected`, or `dismissed` when the vehicle was entitled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`), or a body
            that fails the schema or a §19.9 field rule — e.g. no
            `detection`, or a position whose first element is outside
            −180..180 (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            `reference-unknown` — `place`, `space`, or another body
            Reference names nothing visible to the caller, or
            `violationType` is outside the served registries and code lists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-violations
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: List/filter violations
      description: |-
        Filter by plate (credentialIdentification), notice number, status,
        type, place (subtree-inclusive), detection mode, and the
        `since`..`until` window on detectedTime. Results are constrained
        to the caller's place grant; a lookup that names no place (by
        plate or notice number) returns only violations at granted places
        (Part 9 §9.3a). Plate values appear only under `apx.violations:*`
        scopes (Part 9 §9.6).
      parameters:
        - { name: plate, in: query, schema: { type: string } }
        - name: noticeNumber
          in: query
          required: false
          schema: { type: string }
          description: Exact match on `notice.noticeNumber` — the number the driver holds, and the payment `reference` (§19.6).
        - name: status
          in: query
          schema: { type: string, enum: [detected, confirmed, dismissed, issued, paid, appealed, closed, voided] }
        - { name: type, in: query, schema: { type: string } }
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - name: detectionMode
          in: query
          schema: { type: string, enum: [automated, guided, manual] }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Upper bound (exclusive) on `detection.detectedTime`.
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated violations (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/violations/{id}:
    get:
      operationId: get-apx-v1-violations-id
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: Read a violation
      description: Returns the violation including evidence links, the eligibility check, notice, appeal, and the immutable statusHistory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/violations/{id}/review:
    post:
      operationId: post-apx-v1-violations-id-review
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Review a detected candidate (guided enforcement)
      description: |-
        Transition `detected → confirmed` or `detected → dismissed`. The
        officer's decision is recorded with reason and reviewer; a
        `violationType` in the body corrects the detector's classification.
        `dismiss` without `reason` is 400 `invalid-request`. Any other
        starting state is 409 `violation-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationReview" }
      responses:
        "200":
          description: Reviewed violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition (not in `detected`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/violations/{id}/issue:
    post:
      operationId: post-apx-v1-violations-id-issue
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Issue the notice or citation
      description: |-
        Transition `confirmed → issued` — or `detected → issued` for
        `automated` detections where the policy in force permits
        unreviewed issuance (`EnforcementPolicy.unreviewedIssuance`, or
        the operator's published documentation where the policy is
        silent); a `guided` or `manual` detection still in `detected`, or
        an automated one the policy does not permit, is 409
        `violation-not-issuable`. Sets `notice`, `amount`, and `dueTime`.

        The server resolves the EnforcementPolicy in force at `place`
        (Part 19 §19.10) and refuses with 422 when the request breaks it:
        `delivery-method-not-permitted`, `notice-deadline-passed`,
        `penalty-exceeds-cap` (or clamps, per the policy), or
        `signage-required`. On success `policy`, `signage[]`,
        `unpaidAmount`, `capAmount`, and the first `amountHistory` entry
        (`reason: issued`, or `reason: cap` with `requestedAmount` when
        clamped) are frozen onto the violation. Publishes
        `apx.violations.issued.v1`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationIssue" }
      responses:
        "200":
          description: Issued violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Not issuable from the current state or detection mode.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Refused by the enforcement policy in force (delivery method, notice deadline, penalty cap, or signage).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/violations/{id}/payment:
    post:
      operationId: post-apx-v1-violations-id-payment
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Attach the settling Payment reference
      description: |-
        Transition `issued → paid`. The payment itself is taken through the
        Part 13 surface (`POST /v1/payments`, a payment link, or an APDS
        Payment ingested from a pay station); this attaches its reference.
        Not in `issued` is 409 `violation-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationPaymentAttachment" }
      responses:
        "200":
          description: Paid violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition (not in `issued`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/violations/{id}/appeals:
    post:
      operationId: post-apx-v1-violations-id-appeals
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Open an appeal
      description: |-
        Transition `issued → appealed`, or `paid → appealed` within the
        policy's `appealWindowDays` (pay-then-appeal, Part 19 §19.6); the
        state it came from is recorded as `appeal.openedFrom`. One appeal
        per violation: a second appeal, an appeal on a closed or voided
        violation, or one outside the appeal window is 409
        `appeal-closed`. From a state that was never issued (`detected`,
        `confirmed`, `dismissed`) it is 409 `violation-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationAppealOpen" }
      responses:
        "200":
          description: Appealed violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Appeal already opened once, violation closed/voided, or window passed (`appeal-closed`); or a state that was never issued (`violation-transition-illegal`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/violations/{id}/appeals/resolve:
    post:
      operationId: post-apx-v1-violations-id-appeals-resolve
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Resolve an appeal
      description: |-
        `upheld` → back to `appeal.openedFrom` (`issued`, or `paid` for a
        pay-then-appeal); `reduced` → the same, with `amount` replaced by
        `adjustedAmount` (400 `invalid-request` when it is absent);
        `dismissed` → `closed`. A pay-then-appeal resolved `reduced` or
        `dismissed` carries the Part 13 `refund` reference. No open
        appeal, in whatever state, is 409 `appeal-closed`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationAppealResolution" }
      responses:
        "200":
          description: Resolved violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: No open appeal.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/violations/{id}/void:
    post:
      operationId: post-apx-v1-violations-id-void
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Void a violation
      description: |-
        Valid from every non-terminal state (`detected`, `confirmed`,
        `issued`, `appealed`, `paid`); the record and its statusHistory
        remain readable. Voiding a `paid` violation SHOULD carry the Part
        13 `refund` reference. From a terminal state (`dismissed`,
        `closed`, `voided`) it is 409 `violation-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationVoid" }
      responses:
        "200":
          description: Voided violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such violation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Already terminal (`dismissed`, `closed`, or `voided`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/enforcement/eligibility:
    get:
      operationId: get-apx-v1-enforcement-eligibility
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: Is this vehicle entitled to be here right now?
      description: |-
        The guided-enforcement screen-pop (Part 19 §19.3): one call answers
        whether a credential is covered at a place at an instant, and by
        what — composing the APDS AssignedRights (APDS's own enforcement
        source of truth), Sessions, and the reservation/permit profiles the
        server holds. A convenience READ in the spirit of lane inquiry and
        the occupancy snapshot: the AssignedRight remains authoritative and
        a client MAY derive the same answer from the native routes. Lives
        under `/v1/enforcement` (not `/v1/violations/…`) because no
        violation exists yet when the question is asked.
      parameters:
        - name: credential
          in: query
          required: true
          schema: { type: string }
          description: The credential value — plate string, permit number, transponder id.
        - name: credentialType
          in: query
          required: false
          schema:
            $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/CredentialTypeEnum"
          description: APDS CredentialTypeEnum; defaults to `licensePlate`.
        - name: place
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: HierarchyElement UUID the vehicle is observed at (subtree semantics for rights bound to an ancestor).
        - name: at
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: The instant to evaluate; defaults to now.
      responses:
        "200":
          description: The entitlement answer with its basis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EligibilityResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such place element.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ----- Enforcement policy and signage (Part 19 §19.10–19.11) ----- #
  /v1/enforcement/policies:
    post:
      operationId: post-apx-v1-enforcement-policies
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Create an enforcement policy (idempotent)
      description: |-
        Binds jurisdictional rules to a HierarchyElement. `Idempotency-Key`
        REQUIRED. The policy applies to the element and its subtree from
        `effectiveFrom` unless a descendant carries its own.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnforcementPolicy" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the policy's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementPolicy" }
        "201":
          description: Policy created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementPolicy" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            `reference-unknown` — `place` names nothing visible to the
            caller; or `request-unprocessable` — an inconsistent policy,
            e.g. `effectiveTo` before `effectiveFrom`, or an escalation step
            whose fixed `addAmount` alone exceeds
            `overallCeiling.maximumAmount`. (Steps that only might reach
            the ceiling are lawful: the ceiling clamps, §19.10 rule 3.)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-enforcement-policies
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: List enforcement policies
      description: Policies bound at or below `place`, optionally filtered by status.
      parameters:
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: string, enum: [active, superseded, retired] }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated policies (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EnforcementPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/enforcement/policies/effective:
    get:
      operationId: get-apx-v1-enforcement-policies-effective
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: The policy in force at a place
      description: |-
        Resolves inheritance: the nearest ancestor-or-self `active` policy
        whose effective window covers `at` (default now). This is exactly
        what the server applies at `issue` and for escalation, so
        handhelds, pipelines, and appeals portals see the same rules.
      parameters:
        - { name: place, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: at, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such place, or no policy in force for it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/enforcement/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: get-apx-v1-enforcement-policies-id
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: Read an enforcement policy
      description: Returns the policy including its immutable statusHistory.
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such policy.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: put-apx-v1-enforcement-policies-id
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Update an enforcement policy (full update, versioned)
      description: |-
        Full-update semantics. The precondition is the `version` last
        read, sent as `If-Match: "<version>"` or as the body's `version`
        (Part 4 §4.2a); a stale one is 409 `version-conflict` and nothing
        is written. Changes apply to issuance and escalation from the
        update onward; violations already issued keep the `policy`
        version they were issued under.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnforcementPolicy" }
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such policy.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Stale version (`version-conflict`, current version in `detail`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`reference-unknown` (unknown `place`) or `request-unprocessable` (an inconsistent policy, as on create)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/enforcement/signage:
    post:
      operationId: post-apx-v1-enforcement-signage
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Record posted signage (idempotent)
      description: |-
        Records the text, photo, and position of a sign at a place.
        `Idempotency-Key` REQUIRED. To change the wording later, create a
        new record (or new version) with the new `effectiveFrom` and set
        the old one's `effectiveTo` — historical text is never rewritten.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Signage" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the record's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signage" }
        "201":
          description: Signage recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signage" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`reference-unknown` — `place` or `policy` names nothing visible to the caller."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-enforcement-signage
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: List signage records
      description: Signage bound at or below `place`, optionally filtered by status.
      parameters:
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: string, enum: [active, superseded, removed] }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated signage (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Signage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/enforcement/signage/effective:
    get:
      operationId: get-apx-v1-enforcement-signage-effective
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: The signage in force at a place
      description: |-
        Every `active` Signage record bound to `place` or an ancestor whose
        effective window covers `at` (default now) — what the server
        freezes onto a violation at `issue`.
      parameters:
        - { name: place, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: at, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Signage in force (may be empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Signage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such place.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/enforcement/signage/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: get-apx-v1-enforcement-signage-id
      security:
        - apxOAuth: ["apx.violations:read"]
      tags: [Violations]
      summary: Read a signage record
      description: Returns the record including its immutable statusHistory.
      responses:
        "200":
          description: The signage record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such record.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: put-apx-v1-enforcement-signage-id
      security:
        - apxOAuth: ["apx.violations:manage"]
      tags: [Violations]
      summary: Update a signage record (full update, versioned)
      description: |-
        Full-update semantics. The precondition is the `version` last
        read, sent as `If-Match: "<version>"` or as the body's `version`
        (Part 4 §4.2a); a stale one is 409 `version-conflict`. Changing
        `text` on a record that any issued violation references is
        refused (422 `signage-referenced`) — supersede it instead.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Signage" }
      responses:
        "200":
          description: Updated record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such record.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Stale version (`version-conflict`, current version in `detail`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Text change on a referenced record (`signage-referenced`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ===== Validations program management (optional class apx-validations; Part 20) ===== #
  # Builds on Part 6 §6.3: the provider lookup (/v1/validations/providers)
  # and the applyValidation command stay as they are; this adds merchant
  # enrolment, instrument stock, the redemption ledger, and billing.
  /v1/validations/programs:
    post:
      operationId: post-apx-v1-validations-programs
      security:
        - apxOAuth: ["apx.validations:manage"]
      tags: [Validations]
      summary: Enrol a validation program (idempotent)
      description: |-
        Enrols a merchant to validate parking at a place. `Idempotency-Key`
        REQUIRED. The program becomes a row in the Part 6 provider lookup
        for that place while `active`. Publishes
        `apx.validations.program.status.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationProgram" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the program's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationProgram" }
        "201":
          description: Program enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationProgram" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            `reference-unknown` — `place`, `provider`, or an
            `applicableRateTables` entry names nothing visible to the
            caller; or `request-unprocessable` — a benefit carrying none or
            more than one of amount/duration/percentage (§20.1).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-validations-programs
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: List/filter validation programs
      description: |-
        Filter by place (subtree-inclusive), provider, and status. A
        `apx.validations:redeem` token sees only programs whose provider is
        its own `apx_org` (Part 20 §20.5).
      parameters:
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - { name: provider, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, ended] }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated programs (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/programs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: get-apx-v1-validations-programs-id
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Read a validation program
      description: |-
        Returns the program including rules, billing, and the immutable
        statusHistory. A `redeem` token reading another provider's program
        receives 404, exactly as for a program that does not exist (Part 9
        §9.3a rule 2; Part 20 §20.5).
      responses:
        "200":
          description: The program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program, or another provider's program under a `redeem` token (`target-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: put-apx-v1-validations-programs-id
      security:
        - apxOAuth: ["apx.validations:manage"]
      tags: [Validations]
      summary: Update a validation program (full update, versioned)
      description: |-
        Full-update semantics (Part 5 §5.1): the body carries the complete
        program. The precondition is the `version` last read, sent as
        `If-Match: "<version>"` or as the body's `version` (Part 4 §4.2a);
        a stale one is 409 `version-conflict`. Status transitions:
        `active ⇄ suspended`, either → `ended` (terminal; 422
        `program-not-active` for any transition out of `ended`). Benefit
        and rule changes apply to redemptions from the update onward;
        existing instruments keep the benefit they were issued with.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationProgram" }
      responses:
        "200":
          description: Updated program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Stale version (`version-conflict`, current version in `detail`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            `program-not-active` — a transition out of `ended`;
            `request-unprocessable` — a benefit carrying none or more than
            one of amount/duration/percentage; `reference-unknown` — a body
            Reference names nothing visible to the caller.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/validations/programs/{id}/issuances:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post-apx-v1-validations-programs-id-issuances
      security:
        - apxOAuth: ["apx.validations:manage"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Issue a batch of validation instruments (idempotent)
      description: |-
        Issues `quantity` instruments of `method` to the program the path
        names; the body need not repeat `program` (a value that differs
        from the path is 422 `request-unprocessable`). `Idempotency-Key`
        REQUIRED — a retried print job must not double the stock. For
        `code`/`qrCode`/`digital`, the generated `codes[]` are returned in
        THIS response only. Program must be `active` (422
        `program-not-active`).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/validations/schemas.yaml#/ValidationIssuanceRequest" }
      responses:
        "200":
          description: Idempotent replay — returns the issuance's current representation, without codes (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationIssuance" }
        "201":
          description: Batch issued; includes `codes[]` exactly once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationIssuance" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            `program-not-active` — the program is not `active`;
            `request-unprocessable` — `method` is not in the program's
            `issuanceMethods`, or a body `program` differs from the path.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-validations-programs-id-issuances
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: List issuances for a program
      description: Batches issued to the program, newest first. Codes are never returned here.
      parameters:
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated issuances (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationIssuance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/instruments/{code}:
    get:
      operationId: get-apx-v1-validations-instruments-code
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Check a validation code
      description: |-
        "Is this code good?" — the pay-station / merchant-app read before
        applying. Returns status, program, validity window, and the
        benefit. A code the caller's grant cannot see is 404, never 403
        (no oracle for guessing codes).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The instrument.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationInstrument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown code (or outside the caller's grant).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/programs/{id}/issuances/{issuanceId}/void:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: issuanceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post-apx-v1-validations-programs-id-issuances-issuanceid-void
      security:
        - apxOAuth: ["apx.validations:manage"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Void an issuance batch
      description: |-
        Transition `issued → void` for the batch, and every instrument in
        it that is `valid` or `expired` → `void` (Part 20 §20.2 rule 5) —
        the stolen sheet of QR codes. Instruments already `redeemed` are
        unaffected; their redemptions stand until reversed. The result's
        `voidDetail.voidedCount` says how many codes were voided. A `redeem`
        token may void only its own provider's batches (another
        provider's is 404, §20.5). Voiding a batch already `void` returns
        it unchanged (200). No event is published; the instrument read is
        the source of truth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/validations/schemas.yaml#/ValidationVoid" }
      responses:
        "200":
          description: The voided issuance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationIssuance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program or issuance, or another provider's under a `redeem` token (`target-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/instruments/{code}/void:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: post-apx-v1-validations-instruments-code-void
      security:
        - apxOAuth: ["apx.validations:manage"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Void a single validation code
      description: |-
        Transition one instrument `valid` or `expired` → `void` (Part 20
        §20.2 rule 5) — a single leaked code. A `redeemed` code cannot be
        voided (422 `instrument-invalid`; reverse the redemption first).
        Voiding a code already `void` returns it unchanged (200). As on
        the read, a code outside the caller's grant or provider is 404,
        never 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/validations/schemas.yaml#/ValidationVoid" }
      responses:
        "200":
          description: The voided instrument.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationInstrument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown code (or outside the caller's grant or provider).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The code is already `redeemed` (`instrument-invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/redemptions:
    post:
      operationId: post-apx-v1-validations-redemptions
      security:
        - apxOAuth: ["apx.validations:manage"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Record a redemption (idempotent)
      description: |-
        Applies a validation to a ticket/session from a pay station,
        merchant app, or lane device — the data-plane counterpart of the
        Part 6 `applyValidation` command (which agents use to act on a
        lane; it materializes the same resource). `Idempotency-Key`
        REQUIRED. The server evaluates the program rules (Part 20 §20.3):
        422 `program-not-active`, `request-unprocessable` (the body's
        `place` is not the program's place or within its subtree),
        `instrument-invalid`, `redemption-limit-exceeded`. On success the session gains the APDS
        `Segment.validationId` and `amountReduced` reflects the ACTUAL
        reduction. Publishes `apx.validations.redeemed.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationRedemption" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the redemption's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRedemption" }
        "201":
          description: Redemption applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRedemption" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            In §20.3 order: `program-not-active` (program not `active`);
            `request-unprocessable` (place mismatch — `detail` names the
            program's place); `instrument-invalid` (unknown, void, expired,
            or used code, or a required instrument absent);
            `redemption-limit-exceeded` (a program rule refuses it);
            `reference-unknown` (a body Reference names nothing visible).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-validations-redemptions
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: List/filter redemptions
      description: |-
        Filter by program, place, ticket, session, the Part 6 command that
        applied it, channel, status, and `since` (appliedTime). A `redeem`
        token sees only its own provider's redemptions (§20.5).
      parameters:
        - { name: program, in: query, schema: { type: string, format: uuid } }
        - name: command
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: The `applyValidation` Command (Part 6 §6.3) whose redemption to find — matches `ValidationRedemption.command`.
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: session, in: query, schema: { type: string, format: uuid } }
        - name: channel
          in: query
          schema: { type: string, enum: [lane, payStation, merchantApp, callCenter, api] }
        - name: status
          in: query
          schema: { type: string, enum: [applied, reversed] }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated redemptions (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationRedemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/redemptions/{id}:
    get:
      operationId: get-apx-v1-validations-redemptions-id
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Read a redemption
      description: |-
        Returns the redemption including any reversal and the immutable
        statusHistory. Another provider's redemption under a `redeem`
        token is 404 (Part 9 §9.3a rule 2).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The redemption.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRedemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such redemption, or another provider's under a `redeem` token (`target-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/redemptions/{id}/reverse:
    post:
      operationId: post-apx-v1-validations-redemptions-id-reverse
      security:
        - apxOAuth: ["apx.validations:manage"]
      tags: [Validations]
      summary: Reverse a redemption
      description: |-
        Transition `applied → reversed`; the amount due on the session is
        restored while the session is still open (Part 20 §20.4), and the
        instrument (if any) returns to `valid` while still within its
        window. Already reversed is 409 `redemption-reversed`. A
        redemption already billed on a CLOSED statement is reversed too:
        the closed statement is never edited; `reversal.closedStatement`
        names it, and the next statement closed for the program carries a
        negative `credit` line (`reversal.creditedOn` is set when it
        closes, §20.6).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationRedemptionReversal" }
      responses:
        "200":
          description: Reversed redemption.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRedemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such redemption.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Already reversed (`redemption-reversed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/validations/programs/{id}/statement:
    get:
      operationId: get-apx-v1-validations-programs-id-statement
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Preview a billing statement for a period
      description: |-
        Computes the program's redemptions and billable total for
        `from`..`to` under its billing model — a preview
        (`statementStatus: preview`, no `id`), including the `credit`
        lines the period would carry. Closing the period is
        `POST …/statements`. `from` not before `to` is 400
        `invalid-request`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The computed statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/programs/{id}/statements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post-apx-v1-validations-programs-id-statements
      security:
        - apxOAuth: ["apx.validations:manage"]
      tags: [Validations]
      summary: Close a billing period (idempotent)
      description: |-
        Freezes the period into an immutable statement the operator's
        accounting invoices from. `Idempotency-Key` REQUIRED. Periods MUST
        NOT overlap an existing closed statement (409 `statement-overlap`).
        The statement carries a negative `credit` line for every
        redemption reversed since an earlier statement billed it, and
        sets `reversal.creditedOn` on each (Part 20 §20.6). Publishes
        `apx.validations.statement.closed.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationStatementClose" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the statement (Part 4 §4.2a; a closed statement never changes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationStatement" }
        "201":
          description: Period closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationStatement" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`), or a period whose `periodStart` is not before `periodEnd` or a body that fails the schema (`invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Overlaps a closed statement, or Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-validations-programs-id-statements
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: List closed statements for a program
      description: Closed statements, newest period first; `lines[]` omitted.
      parameters:
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated statements (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such program.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/validations/statements/{id}:
    get:
      operationId: get-apx-v1-validations-statements-id
      security:
        - apxOAuth: ["apx.validations:read"]
        - apxOAuth: ["apx.validations:redeem"]
      tags: [Validations]
      summary: Read a closed statement
      description: |-
        The immutable statement with `lines[]`. Another provider's
        statement under a `redeem` token is 404 (Part 9 §9.3a rule 2).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such statement, or another provider's under a `redeem` token (`target-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Credentials lifecycle (optional class apx-credentials; Part 21) ===== #
  # APDS models a credential as CredentialAssigned on an AssignedRight with
  # no status, replacement, media, or access history; this adds those and
  # materializes active records back onto the AssignedRight (§21.2).
  # GET /v1/credentials/{id}/passback (Part 17) stays where it is.
  /v1/credentials:
    post:
      operationId: post-apx-v1-credentials
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Issue a credential (idempotent)
      description: |-
        Creates a CredentialRecord in `issued`. It becomes `active` either
        by a later `activate` call or, when the body sets
        `activateOnStart: true`, by the server itself at `validity.start`
        (at once when that is absent or past), with actor `system` (Part 21
        §21.1 rule 6). `Idempotency-Key` REQUIRED.
        `credentialIdentification` MUST be unique per `credentialType`
        among non-terminal records (409 `credential-identification-in-use`,
        whose `detail` MUST NOT identify the holding record, holder, or
        place — §21.5). Server-assigned members in the body (`id`,
        `version`, `credentialStatus`, `suspension`, `replacedBy`,
        `statusHistory`, `recordInfo`) are ignored. Publishes
        `apx.credentials.status.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRecord" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the ORIGINAL record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "201":
          description: Credential issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a record that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Identification already in use for this type (`credential-identification-in-use`), or Idempotency-Key replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            Unknown holder, account, assigned right, or place
            (`reference-unknown`); or a validity window that is already over
            or inverted — `validity.end` not in the future, or before
            `validity.start` (`request-unprocessable`, Part 21 §21.1 rule 7).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-credentials
      security:
        - apxOAuth: ["apx.credentials:read"]
      tags: [Credentials]
      summary: List/filter credentials
      description: |-
        Filter by holder, account, type, identification, status, and place
        (subtree-inclusive). Results are constrained to the caller's place
        grant; identification values are personal data under Part 9 §9.6.
        A lookup by `identification` that matches only records outside the
        grant returns an empty 200 (Part 9 §9.3a).
      parameters:
        - { name: holder, in: query, schema: { type: string, format: uuid } }
        - { name: account, in: query, schema: { type: string, format: uuid } }
        - name: type
          in: query
          schema:
            $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/CredentialTypeEnum"
        - { name: identification, in: query, schema: { type: string } }
        - name: status
          in: query
          schema: { type: string, enum: [issued, active, suspended, lost, revoked, expired, replaced] }
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated credentials (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/credentials/{id}:
    get:
      operationId: get-apx-v1-credentials-id
      security:
        - apxOAuth: ["apx.credentials:read"]
      tags: [Credentials]
      summary: Read a credential
      description: Returns the record including media, replacement links, and the immutable statusHistory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/credentials/{id}/activate:
    post:
      operationId: post-apx-v1-credentials-id-activate
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Activate a credential
      description: "Transition `issued → active`; materializes the APDS CredentialAssigned (§21.2). Any other state is 409 `credential-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialTransition" }
      responses:
        "200":
          description: Active credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/credentials/{id}/suspend:
    post:
      operationId: post-apx-v1-credentials-id-suspend
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Suspend a credential
      description: "Transition `active → suspended` (optionally `until`, which MUST be in the future — else 422 `request-unprocessable`); the lane MUST deny it meanwhile. Any other state is 409 `credential-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialTransition" }
      responses:
        "200":
          description: Suspended credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`until` is not in the future (`request-unprocessable`, Part 21 §21.1 rule 7); nothing is written."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/credentials/{id}/resume:
    post:
      operationId: post-apx-v1-credentials-id-resume
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Resume a suspended credential
      description: "Transition `suspended → active`. Any other state is 409 `credential-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialTransition" }
      responses:
        "200":
          description: Active credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/credentials/{id}/report-lost:
    post:
      operationId: post-apx-v1-credentials-id-report-lost
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Report a credential lost or stolen
      description: "Transition `active | suspended → lost`; the lane MUST deny it from this instant. Follow with `replace` or `revoke`. Any other state is 409 `credential-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialTransition" }
      responses:
        "200":
          description: Credential marked lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/credentials/{id}/revoke:
    post:
      operationId: post-apx-v1-credentials-id-revoke
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Revoke a credential (terminal)
      description: "Transition `issued | active | suspended | lost → revoked`; removes the APDS CredentialAssigned. Terminal states are 409 `credential-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialTransition" }
      responses:
        "200":
          description: Revoked credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/credentials/{id}/replace:
    post:
      operationId: post-apx-v1-credentials-id-replace
      security:
        - apxOAuth: ["apx.credentials:manage"]
      tags: [Credentials]
      summary: Replace a credential with a successor (idempotent)
      description: |-
        Issues a successor `active` record inheriting holder, account,
        assigned rights, places, and validity; links `replaces`/`replacedBy`;
        moves THIS record to `replaced` and swaps the APDS CredentialAssigned
        atomically. The predecessor keeps every other field it had (§21.3).
        Allowed from `active`, `suspended`, or `lost`. From `issued` it is
        409 `credential-transition-illegal` (revoke it and issue anew);
        `credential-not-replaceable` is reserved for the terminal states
        `revoked`, `expired`, `replaced`. `Idempotency-Key` REQUIRED.
        Returns the successor.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialReplaceRequest" }
      responses:
        "200":
          description: Idempotent replay — returns the ORIGINAL successor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "201":
          description: The successor credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRecord" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a body that fails the schema (`invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            Terminal record (`credential-not-replaceable`), a record still
            `issued` (`credential-transition-illegal`), successor
            identification in use (`credential-identification-in-use`), or
            key replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/credentials/{id}/access-events:
    get:
      operationId: get-apx-v1-credentials-id-access-events
      security:
        - apxOAuth: ["apx.credentials:read"]
      tags: [Credentials]
      summary: Access-event history for a credential
      description: |-
        Entry/exit attempts with this credential, newest first — granted
        or denied, where, and why. The same events are published as
        `apx.credentials.access.v1`. Retention per Part 9 §9.6.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Exclusive upper bound on `occurredAt`.", schema: { type: string, format: date-time } }
        - name: outcome
          in: query
          schema: { type: string, enum: [granted, denied] }
        - name: direction
          in: query
          schema: { type: string, enum: [entry, exit] }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated access events (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialAccessEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such credential.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/access-events:
    get:
      operationId: get-apx-v1-access-events
      security:
        - apxOAuth: ["apx.credentials:read"]
      tags: [Credentials]
      summary: Access events by place, lane, or reader
      description: |-
        Every access attempt at the caller's granted places, newest first —
        including presentations that matched no CredentialRecord
        (`denialReason: unknownCredential`, carrying `presented`). "Every
        denial at lane 1 tonight" is `?lane=…&outcome=denied&since=…`.
        Results are constrained to the caller's place grant; naming a
        place, lane, or device outside it is 403 `insufficient-grant`
        (Part 9 §9.3a). Retention per Part 9 §9.6. The same events are
        published as `apx.credentials.access.v1` (Part 21 §21.4).
      parameters:
        - name: place
          in: query
          description: HierarchyElement ids, comma-separated; subtree-inclusive.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
        - { name: lane, in: query, description: The VehicularAccess., schema: { type: string, format: uuid } }
        - { name: device, in: query, description: The reader (SupplementalEquipment)., schema: { type: string, format: uuid } }
        - { name: credential, in: query, description: A CredentialRecord id., schema: { type: string, format: uuid } }
        - name: outcome
          in: query
          schema: { type: string, enum: [granted, denied] }
        - { name: denialReason, in: query, schema: { type: string } }
        - name: direction
          in: query
          schema: { type: string, enum: [entry, exit] }
        - { name: since, in: query, description: "Inclusive lower bound on `occurredAt`.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Exclusive upper bound on `occurredAt`.", schema: { type: string, format: date-time } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated access events (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "./domains/credentials/schemas.yaml#/AccessEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Valet (optional class apx-valet; Part 22) ===== #
  # Net-new: APDS has no valet entity. The stay is a native Session; this
  # adds custody, keys, condition evidence, the retrieval queue, staging,
  # and handback.
  /v1/valet/tickets:
    post:
      operationId: post-apx-v1-valet-tickets
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Take custody of a vehicle (drop-off, idempotent)
      description: |-
        Creates the ValetTicket in `dropped` with the drop-off condition
        report. `Idempotency-Key` REQUIRED (handhelds and scanning devices
        retry). The server SHOULD open the APDS Session for the stay and
        reference it, unless the body already references one. `storage`,
        `retrieval`, `handback`, `statusHistory`, and `recordInfo` in the
        body are ignored — the server writes them (Part 22 §22.1 rule 5).
        A `customer.contactChannel.handle` that carries a raw phone number
        or e-mail address SHOULD be refused with 422
        `personal-data-not-permitted` rather than stored or silently
        masked (§22.6). Publishes `apx.valet.ticket.status.v1`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetTicket" }
      responses:
        "200":
          description: Idempotent replay — same key + same body returns the ORIGINAL ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "201":
          description: Custody taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "400":
          description: Missing Idempotency-Key (`idempotency-key-required`) or a ticket that fails the schema (`invalid-request`, with `errors[]`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            Unknown place, lane, session, or customer reference
            (`reference-unknown`), or a raw phone number or e-mail address
            where an opaque handle is required (`personal-data-not-permitted`,
            §22.6).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-valet-tickets
      security:
        - apxOAuth: ["apx.valet:read"]
      tags: [Valet]
      summary: List/filter valet tickets
      description: Filter by place (subtree-inclusive), status, plate, ticket number, customer account, and `since` (dropOff.time).
      parameters:
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: string, enum: [dropped, parked, requested, retrieving, staged, handedBack, closed, cancelled] }
        - { name: plate, in: query, schema: { type: string } }
        - { name: ticketNumber, in: query, schema: { type: string } }
        - { name: account, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated tickets (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/valet/queue:
    get:
      operationId: get-apx-v1-valet-queue
      security:
        - apxOAuth: ["apx.valet:read"]
      tags: [Valet]
      summary: The retrieval queue for a place (attendant board)
      description: |-
        Tickets in `requested`, `retrieving`, or `staged` at the place,
        ordered by `retrieval.promisedTime` ascending — what the runners
        and the stand see. Scheduled pickups (`requestedFor`) appear when
        they fall inside `horizonMinutes` (default 60).
      parameters:
        - { name: place, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: horizonMinutes, in: query, required: false, schema: { type: integer, minimum: 0, default: 60 } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: The queue (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such place.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/valet/tickets/{id}:
    get:
      operationId: get-apx-v1-valet-tickets-id
      security:
        - apxOAuth: ["apx.valet:read"]
        - apxOAuth: ["apx.valet:request"]
      tags: [Valet]
      summary: Read a valet ticket
      description: |-
        Full record for operator scopes. A `apx.valet:request` token sees
        only its own ticket, as the minimized projection of Part 22 §22.5
        — `id`, `version`, `place`, `ticketNumber`, `vehicle`,
        `customer.displayName`, `dropOff.time`, `retrieval.{requestedTime,
        requestedFor, channel, etaMinutes, promisedTime, stagingLane,
        stagedTime, cancelledTime}`, `handback.time`, `valetStatus`, and
        `extensions`; everything else, including `statusHistory`, is
        omitted. The same projection applies to the ticket a
        `apx.valet:request` token gets back from `retrieve` and
        `cancel-retrieval`. An operator token gets 403 `insufficient-grant` for a
        ticket at a place outside its grant (Part 9 §9.3a).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such ticket, or — for an `apx.valet:request` token — a ticket it is not bound to (`target-not-found`; existence is never disclosed, Part 9 §9.3a).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/valet/tickets/{id}/park:
    post:
      operationId: post-apx-v1-valet-tickets-id-park
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Record the parked position and key location
      description: |-
        Transition `dropped → parked`; update `storage` while `parked`; or
        re-park a `staged` car the customer is not collecting yet
        (`staged → parked`: records the new `storage`, clears
        `retrieval.stagingLane`/`stagedTime`, and sets
        `retrieval.cancelledTime` and `cancelReason: re-parked`). Any
        other state is 409 `valet-transition-illegal`. Send `If-Match`
        with the version last read so two runners cannot overwrite each
        other's `storage`: a stale value is 409 `version-conflict` (Part 4
        §4.2a); without it the write is last-writer-wins.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetParkRequest" }
      responses:
        "200":
          description: Parked ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such ticket.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition (`valet-transition-illegal`), or a stale `If-Match` (`version-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/valet/tickets/{id}/retrieve:
    post:
      operationId: post-apx-v1-valet-tickets-id-retrieve
      security:
        - apxOAuth: ["apx.valet:manage"]
        - apxOAuth: ["apx.valet:request"]
      tags: [Valet]
      summary: Request the vehicle (now or scheduled)
      description: |-
        Transition `parked → requested`. The customer's text, app, web
        page, or voice bot calls this on `apx.valet:request` for its own
        ticket; attendants and the call center on `apx.valet:manage`. The
        server sets `retrieval.etaMinutes` and `promisedTime` and
        publishes `apx.valet.retrieval.requested.v1`. A repeat while
        `requested` or `retrieving` ("CAR" texted twice) is not an error:
        200 with the current ticket and ETA, nothing appended or
        republished, and the body's `requestedFor` ignored (to reschedule,
        `cancel-retrieval` then `retrieve`). From `dropped` (not yet
        parked) it is 409 `valet-vehicle-not-located`; from `staged`,
        `handedBack`, `closed`, or `cancelled` it is 409
        `valet-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetRetrievalRequest" }
      responses:
        "200":
          description: Requested ticket with ETA (or the unchanged ticket, for a repeat while `requested`/`retrieving`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such ticket, or — for an `apx.valet:request` token — a ticket it is not bound to (`target-not-found`, Part 9 §9.3a). An operator token gets 403 `insufficient-grant` for a ticket outside its grant.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Vehicle not yet located, or illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/valet/tickets/{id}/cancel-retrieval:
    post:
      operationId: post-apx-v1-valet-tickets-id-cancel-retrieval
      security:
        - apxOAuth: ["apx.valet:manage"]
        - apxOAuth: ["apx.valet:request"]
      tags: [Valet]
      summary: Cancel an open retrieval request
      description: "Transition `requested | retrieving → parked`. A staged car is re-parked by the operator with `park`, not cancelled here. Any other state is 409 `valet-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetCancelRetrievalRequest" }
      responses:
        "200":
          description: Ticket back in `parked`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such ticket, or — for an `apx.valet:request` token — a ticket it is not bound to (`target-not-found`, Part 9 §9.3a). An operator token gets 403 `insufficient-grant` for a ticket outside its grant.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/valet/tickets/{id}/stage:
    post:
      operationId: post-apx-v1-valet-tickets-id-stage
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Vehicle at the staging lane
      description: "Transition `requested | retrieving → staged`; sets `retrieval.stagingLane`/`stagedTime` and notifies the customer's contact channel. Any other state is 409 `valet-transition-illegal`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetStageRequest" }
      responses:
        "200":
          description: Staged ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such ticket.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/valet/tickets/{id}/handback:
    post:
      operationId: post-apx-v1-valet-tickets-id-handback
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Hand the vehicle to a verified customer
      description: |-
        Transition `staged → handedBack` (or `dropped → handedBack` before
        the car moved). The attendant verifies the claimant
        (`verificationMethod`) — a mismatch is 403
        `valet-verification-failed` and MUST be recorded in
        `statusHistory`. Records the handback condition report. The APDS
        Session closes per the operator's flow; `closed` follows
        server-side when it settles.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValetHandbackRequest" }
      responses:
        "200":
          description: Handed back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Insufficient scope/grant, or claimant verification failed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such ticket.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Illegal transition.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/valet/tickets/{id}/pickup:
    post:
      operationId: post-apx-v1-valet-tickets-id-pickup
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: A runner has gone for the car
      description: |-
        Transition `requested → retrieving`; sets
        `retrieval.retrievingBy` (the body's value, else the calling
        principal) — what the runner board shows as "on its way". Optional:
        `stage` from `requested` remains valid, and a server MAY infer
        `retrieving` from its own runner assignment instead (Part 22 §22.1
        rule 2). Any other state is 409 `valet-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/valet/schemas.yaml#/ValetPickupRequest" }
      responses:
        "200":
          description: Ticket in `retrieving`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal transition (`valet-transition-illegal`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/valet/tickets/{id}/cancel:
    post:
      operationId: post-apx-v1-valet-tickets-id-cancel
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Abandon a drop-off before custody (terminal)
      description: |-
        Transition `dropped → cancelled` — the driver left before the car
        moved, or the ticket was opened in error. Appends
        `statusHistory[]` and publishes `apx.valet.ticket.status.v1`; the
        server SHOULD close the APDS Session it opened at drop-off at no
        charge. A customer who changes their mind *after* the walk-around
        but takes the car back is `handback` from `dropped` instead. Any
        other state is 409 `valet-transition-illegal`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./domains/valet/schemas.yaml#/ValetCancelRequest" }
      responses:
        "200":
          description: Ticket `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal transition (`valet-transition-illegal`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/valet/tickets/{id}/condition:
    post:
      operationId: post-apx-v1-valet-tickets-id-condition
      security:
        - apxOAuth: ["apx.valet:manage"]
      tags: [Valet]
      summary: Append a condition-report correction
      description: |-
        Records a finding made after drop-off — the door ding a runner sees
        at P3 — without editing the drop-off report (Part 22 §22.2 rule 3).
        Each `damage[]` entry is appended to
        `dropOff.conditionReport.damage[]` stamped with a server-set
        `recordedTime` and `recordedBy` (the body's `recordedBy`, else the
        calling principal); `imageLinks[]` are appended to the report's
        `imageLinks[]`; `notes` becomes the `detail` of a new
        `statusHistory[]` entry whose `state` is the unchanged
        `valetStatus`. The report's original `notes`, `recordedTime`,
        `recordedBy`, and `customerAcknowledged` never change, and
        `customerAcknowledged` in the body is ignored. Legal in any state
        except `closed` and `cancelled` (409 `valet-transition-illegal`).
        Send `Idempotency-Key` when retrying: an append retried without
        one is appended twice.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConditionReport" }
      responses:
        "200":
          description: The ticket with the correction appended (or, on an idempotent replay, the current ticket).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValetTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ticket `closed` or `cancelled` (`valet-transition-illegal`), or Idempotency-Key replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Reservations & permits (optional classes; Part 14) ===== #
  # Reservations use NATIVE routes (/quotes, /rights/assigned) with the
  # apds-ext:apx:reservation@1.0 extension; only permits add endpoints.
  /v1/reservations/recent:
    get:
      operationId: get-apx-v1-reservations-recent
      security:
        - apxOAuth: ["apx.reservations:manage"]
      tags: [Reservations]
      summary: A customer's last 10 reservations
      description: |-
        Customer history for screen-pops and dispute handling: the same
        holder's most recent reservations (newest planned start first),
        resolved from a plate or an explicit RightHolder id. At least one
        of `plate` or `holder` is REQUIRED (400 `invalid-request`
        otherwise); when both are given the result is their intersection
        (reservations of that holder carrying that plate). `from`/`to`,
        `state`, `country`, and `stateProvince` narrow further (Part 14
        §14.1a).
      parameters:
        - { name: plate, in: query, schema: { type: string } }
        - { name: holder, in: query, schema: { type: string, format: uuid } }
        - name: country
          in: query
          description: |-
            Plate issuing country (APDS VehicleAncillaryIdentification.country
            vocabulary). Qualifies `plate`; absent, the plate string alone
            is matched.
          schema: { type: string, examples: [US] }
        - name: stateProvince
          in: query
          description: Plate issuing state/province (APDS VehicleAncillaryIdentification.stateProvince vocabulary). Qualifies `plate`.
          schema: { type: string, examples: [FL] }
        - name: from
          in: query
          description: |-
            Only reservations whose `plannedStart` is at or after this
            instant. `from` later than `to` is 400 `invalid-request`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only reservations whose `plannedStart` is before this instant.
          schema: { type: string, format: date-time }
        - name: state
          in: query
          description: Only reservations currently in this `reservationState`.
          schema:
            type: string
            enum: [confirmed, amended, cancelled, checkedIn, noShow]
        - name: place
          in: query
          description: |-
            Scope results to one location (for implementations fronting
            multiple places). Holder ids are LOCAL to each implementation —
            there is no central user catalog; cross-system correlation is
            by plate (Part 14 §14.1a).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Up to 10 reservation summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/ReservationSummary" }
        "400":
          description: |-
            Neither plate nor holder given, or an inverted `from`/`to`
            window (problem type `invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |-
            The named `place` does not exist (problem type
            `target-not-found`). A place that exists outside the caller's
            grant is 403 `insufficient-grant` (Part 9 §9.3a).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/sessions/{id}/assigned-right:
    put:
      operationId: put-apx-v1-sessions-id-assigned-right
      security:
        - apxOAuth: ["apx.reservations:manage"]
      tags: [Reservations, Resolution]
      summary: Link a session to its AssignedRight (reservation/permit)
      description: |-
        The explicit reservation↔session link for facilities where the
        plate cannot be the link (barcode-only reservations, unreadable
        plates). Mirrors plate correction (Part 17 §17.5): a transactional
        domain action, naturally idempotent (PUT).

        NORMATIVE (Part 14 §14.1b): the link MUST materialize in the
        underlying APDS Session (`segments[].assignedRight`), MUST publish
        SessionUpdated, and MUST be visible to plain APDS clients reading
        /sessions/{id} — a façade over APDS-modeled state, never a
        parallel store. Pricing consequences (the prepaid rate replacing
        the drive-up rate) follow from the link per the implementation's
        normal rating.

        Re-sending the same link is a no-op 200. A link naming a DIFFERENT
        right on a session already linked to one is 409
        `right-not-linkable` ("session already linked"); undo the first
        link with POST /v1/sessions/{id}/assigned-right/unlink. `If-Match`
        carries the APDS Session `version` the client read (Part 4 §4.2a).
        Where the resolution context gated this action, the approval
        evidence rides `approval`; a policy refusal is 403
        `action-not-allowed` or `approval-required` (Part 17 §17.3).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: APDS Session UUID. }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedRight]
              properties:
                assignedRight:
                  description: The AssignedRight (reservation or permit) this session consumes.
                  $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                reservationCode:
                  type: string
                  description: The presented code, kept as audit evidence for the link.
                reason: { type: string }
                approval:
                  description: Approval evidence, when the resolution context marked this action requiresApproval (Part 17 §17.3).
                  $ref: "#/components/schemas/Approval"
      responses:
        "200":
          description: The link, applied.
          content:
            application/json:
              schema:
                type: object
                required: [session, assignedRight]
                properties:
                  session:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  assignedRight:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  version:
                    type: integer
                    minimum: 1
                    description: The APDS Session `version` after the write (Part 4 §4.2a).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such session or AssignedRight.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            The AssignedRight is not linkable (`right-not-linkable`: already
            consumed elsewhere, outside its validity, wrong place, in
            reservationState `cancelled` or `noShow`, or the session is
            already linked to a different right), or `If-Match` names a
            stale Session version (`version-conflict`, Part 4 §4.2a).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/sessions/{id}/assigned-right/unlink:
    post:
      operationId: post-apx-v1-sessions-id-assigned-right-unlink
      security:
        - apxOAuth: ["apx.reservations:manage"]
      tags: [Reservations]
      summary: Undo a session's link to its AssignedRight
      description: |-
        The audited undo of PUT /v1/sessions/{id}/assigned-right (Part 14
        §14.1b): removes the linked AssignedRight from the session's
        current segment, reverts the segment to the implementation's
        drive-up right, and returns the reservation to its pre-check-in
        `reservationState` (`confirmed` or `amended`, clearing
        `checkInSession`). MUST materialize in the underlying APDS Session
        and MUST publish SessionUpdated, like the link. `reason` is
        REQUIRED. Unlinking a session that carries no linked right is a
        no-op 200 without `unlinkedRight`. A closed Session is 422
        `session-not-open`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: APDS Session UUID. }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Why the link is being undone (audit).
                approval:
                  description: Approval evidence, when the resolution context marked this action requiresApproval (Part 17 §17.3).
                  $ref: "#/components/schemas/Approval"
      responses:
        "200":
          description: The session, unlinked.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  unlinkedRight:
                    description: The AssignedRight the session no longer consumes. Absent when there was nothing to unlink.
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  version:
                    type: integer
                    minimum: 1
                    description: The APDS Session `version` after the write.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`If-Match` names a stale Session version (`version-conflict`, Part 4 §4.2a)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The Session is closed (`session-not-open`); pricing has settled.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/permits/pools/{rightSpecId}/availability:
    get:
      operationId: get-apx-v1-permits-pools-rightspecid-availability
      security:
        - apxOAuth: ["apx.permits:manage"]
      tags: [Permits]
      summary: Pool availability for a pooled RightSpecification
      description: |-
        Profile over APDS RightPool — capacity, issued, available — for one
        pool of the RightSpecification. With neither `pool` nor `at`, the
        pool whose validity contains now, else the earliest future pool
        (Part 14 §14.2).
      parameters:
        - { name: rightSpecId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: pool
          in: query
          description: A RightPool id of this RightSpecification; takes precedence over `at`.
          schema: { type: string, format: uuid }
        - name: at
          in: query
          description: Select the pool whose validity contains this instant (e.g. a date in November for a November pool), RFC 3339.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolAvailability" }
        "404":
          description: No pool for this RightSpecification.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/permits/issue:
    post:
      operationId: post-apx-v1-permits-issue
      security:
        - apxOAuth: ["apx.permits:manage"]
      tags: [Permits]
      summary: Issue a permit from a pool (multi-vehicle credentials)
      description: |-
        Creates a native AssignedRight (APDS annual-permit pattern — one
        right, many vehicles), materialized per Part 14 §14.2. Pool
        exhaustion is 409 pool-exhausted. A client that may retry SHOULD
        send `Idempotency-Key`: a retried issue without one consumes a
        second pool slot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermitIssueRequest" }
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the AssignedRight
            the key issued, in its current representation; no second slot is
            consumed (Part 4 §4.2a).
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AssignedRight"
        "201":
          description: The issued AssignedRight (native APDS entity).
          content:
            application/json:
              schema:
                $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AssignedRight"
        "409":
          description: |-
            Pool exhausted (`pool-exhausted`); Idempotency-Key replayed with a
            different body (`idempotency-conflict`); a stale
            `rightSpecification.version` (`version-conflict`); or a credential
            identification already active on another permit at the place
            (`credential-identification-in-use`, Part 14 §14.2).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            The `rightSpecification` or `holder` names nothing that exists
            or is visible (`reference-unknown`); or the RightSpecification has
            no `rightPools`, or a `credentialType` is not in its
            `credentials` allow-list (`request-unprocessable`, `detail` names
            the rule; Part 14 §14.2).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Accounts, payments, LPR (optional classes; Part 13) ===== #
  /v1/accounts:
    get:
      operationId: get-apx-v1-accounts
      security:
        - apxOAuth: ["apx.accounts:read"]
      tags: [Accounts]
      summary: Look up accounts by name/phone/email/card/plate
      description: |-
        Any combination of filters; returns accounts with balances and
        status. Results are constrained to the caller's `apx_places` grant
        (Part 13 §13.5); under an absent or empty grant the answer is an
        empty 200 (Part 9 §9.3a).
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
        - name: email
          in: query
          description: Exact contact e-mail (case-insensitive). Personal data (Part 9 §9.6).
          schema: { type: string }
        - { name: card, in: query, schema: { type: string } }
        - { name: plate, in: query, schema: { type: string } }
        - name: place
          in: query
          description: |-
            Narrow results below the grant (Part 13 §13.5(3)): comma-separated
            HierarchyElement ids, subtree-inclusive. A place outside the
            caller's grant is 403 `insufficient-grant`. Servers that do not
            implement narrowing ignore it.
          style: form
          explode: false
          schema: { type: array, items: { type: string, format: uuid } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Matching accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/accounts/{id}:
    get:
      operationId: get-apx-v1-accounts-id
      security:
        - apxOAuth: ["apx.accounts:read"]
      tags: [Accounts]
      summary: Full account info
      description: Returns the account including balance and status.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404":
          description: No such account.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/payments:
    post:
      operationId: post-apx-v1-payments
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Take a payment (idempotent)
      description: |-
        Takes a payment against an account or ticket. Idempotency-Key
        REQUIRED. autoAttendant method = PCI-compliant IVR captures the card
        out of band; APX never carries PANs. Declines are 422. With
        `captureLater: true` the payment is authorized only and created
        `authorized` (Part 13 §13.1a).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRecord" }
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the payment the
            key created, in its current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "201":
          description: Approved payment with transactionID (or `authorized` when `captureLater` was asked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`), or a body
            that fails the schema or names neither `account` nor
            `ticketNumber` to settle (`invalid-request`, Part 12).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency-Key replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            Payment declined (`payment-declined`; the problem SHOULD carry a
            `payment` member referencing the recorded declined PaymentRecord,
            Part 13 §13.1); a body carrying card data beyond the truncated
            last four (`personal-data-not-permitted`, refused before it is
            persisted or logged); or `captureLater` on a server without an
            authorization lifecycle (`request-unprocessable`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-payments
      security:
        - apxOAuth: ["apx.accounts:read"]
      tags: [Accounts]
      summary: Payment history by ticket, card digits, or account
      description: |-
        Payments made on a ticket or an account (Part 13 §13.2). At least
        one key — `ticketLast4`, `cardLast4`, `ticketNumber`, or `account` —
        is REQUIRED; `date` and `place` only narrow, and a query with no key
        is 400 `invalid-request`. Privacy rule: a truncated-key lookup
        without a `date` is constrained to the last 8 hours; `ticketNumber`
        and `account` are exempt. Results are constrained to the caller's
        grant (§13.5).
      parameters:
        - { name: ticketLast4, in: query, schema: { type: string } }
        - name: cardLast4
          in: query
          description: |-
            Truncated payment-card digits — the transient-parker lookup of
            last resort (no LPR, no readable ticket). Same recent-window
            privacy rule as ticketLast4. At most four digits: a value
            carrying more is refused with 422 `personal-data-not-permitted`
            before the request is logged (Part 13 §13.2).
          schema: { type: string }
        - name: ticketNumber
          in: query
          description: Full ticket number, exact match. Exempt from the 8-hour window.
          schema: { type: string }
        - name: account
          in: query
          description: Account id — every payment on the account (a statement view). Exempt from the 8-hour window.
          schema: { type: string, format: uuid }
        - { name: date, in: query, schema: { type: string, format: date } }
        - name: place
          in: query
          description: |-
            Narrow results below the grant (Part 13 §13.5(3)): comma-separated
            HierarchyElement ids, subtree-inclusive. A place outside the
            caller's grant is 403 `insufficient-grant`. Never a key on its own.
          style: form
          explode: false
          schema: { type: array, items: { type: string, format: uuid } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Matching payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |-
            A query parameter carries more card digits than the truncated
            last four (`personal-data-not-permitted`, Part 13 §13.2). The
            server refuses before logging the request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/payments/{id}/postings:
    post:
      operationId: post-apx-v1-payments-id-postings
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Accounting write-back (PARIS-style)
      description: |-
        Posts the payment to the monthly-parking/AR system; returns
        confirmation and new balance. Only an `approved` payment can be
        posted; any other state is 409 `payment-state-illegal` (Part 13
        §13.1a).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostingRequest" }
      responses:
        "201":
          description: Posting result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Posting" }
        "404":
          description: No such payment.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The payment is not `approved` (`payment-state-illegal`, Part 13 §13.1a).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/payments/{id}/refund:
    post:
      operationId: post-apx-v1-payments-id-refund
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Refund a payment (financial domain action)
      description: |-
        Refunds the payment fully, or partially per `amount`. A financial
        action per Part 17 §17.4 — never a control command. Idempotency-Key
        REQUIRED; approval evidence required when the resolution context's
        AllowedAction said so. Scope apx.payments:write.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
                reason: { type: string }
                approval:
                  $ref: "#/components/schemas/Approval"
      responses:
        "200":
          description: |-
            The payment with `refundedAmount` increased; `reversed` once the
            cumulative refund reaches `amount`, otherwise still `approved`
            (Part 13 §13.1a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such payment.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            The requested `amount` exceeds what remains refundable (`amount`
            minus `refundedAmount`) — `request-unprocessable`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            Not refundable in its current state — only `approved` is
            (`payment-state-illegal`, Part 13 §13.1a) — or Idempotency-Key
            replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/payments/{id}/void:
    post:
      operationId: post-apx-v1-payments-id-void
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Void an authorized, uncaptured payment
      description: |-
        Financial domain action (Part 17 §17.4). Releases an `authorized`
        payment: `authorized → reversed` (Part 13 §13.1a). Idempotency-Key
        REQUIRED. Scope apx.payments:write.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: The voided payment, now `reversed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such payment.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            Not `authorized` (already captured, declined, or reversed —
            `payment-state-illegal`), or Idempotency-Key replayed with a
            different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/payments/{id}/capture:
    post:
      operationId: post-apx-v1-payments-id-capture
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Capture a previously authorized payment
      description: |-
        Financial domain action (Part 17 §17.4). Settles an `authorized`
        payment: `authorized → approved`, optionally for a lower `amount`
        than was authorized (Part 13 §13.1a). Idempotency-Key REQUIRED.
        Scope apx.payments:write.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: Amount to capture; at most the authorized amount. Omit to capture in full.
                  $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/AmountInCurrency"
      responses:
        "200":
          description: The captured payment, now `approved` with `amount` = the captured amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such payment.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Capture `amount` exceeds the authorized amount (`request-unprocessable`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |-
            Not `authorized` (`payment-state-illegal`, Part 13 §13.1a), or
            Idempotency-Key replayed with a different body
            (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/payment-links:
    post:
      operationId: post-apx-v1-payment-links
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts, Resolution]
      summary: Send a hosted payment link
      description: |-
        The customer-service payment action of first resort (Part 13
        §13.1a): sends a hosted payment link via the given channel for an
        account, ticket, or session. APX never carries PANs. Idempotency-Key
        REQUIRED. Scope apx.payments:write. Payment completion arrives as
        apx.accounts.payment.recorded.v1.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLink" }
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the link the key
            created, in its current representation (`status` may have
            advanced; Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "201":
          description: The link, sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`), or a body
            that fails the schema or names no account, ticket, or session to
            settle (`invalid-request`, Part 12).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: Idempotency-Key replayed with a different body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            A `channel` this server does not deliver on
            (`request-unprocessable`), or a body carrying card data
            (`personal-data-not-permitted`, refused before it is persisted or
            logged; Part 13 §13.1).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/payment-links/{id}:
    get:
      operationId: get-apx-v1-payment-links-id
      security:
        - apxOAuth: ["apx.accounts:read"]
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Read a payment link
      description: |-
        The link's current lifecycle state (`sent → opened → paid | expired
        | cancelled`, Part 13 §13.1a) and, once paid, the resulting
        PaymentRecord. Grant-checked on the link's `place`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The payment link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/payment-links/{id}/cancel:
    post:
      operationId: post-apx-v1-payment-links-id-cancel
      security:
        - apxOAuth: ["apx.payments:write"]
      tags: [Accounts]
      summary: Cancel a payment link
      description: |-
        Kills a link before the customer pays (sent to the wrong number,
        paid another way): `sent | opened → cancelled`. The hosted page MUST
        stop accepting payment from that instant. A link that is `paid`,
        `expired`, or already `cancelled` is 409 `payment-state-illegal`
        (Part 13 §13.1a). Idempotency-Key optional (Part 4 §4.2a).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "./domains/accounts/schemas.yaml#/PaymentLinkCancel" }
      responses:
        "200":
          description: The link, now `cancelled` (or its current representation on an idempotent replay).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |-
            The link is `paid`, `expired`, or already `cancelled`
            (`payment-state-illegal`), or Idempotency-Key replayed with a
            different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/sessions/{id}/plate:
    put:
      operationId: put-apx-v1-sessions-id-plate
      security:
        - apxOAuth: ["apx.data:write"]
      tags: [LPR, Resolution]
      summary: Associate or correct the plate on a session
      description: |-
        The write side of plate correction (Part 17 §17.5): sets the
        session's plate, optionally citing the chosen Observation candidate
        (GET /v1/lpr/candidates). A transactional domain action — not a
        control command. Naturally idempotent (PUT). Scope apx.data:write.

        NORMATIVE (Part 17 §17.5): the correction MUST materialize in the
        underlying APDS Session (identifiedCredentials /
        identifiedVehicle), MUST publish SessionUpdated, and MUST be
        visible to plain APDS clients reading /sessions/{id} — this route
        is a business-action façade over APDS-modeled state, never a
        parallel store.

        `If-Match` carries the APDS Session `version` the client read; a
        stale one is 409 `version-conflict` (Part 4 §4.2a). A closed
        Session may be corrected only inside the operator's dispute
        window and only with `reason`; otherwise 422 `session-not-open`
        (Part 17 §17.5). The 200 echoes only the plate values the caller
        supplied and discloses no other plate-bearing data; candidate
        reads stay under apx.lpr:read (Part 9 §9.6). Where the resolution
        context gated this action, the approval evidence rides `approval`;
        a policy refusal is 403 `action-not-allowed` or
        `approval-required` (Part 17 §17.3).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: APDS Session UUID. }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate]
              properties:
                plate: { type: string }
                country: { type: string, examples: [US], description: APDS VehicleAncillaryIdentification.country vocabulary. }
                stateProvince: { type: string, examples: [FL] }
                observation:
                  description: The Observation candidate this correction is based on.
                  $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                reason: { type: string }
                approval:
                  description: Approval evidence, when the resolution context marked this action requiresApproval (Part 17 §17.3).
                  $ref: "#/components/schemas/Approval"
      responses:
        "200":
          description: The corrected association.
          content:
            application/json:
              schema:
                type: object
                required: [session, plate]
                properties:
                  session:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  plate: { type: string }
                  country: { type: string }
                  stateProvince: { type: string }
                  observation:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/Reference"
                  version:
                    type: integer
                    minimum: 1
                    description: The APDS Session `version` after the write (Part 4 §4.2a).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such session.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`If-Match` names a stale Session version (`version-conflict`, Part 4 §4.2a); nothing is written."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |-
            The Session is closed and outside the operator's dispute
            window, or closed and the correction carries no `reason`
            (`session-not-open`, Part 17 §17.5).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/lpr/reads:
    get:
      operationId: get-apx-v1-lpr-reads
      security:
        - apxOAuth: ["apx.lpr:read"]
      tags: [LPR]
      summary: Bidirectional plate/ticket cross-lookup
      description: |-
        plate → ticket/session with accuracy + screenshot; ticket → plate.
        A pure profile over APDS Observations (ingest = native POST
        /observations). Where the ingested Observation carried the
        `apds-ext:apx:lpr-read@1.0` decoration, each read returns `detail`
        (per-attribute confidences for plate, state, make, model, color;
        alternate reads; plates read; plate face; movement) and the
        server-derived `laneTravel` (Part 13 §13.3a).

        At least one of `plate`, `ticket`, or `observation` is REQUIRED;
        a call with none is 400 `invalid-request`, never a bulk export
        (Part 9 §9.6). Keys given together intersect. Results are bounded
        by the caller's `apx_places` grant (Part 13 §13.5); a value-keyed
        lookup under an empty grant is an empty 200 (Part 9 §9.3a).
      parameters:
        - { name: plate, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - name: observation
          in: query
          description: |-
            Lookup by the underlying APDS Observation id — the read-back
            route for one ingested read (APDS 4.1 has no GET
            /observations/{id}).
          schema: { type: string, format: uuid }
        - name: place
          in: query
          description: |-
            Narrow results below the grant to one HierarchyElement and its
            subtree (Part 13 §13.5(3)). A place outside the caller's
            `apx_places` grant is 403 `insufficient-grant`. Servers that do
            not narrow MAY ignore it.
          schema: { type: string, format: uuid }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Matching reads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LprRead" }
        "400":
          description: None of `plate`, `ticket`, or `observation` given (problem type `invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Alerts (conformance class apx-alerts) ===== #
  /v1/alerts:
    post:
      operationId: post-apx-v1-alerts
      security:
        - apxOAuth: ["apx.alerts:write"]
      tags: [Alerts]
      summary: Raise an alert (idempotent)
      description: |-
        Raises an alert. The `Idempotency-Key` header is REQUIRED: replaying
        the same key with the same body returns the alert as it currently
        stands (200, Part 4 §4.2a); the same key with a different body is
        409 idempotency-conflict. A client MAY supply `id` (Part 7 §7.1).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Alert"
      responses:
        "200":
          description: |-
            Idempotent replay — same key + same body returns the alert as it
            currently stands (e.g. already acknowledged), not a snapshot of the
            first response (Part 4 §4.2a).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "201":
          description: Alert raised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: |-
            Missing Idempotency-Key (`idempotency-key-required`) or a body that
            fails the Alert schema, e.g. an unknown `severity` or no
            `detectionTime` (`invalid-request`, with `errors[]`) — Part 12.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: |-
            Idempotency-Key replayed with a different body
            (`idempotency-conflict`), or a client-supplied `id` that already
            exists (`id-collision`) — Part 12.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: get-apx-v1-alerts
      security:
        - apxOAuth: ["apx.alerts:read"]
      tags: [Alerts]
      summary: List/filter alerts
      description: |-
        Filter by status, severityFloor, type, place (subtree-inclusive),
        device, relatedEntity, since. Alerts with no place binding (e.g.
        `webhookDeliveryFailed`) are visible to tokens of the owning
        organisation and are excluded whenever `place` is given (Part 7
        §7.1).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [raised, acknowledged, resolved, expired] }
        - name: severityFloor
          in: query
          schema: { type: string, enum: [info, warning, minor, major, critical] }
        - name: type
          in: query
          schema: { type: string }
        - name: place
          in: query
          schema: { type: string, format: uuid }
        - name: device
          in: query
          schema: { type: string, format: uuid }
          description: Alerts whose `source.device.id` is this SupplementalEquipment.
        - name: relatedEntity
          in: query
          schema: { type: string, format: uuid }
          description: Alerts whose `relatedEntity.id` is this entity (a Session, a Subscription, a Command…).
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated alerts (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/alerts/{id}:
    get:
      operationId: get-apx-v1-alerts-id
      security:
        - apxOAuth: ["apx.alerts:read"]
      tags: [Alerts]
      summary: Read an alert
      description: Returns the alert including its immutable statusHistory.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: No such alert.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/alerts/{id}/acknowledge:
    post:
      operationId: post-apx-v1-alerts-id-acknowledge
      security:
        - apxOAuth: ["apx.alerts:write"]
      tags: [Alerts]
      summary: Acknowledge an alert
      description: |-
        Transition raised → acknowledged. Illegal transitions are 409
        `alert-transition-illegal`. The optional body annotates the history
        entry this transition appends (Part 7 §7.2); a request with no body
        is unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./domains/alerts/schemas.yaml#/AlertTransition"
      responses:
        "200":
          description: Acknowledged alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Illegal transition from the current state (`alert-transition-illegal`, Part 7 §7.3).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/alerts/{id}/resolve:
    post:
      operationId: post-apx-v1-alerts-id-resolve
      security:
        - apxOAuth: ["apx.alerts:write"]
      tags: [Alerts]
      summary: Resolve an alert
      description: |-
        Transition raised|acknowledged → resolved. Illegal transitions are 409
        `alert-transition-illegal`. The optional body annotates the history
        entry this transition appends (Part 7 §7.2); a request with no body
        is unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./domains/alerts/schemas.yaml#/AlertTransition"
      responses:
        "200":
          description: Resolved alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Illegal transition from the current state (`alert-transition-illegal`, Part 7 §7.3).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Customer Service & Resolution (optional class apx-resolution; Part 17) ===== #
  /v1/resolution/contexts:
    post:
      operationId: post-apx-v1-resolution-contexts
      security:
        - apxOAuth: ["apx.resolution:read"]
      tags: [Resolution]
      summary: Resolve a customer-service context from any known identifiers
      description: |-
        THE aggregation call (Part 17 §17.2): accepts whatever
        parking-domain identifiers are known (lane, device, plate, ticket,
        credential, reservation code…) — telephony mapping stays on the
        call platform's side (§17.1) — and returns everything the server
        can resolve —
        issue classification, lane status, vehicle, session, account,
        passback, device status, recent overrides, support history — plus
        the policy-decided allowedActions. Sections the caller's scopes and
        `apx_places` grant could not read directly are omitted. May return
        `status: partial` with `pendingSources` rather than waiting on a
        slow source; re-read to refresh. Scope apx.resolution:read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolutionResolveRequest" }
      responses:
        "201":
          description: The resolved context (possibly partial).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolutionContext" }
        "400":
          description: |-
            No usable identifier supplied: the body carries none of the
            identifying members (device, place, lane, session, holder,
            credential, plate, ticketNumber, reservationCode) — problem type
            `invalid-request` (Part 17 §17.1).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No identifier resolved to anything this implementation knows.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/resolution/contexts/{id}:
    get:
      operationId: get-apx-v1-resolution-contexts-id
      security:
        - apxOAuth: ["apx.resolution:read"]
      tags: [Resolution]
      summary: Re-read (recompute) a resolution context
      description: |-
        Returns the context recomputed against current state — `version`
        increments when anything material changed. Use after events arrive
        or when the initial response was partial. Scope apx.resolution:read.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The current context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolutionContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such context (contexts MAY expire; re-resolve).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/resolution/contexts/{id}/allowed-actions:
    get:
      operationId: get-apx-v1-resolution-contexts-id-allowed-actions
      security:
        - apxOAuth: ["apx.resolution:read"]
      tags: [Resolution]
      summary: Re-evaluate the allowed actions for a context
      description: |-
        The policy layer's current decisions (Part 17 §17.3) — cheaper than
        a full context recompute; call before executing when time has
        passed. The consuming agent (human or AI) MUST NOT decide
        permissibility itself. Scope apx.resolution:read.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current decisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AllowedAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such context.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/lpr/candidates:
    get:
      operationId: get-apx-v1-lpr-candidates
      security:
        - apxOAuth: ["apx.lpr:read"]
      tags: [LPR, Resolution]
      summary: Plate candidates for correction workflows
      description: |-
        Candidate plate reads (with confidence and imagery links) for a
        session or lane — the read side of plate correction (Part 17
        §17.5); the write is PUT /v1/sessions/{id}/plate. Scope apx.lpr:read.
      parameters:
        - { name: session, in: query, schema: { type: string, format: uuid }, description: Session UUID. }
        - { name: lane, in: query, schema: { type: string, format: uuid }, description: VehicularAccess UUID. }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Candidates, best confidence first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlateCandidate" }
        "400":
          description: Neither session nor lane given (problem type `invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/credentials/{id}/passback:
    get:
      operationId: get-apx-v1-credentials-id-passback
      security:
        - apxOAuth: ["apx.control:read"]
      tags: [Resolution]
      summary: Anti-passback status for a credential
      description: |-
        The credential's passback overlay: state, expected vs recorded
        presence, last access. The write side is the `resetPassback` /
        `forceIn` / `forceOut` commands (Part 17 §17.4). Scope
        apx.control:read; the place grant must cover the credential's
        last-access place.

        A credential the server knows but does not track for passback (a
        transient ticket at a site without anti-passback) is 200 with
        `state: unknown`, not 404; 404 means the credential does not
        exist (Part 17 §17.8).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: APDS Credential UUID. }
      responses:
        "200":
          description: Passback status (`state` is `unknown` for a known credential whose passback is not tracked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassbackStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: No such credential (problem type `target-not-found`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/support/interactions:
    post:
      operationId: post-apx-v1-support-interactions
      security:
        - apxOAuth: ["apx.support:manage"]
      tags: [Support]
      summary: Record a support interaction
      description: |-
        Records one customer-service interaction (human or AI) so future
        resolution contexts can surface it. Summaries, not transcripts
        (Part 9 §9.6). Scope apx.support:manage.

        A console MAY record the interaction when the call is answered and
        complete it later with PUT /v1/support/interactions/{id}. Clients
        that retry SHOULD send `Idempotency-Key`: a replay returns the
        current record with 200, a different body under the same key is
        409 `idempotency-conflict` (Part 4 §4.2a).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportInteraction" }
      responses:
        "201":
          description: Recorded interaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportInteraction" }
        "200":
          description: Idempotent replay — the interaction's current representation (Part 4 §4.2a).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportInteraction" }
        "400":
          description: Invalid interaction (problem type `invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Same `Idempotency-Key` replayed with a different body (`idempotency-conflict`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: get-apx-v1-support-interactions
      security:
        - apxOAuth: ["apx.support:manage"]
      tags: [Support]
      summary: Support history for a subject
      description: |-
        Recent interactions filtered by any subject key. At least one
        filter is required; none is 400 `invalid-request`. `correlationId`, `interactionId`, and
        `credential` each suffice on their own, so one correlation id
        reconstructs the episode (Part 17 §17.7). Scope
        apx.support:manage (or apx.resolution:read for read-only
        consumers).
      parameters:
        - { name: plate, in: query, schema: { type: string } }
        - { name: holder, in: query, schema: { type: string, format: uuid } }
        - { name: account, in: query, schema: { type: string, format: uuid } }
        - { name: session, in: query, schema: { type: string, format: uuid } }
        - { name: place, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: correlationId, in: query, description: Correlation chain id (Part 17 §17.7). Exact match., schema: { type: string, format: uuid } }
        - { name: interactionId, in: query, description: The calling application's opaque interaction identifier. Exact match., schema: { type: string } }
        - { name: credential, in: query, description: APDS Credential UUID (matches `subjects.credential`)., schema: { type: string, format: uuid } }
        - $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/parameters/page"
      responses:
        "200":
          description: Paginated interactions (APDS PaginatedList shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/PaginatedListMeta"
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SupportInteraction" }
        "400":
          description: No filter given (problem type `invalid-request`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/support/interactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: SupportInteraction id. }
    get:
      operationId: get-apx-v1-support-interactions-id
      security:
        - apxOAuth: ["apx.support:manage"]
        - apxOAuth: ["apx.resolution:read"]
      tags: [Support]
      summary: Read one support interaction
      description: |-
        One recorded interaction by id (Part 17 §17.6). Scope
        apx.support:manage, or apx.resolution:read for read-only
        consumers; the interaction's `place` must be inside the caller's
        grant.
      responses:
        "200":
          description: The interaction.
          headers:
            ETag:
              description: The interaction's `version` as an entity tag (Part 4 §4.2a).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportInteraction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      operationId: put-apx-v1-support-interactions-id
      security:
        - apxOAuth: ["apx.support:manage"]
      tags: [Support]
      summary: Update (complete) a support interaction
      description: |-
        Replaces the interaction — typically to complete a record opened
        when the call was answered with `endedAt`, `resolution`, `summary`,
        and `actions` (Part 17 §17.6). Optimistic concurrency per Part 4
        §4.2a: send the `version` last read as `If-Match` (or in the
        body); a stale one is 409 `version-conflict`. The server
        increments `version` and publishes
        `apx.support.interaction.recorded.v1` again; consumers tell a
        create from an update by `version`. `id` in the body, when
        present, MUST equal the path id. Scope apx.support:manage.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportInteraction" }
      responses:
        "200":
          description: The updated interaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportInteraction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stale `version` (`version-conflict`, Part 4 §4.2a); nothing is written.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== Discovery (optional class apx-discovery; Part 16) ===== #
  /v1/discovery:
    get:
      operationId: get-apx-v1-discovery
      security:
        - apxOAuth: []
      tags: [Discovery]
      summary: Credential-scoped capability document
      description: |-
        Reflects the presented token's scopes and grants exactly: the
        endpoints, command types, topics, and place subtrees THIS client can
        use. Soundness rule: everything listed is callable; APX endpoints
        not listed fail with 403.
      responses:
        "200":
          description: The capability document for this credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDocument" }
        "401":
          description: Missing/invalid token.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===== APX routes ===== #
  /.well-known/apx-configuration:
    get:
      operationId: get-well-known-apx-configuration
      tags: [Discovery]
      summary: Bootstrap configuration document
      security: []
      description: |-
        Unauthenticated bootstrap document. Advertises the token endpoint,
        the APDS version this implementation extends, supported APX
        conformance classes, and code-list registry locations.

        Served at the server root (NOT under `/v1`), per RFC 8615.
      responses:
        "200":
          description: Bootstrap configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApxConfiguration"
        "429": { $ref: "#/components/responses/TooManyRequests" }

security:
  - apxOAuth: []

webhooks:
  apx-event:
    post:
      operationId: receive-apx-event
      summary: Signed APX event delivery
      description: |-
        Every webhook delivery POSTs one EventEnvelope with headers
        `APX-Signature` (v1=HMAC-SHA256(secret, timestamp + "." + body)),
        `APX-Timestamp` (RFC 3339, ±5 min replay window),
        `APX-Delivery-Id` (unique per attempt; envelope `id` is stable
        across retries), and `APX-Key-Id` (REQUIRED during secret-rotation
        overlap windows — Part 9 §9.4). Respond 2xx to acknowledge;
        anything else triggers the normative retry schedule (Part 8).

        **Every attempt is signed afresh (normative, Part 8 §8.3):**
        `APX-Timestamp` is the time of that attempt and `APX-Signature` is
        computed over it and the unchanged body, so a retry an hour later
        still falls inside the receiver's ±5-minute window. The body — and
        with it the envelope `id` and `time` — is byte-identical across
        attempts.

        The typed entries below (`apx-native-event` and one per APX topic
        whose data schema lives outside its own domain) name the `data`
        schema each topic carries (Part 8 §8.7); they are the same POST.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventEnvelope"
      responses:
        "200":
          description: Acknowledged.
  apx-native-event:
    post:
      operationId: receive-apx-native-event
      summary: APDS EventTypeEnum topic delivery
      description: |-
        A delivery on an APDS 4.1 topic (`SessionCreated`, `PlaceUpdated`,
        …): `type` is an APDS `EventTypeEnum` value, `data` the APDS
        `EventData` shape (the created/updated entity; for a `*Deleted`
        topic the last state), and `subject` references the entity
        (Part 5 §5.4, Part 8 §8.2). Signed and retried like every delivery.
      parameters: &deliveryHeaders
        - name: APX-Signature
          in: header
          required: true
          description: '`v1=` + hex HMAC-SHA256(secret, APX-Timestamp + "." + raw body), computed per attempt.'
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: APX-Timestamp
          in: header
          required: true
          description: RFC 3339 time of THIS attempt (not of the event or of the first attempt).
          schema: { type: string, format: date-time }
        - name: APX-Delivery-Id
          in: header
          required: true
          description: UUID unique per attempt; the envelope `id` is the dedup key.
          schema: { type: string, format: uuid }
        - name: APX-Key-Id
          in: header
          required: false
          description: The signing key's id — REQUIRED during a rotation overlap (Part 9 §9.4).
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventEnvelope"
                - type: object
                  properties:
                    type:
                      $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/EventTypeEnum"
                    data:
                      $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/EventData"
      responses:
        "200":
          description: Acknowledged.
  apx.subscription.failed.v1:
    post:
      operationId: receive-apx-subscription-failed
      summary: A subscription exhausted its retry schedule
      description: |-
        Published when a subscription enters `failed` (Part 8 §8.3).
        `subject` references the subscription (`className`
        `ApxEventSubscription`); `data` is a SubscriptionFailure. Delivered
        to other subscriptions of the same `apx_org` that list the topic,
        never to the failed one.
      parameters: *deliveryHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventEnvelope"
                - type: object
                  properties:
                    type: { const: apx.subscription.failed.v1 }
                    data:
                      $ref: "./domains/events/schemas.yaml#/SubscriptionFailure"
      responses:
        "200":
          description: Acknowledged.
  apx.data.observation.created.v1:
    post:
      operationId: receive-apx-data-observation-created
      summary: An Observation was ingested
      description: |-
        One event per ingested read. `data` is the APDS
        `ObservationElement` (an ingested ObservationSet yields one event
        per element); `subject` references it with `className`
        `ObservationElement`; publishers MUST populate `elementIds` with
        the observing lane or place, which is the event's place binding
        (Part 8 §8.5). Plate values are subject to Part 9 §9.6.
      parameters: *deliveryHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventEnvelope"
                - type: object
                  properties:
                    type: { const: apx.data.observation.created.v1 }
                    data:
                      $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/schemas/ObservationElement"
      responses:
        "200":
          description: Acknowledged.
  apx.reservation.noshow.v1:
    post:
      operationId: receive-apx-reservation-noshow
      summary: A reservation reached its no-show condition
      description: |-
        `data` is a ReservationSummary (`reservation`, `reservationState`
        `noShow`, `plannedStart`); `subject` references the AssignedRight
        (Part 14 §14.1, Part 8 §8.7).
      parameters: *deliveryHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventEnvelope"
                - type: object
                  properties:
                    type: { const: apx.reservation.noshow.v1 }
                    data:
                      $ref: "#/components/schemas/ReservationSummary"
      responses:
        "200":
          description: Acknowledged.

components:
  parameters:
    ModeParam:
      $ref: "./domains/data/schemas.yaml#/ModeParam"
    CursorParam:
      $ref: "./domains/data/schemas.yaml#/CursorParam"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |-
        The `version` the client last read, as an entity tag (`"7"`). A
        stale value is 409 `version-conflict`; nothing is written (Part 4
        §4.2a). Equivalent to sending `version` in the body.
      schema: { type: string, examples: ['"7"'] }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        When given, the operation is idempotent per Part 4 §4.2a: a replay
        with the same body returns the current representation (200), a
        different body is 409 `idempotency-conflict`. Clients that retry
        SHOULD send it.
      schema: { type: string }

  responses:
    BadRequest:
      description: |-
        The request is malformed: the body or a parameter fails the
        operation's schema or a normative field rule (problem type
        `invalid-request`, with an `errors[]` member naming each offending
        JSON Pointer), or a REQUIRED Idempotency-Key is absent
        (`idempotency-key-required`). Part 12.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |-
        Missing, malformed, expired, or revoked access token (problem type
        `unauthenticated`, Part 12).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |-
        The addressed resource does not exist (problem type
        `target-not-found`). A resource at a place outside the caller's
        `apx_places` grant is 403 `insufficient-grant` instead (Part 9 §9.3).
        A resource that exists but lies outside a narrower ownership scope
        (a merchant's own programs, a valet customer's own ticket) is
        reported as 404, so the answer never confirms another party's
        record exists (Part 9 §9.3a).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |-
        Insufficient scope (problem type `insufficient-scope`) or place
        grant (`insufficient-grant`) for this operation (Part 9).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (problem type `rate-limited`, Part 12).
      headers:
        Retry-After:
          description: Seconds to wait before retrying (RFC 9110).
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  securitySchemes:
    # APDS 4.1's own scheme, vendored verbatim — the security requirement
    # named by every APDS-native operation mounted above. Without this the
    # bundle would reference an undefined scheme.
    oAuth:
      $ref: "../vendor/apds/4.1/apds-api-4.1.yaml#/components/securitySchemes/oAuth"
    apxOAuth:
      type: oauth2
      description: |-
        OAuth 2.0 client-credentials (aligned with APDS 4.1's `oAuth` scheme).
        APX scopes follow `apx.<domain>:<verb>`. Grants are carried in the
        normative token claims `apx_org` (Organisation reference) and
        `apx_places` (HierarchyElement subtree grants — FAIL-CLOSED: absent
        or empty = no places; the explicit wildcard "*" = all places,
        Part 9 §9.3).
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          scopes:
            apx.data:read: Read parking data via APDS-native routes
            apx.data:write: Create/update parking data via APDS-native routes
            apx.control:read: Read commands, lanes, and device status
            apx.control:execute: Execute commands (vend gate, lost ticket, push rate, apply validation…)
            apx.alerts:read: Read alerts
            apx.alerts:write: Raise, acknowledge, and resolve alerts
            apx.subscriptions:manage: Create and manage event subscriptions
            apx.accounts:read: Look up accounts and balances
            apx.payments:write: Take payments and post accounting write-backs
            apx.lpr:read: LPR plate/ticket cross-lookup
            apx.reservations:manage: Quote, book, amend, cancel reservations
            apx.permits:manage: Issue and manage permits
            apx.tolling:manage: Create and manage toll transactions
            apx.resolution:read: Resolve and read customer-service resolution contexts and allowed actions
            apx.support:manage: Record and read support-interaction history
            apx.violations:read: Read violations and run the enforcement eligibility check
            apx.violations:manage: Create, review, issue, settle, appeal, and void violations
            apx.validations:read: Read validation programs, issuances, redemptions, and statements
            apx.validations:manage: Enrol and update programs, issue stock, reverse redemptions, close statements
            apx.validations:redeem: Merchant scope — check codes, issue own stock, record redemptions, read own programs and statements (limited to the token's apx_org)
            apx.credentials:read: Read credentials and their access-event history
            apx.credentials:manage: Issue, activate, suspend, resume, report lost, revoke, and replace credentials
            apx.valet:read: Read valet tickets and the retrieval queue
            apx.valet:manage: Take custody, park, stage, hand back, and manage retrievals
            apx.valet:request: Customer scope — request or cancel retrieval and read status/ETA for the caller's own ticket (text, app, web, voice bot)

