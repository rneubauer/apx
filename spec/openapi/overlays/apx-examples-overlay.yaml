# APX examples overlay — one worked payload per resource schema.
#
# A reference that shows a schema tree but no payload makes every reader
# invent their own first request. Redoc and Swagger UI both surface a
# schema-level example wherever that schema is referenced, so one example per
# resource reaches every operation that returns it.
#
# PROVENANCE. Every payload here is lifted verbatim from docs/scenarios/,
# where it sits under an `apx:validate <Schema>` marker and is already checked
# against that exact schema by `npm run scenarios:check`. They are then checked
# AGAIN in place by `npm run examples:check`, which validates every
# schema-level `examples` entry in the bundle. An example cannot rot without
# CI failing.
#
# STYLE. Payloads are written as JSON (valid YAML) rather than YAML block
# style, deliberately: unquoted timestamps would be parsed into dates and
# re-emitted in a different shape. Quoting everything keeps the bytes the
# reader sees identical to the bytes the scenario validated.
#
# Applied to spec/dist/apx-v1.{yaml,json} by tools/apply-overlay.mjs, after
# the data and docs overlays.
overlay: 1.0.0
info:
  title: APX examples overlay (one worked payload per resource)
  version: 0.9.0

