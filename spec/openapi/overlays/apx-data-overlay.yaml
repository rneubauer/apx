  - target: $.paths['/sessions/{id}'].put.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/sessions/{id}'].put.requestBody.content['application/json']
    description: "Full mode validates against Session; change mode against ChangePayload (Part 5 §5.1a)."
    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/Session"
          - $ref: "#/components/schemas/ChangePayload"
  - target: $.paths['/rights/assigned/{id}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
