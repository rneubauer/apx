  # ----- Upstream schema workarounds (errata 004, 009, 010, 011) -----
  - target: $.components.schemas.RateTable.allOf['1'].required
    remove: true
  - target: $.components.schemas.RateTable.allOf['1']
    description: "Erratum 004: validityStart and activeTimes are required but never defined (the window lives in validity, active times in RateLineCollection)."
    update:
      required: [rateTableName, availability, rateLineCollections]
  - target: $.components.schemas.Identifiers.properties
    description: "Erratum 009: rateTableId is required but only rateTableID is declared; declare the required spelling."
    update:
      rateTableId:
        description: "The quoted RateTable (the spelling Identifiers.required names). Publishers send this member; rateTableID is the APDS 4.1 declared spelling of the same reference and MAY accompany it (APX erratum 009)."
        $ref: "#/components/schemas/VersionedReference"
