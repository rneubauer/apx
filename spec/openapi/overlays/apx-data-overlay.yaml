    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/AssignedRight"
          - $ref: "#/components/schemas/ChangePayload"

  # ----- POST /observations (F-DATA-08, F-DATA-09; errata 005, 006) -----
  - target: $.paths['/observations'].post.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/observations'].post.requestBody.content['application/json']
    description: "Drop the wrapper discriminator that collides with ObservationElement.type; the branches are distinguished by their required members."
    update:
      schema:
        oneOf:
          - $ref: "#/components/schemas/ObservationElement"
          - $ref: "#/components/schemas/ObservationSet"
  - target: $.paths['/observations'].post
    description: "Declare the responses the vendored operation omits (as on the other native creates)."
    update:
      responses:
        '201':
          description: "Observation (or ObservationSet) created (APDS ResponseStatus, as on the other native creates)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStatus"
        '400':
          description: "Observation can not be created due to invalid or missing data. APX (Part 5 §5.1a, Part 12 §12.1): with `Accept: application/problem+json`, problem type `invalid-request` (with `errors[]`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStatus"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        '409':
          description: "Observation can not be created due to conflict (id already exists). APX: with `Accept: application/problem+json`, problem type `id-collision`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStatus"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ----- POST /quotes (F-DATA-10, F-RSV-01; erratum 007) -----
  - target: $.paths['/quotes'].post
    description: "Declare the quote request body the vendored operation omits (optional, so no stock client is refused)."
    update:
      requestBody:
        required: false
        description: "The quote request: a QuoteRightRequest (new right) or a QuoteSessionExtensionRequest (extend a session). Undeclared in APDS 4.1 (APX erratum 007)."
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/QuoteRightRequest"
                - $ref: "#/components/schemas/QuoteSessionExtensionRequest"

  # ----- Response-code parity (F-DATA-14; erratum 012) -----
  - target: $.paths['/rates'].post.responses
    description: "POST /rates declares no 400/409, unlike every other native create."
    update:
      '400':
        description: "RateTable can not be created due to invalid or missing data. APX: with `Accept: application/problem+json`, problem type `invalid-request`."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatus"
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      '409':
        description: "RateTable can not be created due to conflict (id already exists). APX: with `Accept: application/problem+json`, problem type `id-collision`."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatus"
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  - target: $.paths['/rights/assigned/{id}'].put.responses
    description: "PUT /rights/assigned/{id} declares no 404, unlike every other native PUT."
    update:
      '404':
        description: "AssignedRight can not be updated as it has not been found (servers that upsert answer 201 instead). APX: with `Accept: application/problem+json`, problem type `target-not-found`."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatus"
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"

  # ----- Native 400/404/409 (F-DATA-05, F-RSV-08): the problem+json alternative (Part 12 §12.1) -----
  - target: $.paths['/places'].post.responses['400']
    update:
      description: "Bad Request. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `invalid-request` (with `errors[]`) instead of ResponseStatus."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  - target: $.paths['/places'].post.responses['409']
    update:
      description: "Conflict. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `id-collision` (client-supplied id already exists) instead of ResponseStatus."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  - target: $.paths['/places/{id}'].get.responses['404']
    update:
      description: "Not Found. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `target-not-found` instead of ResponseStatus."
      content:
