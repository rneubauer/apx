          schema:
            $ref: "#/components/schemas/Problem"
  - target: $.paths['/places/{id}'].put.responses['400']
    update:
      description: "Bad Request. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `invalid-request` (with `errors[]`) instead of ResponseStatus."
