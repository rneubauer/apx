        oneOf:
          - $ref: "#/components/schemas/RateTableList"
          - $ref: "#/components/schemas/ChangeFeedPage"

  # ----- /rights/assigned -----
  - target: $.paths['/rights/assigned'].get.parameters
    description: Add the APX data-profile mode/cursor parameters.
    update:
      - $ref: "#/components/parameters/ModeParam"
      - $ref: "#/components/parameters/CursorParam"
  - target: $.paths['/rights/assigned'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/rights/assigned'].get.responses['200'].content['application/json']
    description: mode=full returns the stock APDS list; mode=change returns a ChangeFeedPage.
    update:
      schema:
        oneOf:
          - $ref: "#/components/schemas/AssignedRightList"
          - $ref: "#/components/schemas/ChangeFeedPage"

  # ----- /observations (F-DATA-11): the change feed Part 13 §13.4 promises -----
  - target: $.paths['/observations'].get.parameters
    description: "Add the APX data-profile mode/cursor parameters."
    update:
      - $ref: "#/components/parameters/ModeParam"
      - $ref: "#/components/parameters/CursorParam"
  - target: $.paths['/observations'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/observations'].get.responses['200'].content['application/json']
    description: "mode=full returns the stock APDS list; mode=change returns a ChangeFeedPage."
    update:
      schema:
        oneOf:
          - allOf:
              - $ref: "#/components/schemas/PaginatedListMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ObservationElement"
          - $ref: "#/components/schemas/ChangeFeedPage"

  # ----- /places (F-DATA-15): subtree filter for the grant-expansion re-sync -----
  - target: $.paths['/places'].get.parameters
    description: "Add the native place filter (subtree-inclusive, as on /sessions) so a grantAdditions subtree can be full-synced (Part 5 §5.2 rule 7)."
    update:
      - $ref: "#/components/parameters/place_ids"

  # ----- Feed routes (F-DATA-04): a cursor error is an APX error -----
  - target: $.paths['/places'].get.responses
    description: "Declare the cursor refusal of Part 5 §5.2 rules 2 and 5."
    update:
      '404':
        description: "mode=change only: the cursor is unknown, older than the retention window, or was issued for another (class, credential, filter set) — problem type `target-not-found`; re-sync with mode=full (Part 5 §5.2 rules 2 and 5). The cursor is an APX parameter, so this refusal is always a Problem."
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  - target: $.paths['/sessions'].get.responses
    description: "Declare the cursor refusal of Part 5 §5.2 rules 2 and 5."
    update:
      '404':
        description: "mode=change only: the cursor is unknown, older than the retention window, or was issued for another (class, credential, filter set) — problem type `target-not-found`; re-sync with mode=full (Part 5 §5.2 rules 2 and 5). The cursor is an APX parameter, so this refusal is always a Problem."
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  - target: $.paths['/rates'].get.responses
    description: "Declare the cursor refusal of Part 5 §5.2 rules 2 and 5."
    update:
      '404':
        description: "mode=change only: the cursor is unknown, older than the retention window, or was issued for another (class, credential, filter set) — problem type `target-not-found`; re-sync with mode=full (Part 5 §5.2 rules 2 and 5). The cursor is an APX parameter, so this refusal is always a Problem."
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  - target: $.paths['/rights/assigned'].get.responses
    description: "Declare the cursor refusal of Part 5 §5.2 rules 2 and 5."
    update:
      '404':
        description: "mode=change only: the cursor is unknown, older than the retention window, or was issued for another (class, credential, filter set) — problem type `target-not-found`; re-sync with mode=full (Part 5 §5.2 rules 2 and 5). The cursor is an APX parameter, so this refusal is always a Problem."
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  - target: $.paths['/observations'].get.responses
    description: "Declare the cursor refusal of Part 5 §5.2 rules 2 and 5."
    update:
      '404':
        description: "mode=change only: the cursor is unknown, older than the retention window, or was issued for another (class, credential, filter set) — problem type `target-not-found`; re-sync with mode=full (Part 5 §5.2 rules 2 and 5). The cursor is an APX parameter, so this refusal is always a Problem."
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"

  # ----- Native PUTs (F-DATA-01, F-DATA-02): the update-mode header and the change body -----
  - target: $.paths['/places/{id}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
    update:
      - &updateMode
        name: APX-Update-Mode
        in: header
        required: false
        description: "APX data profile (Part 5 §5.1). `full` (default, stock APDS behavior): the body is the complete current state. `change`: the body is a ChangePayload — identity plus only the changed members; absent = unchanged, explicit null = clear. A stale `version` in change mode is 409 `version-conflict`."
        schema:
          type: string
          enum: [full, change]
          default: full
  - target: $.paths['/places/{id}'].put.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/places/{id}'].put.requestBody.content['application/json']
    description: "Full mode validates against HierarchyElement; change mode against ChangePayload (Part 5 §5.1a)."
    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/HierarchyElement"
          - $ref: "#/components/schemas/ChangePayload"
  - target: $.paths['/contacts/{contactId}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
    update:
      - *updateMode
  - target: $.paths['/contacts/{contactId}'].put.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/contacts/{contactId}'].put.requestBody.content['application/json']
    description: "Full mode validates against ContactPoint; change mode against ChangePayload (Part 5 §5.1a)."
    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/ContactPoint"
          - $ref: "#/components/schemas/ChangePayload"
  - target: $.paths['/rights/specs/{id}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
    update:
