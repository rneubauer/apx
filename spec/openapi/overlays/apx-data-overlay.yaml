  - target: $.paths['/contacts/{contactId}'].get.responses['404']
    update:
      description: "contact not found. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `target-not-found` instead of ResponseStatus."
