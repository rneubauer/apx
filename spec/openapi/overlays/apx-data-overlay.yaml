# APX data-profile overlay — a NORMATIVE artifact (Part 3 §3.4, Part 5 §5.6).
#
# The APDS 4.1 document is vendored byte-identical and mounted verbatim, so
# the Part 5 data profile (mode/cursor parameters, ChangeFeedPage responses)
# cannot be expressed inside those path items without editing them. This
# OpenAPI Overlay (https://spec.openapis.org/overlay/v1.0.0) decorates the
# BUNDLED document instead: applying it to spec/dist/apx-v1.{yaml,json}
# (tools/apply-overlay.mjs, run by `npm run spec:bundle`) produces the
# effective API description. The vendored APDS source is never touched.
#
# Scope (Part 5 §5.6, §5.1a):
#  - the change feed (mode/cursor, ChangeFeedPage) on the five feed routes,
#    and the 404 a stale or foreign cursor gets;
#  - APX-Update-Mode and the ChangePayload body on the six native PUTs;
#  - the problem+json alternative on native 400/404/409, and the shared
#    401/403/429 on every native operation (Part 12 §12.1, §12.3);
#  - narrow workarounds for APDS 4.1 defects, each naming its erratum in
#    docs/errata/ (004–012). Remove a workaround in the same change that
#    vendors a corrected APDS release.
# Everything here is additive for a stock APDS client: parameters are
# optional with stock defaults, the stock body and response shapes remain
# conforming branches, and the added media types are selected only by an
# APX `Accept` header.
#
# Authoring landmines: an explicit JSON null in an example crashes
# Spectral, and an unquoted ": " in a description breaks the YAML parse —
# quote every description.
overlay: 1.0.0
info:
  title: APX data-profile overlay (Part 5 data profile over the native APDS routes)
  version: 0.11.0

actions:
  # ----- /places -----
  - target: $.paths['/places'].get.parameters
    description: Add the APX data-profile mode/cursor parameters.
    update:
      - $ref: "#/components/parameters/ModeParam"
      - $ref: "#/components/parameters/CursorParam"
  - target: $.paths['/places'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/places'].get.responses['200'].content['application/json']
    description: mode=full returns the stock APDS list; mode=change returns a ChangeFeedPage.
    update:
      schema:
        oneOf:
          - $ref: "#/components/schemas/HierarchyElementList"
          - $ref: "#/components/schemas/ChangeFeedPage"

  # ----- /sessions -----
  - target: $.paths['/sessions'].get.parameters
    description: Add the APX data-profile mode/cursor parameters.
    update:
      - $ref: "#/components/parameters/ModeParam"
      - $ref: "#/components/parameters/CursorParam"
  - target: $.paths['/sessions'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/sessions'].get.responses['200'].content['application/json']
    description: mode=full returns the stock APDS list; mode=change returns a ChangeFeedPage.
    update:
      schema:
        oneOf:
          - $ref: "#/components/schemas/SessionList"
          - $ref: "#/components/schemas/ChangeFeedPage"

  # ----- /rates -----
  - target: $.paths['/rates'].get.parameters
    description: Add the APX data-profile mode/cursor parameters.
    update:
