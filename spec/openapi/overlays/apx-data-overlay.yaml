  - target: $.paths['/places/{id}'].put.responses['404']
    update:
      description: "Not Found. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `target-not-found` instead of ResponseStatus."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  - target: $.paths['/places/{id}'].put.responses['409']
    update:
      description: "Conflict. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `version-conflict` (stale `version`) instead of ResponseStatus."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  - target: $.paths['/places/{id}'].delete.responses['400']
    update:
      description: "Bad Request. APX (Part 5 §5.1a, Part 12 §12.1): a client sending `Accept: application/problem+json` receives problem type `invalid-request` (with `errors[]`) instead of ResponseStatus."
