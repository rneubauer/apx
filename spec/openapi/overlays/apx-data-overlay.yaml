  - target: $.paths['/rights/specs/{id}'].put.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/rights/specs/{id}'].put.requestBody.content['application/json']
    description: "Full mode validates against RightSpecification; change mode against ChangePayload (Part 5 §5.1a)."
    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/RightSpecification"
          - $ref: "#/components/schemas/ChangePayload"
  - target: $.paths['/rates/{id}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
    update:
      - *updateMode
  - target: $.paths['/rates/{id}'].put.requestBody.content['application/json'].schema
    remove: true
  - target: $.paths['/rates/{id}'].put.requestBody.content['application/json']
    description: "Full mode validates against RateTable; change mode against ChangePayload (Part 5 §5.1a)."
    update:
      schema:
        anyOf:
          - $ref: "#/components/schemas/RateTable"
          - $ref: "#/components/schemas/ChangePayload"
  - target: $.paths['/sessions/{id}'].put.parameters
    description: "Declare APX-Update-Mode (optional, default full)."
    update:
