domain: PkCommon
order: 8
summary: >-
  One addition to RecordType: the system that first created a record, when
  the record reaches a receiver through another system. Open code lists
  need no new element, because APDS ReferencedCodeListEntry and
  UserDefinedCodeList already provide the pattern. The extensions container
  and GeoJSON coordinates are already raised as errata 010 and 011 and are
  not repeated here.
packages:
  - name: CommonClasses
    location: D2Payload/Extension/Parking/PkCommon/CommonClasses
    status: existing
    classes:
      - name: RecordType
        change: extend
        designation: Record type
        definition: A class defining information relating to a specific record.
        stereotype: D2Class
        abstract: false
        parent: null
        level: B
        tier: 2
        apx: RecordInfo.origin (APX Part 18 §18.6)
        rationale: When records pass through an aggregator or a regional hub, a receiver can still tell which system first created each one.
        attributes:
          - name: origin
            designation: Origin
            definition: Identifier of the system that first created the record, when it differs from the system distributing it.
            multiplicity: 0..1
            type: PkCommon.String
        associations: []
    enumerations: []
