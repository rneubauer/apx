<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APX Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231f6feb%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2714%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EAPX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">APX</span><span>Simulator</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="present">Present</button>
      <button data-view="build">Build</button>
      <button data-view="explore">Explore</button>
    </nav>
    <div class="world">
      <label>World <select id="world-select"></select></label>
      <button id="world-reset" class="ghost" title="Reload the world: clears all state">Reset</button>
    </div>
    <div class="clock">
      <div id="clock-now" class="clock-now">—</div>
      <div class="clock-buttons">
        <button data-advance="PT1M">+1m</button>
        <button data-advance="PT5M">+5m</button>
        <button data-advance="PT15M">+15m</button>
        <button data-advance="PT1H">+1h</button>
        <button id="clock-set" class="ghost" title="Set the clock to an instant">Set…</button>
      </div>
    </div>
    <div class="pills" id="pills"></div>
  </header>
  <main>
    <section id="view-present" class="view"></section>
    <section id="view-build" class="view"></section>
    <section id="view-explore" class="view"></section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <datalist id="dl-paths"></datalist>
  <datalist id="dl-credentials"></datalist>
  <datalist id="dl-topics"></datalist>
  <datalist id="dl-injectors"></datalist>
  <script type="module" src="js/app.js"></script>
</body>
</html>
