name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vendor integrity (APDS 4.1 verbatim)
        run: npm run vendor:check
      - name: Spec lint
        run: npm run spec:lint
      - name: Spec bundle
        run: npm run spec:bundle
      - name: Spec conventions (Spectral)
        run: npm run spec:style
      - name: Registries + profile subset + example validation
        run: npm run registries:check && npm run spec:profile && npm run examples:check
      - name: Scenario payload validation
        run: npm run scenarios:check
      - name: Committed artifacts are fresh (bundle and edition manifest match source)
        run: git diff --exit-code spec/dist spec/edition.json

  # The documentation site is generated, so a broken generator is a broken
  # publish. The Docs workflow only runs after merge, which is too late to
  # learn that. Build the whole site on every PR instead.
  # Ubuntu only: the redocly CLI throws a libuv assertion on exit under
  # Windows, which would fail this job for a reason that is not ours.
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild bundles
        run: npm run spec:bundle && npm run spec:profile
      - name: Assemble the documentation site
        run: npm run docs:build
      - name: Every published artifact is present
        run: |
          for f in index.html reference.html parcs.html apx-standard.md \
                   edition.json apx-v1.yaml apx-v1.json apx-parcs.json \
                   registries/index.html registries/registry.schema.json; do
            test -s "site/$f" || { echo "missing or empty: site/$f"; exit 1; }
          done
          grep -q '{{APX_' site/index.html && { echo "unsubstituted placeholder in index.html"; exit 1; }
          echo "site/ complete"

  # A standard's cardinal sin is silently breaking the contract. Gate every
  # PR on an API-diff of the committed bundle against the base branch.
  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The oasdiff action runs in a Docker container that mounts only the
      # workspace (and RUNNER_TEMP) — the runner's /tmp is NOT visible inside
      # it. Write the base bundle into the workspace and pass a relative path.
      - name: Extract base-branch bundle
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          mkdir -p .oasdiff
          git show "origin/$BASE_REF:spec/dist/apx-v1.yaml" > .oasdiff/base-apx-v1.yaml
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Breaking-change gate (oasdiff)
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: .oasdiff/base-apx-v1.yaml
          revision: spec/dist/apx-v1.yaml
          fail-on: ERR
