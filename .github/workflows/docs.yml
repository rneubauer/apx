name: Docs

# Publishes browsable API reference docs to GitHub Pages on every push to
# main: the full APX standard at /, the PARCS starter profile at /parcs.html,
# the specification document set at /specification/ (HTML, plus PDFs when
# the renderer succeeds), and the simulator at /simulator/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22: the PDF printer talks to Chrome over the built-in WebSocket,
          # which Node 20 does not have.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild bundles (never trust, always verify)
        run: npm run spec:bundle && npm run spec:profile
      - name: Render API reference docs and the specification documents (site/specification/)
        run: npm run docs:build
        # Redoc renders the whole reference in one process; it now sits near Node's
        # default ~2 GB heap and ran out of memory once on 2026-11-16.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build the in-browser simulator (site/simulator/)
        run: npm run sim:web
      # Print editions of both document sets: site/apx-specification/ (the
      # six APX Specification documents) and site/apds-submission/ (the APX
      # Data Specification the specification index links to). Each set's
      # HTML is written before printing, so the pages exist even when the
      # PDFs do not. The index is built again afterwards so its Print
      # column links the PDFs. Chrome is preinstalled on the Ubuntu runner
      # and the diagrams need the network; a renderer hiccup must never
      # block the site, so this step may fail.
      - name: Render the document sets to PDF
        continue-on-error: true
        # Each set is tried up to three times on its own: headless Chrome
        # sometimes fails to start ("browser did not answer", 2026-11-17),
        # and one failed set must not stop the other from being published.
        run: |
          render() {
            for attempt in 1 2 3; do
              node tools/build-apds-submission-pdf.mjs "$1" && return 0
              echo "::warning::PDF render of $1 failed (attempt $attempt of 3)"
              sleep 10
            done
            echo "::error::PDF render of $1 failed three times; the site publishes without its PDFs"
            return 1
          }
          status=0
          render apds-submission || status=1
          render apx-specification || status=1
          npm run apxdocs:html
          exit $status
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
